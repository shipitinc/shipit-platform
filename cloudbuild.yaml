steps:
  # Install dependencies
  - name: 'dart:3.12'
    entrypoint: 'dart'
    args: ['pub', 'global', 'activate', 'melos', '^8.0.0']
    env:
      - 'PUB_CACHE=/root/.pub-cache'

  - name: 'dart:3.12'
    entrypoint: 'dart'
    args: ['pub', 'global', 'run', 'melos', 'bootstrap']
    env:
      - 'PUB_CACHE=/root/.pub-cache'

  # Analyze and test
  - name: 'dart:3.12'
    entrypoint: 'dart'
    args: ['pub', 'global', 'run', 'melos', 'run', 'analyze']
    env:
      - 'PUB_CACHE=/root/.pub-cache'

  - name: 'dart:3.12'
    entrypoint: 'dart'
    args: ['pub', 'global', 'run', 'melos', 'run', 'format']
    env:
      - 'PUB_CACHE=/root/.pub-cache'

  - name: 'dart:3.12'
    entrypoint: 'dart'
    args: ['pub', 'global', 'run', 'melos', 'run', 'test']
    env:
      - 'PUB_CACHE=/root/.pub-cache'

  # Build and push server image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'docker/Dockerfile.server',
      '-t', '${_ARTIFACTS_REPO}/server:$SHORT_SHA',
      '-t', '${_ARTIFACTS_REPO}/server:latest',
      'apps/server'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_ARTIFACTS_REPO}/server:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_ARTIFACTS_REPO}/server:latest']

  # Build and push client image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'docker/Dockerfile.client',
      '-t', '${_ARTIFACTS_REPO}/client:$SHORT_SHA',
      '-t', '${_ARTIFACTS_REPO}/client:latest',
      'apps/control_plane'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_ARTIFACTS_REPO}/client:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_ARTIFACTS_REPO}/client:latest']

  # Build and push worker-linux image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'docker/Dockerfile.worker-linux',
      '-t', '${_ARTIFACTS_REPO}/worker-linux:$SHORT_SHA',
      'tooling/workers'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_ARTIFACTS_REPO}/worker-linux:$SHORT_SHA']

# NOTE: This pipeline ONLY builds and pushes Docker images to Artifact Registry.
# It does NOT deploy to any environment. Local QA deployment is done via
# `docker compose -f docker/compose.qa.yaml up --build` on the developer's machine.
# Staging and production deployment have been removed from this workflow per
# ADR-001-Local-Deployment and ADR-002-Environment-Separation.

substitutions:
  _ARTIFACTS_REPO: '${_ARTIFACTS_REPO}'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: 'projects/${PROJECT_ID}/locations/${_REGION}/workerPools/cloudbuild'