status: UNDER_REVIEW
risk_level: 3
risk_rationale: >
  Core workflow AND governance-model change. This revision redefines what may
  mint the only EvidenceKind that satisfies ProductGuard.baselineVerifiedIndependently
  -- the gate between an agent's own assertion and a human being asked to approve
  it. It makes isIndependentlyVerified fail closed, which flips the evaluation of
  every pre-existing product_baseline row (they lack the new required columns and
  therefore no longer satisfy the guard). It is a live security-boundary remediation:
  verifyBaseline is an exposed Serverpod RPC whose wire default is the permissive
  'platform_verified_evidence', so any API client can currently self-attest
  platform verification for any product. Level 3 additionally requires architecture
  approval, which is exactly what HD-1 requests. A Level 2 reading was considered
  and rejected: no UI changes, but the risk taxonomy keys on workflow and governance
  model, both of which change.

