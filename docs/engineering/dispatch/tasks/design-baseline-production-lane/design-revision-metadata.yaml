    question: >
      Does a deterministic platform re-derivation -- executed under a verifier
      principal distinct from the producer's, over a source revision the verifier
      acquired itself, compared by content hash -- constitute platformVerifiedEvidence?
      (A) yes, distinct execution context not additionally required; (B) no,
      verification additionally requires an execution context distinct from production.
    recommendation: "A now, B as scoped follow-on; residual hole recorded explicitly."
