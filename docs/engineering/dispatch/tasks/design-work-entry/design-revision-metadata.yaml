risk_level: 2
risk_rationale: >
  Level 2 -- Feature UX Change. It changes a user flow: a submitted feature
  request currently sits at draft forever, and after this revision it moves to
  planned with a recorded reason; defects gain a recovery path they have never
  had. Both the Reports screen and the feature-request list have listeners
  (premise P-4), so this is a change to what a human observes. It also changes
  what runs autonomously: a triageDefect job is an LLM invocation against a real
  worktree, and making that path restart-safe makes it reachable.
  Level 2 therefore requires HUMAN_DECISION_REQUIRED at Gate D4, which is where
  HD-1(a) and HD-1(b) land -- the risk level and the escalation are one fact
  seen twice. Level 3 was considered and rejected: no navigation change, no IA
  change, one feature, and this revision changes no guard, no evidence kind, no
  transition table and no human gate -- every one of which was the baseline
  lane's Level 3 justification. Level 1 was considered and rejected because it
  "does not affect user flow", and this does. A reviewer may reasonably read
  the governed gate as a governance-model change and land on Level 3; that
  disagreement is invited rather than defended against.

