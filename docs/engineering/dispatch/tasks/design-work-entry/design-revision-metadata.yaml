  - "Corrected my own mid-document route table: routing keys on WorkEntryKind,
     not WorkItemCategory, because a defect's triage item and a feature's item
     carry DIFFERENT categories and the defect item's category is explicitly not a
     routing signal (HD-2)."
  - "Four implementation lanes with non-overlapping OWNED_PATHS; no lane may touch
     packages/scheduler, no schema change, no generated code."

