human_decisions_routed:
  - id: HD-1(a)
    question: >
      Must a HUMAN-REPORTED DEFECT have a governed product before it may be
      triaged? Today createDefect checks registration only
      (control_plane_service.dart:923) and enqueues immediately, for a product in
      any state including offboarded -- against ProductState's own text, "governed
      ... Work may be dispatched for this product". This revision's governance
      gate would newly ENFORCE it, changing shipped working behaviour on a path
      outside this work item's scope.
      (A) triage is exempt -- classifying a real-world defect report is not "work
      for the product", and a governed product must still accept one;
      (B) triage obeys governed like everything else.
    recommendation: >
      A. Offered as input, NOT as a decision. Recorded because enforcement would
      change the live bug-reporting path, which is why it is escalated.
    resolved: false
    blocks: "Gate D4"
    does_not_block: "L1, L2, L3, L4 -- the entire defect half of this revision"
  - id: HD-1(b)
    question: >
      For a feature request against an ungoverned product: PARK (accept it, walk
      to planned, record the reason) or REFUSE (reject at intake with "this
      product is not governed")? Parking is truthful and loses nothing, but a
      human sees their request accepted and then stall at planned -- a worse
      visible outcome than today's draft. Refusing is honest at the moment of
      submission but rejects a human over a platform-internal condition. This is
      a change to what the Reports screen means, on a screen that has listeners.
    recommendation: >
      A (park), paired with UI copy that says why. Offered as input. The two
      answers differ by two lines at one branch in work_entry.dart, so the seam
      is already swappable.
    resolved: false
    blocks: "Gate D4, and the feature half's behaviour"
    does_not_block: "L1, L2 -- the defect sweep is unaffected by this answer"
  - id: HD-2
    question: >
      Should a defect's triage work item keep category: triageWorkItemCategory
      rather than WorkItemCategory.feature? Not raised to change it. Raised
      because this revision HAD to route on WorkEntryKind instead of
      WorkItemCategory because the two disagree, and a reader deserves to know
      that is a standing inconsistency rather than a choice this revision made.
      (A) leave it -- routing keys on the intake, which the design already does;
      (B) harmonise the categories so routing can key on category later.
    recommendation: >
      A. lane_a_defect_triage_work_item.dart:127-133 already says changing it is
      "a domain decision, not wiring".
    resolved: false
    blocks: "nothing"
    does_not_block: "All implementation"

