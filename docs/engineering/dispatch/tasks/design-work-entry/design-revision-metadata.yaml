design_system_compliance: PASS
design_system_compliance_note: >
  No view, token, component or route is added or changed. Recorded as PASS by
  non-applicability; an independent reviewer may prefer UNKNOWN. Conceded openly:
  this revision changes no design system at all, but it DOES change what two
  existing screens display (a feature request's state; whether a defect appears
  classified), so the reviewer should confirm a planned-state chip with a reason
  is legible in the existing token set rather than assuming it.

ux_accessibility_score: PASS
ux_accessibility_note: >
  No user-facing surface is added. The user-visible change is that a previously
  static submission starts moving, and that a feature request on an ungoverned
  product goes from draft to planned-with-a-reason -- which this revision
  concedes is a WORSE visible outcome than draft, and which is why HD-1(b)
  exists rather than being settled here. No WCAG criterion is engaged: no new
  focusable element, no new input, no navigation change. The reviewer should
  check that the recorded reason is rendered as text and not conveyed by colour
  or icon alone, since that is the one place a new string reaches a screen.

implementation_feasibility: HIGH
implementation_feasibility_rationale: >
  Every mechanism already exists: triageDefectDefinition, triageDefectDedupeKey,
  triageDefectInstruction, Scheduler.tick's existing enqueue step,
  DefectTriageWorkItemProvisioner, transition(idempotencyKey:),
  JobQueue.enqueueIfAbsent, BaselineOnboardingSweep as the literal sweep
  template, lane_e as the literal external-dependency template. The two new
  files are additive Dart. No schema change, no migration, no generated code, no
  new dependency, and -- per section 5 -- not one line of packages/scheduler.
  The only unresolved inputs are HD-1 and HD-2, and HD-1 is resolved by choosing
  between two WorkEntrySkipCodes at a single branch, which is a two-line change.

