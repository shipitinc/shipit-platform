## risk_level: 3

> **Re-derived this pass from `DESIGN_GOVERNANCE.md` against what this pass actually did — not inherited, and
> not asserted on an artifact that does not exist.** Three independent clauses of the Level-3 definition are
> met: (1) **core workflow / user mental model** — `898b07d0` splits identity from registration, so "Register
> product" changes meaning from *creates the product* to *commits verification of a product that already
> exists*, and two of four boards' eyebrow strings were rewritten for that reason; (2) **information
> architecture** — the accepted consequence (a visible product with no usable credential) required a NEW
> user-facing element, `Trust Created`, absent from every prior revision of this design; (3) **navigation
> structure** — R.11g item 3 requires the flow be re-enterable from the product, a resume route on
> `ProductDetailPage` that the Products list does not have.
>
> **THE LEVEL-3 HUMAN GATE IS DISCHARGED AND MUST NOT BE RE-OPENED — re-verified directly this pass, not
> inherited.** `9417f8bf`, `27ea6536`, `898b07d0`, `ae1c1f79` and `7b1bc8b7` are all `status: RESOLVED`, all
> `decided_by: "repository owner (interactive structured question UI, session orchestrator-main)"`, and all
> carry `follow_up_actions` with `owner: design-agent`. **The decisions did not remove the risk; they moved it
> into this lane as a mandate.** The rev-4 reviewer's 3-escalation trigger
> (`design-revision-metadata-4.yaml:44-45`, host-trust navigation/IA) **FIRED** — that is exactly what
> `898b07d0` + R.11g item 3 require — and is struck in the revision-4 file so no reviewer is sent to a
> discharged gate.
>
> **One residual component is NOT human-decided and is NOT a gate: D-2.** The human's mobile footer spec (no
> divider, left-aligned) is not expressible with `TechnicalDetails` as built, so the choice between a new
> primitive parameter and a mobile-local footer widget is a **shared-component choice at Level 1**, routed to
> the design-system owner as **N6**. The human already decided the *outcome*; only the mechanism is open.
> **It does not raise the risk level and does not require the human.**
>
> The rev-4 reviewer was right that revision 4's *marginal* risk was Level 0 — that is inapplicable here,
> because this pass carries board writes and Level-3 content.

risk_rationale_would_escalate_beyond_3_if:
  # Nothing below is fired. Listed so a future reviewer can see the ceiling was considered, not assumed.
  - a Human Decision were opened on the four desktop boards' footer copy (F6) in a way that changes the
    normative outcome — it does not; the outcome is settled and only a board edit is unowned
  - the resume affordance (R.11g item 3 / G13) were built as a new top-level navigation destination rather than
    a resume route into the existing credential flow

