> boards do not conform to the resolved footer spec. Both are escalated, neither is a defect this pass
> introduced, and **this pass closed neither**.

## ux_accessibility_score: PASS (on the surfaces the design touches)

> **Unchanged from revision 5, and honestly scoped in the same way.** Contrast recomputed from
> `design_tokens.dart`, sanity-checked (black/white 21.00, white/white 1.00): `Art S` `inkSecondary` on
> `card` **6.74 light / 6.10 dark**; `Trust Created` `inkSecondary` on `card` **6.74 / 6.10**; `Status`
> `inkTertiary` on `canvas` **4.65 / 4.62**; `Trust Btn L` `#ffffff` on `#1668d6` **5.27** and `#06121f` on
> `#4496fc` **6.30**. All ≥ 4.5:1, both themes. The SC-9 remediation copy is `inkSecondary`, measured
> **6.28 / 6.65** on `canvas` and **6.74 / 6.10** on `card` — PASS both themes.
>
> **The known `inkTertiary`-on-`card` FAIL at 4.99 light / 4.23 dark is real, unchanged, and is not on any
> layer this design touched** — it is N10, design-system-owned. Stated rather than rounded away.
>
> **No WCAG criterion beyond colour contrast is claimed.** No screen reader was run, no focus order was
> verified on `Trust Created`, and the disclosure's expanded state was not exercised. Those are QA's, not a
> design-lane claim. **This pass re-derived no contrast figure and changed no colour, so it re-verifies none
> of them by measurement** — it inherits the reviewer's independent recomputation of all ten, which
> reproduced to 0.00.

