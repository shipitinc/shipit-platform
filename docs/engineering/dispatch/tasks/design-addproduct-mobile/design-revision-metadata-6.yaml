> does not exist at this HEAD. A prior revision of this lane claimed HIGH without the analyzer ever
> resolving packages; that is not repeated, and no score here is derived from the analyzer.
>
> **What IS verified, and re-verified at this pass's base.** Every line number this design cites into
> `apps/control_plane/**` and `apps/server/**` was **re-read individually at `16cd497`** (the stale
> empty-diff basis is corrected in `design-revision-5.md` § 14 and `design-revision-metadata-5.yaml`), and
> all hold — including the newly recorded `ui_view_mappers.dart:176`. **One implementation-facing change
> improves feasibility and one worsens the risk of an incomplete change:** N6a now names **seven** G-7 sites
> rather than six, adding the server-side view constructor that will not compile without the edit. A
> developer working the published six would ship a broken `apps/server` build; working the published seven
> will not. MEDIUM, not LOW, because the primitive change reaches five other call sites and its owner is
> not this lane.

