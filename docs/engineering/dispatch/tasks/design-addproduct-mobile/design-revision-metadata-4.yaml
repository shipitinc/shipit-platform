design_system_compliance: PARTIAL
design_system_compliance_reason: >
  Still PARTIAL, and this revision moved it NOT AT ALL, deliberately: revision 4 edits no board, so no
  divergence with a production primitive was closed. The PARTIAL judgement rests on four things, all still
  true at revision 4. (1) The file holds boards disagreeing with mine on `Submit L` size, on `microLabel`
  tracking and on the active nav weight (N5/N6) - all PROHIBITED to this lane, so recorded as
  design-system-owner notifications. (2) `negative` on dark remains 4.02:1 canvas / 3.68:1 card with no
  compliant alternative in ShipItPalette (N2). (3) `inkTertiary` on `card` is 4.23:1 in dark with a live call
  site on my own boards and in the build (N10, new this pass). (4) G12/N9: the boards draw the primary action
  on the bare page background while the code puts it inside DesignPanel = card, because the panel that wraps
  it has no board. Revision 4 additionally RECORDS a board-vs-build divergence revision 3 had hidden by
  naming the wrong token: the `Submit Sub` helper is `inkSecondary` on the boards and `inkTertiary` in the
  build, on `canvas` and `card` respectively (G14, matrix § 6). It is recorded with the surface named rather
  than resolved, because resolving it is a palette decision this lane may not make. The boards remain the
  more legible of the two values, which is why nothing was edited to match the build.

ux_accessibility_score: PARTIAL
ux_accessibility_score_reason: >
  All thirteen ledger figures re-measured from design_tokens.dart:99-101 / :120-122 with a WCAG 2.1
  implementation sanity-checked at black-on-white 21.00 / white-on-white 1.00; every revision-1 and
  revision-2 figure reproduced exactly, and the expanded-TechnicalDetails row is now ONE row naming canvas
  for BOTH platforms at 4.65:1 / 4.62:1 (both pass). The one AA failure this lane had authority to fix
  remains fixed: Trust Host 4.23:1 dark on card -> 6.10:1 via inkSecondary. Not PASS, and the reasons are
  recorded rather than rounded away: (a) Key State still uses negative, 5.72:1 light but 3.68:1 on card in
  dark, with no compliant token in ShipItPalette (N2, pre-existing on the desktop boards too); (b) the
  canRegister == false state still has no token - ShipItPalette has no disabled container/label pair, and
  the appearance the code actually paints has a label at 2.22:1 on its own fill in Light and 2.78:1 in Dark.
  WCAG 1.4.3 exempts inactive controls, so (b) is not a conformance failure; it is recorded because it is the
  strongest available evidence for the N4 request and because the alternative carrier - a 10px monoMeta
  helper at inkSecondary - is not a reliable way to say "this control is unavailable".
  (c) NEW IN REVISION 4 (M-R1) - layer `Art K` ("DEPLOY KEY - THIS PRODUCT ONLY") renders
  ShipItPalette.inkTertiary on `card` - inside `Art Bg`, which is DesignPanel = palette.card - on ALL FOUR
  boards, and the build does the same at add_product_page.dart:533 (desktop) and :1029 (mobile). Measured
  4.99:1 in Light and 4.23:1 in DARK: that is a WCAG 1.4.3 AA FAIL in dark, on the same token that passes on
  `canvas` at 4.65:1 / 4.62:1. A read-only subtree sweep of all four boards confirms `Art K` is the ONLY
  inkTertiary text layer on card; every other inkTertiary layer (Status, F K 0/1/2) sits on canvas. No
  compliant token exists in ShipItPalette for tertiary ink on a card surface in dark, so this is routed to
  the design-system owner as N10 and is why this score is not PASS. This reason exists because revision 3
  annotated the same ledger row "now unused on these boards" - a claim about four boards that was never
  checked and is false. An annotation that hides a measured failure converts a known defect into an
  invisible one, and no downstream gate re-measures an annotation.

