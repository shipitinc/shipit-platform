  that was not run. Raise to HIGH only after `flutter pub get && flutter analyze` passes on the
  implementation branch. The disabled-state read-back is likewise NOT EXECUTED: no Flutter widget was
  rendered, and the values are a documented derivation from framework source (assumption A6). Revision 4
