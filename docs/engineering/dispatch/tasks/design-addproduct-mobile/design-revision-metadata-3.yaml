  Unchanged at 2, and unchanged for a reason that this revision makes explicit rather than repetitive:
  every change here is Level 0/1. Two `align` corrections (Trust Btn L, left -> centre, both Unknown-host
  boards); four font-weight corrections (the active bottom-nav label, 400 -> 600, all four boards);
  twelve ADDITIVE annotation layers in two new page-level groups recording what
  FilledButton(onPressed: null) already paints; and record corrections - a corrected traceability matrix,
  a collapsed contrast-ledger row, regenerated board evidence, corrected citations, withdrawal markers on
  disproven claims in retained artifacts, and a corrected branch name.
  None of it changes an interaction pattern, a navigation or information-architecture surface, or the
  primary action's structure. Two changes make previously-unmeasured reality measurable rather than
  inventing anything: the disabled Register appearance is DERIVED from Flutter 3.44.7's
  _FilledButtonDefaultsM3 plus core/theme.dart:32 (no palette token chosen, no human gate needed), and the
