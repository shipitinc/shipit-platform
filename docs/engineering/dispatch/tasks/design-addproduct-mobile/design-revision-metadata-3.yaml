  system still lacks stays a design-system-owner item (N4/G9).
  Below 3 because no Level 3 condition is met. Not escalated to a human gate: B3 remains filed as Human
  Decision 27ea6536 and is NOT re-opened, and 'Art S' stays PENDING D4.

