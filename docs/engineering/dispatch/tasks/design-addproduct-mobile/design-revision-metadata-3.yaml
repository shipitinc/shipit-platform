    M-N5's premise was CONFIRMED and then made concrete: Material 3's disabled defaults DO apply under
    core/theme.dart, but not because a missing colour "falls back" - because WidgetStateMapper returns the
    first satisfied key's value even when that value is null, so the theme's own property resolves to null
    and ButtonStyleButton.effectiveValue falls through to the M3 default. Full chain in design-revision-3.md
    §5.1, with the Flutter 3.44.7 file and line for each step.
  - >
    L-N3's `MobilePrimaryButton:425` claim is WRONG; the class is at `:424` and revision 2 was already
    right. Two dispatched premises have now been wrong in two consecutive passes (the other: "both desktop
    boards draw 13/600" - they draw 12/600). A finding is a set of claims and each one gets checked.
  - >
