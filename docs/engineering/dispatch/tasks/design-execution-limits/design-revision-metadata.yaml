human_decisions_routed:
  - id: HD-1
    question: >
      What is the default value of SHIPIT_DISPATCH_MAX_CONCURRENT_AGENTS on the first release?
      The concurrency cap is the operator's named top priority and QA must not restart without it.
    recommendation: >
      C = 1 for the first release. It is provably no worse than today's incidental behaviour (one
      registered LocalWorker, maxConcurrency 1), so it cannot regress throughput, and it requires no
      host-sizing input this lane cannot obtain. Any C > 1 requires measured host capacity and
      measured per-session memory, NEITHER of which this repository collects today.
    resolved: false
    blocks: "Gate D4 approval; production rollout"
    does_not_block: >
      Implementation of L1 and L2 — both take C as an injected parameter and are fully testable. The
      mechanism FAILS CLOSED: an absent or unparseable value stops the scheduler and names the
      variable, rather than defaulting to unbounded. So the value is required before QA restarts, but
      choosing it is not required before implementation starts.
  - id: HD-2
    question: >
      May intake ever refuse? Specifically: when the eligible triage backlog exceeds a cap, should a
      newly submitted defect be recorded but NOT enqueued for triage? This is an operator-visible
      behaviour change and a product decision.
    recommendation: >
      If yes, adopt the load-shedding shape in §4.2 — the defect and work item ARE recorded and the
      reporter's "accepted" stays true; the triage job is simply not enqueued; the decision is
      recorded under a new BACKLOG_CAP_REACHED skip code with a greppable event; nothing is silently
      dropped. It must ship ALONGSIDE the enabled DefectTriageSweep, which is currently GATED OFF
      pending P-2/P-5 — otherwise refused defects are recorded and never retried, which converts
      load-shedding into stranded work.
    resolved: false
    blocks: "L4 entirely"
    does_not_block: "L1, L2, L3, L5"
  - id: HD-3
    question: >
      What mem_limit, cpus and pids_limit apply to the `server` and `worker-linux` services on each
      deployment target (local QA, shared/staging, production)?
    recommendation: >
      Add them, and add pids_limit specifically: this host was crashed by fork pressure from agent
      sessions, which is exactly what a pids bound catches and a memory bound alone may not. The
      numbers require real host capacity this lane cannot observe (QA is down; zero Docker commands
      are permitted), so they are not proposed here.
    resolved: false
    blocks: "L5; any shared or staging host"
    does_not_block: >
      Restarting local QA on a Docker-Desktop-bounded VM, which is already constrained. Does not block
      L1, L2, L3.