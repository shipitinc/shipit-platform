risk_level: 2
risk_rationale: >
  Operator-visible behaviour change: a queued defect may now be DEFERRED rather than dispatched, the
  operator sees a new named skip code, and the scheduler refuses to start without an explicitly
  configured cap. That is a change to when work runs and to what an operator is told — Level 2
  ("change to user flow, interaction pattern, or feature-level UX that affects user behavior").

  Level 3 was considered and rejected: intake still accepts and records every defect, the defect
  lifecycle, navigation and information architecture are untouched, and no work item is dropped. A
  deferral is invisible until the operator looks for it, and it is reported under a named code rather
  than by absence.

  Level 1/0 were rejected in the other direction: this adds a hard stop (the per-defect ceiling) and
  contemplates a refusal (the backlog cap), and it changes the startup contract of the server. It adds
  no dependency and crosses no security boundary.

  Level 2 therefore routes to Gate D4 HUMAN_DECISION_REQUIRED, which is consistent with the three
  decisions this lane escalated rather than made (HD-1 cap default, HD-2 intake refusal, HD-3
  resource limits).

changelog:
  - "revision 1 (initial): four requirements designed; concurrency cap placed FIRST in the document
     but the MUST-SHIP pair is (concurrency cap + tick single-flight)."
  - "PREMISE CORRECTION 1: clarificationCount is clarificationRequired.length — questions asked in
     ONE triage pass (triage_processor.dart:147), not rounds. The operator's 21-27 invocation
     estimate is withdrawn; the burst produced 9 successful triage invocations."
  - "PREMISE CORRECTION 2: there are no second/third clarification rounds. The dedupe key
     'defect-{id}:triage_defect' is held forever (triage_defect.dart:17-18 +
     job_queue.dart:56-60 match ANY state including terminal). Max invocations per defect is already
     structurally bounded at maxAttempts=2 (triage_defect.dart:12)."
  - "PREMISE CORRECTION 3: an incidental bound of 1 DOES exist, via the single registered LocalWorker
     (server.dart:152, local_worker.dart:66/92) — in-memory, unconfigured, unlogged, and scaling
     with worker registration. The cap's value is making the bound durable/observable, not creating
     the first bound. Stated so the reviewer does not over-credit the design."
  - "PREMISE CORRECTION 4: the unbounded amplifier is overlapping ticks — Timer.periodic(30s) with an
     async callback, no single-flight guard anywhere (server.dart:322), while a tick blocks for a
     full agent execution (scheduler.dart:370, timeoutSeconds 300). This is why single-flight is
     MUST-SHIP rather than optional."
  - "Concurrency cap designed DURABLE at claim time via pg_advisory_xact_lock + count-in-flight,
     inside the existing claim transaction. Zero migration. Two-replica correctness argued; a bare
     count-then-claim would overshoot by one per replica per tick."
  - "Recorded a real cost: there is NO index on job.state in any migration, so the in-flight count is
     a sequential scan. Accepted for must-ship; the fix (an index on state) is an explicit migration
     and is out of scope."
  - "Per-defect ceiling designed as a DERIVED count over model_execution_record (indexed on
     workItemId, one row per agent execution). ZERO new columns, tables or indexes — so no migration
     and no schema-drift exposure. Named the trap that model_execution_record.jobId is populated
     with workItemId."
  - "Ceiling fails CLOSED when its count source is unavailable (modelExecutionRecordStore == null is a
     silent no-op at execution_coordinator.dart:692-693), recorded as
     EXTERNAL_MODEL_EXECUTION_RECORD_UNAVAILABLE."
  - "Host-load guard RECOMMENDED AGAINST as a code guard: no compose file in docker/ declares any
     mem_limit/cpus/deploy.resources/pids_limit, so a cgroup-derived guard reads 'not loaded' forever
     and never fires. Compose-level limits recommended instead as a DEPLOYMENT concern."
  - "Recorded that a backlog cap at intake is only safe alongside the enabled DefectTriageSweep, which
     is currently GATED OFF pending P-2/P-5 — otherwise refused defects are stranded."
  - "Five implementation lanes with non-overlapping OWNED_PATHS (L1..L5), dependency edges
     L1->L3, L1->L4, L2 parallel."
  - "Three human decisions routed (HD-1 cap default, HD-2 intake refusal, HD-3 resource limits);
     NONE resolved by this lane."

