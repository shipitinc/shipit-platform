risk_level: 3

risk_rationale: |
  Level 3 (Major Workflow / Architecture Change) per DESIGN_GOVERNANCE.md, unchanged from revisions 1
  and 2. The level describes the change, not whether a human has blessed it, and a precision
  correction does not lower it.

  1. AMENDS RECORDED ARCHITECTURE ON A SECURITY BOUNDARY. It governs where a private key capable of
     authorising repository WRITE access is held, and what "revoked" means. No such secret exists in
     the repository today.
  2. CHANGES A CORE WORKFLOW. Revocation acquires a ShipIt-side action where ADR 0018 said none was
     required, plus a runtime dependency (the secret manager) that can block the credential path.
  3. DEPENDS ON ENFORCEMENT THAT LIVES ELSEWHERE AND IS STILL PARTLY ABSENT. Improved at 43d328b
     (one-active index and predicating upsert merged in e391c02) and still unsatisfied at 289f1d3: no
     transport host-key enforcer, no secret-manager adapter, no manager-handle destruction, and
     registration not wired to a connectivity check. §Decision status records all of this per clause.
  4. CARRIES FOUR ACCEPTED RISKS ON A SECURITY BOUNDARY, recorded with their consequences at ADR
     §Accepted risks A1-A4. This revision does NOT close any of them and does NOT add a fifth. It
     makes gap A4's evidence accurate, which narrows the work without changing the risk.
  5. THIS REVISION NEWLY DISCLOSES A SECURITY CONSEQUENCE THE EARLIER REVISION OBSCURED — the
     same-uid exposure during the transport-time window in which SHIP IT holds the materialised
     private half (9417f8bf:116-119 rejected A1 for exactly this reason). It is a DISCLOSURE, not an
     added risk: the exposure existed in the accepted architecture from the moment A3 was chosen.
     Stating it plainly is why the level does not fall.

  Level 3's approval requirement was satisfied on 2026-10-06 by the repository owner as ADR owner
  (876c6b97, OPTION_A). That satisfied the HUMAN GATE. It does not satisfy INDEPENDENT REVIEW, which
  has still never happened for any revision of this artifact.

changelog:
  - "Revision 3. Responds to the independent review of revision 2 (CHANGES_REQUIRED, 0 BLOCKERS, 2 HIGH) and to finding G-17 from the keys rev-5 review. Scopes the 'never holds key bytes' absolute (HIGH 1); marks A3 custody decided-and-unbuilt throughout and adds §Decision status (HIGH 2); corrects the ADR's denial that its own acceptance decision object exists (G-17); corrects gap A4's *.dart-only evidence, which had hidden a GCP Secret Manager substrate already provisioned in this repository's Terraform; adds an A1-A4 identifier disambiguation. Revisions 1 and 2 retained unaltered as history."

  # ---- Findings from the review of revision 2 ----
  - "H1 — HIGH 1 (verified, then corrected): the ADR asserted the absolute 'SHIP IT never holds key bytes' at :83, :226, :33 and :331-333 while requiring SHIP IT to retrieve the private half from the manager at transport time — false by the ADR's own next sentence. Scoped by dimension: never STORED (the guarantee, and it excludes A2) versus materialised transiently at transport time (true, and not a guarantee). Records the consequence the absolute obscured — the same-uid exposure moves from the filesystem to process memory for the connection's lifetime, per 9417f8bf:116-119. Weakenes no clause; changes no decision."
  - "H2 — HIGH 2 (verified, then corrected): A3 was stated in the present indicative (:4, :33, :78 'Current', :226, :284-293) with no adapter, no resolver and no endpoint in existence — the same defect class the keys review caught as B5. New §Decision status marks all nine clauses Decided/Built with per-clause file evidence; the ADR's own existing idiom at :368-370 ('Requirement, not yet enforced at the transport') is applied rather than a new device invented. Two clauses recorded as PARTLY built: revocation writes the audit row but does not destroy the handle, and the connectivity check exists but is not wired to registration."
  - "H3 — G-17 (verified, then corrected): ADR :16-21 and :572-580 denied that any Human Decision object recorded the acceptance, and 876c6b97 landed in 5436a4d — the SAME commit that wrote the denial. Both passages now cite the object with its decision fields, and the correction block gives the --diff-filter=A evidence and the 13-versus-14 timeline. Recorded precisely: revision 2's verification was SOUND at its base 43d328b; the defect was writing a fact with a shelf life as a standing claim."

  # ---- New in revision 3 ----
  - "N1 — status: ACCEPTED -> DRAFT. The owner's acceptance of A2 is unchanged and cited in full; the artifact is under correction and unreviewed, so ACCEPTED would invite a reviewer to read the wording as settled. See status_note."
  - "N2 — NEW ADR §Decision status (':278-312'): nine-clause Decided/Built table, the stated consequence, and the GCP Secret Manager infrastructure finding."
  - "N3 — NEW ADR §Amendments A2 subsection 'never holds key bytes — what that claim does and does not mean': three-part scoping (what is the guarantee / what is not / the same-uid consequence)."
  - "N4 — NEW ADR §Accepted risks disambiguation table: A1-A4 denote substrate options in §Amendments and accepted risk ids in §Accepted risks, and 'A3' is both. Flagged because it has already produced one wrong conclusion this session."
  - "N5 — ADR A2 table row re-worded to carry the scoping pointer; §Positive revocation bullet retitled 'specified to be two-sided' with 'today revocation is one-sided in practice'; fallback clause records that NEITHER substrate is implemented; §Invariants preamble carries a correction note binding every downstream reader to the scoped reading."
  - "N6 — gap A4 evidence corrected. The earlier search was *.dart-only and so could not see that a secret manager is already provisioned in this repository's Terraform (modules/secrets/main.tf:23,31,39; modules/cloudsql/main.tf:77-89; modules/iam/main.tf:31-34 grants secretAccessor to the Cloud Run SA; modules/cloudbuild/main.tf:72-76; main/main.tf:82-87), while NO deploy-key secret is declared in infrastructure/ and nothing binds the server at runtime. Makes A4 narrower and more concrete; the accepted consequence is RESTATED UNCHANGED and the gap stays OPEN."
  - "N7 — 876c6b97 added to §Related → 'Decisions governing amendment A2', with the note that it was added in the same commit as the amended ADR text."
  - "N8 — §Related → 'The acceptance itself' rewritten to cite the object, with the dated correction block, the commit evidence table, and the explicit statement that the earlier verification was not fabricated."

  # ---- Corrections to revision 2 ----
  - "C1 — revision 2's own metadata (decision_object: null, plus a note asserting no object exists) and design-revision-2.md (R25, :430) carried the same false denial. Both RETAINED UNALTERED as history and superseded by this revision; revising them in place would repeat the exact defect being corrected."
  - "C2 — R25 counted 14 decision files at 43d328b; `git ls-tree --name-only 43d328b .decisions/` returns 13. R25's conclusion was correct; its parenthetical count was not."
  - "C3 — the dispatch's provenance for the A2 revision (6220951) is wrong; it is 5436a4d. Material because G-17's whole argument is a commit-ordering argument. Recorded as F-6."
  - "C4 — reviewed_by / reviewed_at: STILL null, deliberately unchanged. Independent design review has never happened for any revision of this artifact."

  # ---- Not changed ----
  - "N-NOT — Revisions 1 and 2 untouched, per the ADR's own no-silent-rewrite convention (:37-40). The four accepted risks are the same four, none closed, none added. The owner's answer in 876c6b97 is not re-opened and no clause of it was rewritten. The nine governing decisions are read and cited, none edited; .decisions/** untouched (14 objects). Every other ADR, all production source, and all QA artifacts are unmodified."

