design_system_compliance: PASS
design_system_compliance_note: |
  PASS — not applicable. No UI change: this revision touches ADR prose and a design artifact, and adds
  no component, token or layout.

  It does affect operator-facing copy constraints. ADR §Amendments A2 already forbids UI text claiming
  the key "stays in the keychain" on a device that no longer holds it, and §1.1 strengthens the
  underlying truth that copy must not rely on: under A3 the private half IS materialised in SHIP IT's
  process at transport time, so no copy may claim SHIP IT "never holds" it. No copy was authored or
  changed; the constraint is recorded for the mobile lane, which owns that text
  (add_product_page.dart:542 and :1038, per the existing ADR note).

ux_accessibility_score: PASS
ux_accessibility_score_note: |
  PASS — not applicable. No interface is added, removed or restyled.

  The accessibility surface of this artifact is the ADR itself, and revision 3 improves it. §Decision
  status is a table rather than prose, so a reader can scan decided-vs-built without reading
  paragraphs. Both correction blocks are dated and attributed, so which text is current is never in
  doubt. Every negative claim carries the file-level evidence that makes it independently checkable,
  which is the accessibility property that matters for a document a future reader must be able to
  trust without the author's session in front of them.

implementation_feasibility: MEDIUM
implementation_feasibility_note: |
  MEDIUM — unchanged from revision 2, and for the same reason recorded there.

  A3 depends on a substrate that is decided, already provisioned in this repository's Terraform, and
  not yet wired to the credential path, whose reachability is UNVERIFIED — plus a transport-time
  window that revision 3 has just made visible for the first time. The identity/registration split
  (898b07d0) and two-sided revocation (79e860e2) are likewise specified and not implemented.

  Revision 3 REDUCES the uncertainty an implementer faces — F-2 turns "is there a secret manager?"
  into a concrete work item against an existing GCP Secret Manager and an existing secretAccessor
  grant — while INCREASING the honesty about what must be built. Feasibility does not rise because
  nothing was implemented; the estimate gets sharper, and two clauses are now labelled "partly built"
  so an implementer meets the real state rather than a binary one.

