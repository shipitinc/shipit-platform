risk_level: 3

risk_rationale: |
  Level 3 (Major Workflow / Architecture Change) per DESIGN_GOVERNANCE.md, unchanged from revisions 1-3
  and unchanged from the independent review's own assessment (INDEPENDENT_RISK_LEVEL: 3,
  RISK_LEVEL_AGREEMENT: YES).

  The level describes THE CHANGE BEING RECORDED, not the accuracy of the prose, not how carefully it is
  worded, and not whether a human blessed it. Acceptance did not lower it in revision 2; a precision
  correction does not lower it here.

  1. AMENDS RECORDED ARCHITECTURE ON A SECURITY BOUNDARY. It governs where a private key capable of
     authorising repository WRITE access is held, and what "revoked" means. No such secret exists in the
     repository today.
  2. CHANGES A CORE WORKFLOW. Revocation acquires a ShipIt-side action where ADR 0018 said none was
     required, plus a runtime dependency (the secret manager) that can block the credential path.
  3. DEPENDS ON ENFORCEMENT THAT LIVES ELSEWHERE AND IS STILL PARTLY ABSENT. At 289f1d3: no transport
     host-key enforcer, no secret-manager adapter, no manager-handle destruction, registration not wired
     to a connectivity check, and the UI's deploy key still a client-side mock (F-9). ADR section
     Decision status records all of this per clause - eleven rows, three of them partly built.
  4. CARRIES FOUR ACCEPTED RISKS ON A SECURITY BOUNDARY, recorded with their consequences at ADR section
     Accepted risks A1-A4. The owner accepted them on 2026-10-06 (876c6b97). REVISION 4 DOES NOT CLOSE
     ANY OF THEM, DOES NOT ADD A FIFTH, AND DOES NOT RE-COUNT THEM. It records that A1's exposure no
     longer reproduces on main and ROUTES the retirement rather than taking it.
  5. ~~This revision newly discloses a security consequence, which is why the risk level does not
     fall.~~ REMOVED AS A RATIONALE, per finding L-2. A disclosure NEITHER RAISES NOR HOLDS a risk
     level: the level is set by the change being recorded, and that change is the same one items 1-4
     already describe. Holding Level 3 on "we were honest this time" would make the scale mean something
     it does not. The level rests on items 1-4, which are causal.

  Level 3's approval requirement was satisfied on 2026-10-06 by the repository owner as ADR owner
  (876c6b97). That satisfied the HUMAN GATE. It does not satisfy INDEPENDENT REVIEW, which for
  REVISION 4 has never happened. Revision 3 was reviewed; revision 4 is not.

changelog:
  - "Revision 4. Responds to the independent design review of revision 3 (DESIGN_REVIEW_CHANGES_REQUIRED:
    1 BLOCKER, 3 HIGH, 4 MEDIUM, 2 LOW). THE ORGANISING CHANGE IS A SWEEP, NOT A FIX: the ADR's defect is
    systemic stale-but-unmarked normative text, so every normative claim was swept against the amendment
    ledger on six axes. Eleven sites found against four reported; revisions 1-3 retained unaltered as
    history, per the ADR's own convention at :37-40."

  # ---- The sweep ----
  - "SWEEP - method stated so it can be re-run: six greps (W1 per-product scope, W2 custody, W3 rotation
    scope, W4 revocation, W5 key-count arithmetic, W6 reference-name format), each hit adjudicated as
    marked / quoted-history / correct-as-written / unmarked-and-normative. design-revision-4.md section
    1.4 records what was DECLINED and why, which is what made the sweep auditable rather than a search."
  - "SWEEP RESULT - eleven sites: B-1, H-2a, H-2b, H-1 (reported) plus S-1 public-half clause had no
    table row and targeted 'the product's repository'; S-2 reference example was the PRE-A1 name
    GIT_PRODUCT_<productRef>_SSH; S-3 'N products means N keypairs' contradicted a bullet four lines
    below it; S-4 UI key state described per product; S-5 dedicated per-product page implied rotation
    as one act; S-6 (below); S-7 six accepted-risk-A1 claims false against main (M-4)."

  # ---- B-1, H-1, H-2, H-3 ----
  - "B-1 - FIXED. The section Decision headline ('scoped per product, not per platform') is struck,
    marked SUPERSEDED (A1), with amendment A1's own reason quoted and per-repository scope stated as
    current. The internal contradiction with the Decision-status row 14 lines below is resolved."
  - "H-1 - FIXED. The custody row no longer rests on the stale doc comments. It now cites the FIELD
    DECLARATIONS (repository_credential.dart:61-122 - no private-key field, which is the whole basis of
    the claim) and states explicitly that :14-15 and :70-71 are stale and are NOT the evidence. Verified
    :20-27 is correctly A1-aware, so the file is right where A1 governs and stale where A2 governs. The
    stale comments are PRODUCTION SOURCE and are filed as a section Known gaps implementation
    follow-up (F-10), not fixed here."
  - "H-2 - FIXED, both sites, and one needed more than a marker. ':384-385 Rotation is per product' and
    ':401 Rotation blast radius is one product, not the fleet' are struck and marked SUPERSEDED (A1).
    :401 sat in Consequences/Positive, so marking it would have left the document ARGUING from a premise
    it had abandoned; its substance is now corrected - per-repository scoping moves cost rather than
    removing it (n repositories, n rotations) - and the honest cost sits in Negative, which already
    said it correctly. Gap G-e is CLOSED and restated as history rather than left open."
  - "H-3 - FIXED IN PART (the in-scope half). Section Related now carries a dated, attributed SCOPE NOTE
    tabulating ALL FOUR sites of the absolute (9417f8bf:113, :140, :210; 876c6b97:20), naming :140 as the
    load-bearing uniqueness argument, stating the decisions are NOT re-opened, noting each object is
    internally inconsistent because :116-119 already has the correct reasoning, and pointing at the
    acceptance section. The ADR's own citations are UNCHANGED - nothing implies the objects say
    otherwise. THE UPSTREAM HALF IS REPORTED, NOT WRITTEN: .decisions/** is Manager-owned, and
    design-revision-4.md section 11 supplies the exact append-only note text for both objects, with the
    instruction to never rewrite a resolution rationale (LEARNING_POLICY.md:261; ADR :37-40)."

  # ---- M-1..M-4 ----
  - "M-1 - FIXED by ADDING ROWS, not only by narrowing the sentence. ':281 Every clause below is
    therefore marked' is now scoped to what the table covers, and the two missing normative clauses
    gained rows: the public-half/UI clause and rotation. Adding the UI row SURFACED A REAL DEFECT - the
    surface is built (add_product_page.dart:547, :1043, copy affordances :558, :1054) but the value is a
    CLIENT-SIDE MOCK (_generateMockKeyPair, :126-138), so no server-issued public half reaches the UI
    and an operator can install a key registered nowhere. That is the third partly-built clause; the
    count moved two -> three and the consequence paragraph was updated. Table nine -> eleven rows."
  - "M-2 / G-b - FIXED (surfaced AND filed). Under Accepted risks the bullet now says explicitly that it
    is not counted there and why. A NEW section Known gaps entry carries it, states that no owner exists
    (876c6b97:136-161 assigns gap A2 to design-agent and gaps A3/A4 to implementation/deployment
    authority), records that the property is SUBSTRATE-INDEPENDENT, and marks it surfaced for the
    Manager to route - NOT self-assigned. Creating a fifth accepted risk remains correctly declined."
  - "M-3 - FIXED at both sites (section Preconditions and section Related); each now reads 'decision
    object id, not a commit' with the type, and section Preconditions records that `git log 570bb640`
    fails. SWEPT THE WHOLE CLASS: all NINE 8-hex tokens in the ADR are decision ids (none is a commit)
    and all six 7-hex tokens are commits, so this was exactly one site."
  - "M-4 - FIXED, and the sweep found SIX sites rather than the three named. Verified against main
    c6f301d: 08c7590 made the mint insert-only and it refuses an existing credentialId 'whether the
    supplied material differs, matches, or the existing credential is revoked', in BOTH store tiers, and
    the store comment states 'D-4 removes the mint's ability to resurrect one'. All six stale claims are
    corrected (including 'not merged into main' and 'a re-mint supplying identical material still
    overwrites status', both now false). Immutability is recorded as STRONGER than the e391c02 reading.
    THE AUTHORITY LINE: the technical closure is recorded as verified fact with citations; accepted risk
    A1 is NOT retired and the count stays FOUR, because retiring it from the owner's register is a
    Manager/human action and a lane taking it unilaterally would be this revision's own defect class in
    the other direction. The A1 heading carries BOTH facts, and the Positive revocation bullet carries
    the split (resurrection closed, handle destruction still unimplemented, so revocation is still
    one-sided in practice) so a closed gap cannot launder an open one."

  # ---- L-1, L-2 ----
  - "L-1 - FIXED. Section 1's citations are labelled post-revision and section 2's ledger is labelled
    pre-revision, so a reader cross-checking the two can tell why the numbers differ."
  - "L-2 - FIXED. Risk rationale item 5 is REMOVED as a rationale and the removal is stated with its
    reason: a disclosure neither raises nor holds a risk level. The level rests on items 1-4, which are
    causal. Conclusion (3) unchanged - the reviewer agreed with it - but the stated reason is no longer
    load-bearing."

  # ---- New in revision 4 ----
  - "S-6 - NEW, and the strongest evidence the sweep was necessary. Section Status claimed the design
    revision 'has never been independently reviewed'. That is FALSE: the review of revision 3 exists on
    main (RESULT: DESIGN_REVIEW_CHANGES_REQUIRED, REVIEWED_HEAD: 289f1d3), verified with git ls-tree.
    It is G-17's OWN DEFECT CLASS - a fact with a shelf life written as a standing claim - reproduced by
    the very revision that fixed G-17, and carrying a prescription ('stays null until a reviewer signs
