    stated truthfully: reviewed_by is still null because CHANGES_REQUIRED is not a signature, revision 4
    responds to that review and is itself unreviewed."
  - "S-7 - NEW (this is M-4, sized properly). Six accepted-risk-A1 sites were stale-wrong against main,
    not three. Corrected, with a dated landing note recording six verified evidence rows."
  - "NEW ADR section Decision status LANDING NOTE - a dated, evidence-tabled statement of what 08c7590
    changed, so the table's 289f1d3 anchor is not read as current. Records re-verification against main as
    a STANDING obligation at commit time, because this finding exists only because main moved."
  - "NEW section Known gaps entries - (a) the transport-time same-uid exposure, with no owner, substrate-
    independence, and routed-not-assigned (M-2/G-b); (b) repository_credential.dart's stale custody doc
