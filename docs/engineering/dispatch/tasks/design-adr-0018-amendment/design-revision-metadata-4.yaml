    entry CLOSED and restated as history; (d) the re-verification obligation."
  - "F-9 - NEW. add_product_page.dart renders a CLIENT-SIDE MOCK deploy key (_generateMockKeyPair,
    :126-138: 32 bytes from Random.secure(), labelled ssh-ed25519, 16-byte-digest fingerprint) with a
    'Copy public key' affordance. No server-issued public half reaches the UI. This is the
    'non-installable mock' 73097d48 was issued to replace, still present. Persisted in ADR (owned);
    the fix is PRODUCTION SOURCE and is reported for routing."

  # ---- Corrected claims about this artifact's own history ----
  - "C-5 - Revision 3's own metadata review_note read 'Independent design review HAS NEVER HAPPENED for
    this artifact, at any revision', which is false (F-14). design-revision-3.md and
    design-revision-metadata-3.yaml are RETAINED UNALTERED as history and superseded by this revision -
    the same device revision 3 applied to revisions 1 and 2, and the same reason: revising them in place
