acceptance_is_not_review: true
acceptance_is_not_review_note: |
  ACCEPTANCE IS NOT REVIEW, and four revisions in this artifact have made that point while getting the
  facts around it wrong twice.

  Acceptance is the ADR owner's authority over the design: they decide the amendment is right for this
  repository. Review is an independent agent's judgement of the artifact: whether it is complete, correctly
  sourced, internally consistent, and honest about what it does not establish. Neither substitutes for the
  other, and an accepted design is not a reviewed artifact.

  The two factual errors around this point, both the same defect class and both now corrected:
    - G-17 - the ADR asserted a human acceptance AND the absence of any record supporting it, in the same
      commit. An acceptance whose provenance is misstated is worse than no acceptance, because it invites
      reliance and suppresses checking.
    - S-6 - revision 3 then asserted "has never been independently reviewed" while the review of
      revision 2 was already on record, and revision 3 wrote the same claim again for itself. A review
      whose existence is misstated has the same property: it tells a reader no check exists.

  The acceptance is real (876c6b97) and correctly cited. Revision 3 WAS independently reviewed, with a
  ten-finding CHANGES_REQUIRED verdict. Revision 4 has NOT been.

