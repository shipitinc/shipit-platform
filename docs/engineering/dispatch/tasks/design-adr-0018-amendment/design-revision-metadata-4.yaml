design_system_compliance: PASS
design_system_compliance_note: |
  PASS - not applicable. No UI authored by this revision: it touches ADR prose and a design artifact, and
  adds no component, token or layout.

  It does tighten the OPERATOR-FACING COPY CONSTRAINTS recorded for the mobile lane, and M-1 adds a new
  binding one. ADR section Amendments A2 already forbids UI text claiming the key "stays in the
  keychain"; revision 4 adds that no copy may present the screen's key as INSTALLABLE, because
  add_product_page.dart renders a client-side mock and no server-issued public half reaches the UI
  (F-9). A mobile lane reading only section Amendments A2 would not know this. Recorded for routing;
  apps/control_plane/** is outside this lane's write scope, and the reviewer of revision 3 likewise did
  not re-verify add_product_page.dart:542/:1038.

ux_accessibility_score: PASS
ux_accessibility_score_note: |
  PASS - not applicable. No interface is added, removed or restyled.

  The accessibility surface of this artifact is the ADR itself, and this revision improves it in the
  property that matters for a document a future reader must be able to trust without the author's session:
  EVERY superseded clause now carries a visible marker (SUPERSEDED markers 4 -> 10), the decided-vs-built
  inventory is a table with per-row evidence and per-row "not built" citations rather than prose, the
  same-uid exposure is reachable from section Known gaps rather than only from section Accepted risks, and
  the two passages that actively mislead - a stale scope headline and a false review-status claim - are
  corrected rather than left to be discovered by a reader.

implementation_feasibility: MEDIUM
implementation_feasibility_note: |
  MEDIUM - unchanged from revisions 2 and 3, and for the same reason recorded there.

  A3 depends on a substrate that is decided, already provisioned in this repository's Terraform, and NOT
  wired to the credential path, whose reachability is UNVERIFIED - plus a transport-time window that
  revision 3 made visible for the first time. The identity/registration split (898b07d0) and two-sided
  revocation (79e860e2) are likewise specified and not implemented: 08c7590 closed the resurrection half
  of the revocation gap but no code destroys a manager handle, so revocation is still one-sided in
  practice.

  Revision 4 IMPROVES what an implementer inherits without changing the estimate:
    - Rotation is now correctly scoped (per repository) and confirmed BUILT, so an implementer no longer
      has to infer that "per product" meant "per repository".
    - The public-half UI is marked PARTLY BUILT with the mock named, so nobody builds on the assumption
      that the screen offers an installable key. This is a DISCOVERED implementation prerequisite
      (F-9), not one revision 4 created.
    - Key-material immutability is recorded as STRONGER than the e391c02 reading, with the extra
      predicates on scope and on durable evidence named.
    - The pre-A1 reference-name form GIT_PRODUCT_<productRef>_SSH is now forbidden by name - using it
      would collide two repositories of one product on one secret name.
  Feasibility does not rise because nothing was implemented. The estimate gets sharper.

