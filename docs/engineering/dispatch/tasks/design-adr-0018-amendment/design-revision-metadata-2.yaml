ux_accessibility_score: PASS
ux_accessibility_score_note: |
  Scoped to what this revision changes. ADR :89-91 is unchanged and remains screen-reader-safe;
  nothing here removes a label, a focus target or a confirmation affordance, and two-sided revocation
  adds no new user-facing surface. Recording a risk as accepted is a documentation act with no
  user-facing surface at all.
  NOT ASSESSED and not claimed: the mobile lane's board-copy corrections, and the remediation copy for
  secret-manager unavailability, which remains a recorded precondition rather than a specification.

implementation_feasibility: MEDIUM
implementation_feasibility_note: |
  Unchanged, and the re-verification moved it in neither direction. The amendment itself is
  documentation and is complete. Feasibility of the architecture it RECORDS is MEDIUM and was never
  higher: 9417f8bf records confidence LOW and states that no substrate option was runtime-verified, and
  A3 adds a runtime dependency whose availability now gates the credential path. The documented A1/A4
  fallback is what keeps this MEDIUM rather than LOW.

  Note the direction of the correction: at 6220951 two of the invariants this ADR externalised were
  enforced by nothing at all. At 43d328b both are enforced in the database. That is a real
  improvement, and it is also why the level-3 rating is unchanged rather than lower — what remains
  missing is the transport host-key enforcer, which is the security-critical one.

