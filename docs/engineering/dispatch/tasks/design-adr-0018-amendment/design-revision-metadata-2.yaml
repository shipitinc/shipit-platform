risk_level: 3

risk_rationale: |
  Level 3 (Major Workflow / Architecture Change) per DESIGN_GOVERNANCE.md, unchanged from revision 1.
  Acceptance did not lower it: the level describes the change, not whether a human has blessed it.

  1. AMENDS RECORDED ARCHITECTURE ON A SECURITY BOUNDARY. It changes where a private key capable of
     authorising repository WRITE access is held, and what "revoked" means. No such secret exists in
     the repository today.
  2. CHANGES A CORE WORKFLOW. Revocation acquires a ShipIt-side action where ADR 0018 said none was
     required, and a new runtime dependency (the secret manager) can block the credential path. The
     operator's mental model of revocation changes.
  3. DEPENDS ON ENFORCEMENT THAT LIVES ELSEWHERE AND IS STILL PARTLY ABSENT. Under A3, SHIP IT holds
     no key bytes, so every property once followed from possessing a key must now be enforced by
     another component. That dependence improved at 43d328b — the one-active index and the predicating
     upsert are merged (e391c02) — and remains partly unsatisfied: there is still no transport
     host-key enforcer.
  4. CARRIES FOUR ACCEPTED RISKS ON A SECURITY BOUNDARY. ADR :446-524 records each with its
     consequence: a revoked credential can be resurrected; host keys are not verified at the
     transport; the "local only" scope is a stated posture rather than a property; and the secret
     manager's reachability was never runtime-probed. The owner accepted these alongside A2 rather
     than gating A2 behind them.

  Level 3's approval requirement was satisfied on 2026-10-06 by the repository owner as ADR owner.
  That satisfies the HUMAN GATE. It does not satisfy INDEPENDENT REVIEW, which has never happened.

