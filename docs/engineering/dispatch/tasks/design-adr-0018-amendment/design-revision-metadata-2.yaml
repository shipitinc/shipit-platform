acceptance_is_not_review: true
acceptance_is_not_review_note: |
  ACCEPTANCE IS NOT REVIEW, and this artifact has been accepted and has never been reviewed.

  Acceptance is the ADR owner's authority over the design: they decide the amendment is right for
  this repository. Review is an independent agent's judgement of the artifact: whether it is complete,
  correctly sourced, internally consistent, and honest about what it does not establish. Neither
  substitutes for the other, and an accepted design is not a reviewed artifact.

  This field exists because the distinction was lost once already. Revision 1 correctly refused to
  declare an acceptance it had not been given — it carried status DRAFT, approved_by null, and a
  blocking item reading "ADR 0018 status remains Proposed. This lane does not declare it Accepted." A
  sibling design revision read that work and asserted in thirteen-plus places that the amendment was
  "Accepted". The acceptance existed nowhere on disk; the downstream artifact invented it. Now that
  the acceptance is real and recorded, this field records the other half of the truth, so the same
  drift cannot recur by treating an accepted ADR as a reviewed one.

