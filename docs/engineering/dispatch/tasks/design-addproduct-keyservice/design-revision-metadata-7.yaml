requirements_gaps:
  # Revision 5's G-3..G-17, L-6 and the ADR :103 wording entry, plus Revision 6's G-18, G-19 and
  # G-20, are incorporated BY REFERENCE and are UNCHANGED in substance. They are not restated
  # here, because restating a register is how two registers drift apart — which is the exact
  # defect B-R5-1 part 1 exists to prevent, and which H-3 shows the counts were never checked
  # against. THE THREE NEW ENTRIES FOLLOW, plus ONE entry that Revision 6 carried and this
  # revision closes.
  #
  # REGISTER AGREEMENT (design-revision-7.md § R.18.2-j, counted at § 0.5): requirements_gaps and
  # the body's § R.18.2-j carry the SAME THREE new entries, G-21, G-22 and G-23. A reviewer
  # checking one against the other must find identical ids, summaries and owners.
  #
  # COUNTS, FROM THE LIVE DOCUMENTS AND NOT FROM REVISION 6's ASSERTION:
  #   Revision 5   § R.18.2 = 15 rows   requirements_gaps = 16 entries
  #   Revision 6   § R.18.2 = 18 rows   requirements_gaps = 19 entries   (published as 19 -> 22; WRONG)
  #   Revision 7   § R.18.2 = 21 rows   requirements_gaps = 22 entries
  # The asymmetry between the two registers is NOT an error: § R.18.2 has no row for "the Rev-4
  # review report" because that entry is CLOSED at § 0.5, while requirements_gaps carries it marked
  # CLOSED so the residue survives. 21 vs 22 is stated, not smoothed.
  - id: "G-21"
    summary: |
      ★ NEW — ADR 0018's OWN BODY STILL RECORDS FOUR ACCEPTED RISKS AFTER THE OWNER RETIRED ONE.
      Verified read-only at 14b0267: `grep -c 'Consequence accepted' docs/adr/0018-per-product-git-credentials.md`
      -> 4. :453 still reads "**A1 — A revoked credential can be resurrected by a re-mint. ACCEPTED.**";
      :448-451 still says "The four gaps A2 carries" and "Nothing here is closed"; :527 says "the four
      accepted risks above"; :557 and :574 say "the four accepted risks". The owner's retirement of A1
      IS recorded — in 876c6b97's second scope note, appended at 14b0267, which states "THREE are now
      recorded (A2, A3, A4)" — but only in the DECISION OBJECTS, not in the ADR.
      WHY IT IS A GAP: a reader who checks the ADR — the artifact every lane cites for custody — concludes
      four accepted risks are live and that A1 is one of them. The ADR and the decision objects now disagree,
      and the ADR is the one that gets cited. SAME CLASS AS G-17, which was ADR 0018 asserting no decision
      object records its acceptance in the same commit that added the object: a record that will not be
      re-checked, because it is authoritative, asserting a state the owner has changed. SIBLING, NOT THE SAME
      FINDING — different file, different owner.
      ALREADY SPECIFIED, NOT YET APPLIED: the ADR lane specified this exact edit in
      design-adr-0018-amendment/design-revision-5.md section 4, and its own report records the ADR as
      UNCOMMITTED (999 -> 1212 lines). So at 14b0267 the specified edit is not on disk either. This lane
      specified NOTHING NEW; it verified the count that must change (four -> three) and the sites that
      carry it, and recorded the three things the edit must not get wrong (substrate option A1 is live;
      amendment A1 is live and live in the code; retiring A1 did not discharge the revocation half).
    owner: "ADR LANE + MANAGER — apply the already-specified edit and commit it. NOT THIS LANE'S:
            docs/adr/** is PROHIBITED_PATHS, NOTHING WAS WRITTEN THERE, and no such edit is claimed.
            WHEN APPLIED, THE COUNT IS THREE: A2, A3, A4. A1 was retired BY THE REPOSITORY OWNER on
            2026-10-07 — two prior lanes were right to decline to make that call themselves. AND THE
            RETIREMENT DOES NOT DISCHARGE REVOCATION: no code destroys a secret-manager handle, so
            revocation remains one-sided in practice and that half was never an accepted risk."
  - id: "G-22"
    summary: |
      ★ NEW — REVISION 6'S FALSE AND MIS-RESOLVING TEXT IS COMMITTED, AND THIS CORRECTION DOES NOT TRAVEL
      WITH THE FILE.
      45 cross-reference sites across 7 distinct targets mis-resolve (design-revision-7.md § R.11g-j § A:
      `§ 10.2-h` at 2 sites, `§ 10.2` at 1, the ADR amendment's `§ 3.1` at 1, `§ Content pins` at 7, bare
      `§ R.11g` at 17, `§ 10.1 item 12` at 16, bare `§ R.1` at 1), and 8 sites assert a false
      `artifacts[]`-entry-carries-a-real-hash claim. All of it is COMMITTED on main at af8e30f in four
      artifacts this revision RETAINS BYTE-IDENTICAL, and those are the ones a reader will open.
      WHY IT IS A GAP: a correction does not travel with a file. A reader who opens design-revision-6.md
      directly — by search, by a citation, by `git show` at an older SHA — gets the false text with no
      pointer to this revision. The chain only helps a reader who walks it. This is LOW-4's mechanism
      GENERALISED: Revision 5 has no forward pointer to Revision 6, and now neither does Revision 6.
      THE CHOICE, AND ITS COST, STATED RATHER THAN MADE SILENTLY: not editing a committed artifact is
      CORRECT — it is why design-revision-6.md:277 and :523 are citable at af8e30f at all, and it is how
      this revision found two of its own defects in them. It is not free. The cost is this entry.
      THE FIX IS EXACT: a supersession banner on design-revision-5.md naming Revision 6 (LOW-4) and on
      design-revision-6.md naming Revision 7. Both are one-line prepends to committed files and belong to
      whoever commits. Exact banner text: report-revision-7.md § 7. NOT THIS LANE'S — it may not commit.
    owner: "MANAGER — add both supersession banners with the next commit. UNTIL THEN, THIS ENTRY IS THE
            REDIRECT, and it is one line that will not travel with the file it corrects."
  - id: "G-23"
    summary: |
      ★ NEW — THE BOARD-OWNERSHIP GRANT IS BROADER THAN G-18's MEASURED OBLIGATION, AND THE DIFFERENCE IS
      RECORDED NOWHERE.
      THE HUMAN HAS GRANTED BOARD OWNERSHIP to a scoped design-system lane, covering the four desktop
      `S · Add Product · …` boards AND `BPM`, to remove the single `Footer` text layer at (236, 862).
      EVERY MEASUREMENT OF THAT LAYER — three independent lanes, all read-only — is on the four desktop
      `S` boards. BPM WAS MEASURED AS CARRYING NO FOOTER COPY: penpot-board-evidence.md § 6.3 and § 6.4,
      and Revision 6 section R.11g-h amendment 2, both record BPM and SM as TWO STATES OF ONE MOBILE
      DESIGN WHOSE SPEC IS ALREADY SATISFIED, and Revision 6 states "There is no substantive conflict and
      no mobile board edit is required".
      WHAT BPM DOES CARRY is a DIFFERENT defect: WORK_STATE.md:639 records that "BPM additionally carries
      the same false custody string and the now-false `NOT REGISTERED YET` eyebrow" — the item Revision 6
      registered under blockers[] EXTERNAL_BLOCKER_NOT_MINE (b), NOT under G-18.
      WHY IT MUST BE RECORDED RATHER THAN RESOLVED: A GRANT OF OWNERSHIP IS NOT A FINDING OF FACT. If the
      design-system lane reads "you own BPM" as "edit BPM's footer", it will make an edit NO MEASUREMENT
      SUPPORTS and Revision 6 explicitly says is not required. That is the B-R5-1 failure mode — the build
      diverging from the authority it declares — reappearing in the opposite direction, on the board
      rather than in the code.
      WHAT IS DECIDED AND WHAT IS NOT: the grant is the human's and is DECIDED; this entry does NOT
      narrow it. It records only that G-18's OBLIGATION is scoped to the four desktop S boards, and that
      if the design-system lane measures a `Footer` layer on BPM, that is A NEW MEASUREMENT TO REGISTER —
      not an authorisation this artifact confers. THE QUESTION IS CURRENTLY UNVERIFIED IN BOTH
      DIRECTIONS and is the granted lane's to establish; this lane called no Penpot tool and read no board.
    owner: "THE GRANTED DESIGN-SYSTEM LANE (to establish BPM's state before editing it) + MANAGER.
            RECORDED by this lane, which holds NO BOARD OWNERSHIP and read no board."

