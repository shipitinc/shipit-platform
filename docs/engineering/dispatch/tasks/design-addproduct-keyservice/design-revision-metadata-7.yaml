# -------------------------------------------------------------------------------------
# risk_rationale — the SINGLE tally, reproduced VERBATIM from design-revision-7.md § 2.1,
# which carries it verbatim from design-revision-5.md § 9.1 through Revision 6.
#
# Revision 7 moves NO reason's status in either direction and claims NO NEW REASON.
# Claiming one for bookkeeping is the same error class as H10 (a count asserted in five
# places). The LEVEL is re-derived, not inherited: design-revision-7.md § 2.2 re-states
# the six level-3 grounds and confirms every one is present at 14b0267.
# -------------------------------------------------------------------------------------
risk_rationale: |
  Level 3 — "Change to core workflow, navigation structure, or information architecture
  affecting multiple features or user mental models" (DESIGN_GOVERNANCE.md:94-99). Approval
  path: HUMAN_DECISION_REQUIRED — product/design/architecture approval. This revision does
  NOT have it and does not claim it.

  Six grounds, re-confirmed present at this revision's base 14b0267:
    1. 898b07d0 makes a Product VISIBLE before registration commits and turns registration
       into a commit — what a Product IS changes across the Products page, product detail
       and Add Product.
    2. RegistrationCommitState is a FIVE-STATE client model; § R.11.1 state 4 changes what
       product detail asserts and is currently indistinguishable from state 1 (G-14).
    3. Revision 5 § R.11g item 3 adds a RESUME ROUTE from the product into the credential
       flow — new IA, and without it 898b07d0's accepted consequence is a dead end.
    4. First handling of key material by SHIP IT; irreversible from SHIP IT's side.
    5. An SSH transport seam with NO precedent, carrying an ADR requirement that is
       HALF-IMPLEMENTED (G-4), on the credential path.
    6. A credential-minting endpoint on a control plane server.dart:71-73 that declares
       NO AUTHENTICATION.

  THE TALLY — one, and it is the only one, carried character-for-character from Revision 5:

  0 reasons IMPROVED, 2 reasons UNCHANGED (R1, R6), 4 reasons WORSE (R2, R3, R4, R5)

  UNCHANGED BY REVISION 7. Revision 7 claims no movement in either direction.

  WHAT REVISION 7 ADDS TO THE LEVEL: three new open gap-register entries — G-21 (ADR 0018's
  own body still records FOUR accepted risks after the owner retired one), G-22 (Revision
  6's false and mis-resolving text is committed and this correction does not travel with the
  file), G-23 (the board-ownership grant is broader than G-18's measured obligation) — plus two
  residual items on G-19. SIX open governance items against a design whose level is 3 is
  itself an argument FOR level 3, not against it: a design at level 1 does not accumulate
  governance debt. Revision 6 argued this with three; Revision 7 argues it with six and the
  argument is STRONGER, not weaker. A correction pass that lowered the level because it
  changed no design content would be measuring the correction rather than the design.

  ACCEPTED-RISK COUNT IS NOW THREE — A2, A3, A4. A1 (the RESURRECTION risk) was retired BY THE
  REPOSITORY OWNER on 2026-10-07, after 08c7590 made the mint insert-only on both tiers.
  Verified at 14b0267 by reading the shipped source, not adopted:
    - apps/server/lib/src/persistence/postgres_product_registry_store.dart:190-191
      "A MINT NEVER OVERWRITES AN EXISTING IDENTITY — the null-`expectedVersion` branch is
      `DO NOTHING`, not a predicated `DO UPDATE`."
    - packages/product_registry/lib/src/store/in_memory_product_registry_store.dart:167-169,184
      "is INSERT-ONLY. Checked FIRST…"
    - packages/product_registry/lib/src/engine/product_registry_engine.dart:933-936
      "A mint is insert-only: supplying an id that already exists is refused by the store and
      changes nothing — whether the supplied material differs, matches, or the existing
      credential is revoked."
  Two prior lanes were RIGHT TO DECLINE to retire it — 876c6b97's first scope note says
  "RETIRING IT IS THE OWNER'S CALL". A design lane may not retire an accepted risk. The owner
  has; this revision records that and attributes it.

  ⚠ THREE READINGS OF "A1" EXIST AND MUST NOT BE CONFLATED. This has already caused one wrong
  conclusion in this work item; ADR 0018 now carries a three-way identifier table for that reason.
    - ACCEPTED RISK A1 ("a revoked credential can be resurrected by a re-mint") — RETIRED 2026-10-07.
    - AMENDMENT A1 ("Scope is the repository, not the product", ADR:35) — LIVE, and live IN THE
      CODE TODAY: packages/product_registry/lib/src/store/product_registry_store.dart:47 reads
      "KEY MATERIAL IS IMMUTABLE (ADR 0018 A1)" and :52-53 "ADR 0018 A1, 'scope is the
      repository'". A reader told "A1 was retired" who meets these comments must NOT conclude the
      immutability rule is retired. It is not.
    - SUBSTRATE OPTION A1 (filesystem 0600) — LIVE, ADR:107 and :442, the documented fallback.

  ⚠ RETIRING A1 DISCHARGED THE RESURRECTION HALF ONLY. Verified at 14b0267:
  grep -rniE 'destroySecret|deleteSecret|removeSecret|secretManager\.delete' --include='*.dart'
  apps packages  ->  0 MATCHES. No code destroys a secret-manager handle, so REVOCATION REMAINS
  ONE-SIDED IN PRACTICE, and THAT HALF WAS NEVER AN ACCEPTED RISK. Retiring A1 did not accept it,
  close it, or transfer it to A2–A4. It belongs to 79e860e2. Carried against Revision 5 § R.6 at
  design-revision-7.md § R.6-j. A CLOSED GAP MUST NEVER LAUNDER AN OPEN ONE.

  ⚠ ADR 0018's OWN BODY STILL RECORDS FOUR. Verified at 14b0267:
  grep -c 'Consequence accepted' docs/adr/0018-per-product-git-credentials.md  ->  4
  :453 still reads "**A1 — A revoked credential can be resurrected by a re-mint. ACCEPTED.**"
  :448-451 still says "The four gaps A2 carries" and "Nothing here is closed"; :527 and :557 and
  :574 still say four. The retirement is in the DECISION OBJECTS, not in the ADR. That gap is
  G-21, owned by the ADR lane + Manager; docs/adr/** is PROHIBITED_PATHS for this lane and
  NOTHING WAS WRITTEN THERE. The ADR lane has ALREADY SPECIFIED the edit in
  design-adr-0018-amendment/design-revision-5.md section 4; its own report records the ADR as
  UNCOMMITTED (999 -> 1212 lines), so at 14b0267 the specified edit is not on disk either.

  SCOPE OF THIS PASS: no design content about the key flow was changed. Substrate choice, the
  custody model, the eight-column D-6 set, G-14, G-10's unrun probe and A4's unproven reachability
  are all untouched. A4 remains accepted AND unproven, which is the combination worth recording.

