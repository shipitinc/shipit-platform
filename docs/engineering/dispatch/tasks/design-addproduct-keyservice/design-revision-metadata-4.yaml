# -------------------------------------------------------------------------------------
# risk_rationale — the SINGLE tally, reproduced verbatim from design-revision-4.md § 9.1.
# H6: Revision 3 tallied the same reasons four different ways across three artifacts.
#      This block, design-revision-4.md § 9.1 and report-revision-4.md must carry the SAME
#      sentence. If a fourth number appears anywhere, the finding has recurred.
# -------------------------------------------------------------------------------------
risk_rationale: |
  Level 3 (Major Workflow / Navigation / IA Change) per DESIGN_GOVERNANCE.md § Design-Change
  Risk Levels. Revision 4 RE-DERIVES the level rather than inheriting it, per Invariant 6,
  which requires the classification for EVERY revision. Revision 3 was independently agreed
  at 3 (INDEPENDENT_RISK_LEVEL: 3, RISK_LEVEL_AGREEMENT: YES); agreement is recorded, not
  inherited — and H6 concerned the ARITHMETIC behind the level, not the level.

  THE SIX REASONS AND THEIR STATUS

  R1. FIRST HANDLING OF KEY MATERIAL — UNCHANGED. This design is the first time SHIP IT
      handles a private deploy-key half in a flow it controls. Still irreversible: a leaked
      key authorising WRITE access to a customer repository cannot be recalled from SHIP
      IT's side — it must be uninstalled at the host. No such secret exists in the
      repository today.

  R2. CREDENTIAL EXPOSED THROUGH AN UNAUTHENTICATED, UNPINNED CONTROL PLANE — WORSE.
      Under A3 the endpoint is not the only exposure; there is now a RUNTIME DEPENDENCY
      whose unavailability blocks the credential path, so the failure mode is disclosure
      AND denial. apps/server/lib/server.dart:71-73 declares no authentication services;
      570bb640's loopback pinning is still un-implemented; docker/compose.yaml:16-17
      publishes 5432:5432 unqualified and :63 hardcodes SERVERPOD_DATABASE_PASSWORD in a
      COMMITTED file. Revision 4 sharpens it: an attacker with the database can also set
      status = 'revoked', and D-2's index would then block the legitimate re-mint — so D-4
      is an AVAILABILITY control here, not only an integrity one.

  R3. CHANGE TO THE CORE REGISTRATION WORKFLOW — WORSE. Under 898b07d0 the change is no
      longer only "registration is gated"; it is IDENTITY SEMANTICS — a Product becomes
      visible BEFORE registration commits, and the accepted consequence is a visible
      product with no usable credential. That changes what a Product means across the
      Products page, product detail and Add Product: closer to information architecture
      than to a gate. ae1c1f79 adds a second interaction — the same flow's FIRST step is
      now conditional on an infrastructure dependency, so the flow has TWO distinct
      failure shapes with different user-visible consequences (design-revision-4.md
      § R.11g item 5).

  R4. CREDENTIAL INVARIANTS REACHABLE AND NOT ENFORCED — WORSE. R-B6's original defect is
      closed by D-1/D-2 (design-revision-4.md § R.8.2). But D-4, D-5 and D-6 are STILL
      UNMERGED, and this pass found THREE MORE defects in the specified flow: G-13 (the
      get-or-create step rewrites a product's state and createdAt, because saveProduct and
      saveRepositoryReference are both ON CONFLICT DO UPDATE), G-14 (a revoked credential
      is invisible to the product detail, so the user is told "no key generated yet" about a
      withdrawn key), and G-15 (D-4's named CredentialIdentityConflictException does not
      exist). The COUNT of unbuilt or newly-found credential invariants ROSE, which is the
      opposite of the direction the net should move.

  R5. AN SSH TRANSPORT SEAM WITH NO PRECEDENT — WORSE. The seam must deliver host-key TOFU
      verification AT THE TRANSPORT and manager-backed material resolution — two
      security-critical capabilities, one with no precedent anywhere in the repository, and
      ADR 0018 :96-99 makes the first a REQUIREMENT. Revision 4's contribution is PRECISION,
      not reduction: the DOMAIN half IS enforced (product_registry_engine.dart:1047-1052 and
      :1162-1167), so the remaining half is cleanly nameable — and a cleanly nameable half
      is still an unbuilt half. This also WITHDRAWS Revision 3's over-broad "no runtime
      enforcer / decorative" claim (§ R.10.3).

  R6. A DESIGN WHOSE OUTCOME MAY CONTRADICT AN EXISTING RECORDED ADR — IMPROVED, with a
      stated residual. Revision 2's reason for 3 was ADR 0018 :85-88 in tension with
      b869ec24; Revision 3 re-framed it as a known, human-owned, PENDING amendment. The ADR
      0018 AMENDMENT IS NOW WRITTEN AND ACCEPTED by the human (158 -> 465 lines; it
      supersedes :85-88, keeps :87-88's prohibition, supersedes :113-114 and upholds
      :100-102). The contradiction is resolved in a recorded artifact rather than merely
      anticipated. RESIDUAL, stated rather than dropped: the amendment is UNCOMMITTED and not
      yet in docs/adr/**, so code shipping before the merge briefly contradicts a live ADR.
      That residual is an ownership and sequencing matter, not a design uncertainty — and it
      is why the merge appears in design-revision-4.md § 10.1 action 1.

  THE TALLY — one, and it is the only one

  RISK_LEVEL: 3 (Major Workflow / Navigation / IA Change), re-derived on this evidence.
  1 reason IMPROVED (R6), 1 reason UNCHANGED (R1), 4 reasons WORSE (R2, R3, R4, R5).

  Three places must carry this exact sentence: this block, design-revision-4.md § 9.1, and
  report-revision-4.md. Revision 3's four tallies — "5 rows" / "one improved, two unchanged,
  three worse" / "IMPROVED (2 reasons) … UNCHANGED OR WORSE (4 reasons)" enumerating five /
  "Two improved, four unchanged or worse" — are WITHDRAWN as arithmetic. Their LEVEL was
  right; the counting was incoherent, and incoherent counting in a risk rationale is not a
  typo, because the tally is what a reviewer checks to see whether the reasoning was done.

  WHAT THE LEVEL MEANS. Level 3 requires product/design/architecture human approval at Gate
  D4. The six Gate D4 decisions are taken and ae1c1f79 is taken. The CONTENT of Revision 4
  still requires human approval: D-4, D-5, D-6, G-13, G-14, SC-11..SC-19, the N-9 copy, and
  § R.5.7's compensation construct.

