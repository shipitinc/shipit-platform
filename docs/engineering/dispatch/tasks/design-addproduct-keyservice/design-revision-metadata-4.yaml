changelog:
  - "Revision 4. CORRECTION PASS over Revision 3 (4B017787-…), returned DESIGN_REVIEW_CHANGES_REQUIRED
     by a fresh independent reviewer with 4 BLOCKERS, 7 HIGH, 2 MEDIUM and 4 LOW, INDEPENDENT_RISK_LEVEL 3
     and RISK_LEVEL_AGREEMENT YES (tasks/review-addproduct-keys-rev3/report.md, tracked on main at
     1aa8755, REVIEWED_HEAD 77c19f1). REVISION 3 WAS NEVER APPROVED AND NO APPROVAL CARRIES OVER. No
     commit, no push, no Docker command, no test run, no deletion."

  # ---- BLOCKERS ----
  - "B1 (BLOCKER) — STALE BASE. Revision 3's HEAD_SHA was 77c19f1, which is NOT an ancestor of main and
     does not contain the resolved decisions, the store-integrity work, the LANES retraction or the
     restored AGENTS.md §13. A design citing SHAs that are none of them ancestors of its own base cannot
     be verified by anyone reviewing it. FIX: this worktree is re-based onto 361256c (a fast-forward —
     77c19f1 was an ancestor). All nine cited SHAs verified as ancestors; output quoted in § 0.3.
     CONSEQUENCES RE-VERIFIED, NOT ASSUMED: (a) LANES.md:204-205 is NOT a surviving false claim — at
     77c19f1 the file was 172 lines with no such assertion, and at the new base it is 399 lines with the
     RETRACTION at :204-205 (landed 4e2d237), so § 10.1's item requesting it is WITHDRAWN;
     (b) G-1' is CLOSED — 0bf2fa0 restored AGENTS.md §13/§13a/§13b (now at :65-101), so § 10.1's item
     asking for that action is also WITHDRAWN; (c) ae1c1f79 IS now present and is cited (H4).
     § R.18.1 records both closures and § R.18.2 no longer lists either as open."

  - "B2 (BLOCKER) — destroy(handle) IN A finally DESTROYS THE HANDLE ON THE SUCCESS PATH. Revision 3 said
     'compensate: destroy(handle) in a finally' (§ R.5.2 step 5) and 'inside a try, with destroy(handle)
     in the finally on any failure' (§ R.14.1 step 5). DART HAS NO FAILURE-ONLY finally. On the literal
     reading the success path destroys the handle just recorded — the exact forbidden state § R.5.2
     names. FIX: § R.5.7 states the construct ONCE, normatively, with two acceptable forms (a success
     flag, or catch-and-rethrow), and § R.5.2 step 6, § R.10.1 step 4 and § R.14.1 step 6 all REFERENCE
     IT AND REPRODUCE NO VARIANT. Five obligations, each testable: (1) destroy iff the row was not
     recorded; (2) ON SUCCESS THE HANDLE SURVIVES AND MUST BE RESOLVABLE; (3) destroy on the failure path
