  - "B6 (BLOCKER) — THE CORRECTED STEP 4 BYPASSED OWNERSHIP, AND NO STEP PRODUCED THE ERROR TABLE'S 403.
     engine.readActiveCredential (engine:1135-1142) opens with readRepositoryReference then
     _ensureOwned at :1140 — but Revision 4's H2 fix switched step 4 to
     productRegistryStore.readActiveCredentialForRepository, which filters on repositoryId and status <>
     'revoked' (store:370-381; in_memory:221-232) and HAS NO NOTION OF A PRODUCT AND NO _ensureOwned.
     Choosing the store method IS the bypass. Revision 4's claim that 'by step 4 ownership is already
     established, because step 3 created the reference under productId' is FALSE: addRepositoryReference
     calls _store.readProduct(productId) for EXISTENCE ONLY (engine:159, annotated 'existence + scope'),
     never _ensureOwned, and under G-13's read-first the write is SKIPPED whenever the reference already
     exists — so on exactly the cross-product case step 3 performs no write and no check. Revision 4's
     claim that 'this endpoint does not call it and does not bypass it' is also false, and is withdrawn
     by name. CONSEQUENCE: mintOrReadDeployKey(productId: 'A', repositoryId: <B's repository>) returned
     B's publicKey, credentialId, status and hostKeyStatus with alreadyExisted: true — a cross-product
     disclosure on an endpoint § R.15.1 records as carrying NO AUTHENTICATION (server.dart:71-73) and with
     no loopback pinning. NO STEP raised the CrossProductAccessException the error table promised.
     FIX: § R.14.1 gains STEP 3A — a normative ownership step, 'immediately after
     readRepositoryReference(repositoryId) returns and BEFORE deciding whether to create anything,
     establish that the reference belongs to productId; on mismatch throw CrossProductAccessException',
     with TWO acceptable forms (a) compare ref.productId directly — literally what _ensureOwned does; (b)
     preferred — call engine.resolveRepository(productId, repositoryId) (engine:176-183), which does
     exactly this and whose RepositoryNotFoundException IS the create signal, collapsing step 3's
     absence test and 3a's ownership check into one call. § R.14.1 states EXPLICITLY that step 3's
     read-first is NOT an ownership check (absence-testing and ownership-testing are different questions
     answered by different methods, and a get-or-create loop naturally answers only the first), and that
     step 4's store call is safe BECAUSE OWNERSHIP WAS ESTABLISHED ONE STEP EARLIER — attached to the
     step that makes it true rather than to a write that does not occur on this case. THE ERROR TABLE's
     403 ROW NAMES STEP 3A AS ITS ONLY PRODUCING STEP, and says that an error-table row with no producing
     step is not a refusal. T-L ADDED: a foreign repositoryId yields 403 AND NO FIELD of the other
     product's credential is returned — not publicKey, fingerprint, algorithm, credentialId, status,
     hostKeyStatus, nor alreadyExisted: true — ON BOTH STORE TIERS. SC-20 added. G-16 added as a gap
     register entry. SAME SECTION, SAME CORRECTION: G-13's blast radius now carries the FULL column set —
     saveProduct's conflict branch (store:92-100) sets name/description/manifestVersion/state/createdAt/
     updatedAt/version, and saveRepositoryReference's (store:136-142) sets productId/kind/uri/provider/
     addedAt/version — INCLUDING 'productId' at store:137, which Revision 4 OMITTED and which is the one
     column whose rewrite REPARENTS another product's repository reference. § R.10.0 states the
     reparenting mechanism, that addRepositoryReference with an existing repositoryId and a different
     productId moves the repository silently, and that G-13's read-first discipline is therefore
     LOAD-BEARING RATHER THAN A FOOTNOTE — it is the only thing preventing either harm — which is why
