    line numbers, which is invisible to users and material only to the lane that consumes it.

implementation_feasibility:
  value: "MEDIUM"
  rationale: |
    Unchanged at the revision level; the composition underneath is stated per component so the
    aggregate does not hide a split.
    HIGH: domain half; store half (D-4/D-5/D-6 — three statements plus two Dart predicates, six
    tests per tier, five required contract sentences; EIGHT columns per tier after H9, which is
    one extra _noClear clause and one extra _clears disjunct); G-14 (one method's data source, one
    selection rule, plus § R.9.7 item 5's ordering requirement on both tiers, zero schema or wire
    change); G-13 + G-16 (two reads, a catch, and one ownership call that already exists as
    engine.resolveRepository); G-7's wire change (one field, two regenerations, TWELVE ROWS ACROSS
    SIX FILES after H10).
    MEDIUM: substrate integration — no precedent in this repository, reachability UNVERIFIED
    (G-10), and § R.5.7's compensation construct has FIVE obligations (L6's correction — Revision 4
    said four in this field while the section itself listed five), of which TWO are subtle:
    obligation 3, a destroy that throws inside a finally masks the real error; and obligation 4,
    where H8's finding is that Revision 4's FORM 2 never zeroed the buffer on the put-throws path,
    so one of the two forms the section accepts did not meet the section's own requirement.
    LOW: the SSH transport seam — nothing exists at the transport, two security-critical
    capabilities, one an ADR requirement, and the domain's existing enforcer does not help because
    the domain does not make the connection.

