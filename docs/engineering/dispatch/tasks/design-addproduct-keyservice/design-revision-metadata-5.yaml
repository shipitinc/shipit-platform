     false with level 3 RETAINED, blocking_items [], and the ADR's Status line now 'Accepted (amended —
     … A1 credential scope = per repository; A2 credential custody = external secret manager, revocation =
     two-sided)' with a new § Accepted risks (:446-524) carrying A1–A4, each with a 'Consequence accepted.'
     paragraph and a named owner. § 0.2 states all of it with the citations; § R.17.1 is rewritten;
     § R.16 rows 31 and the ADR row; § R.17's lead; § 10; § 10.1. ACCEPTANCE IS NOT REVIEW IS NOW SAID
     IN THE PLACES THAT MATTER: the amendment's reviewed_by/reviewed_at are null ON PURPOSE, it carries
