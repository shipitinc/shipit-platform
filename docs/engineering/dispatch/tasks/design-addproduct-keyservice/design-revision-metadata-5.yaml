ux_accessibility_score:
  value: "PARTIAL"
  rationale: |
    Unchanged. Contrast figures are INHERITED, NOT RE-MEASURED (design-register-button/report.md:
    71-76); no contrast tool was run by this lane. The refused-mint surface (§ R.11g item 5) still
    has NO copy specified, deliberately: the copy belongs to the sibling lane and N-8's token
    binding applies to it automatically. A surface with no copy yet specified is a reason the
