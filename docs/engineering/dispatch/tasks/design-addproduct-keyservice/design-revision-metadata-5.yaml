  # ---- HIGH ----
  - "H8 (HIGH) — § R.5.7 FORM 2 VIOLATED ITS OWN OBLIGATION 4. FORM 2 put `provider.put` OUTSIDE the try,
     so a put-throws failure propagated past `zero(privateHalf)` entirely and the trailing zero was
     UNREACHABLE after the bare `rethrow`. Obligation 4 is normative ('zeroed on every path, success
     included') and § R.5.7 states the required behaviour is identical between the two forms. FIX: FORM 2
     is rewritten as `String? handle; try { handle = await put(...); await recordGeneratedCredential(…); }
     catch (error, stack) { if (handle != null) await destroyQuietly(handle); rethrow; } finally {
     zero(privateHalf); }` — catch keeps the destroy, finally keeps the zero, and they are not
     interchangeable because moving destroy into the finally would RE-INTRODUCE B2 (finally also runs on
     the success path). § R.5.7 now shows Revision 4's defective form and states the two defects in it.
     SECONDARY: § R.5.7's normative sentence said destroyQuietly must be SKIPPED on a null handle, while
     FORM 1's finally called it unconditionally inside `if (!recorded)` — reached with a null handle
     exactly when put throws. The sample and the sentence disagreed and THE SAMPLE IS THE ONE AN
     IMPLEMENTER COPIES; both forms now guard on `handle != null`, and § R.5.7 says so. § 10.2 item 1 now
     checks obligations 1, 2 AND 4 on BOTH forms, with three named falsifiers. T-I extended to assert the
     zero on every exit of both forms. SC-18 extended."

  - "H9 (HIGH) — D-6's REQUIREMENT BOX NAMED EIGHT COLUMNS AND BOTH TIER CONSTRUCTS COVERED SEVEN.
