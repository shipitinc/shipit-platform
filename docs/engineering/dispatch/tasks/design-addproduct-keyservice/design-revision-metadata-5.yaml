# -------------------------------------------------------------------------------------
# risk_rationale — the SINGLE tally, reproduced VERBATIM from design-revision-5.md § 9.1.
#
# B5: Revision 4 published "1 reason IMPROVED (R6), 1 reason UNCHANGED (R1), 4 reasons
#     WORSE (R2, R3, R4, R5)". That sentence is WITHDRAWN — its single IMPROVED leg rested
#     on an acceptance that did not exist on the record at Revision 4's base. The tally is
#     republished below and in report-revision-5.md.
# L7: Revision 4's three copies were not verbatim (off by one word). The sentence below is
#     byte-identical to the same two lines in design-revision-5.md § 9.1 and
#     report-revision-5.md. A fourth number must not appear anywhere.
# -------------------------------------------------------------------------------------
risk_rationale: |
  Level 3 (Major Workflow / Navigation / IA Change) per DESIGN_GOVERNANCE.md § Design-Change
  Risk Levels. Revision 5 RE-DERIVES the level rather than inheriting it, per Invariant 6,
  which requires the classification for EVERY revision. Revision 4 was independently agreed
  at 3 (INDEPENDENT_RISK_LEVEL: 3, RISK_LEVEL_AGREEMENT: YES); agreement is recorded, not
  inherited.

  THE SIX REASONS AND THEIR STATUS

  R1. FIRST HANDLING OF KEY MATERIAL — UNCHANGED. This design is the first time SHIP IT
      handles a private deploy-key half in a flow it controls. Still irreversible: a leaked
      key authorising WRITE access to a customer repository cannot be recalled from SHIP
      IT's side — it must be uninstalled at the host. No such secret exists in the
      repository today.

  R2. CREDENTIAL EXPOSED THROUGH AN UNAUTHENTICATED, UNPINNED CONTROL PLANE — WORSE.
      Under A3 the endpoint is not the only exposure; there is now a RUNTIME DEPENDENCY
      whose unavailability blocks the credential path, so the failure mode is disclosure
      AND denial. apps/server/lib/server.dart:71-73 declares no authentication services;
      570bb640's loopback pinning is still un-implemented; docker/compose.yaml:16-17
      publishes 5432:5432 unqualified and :63 hardcodes SERVERPOD_DATABASE_PASSWORD in a
      COMMITTED file. An attacker with the database can also set status = 'revoked', and
      D-2's index would then block the legitimate re-mint — so D-4 is an AVAILABILITY
      control here, not only an integrity one. B6 SHARPENS IT AGAIN: the mint endpoint as
      Revision 4 specified it would return ANOTHER PRODUCT's publicKey, credentialId,
      status and hostKeyStatus, on a plane with no authentication at all.

  R3. CHANGE TO THE CORE REGISTRATION WORKFLOW — WORSE. Under 898b07d0 the change is no
      longer only "registration is gated"; it is IDENTITY SEMANTICS — a Product becomes
      visible BEFORE registration commits, and the accepted consequence is a visible
      product with no usable credential. That changes what a Product means across the
      Products page, product detail and Add Product: closer to information architecture
      than to a gate. ae1c1f79 adds a second interaction — the same flow's FIRST step is
      now conditional on an infrastructure dependency, so the flow has TWO distinct
      failure shapes with different user-visible consequences (design-revision-5.md
      § R.11g item 5).

  R4. CREDENTIAL INVARIANTS REACHABLE AND NOT ENFORCED — WORSE. R-B6's original defect is
      closed by D-1/D-2 (design-revision-5.md § R.8.2). But D-4, D-5 and D-6 are STILL
      UNMERGED, Revision 4 found THREE more defects in the specified flow (G-13, G-14,
      G-15), and THIS PASS FOUND THREE MORE OF ITS OWN: B6's cross-product disclosure on
      the mint endpoint (G-16) — a defect INTRODUCED BY REVISION 4'S OWN CORRECTION OF A
      BLOCKER, which is the worst possible direction; D-6's silent omission of
      lastFailureReason from BOTH tier constructs (H9), which would ship one diagnostic
      column erasable on the CAS branch on both tiers; and § R.11.2's selection rule
      depending on an ordering guarantee that exists on ONE TIER ONLY (M4). The COUNT of
      unbuilt or newly-found credential invariants ROSE AGAIN, the opposite of the
      direction the net should move — and this time one of them was manufactured by the
      previous pass.

  R5. AN SSH TRANSPORT SEAM WITH NO PRECEDENT — WORSE. The seam must deliver host-key TOFU
      verification AT THE TRANSPORT and manager-backed material resolution — two
      security-critical capabilities, one with no precedent anywhere in the repository, and
      ADR 0018 :96-99 makes the first a REQUIREMENT. The revision's contribution is
      PRECISION, not reduction: the DOMAIN half IS enforced (product_registry_engine.dart:
      1047-1052 and :1162-1167), so the remaining half is cleanly nameable — and a cleanly
      nameable half is still an unbuilt half.

  R6. A DESIGN WHOSE OUTCOME MAY CONTRADICT AN EXISTING RECORDED ADR — UNCHANGED, and the
      improvement Revision 4 claimed for it was NOT REAL. The substance moved twice, in
      opposite directions. Revision 4 claimed IMPROVED because the ADR 0018 amendment was
      "written and Accepted" — and at its base THAT WAS FALSE (B5): the amendment read
      status: DRAFT, approved_by: null, reviewed_by: null, human_gate.required: true at
      level 3, with a blocking item reading "ADR 0018 status remains Proposed. This lane
      does not declare it Accepted."; .decisions/ held no acceptance object. NOW THE
      ACCEPTANCE IS REAL — Human Decision 876c6b97-3e23-459d-aa9d-3a5faeb33702.yaml
      (ARCHITECTURE, RESOLVED, recording the owner's verbatim answer "Accept A2, record
      the gaps as accepted") and amendment revision 2 (status: ACCEPTED, approved_by and
      approved_at populated) — and the residual Revision 4 asked about is gone too: the
      edit IS docs/adr/0018-per-product-git-credentials.md and it IS committed and landed
      at 5436a4d, so "merge it" was never the right action (M5). NET: UNCHANGED, for three
      reasons and none of them credit. (a) An acceptance asserted without a record is not an
      improvement, and republishing the number would have carried the assertion forward.
      (b) ACCEPTANCE IS NOT REVIEW — the amendment's reviewed_by and reviewed_at are null
      ON PURPOSE, its acceptance_is_not_review field is true, and independent design review
      of the amendment has NEVER happened, so the artifact this design depends on is still
      unjudged by anyone but its author and the ADR owner. (c) The amendment's own REVISION
      1 CONTAINED A FACTUAL ERROR — it claimed the partial unique index refuses a
      legitimate fresh mint, and it does not, because rotateCredential revokes first. That
      over-claimed the index in the direction that would have made accepted risk A1
      (resurrection) LOOK CLOSED, and A1 is this design's own subject matter. A dependency
      whose first draft overstated its own protection against the exact defect under repair
      is not a reason to mark the risk down. § 10.1 action 1 asks for the review.

  THE TALLY — one, and it is the only one

  RISK_LEVEL: 3 (Major Workflow / Navigation / IA Change), re-derived on this evidence.
  0 reasons IMPROVED, 2 reasons UNCHANGED (R1, R6), 4 reasons WORSE (R2, R3, R4, R5).

  Three places must carry this exact sentence, character for character: this block,
  design-revision-5.md § 9.1, and report-revision-5.md. Revision 4's sentence — "1 reason
  IMPROVED (R6), 1 reason UNCHANGED (R1), 4 reasons WORSE (R2, R3, R4, R5)" — is WITHDRAWN
  as arithmetic and named above. Revision 3's four tallies — "5 rows" / "one improved, two
  unchanged, three worse" / "IMPROVED (2 reasons) … UNCHANGED OR WORSE (4 reasons)"
  enumerating five / "Two improved, four unchanged or worse" — remain withdrawn.

  LEVEL 3 IS UNAFFECTED, AND THIS PASS SUPPORTS IT MORE STRONGLY. Five of the six reasons
  are WORSE, and the sixth moved from claimed-improved to honestly-unchanged, which removes
  an argument for a LOWER level rather than an argument against a higher one. G-4 remains an
  ADR requirement that is half-implemented; the SSH transport seam remains LOW feasibility
  carrying an ADR requirement with no implementation anywhere in the repository; D-4/D-5/D-6
  remain UNMERGED; G-13, G-14, G-15, G-16 and G-17 remain OPEN; and A3's reachability remains
  UNVERIFIED (G-10). Any one of those is a level-3 fact on its own.

  WHAT THE LEVEL MEANS. Level 3 requires product/design/architecture human approval at Gate
  D4. The six Gate D4 decisions are taken, ae1c1f79 is taken, and the ADR 0018 amendment is
  human-accepted (876c6b97) — but has NEVER been independently reviewed. The CONTENT of
  Revision 5 still requires human approval: D-4, D-5, D-6 (now EIGHT columns), G-13 (now
  including the reparenting hazard), G-14, G-16, SC-11..SC-20, the N-9 copy, § R.5.7's BOTH
  accepted forms, and § R.14.1's step 3a ownership step.

