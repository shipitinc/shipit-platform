  requirements_gaps:
    - "OPEN-D4-1 (Q1 substrate, Q2 fail-open-vs-fail-closed, Q3 revocation disposal, Q4 transport
       exposure) - OPEN, HUMAN DECISION REQUIRED AT GATE D4. Deliberately not answered per the human's
       instruction; the private-half store cannot be specified until it is resolved."
    - "OPEN-D4-2 (registration ordering) - OPEN, HUMAN DECISION REQUIRED AT GATE D4. A provable
       circular dependency between human point 2b and the credential domain's product-ownership
       requirement. Found while designing; not named in the dispatch."
    - "G-1  ADR 0018 and 'AGENTS.md 13a' are ABSENT (docs/engineering/adr/ contains only 0001-0003).
       The governing ADR for the credential model cannot be read. Ten substitute assumptions recorded
       in design-revision.md R-21. No ADR content invented."
    - "G-2  No read-only-over-Docker rule exists in AGENTS.md, so no runtime claim could be verified;
       four claims are marked UNVERIFIED with the command a human should run."
    - "G-3  Zero test files import add_product_page.dart, so SC-02/SC-04/SC-06 have no existing harness."
    - "G-4  No SSH host-key verification exists anywhere in the repository; HostKeyStatus has no runtime
       enforcer today."
    - "G-5  No read-only endpoint for a product's public key exists; the client must hold a credentialId
       to re-read it."
    - "G-6  recordGeneratedCredential's host parameter is optional and defaults to null, so a credential
       can exist with no host. The design refuses to mint without one; the domain does not enforce it."
    - "G-7  RepositoryCredentialView exposes referenceName to clients. Under server-side storage that is
       a path/ARN disclosure. Removing it is a generated-contract change in two packages; tied to
       OPEN-D4-1."
    - "G-8  How the host-key fingerprint is obtained (ssh-keyscan vs handshake) is unspecified; part of
       the new transport seam."
    - "Human points 2e and 2f, and the four mobile Penpot boards, are OUT OF SCOPE for this lane and
       belong to design-addproduct-mobile. Their implications are stated in the brief so the sibling
       lane can align, but they are not designed here and are recorded as not-covered, not as gaps."
