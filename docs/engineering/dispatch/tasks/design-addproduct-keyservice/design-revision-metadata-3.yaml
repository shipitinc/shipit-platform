  # ---- 9417f8bf — OPTION_C, A3 external secret manager ----
  - "9417f8bf/R.1 — THE SUBSTRATE QUESTION IS CLOSED AND THE OPTION SET IS WITHDRAWN. § R.4's
     four-option A1–A4 set, the Q1/Q1′ framing and the per-option confidence table are DELETED from
     normative text. § R.4 is now a withdrawal notice mapping each old option to its disposition. A3 is
     specified concretely: the SecretProvider interface (§ R.1.2 — verifyProtection/put/resolve/destroy, in
     apps/server, NOT packages/product_registry per C-02), reference resolution at push time (§ R.1.4), and
     A1/A4 as the DOCUMENTED FALLBACK with an explicit trigger condition (§ R.1.5 — reachable only when no
     manager is CONFIGURED; a configured-but-down manager fails closed). A2 is EXCLUDED PERMANENTLY
     (§ R.1.6): ADR 0018 :87-88's 'never persisted to the durable record' survives the supersession.
     Revision 2's own caveat about A1/A4 complying 'by coincidence of topology' is carried forward."
  - "9417f8bf/R.1.3 — THE ONE DESIGN CHOICE MADE INSIDE THE DECISION, stated as a choice with its
     alternative named rather than buried: referenceName is formed as a SERVER-GENERATED OPAQUE HANDLE
     (credbind_<32 hex>, 128 bits from the platform CSPRNG, carrying no product/repository/manager
     information), with the manager address and path prefix derived at resolve time from SERVER
     CONFIGURATION. The decision's option text said 'a secret path or ARN'; taken literally the durable
     record would carry vault topology, and that record is readable by an off-host caller using a password
     published in a committed file (docker/compose.yaml:63, :16-17; .env.example:16-18). The literal-ARN
     form remains available and is NOT forbidden; I rejected it and recorded the rejection so a reviewer
     can challenge it. This does not re-open the substrate decision and does not weaken ADR 0018 :92-95."
  - "9417f8bf/R.3.2 — G-7 IS NOW REQUIRED WORK, not a gap with a named owner. RepositoryCredentialView LOSES
     referenceName and GAINS NOTHING. Blast radius specified in 7 rows: the model source
     (repository_credential_view.yaml:11), two generated protocols (apps/server + packages/control_plane_client
     — this is the 'generated-contract change in two packages'), the mapper (ui_view_mappers.dart:176), the
     hand-written client DTO (control_plane_repository.dart:108, :1098, :1691, :1709, :1708) and the two
     display sites (product_detail_page.dart:471, :676). What the client receives instead: nothing —
     credentialId is already the non-identifying handle it uses. § R.3.3 rules out the two obvious
     substitutes (a digest of the handle enables cross-product correlation; a prefix discloses the naming
     scheme). § R.3.4 records that the product_detail GOLDENS must be regenerated — an easily-missed
     consequence that surfaces as a VISUAL regression rather than a contract one."

  # ---- 7b1bc8b7 — OPTION_A, fail closed with named remediation ----
  - "7b1bc8b7/R.5 — THE DEGRADED PATH, END TO END, WITH THE REMEDIATION COPY AS A REQUIRED DELIVERABLE.
     Four distinguishable triggers (secretManagerUnconfigured, secretManagerUnreachable,
     secretManagerProtectionUnverifiable, secretManagerWriteRefused — with the UNEVALUABLE policy case
     folded into the third on purpose, so 'we could not check' cannot read as 'it is fine'). The refusal is
     503 substrateUnavailable with a remediation block, deliberately COARSE on the wire so an
     unauthenticated caller cannot use the endpoint as an oracle for the manager's existence, address or
     policy. § R.5.4 specifies ALL FOUR remediation blocks VERBATIM, every string bound to
     palette.inkSecondary by N-8, with four copy obligations (each names an operator action a non-engineer
     could perform; each states nothing was created; each offers retry; none overclaims). § R.5.5 states
     CONSISTENCY with the four existing credential refusals and concludes the new one must be a NEW type —
     SecretSubstrateUnavailable, in apps/server and NOT in packages/product_registry (C-02) — carrying the
     remediation as DATA, mirroring HostKeyNotConfirmedException's two status values driving two messages."
  - "7b1bc8b7/R.5.2 — THE ONE ORDERING DECISION THIS REVISION MAKES, flagged for the human rather than
     smuggled: the substrate precondition is evaluated BEFORE the flow writes anything, so a substrate
     refusal creates no Product row, no RepositoryReference row, no credential row and no keypair. 7b1bc8b7
     scopes the refusal to the keypair and the credential row; 898b07d0 makes the Product and
     RepositoryReference the flow's first step; neither object spells out the interaction. The alternative
     reading (create the product, refuse the mint) is available and is not forbidden — I rejected it because
     it produces 898b07d0's accepted bad state WITHOUT the benefit that made it acceptable. Step 5's
     destroy(handle)-in-a-finally COMPENSATION is mandatory and its rationale is given: without it a
     failure between put and the row write leaves an orphan private half that no revocation can reach."

  # ---- 79e860e2 — OPTION_A, destroy the private half on revoke, keep the row ----
  - "79e860e2/R.6 — REVOCATION IS TWO-SIDED. destroy(handle) FIRST, then mark the row revoked — and that
     ORDER is normative, with the failure-at-each-step table showing destroy-first is the safe direction
     (mark-first would leave a revoked row with a live private half that still authenticates). A manager
     destroy failure REFUSES the row update, applying 7b1bc8b7's posture to revocation. The row is retained:
     revokeCredential (:1072-1090 at 07c8c8f) never deletes, and credential_test.dart:310 ('revoked
     credentials stay readable, never deleted') asserts the RECORD, not the bytes, so C-1 does not
     contradict it. Revision 2's anchor was credential_test.dart:246 at 77c19f1; the test moved at
     07c8c8f — both cited. § R.6.3 states the honest dependency: R.6's semantics are only actually
     delivered once D-4 lands, which is why 79e860e2's own follow-up test ('a revoked credential cannot
     reach the repository') fails today. ADR 0018 :113-114 is SUPERSEDED."

  # ---- 898b07d0 — OPTION_A, split identity from registration ----
  - "898b07d0/R.10 — THE KEY FLOW NOW CREATES THE PRODUCT ROW FIRST. New state machine with two starred new
     steps (verifyProtection at step 0; create Product(state=registered) + RepositoryReference at step 2)
     and a starred 'REGISTER PRODUCT = commits credential verification' step; everything from the trust
     step onward is Revision 1's machine carried unchanged. The cycle Revision 2 proved unsatisfiable is
     closed: recordGeneratedCredential's requirement of readRepositoryReference + _ensureOwned is now
     SATISFIED BY STEP 2 rather than by registration. ADR 0018 :100-102 is UPHELD and must NOT be
     amended. No pre-registration ProductState is introduced — registered's existing semantics
     (product_state.dart:24-27) are exactly what option 1 relies on."
  - "898b07d0/R.11, R.11.1, R.11g — THE ACCEPTED CONSEQUENCE MADE NORMATIVE AND TELLABLE. A visible product
     may exist with no usable credential, and the UI MUST be able to tell that state apart: the derived
     RegistrationCommitState (committed <=> some credential has canReachRepository == true) plus the five
     client-observable states that must be visually distinct — including state 4 (revoked), which the
     existing five-member AccessStatus cannot express. § R.11g is a BINDING CONSUMPTION CONTRACT for
     design-addproduct-mobile in six items, of which item 3 is a REQUIREMENT ON THE SIBLING'S DESIGN and
     not an observation: the flow must be re-enterable FROM THE PRODUCT, or the accepted consequence
     becomes the dead end human point 2d rejected. No board is authored or edited by this lane (C-11)."
  - "898b07d0/R.12 — THE READ PATH IS NO LONGER CONDITIONAL. Revision 2's 'this row depends on OPEN-D4-2'
     paragraph is deleted; the table stands as written, which makes the human's addendum ('if down the road
     we want to create that product we'll find the key ready to be verified again') literally true through
     a concrete read path. One honest addition: under A3 'the key is on the machine' is literally false and
     was never the property relied on — the property is that the record persists and the material is
     retrievable from the manager, and a manager that is down on re-entry surfaces as secretReferenceMissing."

  # ---- 4d2c6b81 — OPTION_A, index into a migration too. ALREADY IMPLEMENTED ----
  - "4d2c6b81/R.8 — THE STORE INVARIANT IS NOW REAL AND DEPENDED ON EXPLICITLY, NOT PROPOSED. fix/credential-
     store-integrity is implemented and independently reviewed at 07c8c8f (RESULT: IMPLEMENTED,
