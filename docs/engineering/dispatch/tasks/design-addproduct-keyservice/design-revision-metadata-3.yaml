     D-2's partial unique index in BOTH tool/schema_bootstrap.sql AND migration
     20261006150645000, with its predicate byte-identical to readActiveCredentialForRepository's
     (:370-381) so constraint and query cannot contradict. § R.8.2 re-derives B6's kill honestly in three
     mechanism classes: TWO PERSISTENCE MECHANISMS, BOTH REAL, plus one application requirement
     (the endpoint must pass no caller-supplied credentialId) — so B6's original defect is closed at the
     store, CONDITIONALLY, and the state-loss family around it is NOT closed. § R.8.3 itemises the six
     requirements that now rest on the invariant, including the two that rest on D-4 and are NOT built."
  - "4d2c6b81 — carried forward verbatim from the implementer's own disclosure, not smoothed: the
     duplicate-credential audit must be run BY A HUMAN against every deployed database before migration
     20261006150645000 is applied, because CREATE UNIQUE INDEX fails on duplicates; the audit query as
     originally dispatched DOES NOT EXECUTE (repositoryId is quoted camelCase, unquoted it folds to
     repositoryid and ERRORS, which reads exactly like 'no duplicates'); and zero duplicates were found in
     every reachable database, but the only credential-bearing one held 0 ROWS — a vacuous 'no'."

  # ---- Two confirmed security defects, newly specified ----
  - "M-3/R.9.1 — D-4 REQUIRED: THE MINT PATH NEVER UPSERTS. D-1's predicate is SATISFIED BY IDENTICAL
     VALUES, so an identical-material re-mint still upserts and resets eight columns (status, hostKeyStatus,
     hostConfirmedAt, hostConfirmedBy, lastVerifiedAt, lastVerifiedBy, createdAt, revokedAt/revokedReason).
     The column list IS the requirement, not a summary. Safety argument verified rather than asserted: every
     saveProductCredential call site at 07c8c8f is tabulated, and ONLY engine:979 (the mint) reaches the
     upsert branch — confirmHostKey (:1011, :1025), recordCredentialCheck (:1066) and revokeCredential
     (:1088) all use copyWith + CAS. So D-4 cannot break them, and rotateCredential reaches the branch only
     by minting a new credentialId. Required shape is DO NOTHING + RETURNING with a typed
     CredentialIdentityConflictException — explicitly NOT 'DO UPDATE ... WHERE <always false>', which would
     keep the predicate alive as an accidental second source of truth."
  - "M-3/R.9.2 — A DERIVED CONSEQUENCE, NEW IN THIS REVISION: A REVOKED CREDENTIAL CAN BE RESURRECTED. Not
     in the engineering review; derived from reading $assignments against
     readActiveCredentialForRepository. readActiveCredentialForRepository excludes revoked rows, so the
     engine's one-active guard at :954-960 CANNOT FIRE for a revoked row; the upsert branch then clears
     revokedAt/revokedReason and returns the row to the active set as generated. Under 79e860e2 its manager
     handle has ALREADY BEEN DESTROYED, so the resurrected row claims a deploy key that exists nowhere — and
     because it now occupies the active set, D-2's index refuses the legitimate fresh mint for that
     repository. Recovery is rotateCredential, so it is recoverable, but the state is corrupted and the
     audit trail is falsified. NO EXISTING TEST COVERS IT: credential_test.dart:323 closes the CHECK path
     (recordCredentialCheck refuses a revoked credential) and not the MINT path. Specified as T-D."
  - "M-4/R.9.3 — D-5 REQUIRED: THE SCOPE SET IS IMMUTABLE TOO. productId and repositoryId must be
     immutable on an existing credentialId, on BOTH branches, in the statement. The re-point also carries
     hostKeyStatus/hostConfirmedAt/hostConfirmedBy/hostKeyFingerprint — none of which are in D-1's predicate —
     so a human's confirmation of repo-1's host is carried to repo-2's host, which contradicts ADR 0018
     :96-99 directly: the operator must be shown the host and fingerprint and must confirm it. It also
     defeats the control ADR 0018 A1 :19-21 and repository_credential.dart:62-65 rely on, since a known
     credentialId becomes a way to change which repository a key authorises. Cannot break rotation
     (rotateCredential mints a new id for the same repositoryId). Also closes the implementer's pre-existing
     follow-up #5 rather than leaving it dangling."
  - "M-3, M-4/R.9.4, R.9.5 — THE COMPLETE SET a mint must not touch, stated once: material (D-1, landed),
     scope (D-5), record identity (D-4), and the whole mutable set (D-4). Tests T-C (identical-material
     re-mint throws, EVERY column byte-identical), T-D (no resurrection, and a fresh mint then succeeds —
     needs the Postgres tier), T-E (D-4 does not regress D-1), T-F (repositoryId immutable), T-G
     (productId immutable). T-C/T-E/T-F/T-G FAILS TODAY by the reasoning above; T-E passes today as a
     regression guard. NONE WAS RUN BY THIS LANE."

  # ---- D-3, D-7, H3/H4 re-verified ----
  - "D-3 STILL HOLDS AND IS AN ADR GAP — RE-VERIFIED at 07c8c8f. grep -rn
     'SSH_AUTH_SOCK|known_hosts|ssh-keyscan|StrictHostKeyChecking|IdentityFile' apps packages -> 0 matches;
     packages/worker_runtime/lib/src/workspace/git_workspace_inspector.dart:106-112 runs Process.run(git,
     args) with no environment:. HostKeyStatus.permitsConnection has no runtime enforcer, so 'ShipIt refuses
     to connect to an unrecognised host' is decorative today. Classified as an ADR GAP, not only a missing
     feature, because ADR 0018 :96-99 makes it a REQUIREMENT in a recorded, read, cited ADR. Under A3 the
     seam is LARGER, not smaller: it must deliver host-key TOFU verification AND manager-backed material
     resolution, two security-critical capabilities in one seam, one with no precedent anywhere."
  - "D-7, H3, H4 STAND — RE-VERIFIED at 07c8c8f / 77c19f1. grep -rn '127.0.0.1:' docker
     apps/server/docker-compose.yaml -> no match (loopback pinning un-implemented);
     docker/compose.yaml:16-17 publishes '5432:5432' unqualified (0.0.0.0); :63 hardcodes
     SERVERPOD_DATABASE_PASSWORD: shipit in a committed file; .env.example:16-18 documents the defaults;
     server.dart:71-72 declares no authentication services. Revision 2's § R.18 is carried IN FULL,
     including its fourth point (the direct-database path bypasses the endpoint, so endpoint auditing does
     not constrain the data) and its refusal to propose API authentication. NEW under A3 (§ R.15.3): an
     unauthenticated caller who can influence manager reachability can DENY the credential path outright,
     and R-H2's promise NARROWS — re-entry finds the key ready only if the manager was reachable at mint.
     The fourth path moves from DISCLOSURE to DENIAL under A3."
  - "N-9 NEW (R.10.2) — COPY MUST DESCRIBE CUSTODY TRUTHFULLY AND NAME NO SUBSTRATE. The current line at
     add_product_page.dart:542 ('ed25519 · created on this device · the private half stays in the
     keychain') is false in BOTH halves under A3. The exact replacement string is specified:
     'ed25519 · generated on the server · the private half stays in the secret manager' — this is what the
