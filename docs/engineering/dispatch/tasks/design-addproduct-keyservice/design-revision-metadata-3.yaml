risk_rationale: |
  Level 3 (Major Workflow / Navigation / IA Change) per DESIGN_GOVERNANCE.md § Design-Change Risk
  Levels. Revision 3 RE-DERIVES the level rather than inheriting it, because Revision 2's reasons have
  partly changed and partly not. Revision 2's 3 was independently agreed (INDEPENDENT_RISK_LEVEL: 3,
  RISK_LEVEL_AGREEMENT: YES); this re-derivation is required by Invariant 6 for every revision.

  IMPROVED (2 reasons)
  1. THE ADR CONTRADICTION IS RESOLVED. Revision 2's second reason for 3 was that "a design whose
     outcome may contradict an existing ADR is not a component-level change" (ADR 0018 :85-88 in tension
     with DEC-b869ec24). The human resolved it (9417f8bf OPTION_C, superseding :85-88). The design no
     longer carries an unresolved contradiction with a live ADR. It now carries a KNOWN, HUMAN-OWNED,
     PENDING amendment — a tracked dependency rather than an open question. Different character,
     similar magnitude: code shipping before that amendment would contradict a live ADR, which is
     arguably worse than not knowing. (design-revision-3.md § R.17)
  2. ZERO GATE D4 DECISIONS REMAIN. Revision 2 was written against four open sub-questions and two open
     decisions; all six are RESOLVED at 2026-10-06T13:05:00Z.

  UNCHANGED OR WORSE (4 reasons)
  3. FIRST HANDLING OF KEY MATERIAL — unchanged, and still irreversible. A leaked key authorising WRITE
     access to a customer repository cannot be recalled from SHIP IT's side; it must be uninstalled at
     the host. No such secret exists in the repository today.
  4. CREDENTIAL EXPOSURE THROUGH AN UNAUTHENTICATED, UNPINNED CONTROL PLANE — WORSE.
     apps/server/lib/server.dart:71-72 declares no authentication services; DEC-570bb640's loopback
     pinning is confirmed UN-IMPLEMENTED (grep -rn "127.0.0.1:" docker apps/server/docker-compose.yaml
     -> no match); docker/compose.yaml:16-17 publishes 5432:5432 unqualified (0.0.0.0) and :63 hardcodes
     SERVERPOD_DATABASE_PASSWORD: shipit in a COMMITTED file. Under A3 there is now also a RUNTIME
     DEPENDENCY whose unavailability BLOCKS the credential path, so the failure mode is disclosure AND
     denial. (design-revision-3.md § R.15, § R.15.3)
  5. CHANGE TO THE CORE REGISTRATION WORKFLOW — STRONGER. Under 898b07d0 the change is no longer only
     "registration is gated"; it is IDENTITY SEMANTICS. A Product becomes visible BEFORE registration
     commits, and the accepted consequence is a visible product with no usable credential. That changes
     what a Product means across the Products page, product detail and Add Product — closer to
     information architecture than to a gate. (design-revision-3.md § R.10, § R.11.1)
  6. TWO NEW CREDENTIAL INVARIANTS REACHABLE TODAY — the open half is worse than Revision 2's. R-B6's
     ORIGINAL defect is closed: D-1 (predicated ON CONFLICT ... WHERE ... RETURNING over
     publicKey/fingerprint/algorithm/referenceName, both branches) and D-2 (partial unique index in BOTH
     tool/schema_bootstrap.sql AND migration 20261006150645000) landed and were independently reviewed at
     07c8c8f. But two NEW defects are live and reachable through the PUBLIC DOMAIN API today, both outside
     D-1's literal scope because D-1 named four fields:
       M-3 identical-material re-mint still UPSERTS — D-1's predicate is SATISFIED BY IDENTICAL VALUES —
            resetting status to generated, hostKeyStatus to unknown and nulling hostConfirmedAt,
            hostConfirmedBy, lastVerifiedAt, lastVerifiedBy, createdAt, revokedAt and revokedReason. A
            human's host confirmation is silently discarded.
       M-4 repositoryId remains REWRITABLE on the conflict branch ("repositoryId" = @repositoryId is in
            $assignments at :228 and NOT in D-1's predicate at :325-328), so an installed deploy key can be
            silently re-pointed between two repositories of the same product with no rotation record — and
            host confirmation travels with it, contradicting ADR 0018 :96-99. _ensureOwned (:1784-1790)
            blocks crossing products, so the blast radius is one product's repositories.
     Plus a consequence this lane DERIVED: a REVOKED credential can be RESURRECTED by an
     identical-material re-mint, because readActiveCredentialForRepository excludes revoked rows so the
     engine's one-active guard cannot fire — and under 79e860e2 its manager handle has ALREADY been
     destroyed, so the resurrected row claims a key that exists nowhere. (design-revision-3.md § R.9)
  7. AN SSH TRANSPORT SEAM WITH NO PRECEDENT — WORSE. It must now deliver TWO security-critical
     capabilities: host-key TOFU verification, which ADR 0018 :96-99 makes a REQUIREMENT with no
     implementation and no precedent anywhere (git_workspace_inspector.dart:106-112 runs Process.run with
     no environment:; grep for SSH_AUTH_SOCK|known_hosts|ssh-keyscan|StrictHostKeyChecking|IdentityFile
     across apps and packages returns 0 matches); and manager-backed material resolution, which is new
     under A3. (design-revision-3.md § R.10.3)

  NET: one reason improved, one transformed, three unchanged-or-worse, and one of the improved and one
  of the worse concern the SAME subject (the substrate decision) — which is why the net does not move.
  Level 3 requires product/design/architecture human approval at Gate D4. The six decisions have already
  been taken through that gate; the CONTENT of Revision 3 still requires it (D-4, D-5, SC-11..SC-14, the
  N-9 copy, and the § R.5.2 ordering interpretation), and the ADR 0018 amendment is a BLOCKING
  PREDECESSOR for implementation.

