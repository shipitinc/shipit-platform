# REASON IS CLAIMED — claiming one for bookkeeping is the same error class as H10
# (a count wrong in five places).
#
# The level itself is RE-AFFIRMED on Revision 6's content, not inherited: design-revision-6.md
# § 2.2 re-states the six level-3 grounds and confirms every one is present at 1c3f5ad.
# The Rev-5 reviewer independently re-derived 3 and agreed; that agreement is carried.
