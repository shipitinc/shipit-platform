risk_rationale: |
  Level 3 — "Change to core workflow, navigation structure, or information architecture
  affecting multiple features or user mental models" (DESIGN_GOVERNANCE.md:94-99). Approval
  path: HUMAN_DECISION_REQUIRED — product/design/architecture approval. This revision does
  NOT have it and does not claim it.

  Six grounds, re-confirmed present at this revision's base 1c3f5ad:
    1. 898b07d0 makes a Product VISIBLE before registration commits and turns registration
       into a commit — what a Product IS changes across the Products page, product detail
       and Add Product.
    2. RegistrationCommitState is a FIVE-STATE client model; § R.11.1 state 4 changes what
       product detail asserts and is currently indistinguishable from state 1 (G-14).
    3. § R.11g item 3 adds a RESUME ROUTE from the product into the credential flow — new
       IA, and without it 898b07d0's accepted consequence is a dead end.
    4. First handling of key material by SHIP IT; irreversible from SHIP IT's side.
    5. An SSH transport seam with NO precedent, carrying an ADR requirement that is
       HALF-IMPLEMENTED (G-4), on the credential path.
    6. A credential-minting endpoint on a control plane server.dart:71-73 that declares
       NO AUTHENTICATION.

  THE TALLY — one, and it is the only one, carried character-for-character from Revision 5:

  0 reasons IMPROVED, 2 reasons UNCHANGED (R1, R6), 4 reasons WORSE (R2, R3, R4, R5)

  UNCHANGED BY REVISION 6. Revision 6 claims no movement in either direction.

  WHAT REVISION 6 ADDS TO THE LEVEL: three new open gap-register entries — G-18 (a real,
  measured, now-OWNED board-conformance gap), G-19 and G-20 (two records that are wrong or
  missing and are NOT this lane's to write). Three open governance items against a design
  whose level is 3 is itself an argument FOR level 3, not against it: a design at level 1
  does not accumulate governance debt.

  SCOPE OF THIS PASS: no design content about the key flow was changed. The Rev-5 reviewer's
  own words: "None of these touch the design's content about the key flow. The correction is
  small and I have made it actionable below." Its BLOCKER was in Revision 5's COUPLING, not
  in its reading of 27ea6536 — the footer spec is right, the three code edits are right, and
  design_primitives.dart:396 is right. Those were verified by the reviewer and were NOT
  re-derived here; only this revision's own citations were re-read at this base (V-1).

