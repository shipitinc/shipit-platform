risk_level: 3
risk_rationale: |
  Level 3 (Major Workflow / Navigation / IA Change) per DESIGN_GOVERNANCE.md.

  Revision 2 keeps level 3 on the Independent Design Review's own assessment (INDEPENDENT_RISK_LEVEL: 3,
  RISK_LEVEL_AGREEMENT: YES), re-derived here rather than accepted:

  1. HANDLING KEY MATERIAL FOR THE FIRST TIME. SHIP IT will hold a private key authorising WRITE access
     to a customer repository. No such secret exists in the repository today. Compromise is repository
     compromise, irreversible without a host-side uninstall.
  2. OVERTURNS A DOCUMENTED ARCHITECTURAL ASSUMPTION — and revision 2 makes this larger, not smaller.
     ADR 0018:85-88 (read, 158 lines) places the private half in the operator's local secret store and
     forbids persisting it to the durable record; DEC-b869ec24 moves generation and storage server-side.
     The revision does not resolve that tension — it is the human's (OPEN-D4-1, re-framed as Q1') — but a
     design whose outcome may contradict an existing ADR is not a component-level change.
  3. CHANGES THE CORE REGISTRATION WORKFLOW. Human points 2a/2b make key generation and host trust
     preconditions of product registration. ADR 0018:100-102 independently requires the same, so the
     workflow change is mandated by architecture and cannot be deferred as a UI preference.
  4. INTRODUCES A CREDENTIAL-MINTING ENDPOINT ON AN UNAUTHENTICATED, NOT-LOOPBACK-PINNED CONTROL PLANE.
     apps/server/lib/server.dart:71-72 declares no authentication services; the loopback-pinning
     follow-up in DEC-570bb640 is confirmed UN-IMPLEMENTED. This is the first endpoint whose side effect
     is persisting secret material.
  5. NEW IN REVISION 2 — the design's central security claim was false at the persistence layer and is
     now specified as unbuilt work. product_credential's publicKey is overwritable in place through
     recordGeneratedCredential's own API (engine:920/941/965 + ON CONFLICT DO UPDATE at
     postgres_product_registry_store.dart:239-243), and ADR 0018 A1's one-per-repository invariant is not
     a database constraint at all (definition.sql:646 is non-unique). Until D-1 and D-2 (design-revision-2
     § R.15b) are built, finding B6 is documented rather than closed. A workflow whose central invariant
     is unenforceable is not a workflow-level change of the safe kind.

  Level 3 requires product/design/architecture human approval at Gate D4. This revision does not
  pre-empt it: OPEN-D4-1 (re-framed as Q1') and OPEN-D4-2 remain OPEN and are defaulted nowhere.

