    - "G-5  No read-only endpoint for a product's public key exists; the client must hold a credentialId to
       re-read it."
    - "G-6  recordGeneratedCredential's host parameter is optional and defaults to null, so a credential can
       exist with no host. The design refuses to mint without one; the domain does not enforce it."
    - "G-7  RepositoryCredentialView exposes referenceName to clients. Under server-side storage that is a
       path/ARN disclosure. OWNER NAMED (M4): 9417f8bf, as Q4 of the reissued object."
    - "G-8  How the host-key fingerprint is obtained (ssh-keyscan vs handshake) is unspecified; part of the new
       transport seam."
    - "G-9  NEW. ADR 0018 A1's one-credential-per-repository invariant is documented but NOT a database
       constraint: repositoryId carries only a non-unique index (definition.sql:646) and the one-active rule
       is an untransacted read-then-write (engine:940-941). Two concurrent mints yield two active credentials
       (§ R.15.4). Remedy is required deliverable D-2."
    - "L-6  REPORTED, NOT EDITED: docs/engineering/dispatch/DECISIONS.md's index table omits 570bb640. Manager-owned."
    - "Human points 2e and 2f, and the four mobile Penpot boards, are OUT OF SCOPE for this lane and belong to
       design-addproduct-mobile. Their implications are stated in the Brief (v1.1.0) so the sibling lane can
       align, but they are not designed here and are recorded as not-covered, not as gaps."
