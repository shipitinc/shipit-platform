     own stated basis: A4 was untested and A3 equally untested, and nothing about any option was
     runtime-verified. Q2 keeps MEDIUM (independently accepted by the review); Q1/Q3'/Q4 are LOW."
  - "M3 — N-8 ADDED, NORMATIVE. 'inkTertiary' on the card surface measures 4.23:1 dark and FAILS WCAG AA, and it
     is the current idiom for exactly this copy (add_product_page.dart:542, :590) — so all seven new strings
     (five failure kinds + two host states) would follow the failing idiom by default. New requirement N-8 makes
     palette.inkSecondary (6.74:1 light / 6.10:1 dark) the REQUIRED token for every new string, moved out of
     § R.8's recommendation table where an implementer reading requirements would not find it. SC-06 extended.
     Ratios labelled inherited and independently re-measured by the review; NOT re-measured by this lane."
  - "M4 — G-7 now has a named owner: 9417f8bf. R1 recorded 'may referenceName reach the client' as a gap with no
     owner, while 9417f8bf's stated question is the substrate only. § R.4.1 names it, explains that client
     exposure is a CONSEQUENCE of the substrate answer (path vs ARN vs opaque row reference), and asks the
     Manager to widen the reissued object's question to cover it."

  # ---- L: LOW ----
  - "L1 — engine:52 → engine:54 for 'state: ProductState.registered' (verified: createProduct spans 43-61,
     hardcoded state at :54)."
  - "L2 — product_state.dart:29-32 → product_state.dart:24-27 for the 'no baseline, no governance, no work' text
