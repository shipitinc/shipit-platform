  # ---- B: BLOCKERS ----
  - "B1 — ADR 0018 EXISTS; R1's G-1 was FALSE. WITHDRAWN. Revision 1 asserted as a 'traceability gap of the
     first order' that the governing ADR 'does not exist in this repository', produced by listing
     docs/engineering/adr/ instead of docs/adr/. Verified: docs/adr/0018-per-product-git-credentials.md
