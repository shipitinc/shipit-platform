     files cite ADR 0018 by number, several by amendment (postgres_product_registry_store.dart:172,
     product_registry_store.dart:35, repository_credential.spy.yaml:4, repository_credential.dart:10 and
     :22, credential_status.dart:1 and :36, repository_provider.dart:8, product_state.dart:1,
     product_registry_engine.dart:898 and :1057, exceptions.dart:213, ui_view_mappers.dart:138,
     products_page.dart:308) — including files revision 1 cited as evidence of its absence. Retraction
     stated first in design-revision-2.md § 0.1; false G-1 removed from requirements_gaps and from
     traceability-matrix-2.md § 4; D-6 restated in place in discoveries.md with the retraction appended."
  - "B1 (cont.) — § R.21 REWRITTEN. The surviving real gap is that AGENTS.md has NO §13 (verified: 129 lines;
     sections Inherited invariants/Orchestration/Product-specific policy/Test resource hygiene/Framework
     provenance; Product-specific policy is 'TBD' at :59-63; §13b absent too). So ADR 0018's carve-out
     (:140-141) and ADR 0012:34 and ADR 0019:121 all point at text that does not exist. Recorded as G-1' and
     escalated as a governance action — AGENTS.md is outside OWNED_PATHS and was NOT edited."
  - "B1 (cont.) — § R.4 A1/A2/A4 and § R.6 C-1..C-3 rewritten against what the ADR already decides. A2 is
     marked FORBIDDEN by ADR 0018:87-88 ('never … persisted to the durable record'), with the sentence
     attached at the option itself so the human cannot choose it unknowingly. Q1 collapsed to Q1' (does
     b869ec24's server-side custody supersede :85-88?) — the genuinely open delta. Seven of R1's ten
     'substitute assumptions' demoted from assumptions to recorded ADR decisions (R.21.2)."
  - "B1 (cont.) — architecture_refs REPOPULATED with ADR 0012/0015/0018/0019/0020/0021, each read and each
     mapped to the sections it governs (design-brief-1.1.0.md; traceability-matrix-2.md § 4). R1 listed only
     ADR-0001/0002/0003 — framework-distribution ADRs governing nothing here — so no design element traced
     to the architecture it depends on. Those three are retained in the list, annotated, so the mistake's
     source stays visible."
  - "B2 — R1's 'B6 is structurally impossible — four independent mechanisms' is FALSE at the persistence
     layer. Verified: saveProductCredential with null expectedVersion runs INSERT … ON CONFLICT
     (\"credentialId\") DO UPDATE SET … \"publicKey\" = @publicKey … (postgres_product_registry_store.dart:
     238-243, assignments :195-210); recordGeneratedCredential calls it at engine:965 with NO
     expectedVersion, accepts a caller-supplied credentialId (engine:920), and its one-active guard
     (engine:940-941) is 'if (active != null && active.credentialId != supersedesCredentialId)'. So
     recordGeneratedCredential(credentialId: <existing>, supersedesCredentialId: <same>, publicKey: <new>)
     passes the guard and overwrites the stored key in place, resetting status to generated and discarding
     host confirmation. copyWith is NOT on that path (a fresh object is constructed at engine:950-964)."
  - "B2 (cont.) — § R.15 REWRITTEN as TWO mechanisms, not four, and explicitly NOT independent, with a
     per-mechanism statement of what each actually buys (two are properties of not-yet-written endpoint
     code; one is a refusal of a second ROW keyed on supersedesCredentialId, not an immutability guard;
     copyWith protects the in-memory object and nothing at the boundary that persists the row). R1's
     sentence 'These are independent … mechanism 4 still prevents silent substitution' is WITHDRAWN. § R.2
     constraint 3 corrected to say immutability holds in memory only."
  - "B2 (cont.) — § R.16 step 4 REWRITTEN. R1 resolved a concurrent mint on 'the engine's one-active
     exception (engine:940-947)', which WILL NOT FIRE: product_credential carries a unique index on
     credentialId only (definition.sql:645) and repositoryId has a NON-UNIQUE index (:646), so two
     concurrent mints both pass the read-then-write and both insert. Now resolved on D-2's unique
     violation. Added: mint must pass no caller-supplied credentialId (the precondition of the overwrite);
     an immutability violation is a defect and must not be converted into alreadyExisted."
  - "B2 (cont.) — NEW § R.15b: THREE REQUIRED DESIGN DELIVERABLES. D-1 store-level key-material immutability
     guard on saveProductCredential, with the preferred predicated 'ON CONFLICT … DO UPDATE … WHERE
     publicKey = … AND fingerprint = … AND algorithm = … AND referenceName = … RETURNING' form and an
     alternative typed-refusal form; D-2 the required partial unique index
     'ON product_credential (repositoryId) WHERE status <> ''revoked''' (PROPOSED ONLY — C-09 forbids
     creating it), whose predicate is identical to readActiveCredentialForRepository's own predicate
     (postgres_product_registry_store.dart:262) so constraint and query cannot contradict, and whose order
     is satisfied by rotateCredential's revoke-then-mint (engine:1104, :1108-1119); D-3 two engine-level
     tests, T-A (same-credentialId re-mint must throw, stored key byte-identical) and T-B (two concurrent
     mints yield exactly one active row), both of which FAIL TODAY. D-1/D-2 are substrate-independent and
     therefore NOT gated on OPEN-D4-1."
  - "B2 (cont.) — NEW finding while reading: a version CAS alone does NOT close the D-1 hole, because
     recordGeneratedCredential hardcodes version: 1 (engine:963), so a previously-minted row is also at
     version 1 and 'expectedVersion: 1' would match and still overwrite publicKey. The guard must be
     expressed on the immutable fields themselves. The engine already uses CAS correctly on the other four
     credential writers (engine:997, :1011, :1052, :1074), which is why the pattern was noticed — but the
     mint path is the one that cannot use it."
  - "B2 (cont.) — SC-02 and SC-03 EXTENDED with T-A and T-B; SC-08 re-framed to require the D4 decision be
     taken against ADR 0018 in evidence. R1's SC-03 concurrency clause ('resolves via the engine's
     one-active rule') corrected."

  # ---- H: HIGH ----
  - "H1 — § R.3 REWRITTEN invariant-only. Deleted 'Decision (normative … it selects a substrate)', deleted
     'SHIP IT's own at-rest store' (which silently excluded A3, the option § R.8 and 9417f8bf recommend),
     and deleted 'No wire-contract break from the field's existence' (asserted then retracted 30 lines
     later). § R.3 now states exactly one normative invariant — referenceName names a reference and never
     a value — and marks three things OPEN: its subject, the substrate, and client exposure. Reuse row #35's
     migration cell marked explicitly CONDITIONAL on the substrate instead of 'none proposed'."
  - "H1 (cont.) — L4 fixed inside § R.3: R1 claimed referenceName is 'already indexed as part of the row'.
     It has NO index; repository_credential.spy.yaml:7-14 declares exactly three (credentialId unique,
     repositoryId, productId)."
  - "H2 — Q3 is NOT withdrawn but RE-FRAMED, with the reason stated. ADR 0018:113-114 already answers
     'Revocation is provider-native … requires no Shipit-side action' — under the ADR's own custody model,
     where SHIP IT holds no bytes. b869ec24 moves custody server-side and is SILENT on revocation
     (grep -i 'revoc|rotat' over .decisions/b869ec24-*.yaml returns no match). So Q3' asks whether :113-114
     survives the move, and C-2 is named as the ADR's answer under Q3'=YES rather than being presented as an
     unexplored option. 79e860e2 must be restated in these terms."
  - "H3 — A2's threat model CORRECTED. R1's A2 'For' bullet claimed 'backups of the database alone no longer
     disclose the key'; that is false comfort. An attacker needs no backup: docker/compose.yaml:62 hardcodes
     SERVERPOD_DATABASE_PASSWORD: shipit in a committed file, docker/compose.yaml:16-17 publishes 5432:5432
     unqualified (0.0.0.0), .env.example:16-18 documents POSTGRES_USER/PASSWORD=shipit, and
     DEC-570bb640:34-37 and :73-75 record exactly this exposure. A2's 'For' claim is WITHDRAWN and the
     direct-read path added to A2's 'Against' and to the new § R.7.1 threat-model table."
  - "H4 — § R.18 gains a FOURTH point: the direct-database path. An off-host caller reaching 5432 with the
     committed default credentials bypasses the endpoint entirely, so endpoint auditing and endpoint
     constraints do not constrain the data; and under a Q1'-supersession selecting A2 that is exactly where
     the sealed key material sits. § R.18's existing honesty is preserved verbatim and extended, not
     softened."

  # ---- M: MEDIUM ----
  - "M1 — Brief's cross-lane instruction CORRECTED. R1 told design-addproduct-mobile the enforced order is
     'four steps — not the current three-step _StepText list (add_product_page.dart:650-672)'. There are FOUR
     _StepText entries, at :650, :656, :662, :668. v1.1.0 states the current list is four steps (generate /
     install+prove / read revision+build baseline / approve baseline) and that the key-flow order replaces
     steps 1–2 with Generate → Trust → Check, adding Register as distinct. Issued as design-brief-1.1.0.md so
     v1.0.0 stays intact; notifying the sibling lane is a Manager action (it owns its own artifacts)."
