  - "L4 — see H1: referenceName has no index."
  - "L5 — D-7 RESTATED in discoveries.md as a CONFIRMED-UNIMPLEMENTED FOLLOW-UP to 570bb640, not a first-time
     finding; 570bb640's own context already records that 'local only' is unenforced (:22-27, :67-72). § R.18
