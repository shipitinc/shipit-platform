  - "dispatch constraint 2 -- retry re-runs a real AI agent and spends real model credits; make that consequence visible and unambiguous BEFORE the human commits"
  - "dispatch constraint 3 -- retry must respect SHIPIT_DISPATCH_MAX_CONCURRENT_AGENTS and the built zombie/timeout protections; on denial, tell the human plainly and offer a queued alternative, never a button that silently does nothing"
  - "dispatch constraint 4 -- no raw SQL, no hand-written state mutation; every server-side move through DurableWorkflowEngine/WorkItemTransitions with the same injected policy, as packages/scheduler/lib/src/scheduler.dart does for its reclaim path"
  - "dispatch constraint 5 -- durability/idempotency: specify double-click, refresh mid-flight, lost response and capacity denial, following the repo's existing idempotencyKey conventions"
  - "dispatch constraint 6 -- plain language, existing vocabulary; no engineer jargon; a quiet log or empty screen must never be indistinguishable from a healthy one"
  - "dispatch (a) -- the exact action set mapped to legal transitions, with copy for each; decide and justify whether abandon/cancel is wanted or scope creep"
  - "dispatch (b) -- layout/interaction for the action panel: where it sits, what it shows about WHY it failed, how a credit-spending retry is confirmed"
  - "dispatch (c) -- the client->server contract: RPC name and shape, specified as NEW surface (method, params, result, error cases)"
  - "dispatch (d) -- behaviour when the capacity guard denies, and when the underlying job/execution is in a weird state"
  - "dispatch (e) -- accessibility and existing design-system conventions"
  - "dispatch (f) -- what the screen must NOT do (no capacity-guard bypass; retry never presented as free)"
  - "dispatch (g) -- the nine parked agent_completed items are OUT OF SCOPE; note as a follow-up only, never conflated or solved here"
  - "dispatch deliverable -- OWNED_PATHS / READ_ONLY_PATHS declared; no modification of production source under apps/** or packages/**"
  - "dispatch hard constraint -- zero Docker/Compose mutating commands (QA is live); docker exec with a read-only command permitted; never make clean / qa-down / test-env-down / e2e-down / bare down -v; reading a compose file as text is the supported way to learn what a stack does; do NOT touch live database state"

