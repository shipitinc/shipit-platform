hd4_note: >
  Revision 1.3.0 closes HD-4 (decision 8a3f6b17-92d4-4e08-b6c1-8f0d5b27a934, ARCHITECTURE, RESOLVED,
  outcome DESIGN_NOT_REQUIRED). Independent review found B1 NOT fixed at 1.2.0: the alternative branch
  changed shape and became ALWAYS-FALSE. On branch B item.state is agentExecuting and the target is
  agentExecuting; (agentExecuting, agentExecuting) is ABSENT from _legalTransitions and
  _isGenericEscape rejects self-transitions (work_item_transitions.dart:303), so isValid was always
  false and every authorised retry was dropped. Worse, the two conjuncts were MUTUALLY UNSATISFIABLE:
  the authorisation conjunct required the audit row to name the item's LATEST transition (so the item
  IS in agentExecuting) while edge legality required from != to (so it is NOT).
  ROOT CAUSE: agentExecuting means "an execution is ALREADY RUNNING". Transitioning a failed item into
  it asserts something untrue, and the scheduler correctly refuses to dispatch an item claiming to
  already be executing. Specifying a dispatch seam around that target was the wrong shape, not merely a
  wrong implementation.
  THE SEAM IS DELETED IN ITS ENTIRETY -- section 6.5.2 is gone, not narrowed, not replaced by a fourth
  variant, per the decision's binding instruction. There is no change to Scheduler._eligibleRunnableJobs,
  no branch on statusOf, no replacement of isRunnable, no worker_execution guard, and no
  requestOperatorDispatch anywhere. The retry now moves the item agentFailed -> designNotRequired --
  a triage entry state (triage_defect.dart:10) whose designNotRequired -> agentExecuting edge is
  already exercised (live transition tr-hn3lio9ndj-1hjznv6) -- so the entire existing dispatch path
  applies unchanged.
  ACCEPTED COST, SPECIFIED HERE: one new workflow-engine edge (section 6.5.1, AC-35, proved through
  the real engine with a negative control) and a fresh dedupe key per retry (section 6.7, AC-36),
  derived from durable metadata.triageAttempt because DedupeKeyBuilder is synchronous and takes only
  (WorkItem, JobDefinition) -- scheduler.dart:113-115.
correction_note: >
  Revision 1.2.0 corrected INDEPENDENT DESIGN REVIEW findings on 1.1.0 (CHANGES_REQUIRED). The reviewer
  CONFIRMED HD-1/HD-2/HD-3 folded in faithfully, P-1..P-6 all verify against source, the action set is
  correct against the real transition table, atomicity is achievable, risk level 3 is right, and NO
  human decision is reopened -- so nothing verified was re-derived. Six defects were corrected, two
  of them blockers and both mine.
    B1 (BLOCKER) -- the operator-retry eligibility rule was specified as DEAD CODE. 1.1.0 said "after
      the existing checks, never instead of them" and counted "item exists and is NOT terminal" as an
      existing gate. _eligibleRunnableJobs (scheduler.dart:569-599) contains TWO independent `continue`s
      that drop any job whose item is agentExecuting -- :578-581 (statusOf != runnable) and :593-594
      (isRunnable) -- and both fire before any appended check. Failure mode: a capacity-denied retry
      leaves the item in agentExecuting with a queued job every tick drops, i.e. P-1 recurring through
      the design's own `queued` outcome. Fixed by NEW section 6.5.2: restated as an explicit ALTERNATIVE
      BRANCH with the concrete restructured control flow, a REPLACE-vs-NOT-BYPASS table, and the
      reachable-only-where-branch-A-is-not property. Breaks section 7.1 item 5, AC-17 and dispatch
      constraint 3's promise of "a queued alternative, NOT a button that silently does nothing".
    B2 (BLOCKER, coupled) -- Lane S's contract was NEGATIVE-ONLY (AC-19b/c), so it could merge green
      while dispatching nothing. Fixed at 1.2.0: NEW section 16.3 declares the completion gate, and
      positive criteria were added. The negative-only incompleteness is DECLARED in requirements gaps
      (item 2) rather than left undeclared.
      >> SUPERSEDED AT 1.3.0: the positive criteria named here (AC-15e, AC-32, AC-33) were DELETED with
      the seam. The CURRENT Lane S acceptance set is AC-35 (the edge is legal through the real engine,
      with a negative control), AC-36 (the four dedupe-key properties), AC-17 (a retried item is
      dispatched by a NORMAL tick), AC-14a-e (the audit record) and AC-10 (one-transaction atomicity),
      with AC-19b, AC-19c, AC-29, AC-7 as negatives. See implementation_sequencing.lane_s_seam.
    H1 (HIGH) -- a surviving 1.0.0 fragment asserted the WITHDRAWN prefix still authorises, plus an
      orphaned `blocks:` line and a duplicate unresolved "### HD-3" heading. All deleted; see the
      full-brief sweep table in design-brief.md section 17.1.
    M1 (MEDIUM) -- SHIPIT_OPERATOR_MAX_RETRIES=0 was spec-inconsistent: section 6.6 named
      ExecutionCapacityResolution.fromEnvironment, which resolves parsed < 1 to UNRESOLVED with a
      "below the minimum of 1" diagnostic (execution_capacity.dart:156-164), while AC-15c calls 0 a
      valid configuration. Fixed by one explicit sentence: reuse the PATTERN, not the helper; 0 must
      resolve to a RESOLVED value meaning permanently disabled, with a configuration-styled diagnostic.
    M2 (MEDIUM) -- "11 WorkflowStore implementors" was wrong; it is 8 (3 production + 5 test doubles).
      The contract suite is NOT an implementor -- workflow_store_suite.dart:9-11 takes a
      Future<WorkflowStore> Function() factory. Corrected in sections 6.4.4 and 12. The error was in the
      SAFE direction but was repeated twice as load-bearing risk-pricing evidence.
    LOW -- L1: AC-31's conclusion (schema_bootstrap.sql needs no change) is CORRECT but its evidence was
      a proxy; the real reason is that verify_schema_bootstrap.sh:126-131 `required_objects` admits only
      trigger:/index: kinds, so a generated table cannot be listed there. Reasoning restated.
      L2: citation drift corrected -- reason is at durable_workflow_engine.dart:157 (was :156) and the
      rejected path at :170-173 (was :169-172). L3: A3/A11 introduce Semantics(liveRegion: true) with
      NO codebase precedent and AC-27's goldens cannot see a semantics tree; NEW AC-34 adds three
      explicit widget tests asserting on tester.getSemantics(). L4: LEARNING_POLICY category tags added
      to the durable discoveries -- P-6 = CONTRADICTION, section 14.1 = DESIGN_DISCOVERY, section 14.2 =
      PROJECT_FACT. ALSO FOUND BY THE SWEEP AND NOT REPORTED: section 14's G5 row still read "Any
      migration or schema change / None is needed", which is untrue after HD-2; corrected.
  p1_status: >
    P-1 REMAINS THE GOVERNING FINDING AND IS NOT SOFTENED. It is sharper if anything: B1 showed the
    seam's own specification could not have delivered it, and section 16.3 now exists so the same class
    of error cannot pass review twice.
