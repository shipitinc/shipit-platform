risk_rationale: >
  Level 3 -- Major Workflow change. UNCHANGED by revision 2 and independently confirmed by the
  operator, who granted it at Level 3 against DESIGN_GOVERNANCE.md:99 and declined a downgrade.
  Four independent grounds, each stated so a reviewer can disagree with one without discarding
  the rest. (1) A state is added to WorkItemState, the enum every component obeys -- the
  scheduler's entry sets, the coordinator's edges, the workflow store, the control-plane API and
  the operator UI (platform_contracts/lib/src/enums/workflow_state.dart:1-30). (2) The transition
  table every other component must obey gains an edge (work_item_transitions.dart); the scheduler
  asks that table and never reimplements it (runnable_work.dart:152-163). (3) Human-decision
  routes are retargeted across five (type, choice) pairs spanning four decision types
  (human_decision_routing.dart:55-56,59-60,61-62,71-72,79-80) plus a transition-guard change,
  which changes what "rework" and "reject" mean to a human resolving a gate. (4) The escalation
  audit trail changes shape, and getting it wrong is SILENT: escalationTargetFor "does not error
  -- it silently stops the escalation index advancing" (human_decision_routing.dart:105-109).
  Level 2 was considered and rejected: the change is to the governance model every future feature
  inherits, not to one feature's flow. Level 2 is a defensible alternative reading and is invited
  rather than defended against. REVISION 2 ADDS NO GROUND: OD-8's answer widens A1's FILE map; it
  touches no WorkItemState, no edge and no route.

changelog:
  - "revision 2. A CORRECTION PASS, not a redesign. It folds in three operator answers
     (fb3c3485 Level-3 approval, 9bfe2d09 OD-7 = option B, c04f6a8d OD-8 = option A) and eight
     independent-review findings (M1-M5, L1-L3). The design's spine is unchanged: the corrected
     framing (section 2), the Level 3 justification (12.1), the collision argument (7.4), the two
     lockstep corrections D-13/D-14, the retained-tree refusal D-8 and the section 9.4 backlog
     refusal all carry forward in substance. Every finding touching them was re-verified against
     the code before being accepted -- see brief section 17."
  - "M1: the credential property is now an OBLIGATION on A1's materialiser, not an inheritance.
     Revision 1's D-7 asserted as established fact that 'a durable clone carries no credential'.
     That is true of RepositorySnapshotAcquirer -- identity/known_hosts/wrapper are SIBLINGS of the
     clone (repository_snapshot_acquirer.dart:740,743-746), GIT_SSH_COMMAND is a per-invocation env
     var (:1202), HOME is redirected (:1213) and GIT_CONFIG_GLOBAL/SYSTEM are /dev/null (:1214-1215)
     -- but section 6.4 FORBIDS A1 from reusing the acquirer, so the property was inherited by
     nothing. Section 6.4 now states six binding obligations, including 'leave NO core.sshCommand
     and no identity reference in the clone's git config', plus prohibitions 17-18 and review row
     R-9."
  - "M2: A2's runtime_depends_on and section 8.3's concurrency table BOTH overstated compile-time
     independence. Once C-1 is discharged, server.dart references A1's runtime class, so the
     composition-root integration IS serialized. Restated as the brief's own prose already had it:
     product code is independently compilable; the ONE-FILE composition-root integration is
     serialized. C-1/C-2 still hold; the verdict is unchanged; the dependency is one-directional
     and shallow because of C-2."
  - "M3: the env-var read is recorded explicitly as A2's obligation under C-1. Revision 1 made it
     A1's obligation (D-18) while assigning server.dart exclusively to A2 and listing it under
     A1's does_not_own -- so another implementer would have written the code A1's central
     agnosticism invariant depends on. A1's grant was deliberately NOT narrowed instead, because
     C-1's single-writer guarantee is the stronger invariant. Prohibition 19, D-18, section 7.9."
  - "M4: section 12.3 now partitions AUTHORABLE-NOW from STILL-GATED, per unit and per work item.
     Approval authorises BUILDING, not landing. Neither IMPL-001 nor IMPL-002 completes on
     approval alone. The status column is derived only from section 11's recorded decision status,
     never from an inference about intent."
  - "M5: A1's directory-wide grant over apps/server/lib/src/credentials/** is NARROWED. That
     directory contains repository_snapshot_acquirer.dart -- the file holding the retained-tree
     leak section 15.13 forbids A1 from fixing and section 6.4 forbids A1 from reusing -- so the
     grant could not enforce the prohibition it was supposed to enforce. ALL THIRTEEN files are now
     READ-ONLY for BOTH units, with repository_snapshot_acquirer.dart named explicitly. Verified
     that A1 needs to modify none of them: it composes them. A1's materialiser moves under
     lib/src/baseline/** so the mechanical product-agnosticism gate covers it. D-8 is now
     structurally enforced rather than policy-only. Prohibition 13, D-22."
  - "L1: four citation offsets corrected after direct verification. workspace_descriptor.dart
     repositoryPath :20->:18 and startingRevision :21->:19 (worktreePath :20 was correct by
     coincidence, which is how the error survived); workspace_descriptor.schema.json required
     array :8-16->:8-17; and work_item_transitions.dart :280-284 is the explanatory COMMENT, not
     the guard call -- the call is :285-290 (comment :277-284). Both references are now given so
     the citation cannot be re-broken the same way."
  - "L2: recorded as a traceability limitation -- IMPL-001..IMPL-005 have NO source-of-truth
     requirements artifact in this repository. Verified: the only hits for those IDs anywhere are
     in this design folder, and there is no docs/requirements/ directory. Section 13.1 is therefore
     dispatch-text-to-design, NOT requirements-to-design."
  - "L3: section 4.3 said the approval request was A2-scoped while section 12.3 items 3-4 requested
     approval for A1's clone location and A1's schema change. Aligned: the Level 3 JUSTIFICATION
     rests on A2's lifecycle surface; the APPROVAL is PAIR-WIDE."
  - "NEW FINDING (not a review finding, arising from folding in an operator answer): OD-8 = option A
     changes the Dart type of OnboardingRecord.workspace, and its verified blast radius is
     materially wider than revision 1's conditional grant assumed. Section 8.6 enumerates every
     reader that binds the field and finds product_registry_engine.dart's recordWorkspace
     parameter type, the shared store_contract_tests suite, postgres_product_registry_store.dart
     and control_plane_service.dart all in scope. Verified that this adds NO null branch to the
     artifact-resolution chain -- all four named per-execution consumers provably contain no
     reference to OnboardingRecord, so OD-8's byte-identical binding holds. The required path
     grant is ESCALATED to the Manager and NOT self-granted. D-25."
  - "OD-7 = option B (9bfe2d09): a HOST BIND ${SHIPIT_HOST_WORKSPACE_DIR}, matching the
     ${SHIPIT_HOST_SECRET_DIR} precedent (compose.qa.yaml:119), with a fail-closed sentinel of the
     same shape and explicit -p naming on every teardown. Revision 1 had recommended a Docker
     named volume; the operator chose the host bind and the deciding factor was review
