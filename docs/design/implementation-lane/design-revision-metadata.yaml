implementation_units:
  A1:
    name: "durable workspace creation"
    changes_lifecycle: false
    owns:
      - "apps/server/lib/src/baseline/**  -- the lane, its resolve(...)-shaped factory (C-2), ITS OWN MATERIALISER, and the product_agnosticism_test.dart update. The materialiser lives here so the mechanical agnosticism gate covers it."
      - "packages/platform_contracts/lib/src/types/durable_workspace_descriptor.dart  (NEW -- OD-8 = option A)"
      - "packages/platform_contracts/lib/src/types/onboarding_record.dart  + .g.dart  -- the field type, hasLiveWorkspace/hasDurableWorkspace, validate()"
      - "packages/platform_contracts/test/contract_schemas_test.dart  -- register the new schema"
      - "schemas/durable_workspace_descriptor.schema.json  + schemas/examples/…  (NEW)"
      - "schemas/onboarding_record.schema.json  -- the inlined shape"
      - "packages/product_registry/**  -- recordWorkspace's parameter type (brief 8.6). WAS read-only in revision 1."
      - "packages/store_contract_tests/**  -- the shared conformance suite constructs WorkspaceDescriptor"
      - "apps/server/lib/src/persistence/postgres_product_registry_store.dart  -- ONE file, one JSON binding, no SQL change"
      - "apps/server/lib/src/services/control_plane_service.dart  -- one debug-log reader (brief 8.6)"
      - "docker/**  -- the host bind mount (brief 6.3)"
    read_only:
      - "apps/server/lib/src/credentials/**  -- ALL THIRTEEN FILES, for A1 and A2 alike (M5). Named explicitly: repository_snapshot_acquirer.dart, which holds the retained-tree behaviour D-8 forbids A1 from fixing and 6.4 forbids A1 from reusing; plus repository_snapshot_acquirer_test.dart, credential_key_service.dart, repository_access_verifier.dart, secret_provider.dart, posix_file_permissions.dart, ssh_keypair.dart, secret_material.dart, ssh_remote.dart, gcp_secret_manager_secret_provider.dart, local_file_secret_provider.dart, secret_provider_resolver.dart, secretless_error.dart."
      - "packages/platform_contracts/lib/src/types/workspace_descriptor.dart and schemas/workspace_descriptor.schema.json -- OD-8 binds them UNMODIFIED for BOTH units."
      - "apps/server/lib/server.dart -- see condition C-1"
    not_owned:
      - "apps/server/lib/src/persistence/** beyond postgres_product_registry_store.dart -- re-scoped through review if a second file proves to need it, not taken silently"
    why_zero_credential_files_are_owned: >
      Verified that A1 needs to modify none of the thirteen. A1 COMPOSES the primitives and every
      one already exposes what a materialiser needs: CredentialKeyService.generate (:234) and
      .verifyAccess (:341), RepositoryAccessVerifier, SecretProvider as the port, PosixFileModes,
      SshKeyPair and SecretBytes as value types. SshRemote (ssh_remote.dart:8-39) carries only
      user/host/port/repositoryPath and no identity field, so a durable clone needs no variant of
      it. A directory-wide grant would have handed A1
      write access to the one file whose behaviour it must not change, and a prohibitions register
      is not a capability control.
    contingency: >
      If implementation finds a genuine need to modify one of the thirteen, it is re-scoped
      through review -- not taken in silently (the rule brief 6.9 applies to persistence/**). The
      one modification this design FORESEEES and refuses is repository_snapshot_acquirer.dart, whose
      retained-tree behaviour is OD-9's to fix in its own lane.
    condition_c2: >
      A1's runtime MUST be constructible without apps/server/lib/server.dart -- a resolve(...)-shaped
      factory taking its dependencies as parameters, modelled on BaselineProductionRuntime
      (baseline_runtime.dart:62-134) and integration-tested the way that one is
      (baseline_dispatch_integration_test.dart:57, :749). This is what makes the section 8.3
      compile-time dependency ONE-DIRECTIONAL: A1 never waits on A2.
    credential_obligations_M1: >
      A1's materialiser MUST, per acquisition: materialise the private half via
      CredentialKeyService.generate; write identity/known_hosts/ssh-wrapper as SIBLINGS of the
      clone, never inside it; pass the private half ONLY through a per-invocation environment
      (GIT_SSH_COMMAND, pinned PATH, GIT_TERMINAL_PROMPT=0, GIT_ASKPASS=''); redirect HOME and set
      GIT_CONFIG_GLOBAL and GIT_CONFIG_SYSTEM to /dev/null; leave NO core.sshCommand and NO identity
      reference in the clone's git config; and destroy the private half FIRST AND UNCONDITIONALLY
      before deciding the repository's fate. Obligations 3-5 are invisible on every success path,
      which is why review row R-9 exists.
  A2:
    name: "implementation scheduler"
    changes_lifecycle: true
    owns:
      - "packages/scheduler/**"
      - "packages/workflow_engine/**"
      - "packages/workflow_store/**"
      - "packages/platform_contracts/lib/src/enums/workflow_state.dart  (GRANTED by fb3c3485)"
      - "apps/server/lib/src/implementation/**  (GRANTED by fb3c3485)"
      - "apps/control_plane/lib/core/plain_language.dart  (GRANTED by fb3c3485)"
      - "apps/control_plane/lib/shared/transition_copy.dart  (GRANTED by fb3c3485)"
      - "apps/server/lib/server.dart  (EXCLUSIVELY -- condition C-1, revised)"
    read_only:
      - "apps/server/lib/src/baseline/**"
      - "apps/server/lib/src/credentials/**  -- all thirteen, same as A1 (M5)"
      - "packages/platform_contracts/lib/src/types/workspace_descriptor.dart and its schema -- OD-8 binds them unmodified"
      - "docker/**  -- A1 owns the mount; A2 only reads the path A1 recorded"
    runtime_depends_on: >
      CORRECTED (M2). Revision 1 said "Data dependency only: readOnboardingForProduct already exists,
      so A2 compiles and passes its own tests without A1's code existing." THAT IS FALSE once C-1
      is discharged: server.dart is A2's and it references A1's runtime class, so A2's composition
      root cannot compile until A1's factory declaration is visible.
      ACCURATE STATEMENT: A2's PRODUCT code is independently compilable and independently testable
      in both directions -- A1 calls recordWorkspace/completeOnboarding which already exist
      (f164d40), and A2 reads readOnboardingForProduct which already exists
      (postgres_product_registry_store.dart:1062-1071). The ONE-FILE composition-root integration
      is SERIALIZED, at a cost of roughly two call lines, and it is one-directional and shallow
      because of C-2. This field overstated independence in the exact place the dispatcher reads
      to decide whether two lanes may run concurrently, and a field that overstates is worse than
      no field, because it is trusted precisely where nobody re-checks.
    composition_root_obligations_M3: >
      Under C-1, A2 writes THREE things in server.dart: its own composition (implement worker,
      sched-impl, the resolver -- brief 7.8); A1's wiring lines, added in the same composition
      pass after A1's factory exists; and THE ENVIRONMENT-VARIABLE READ FOR A1'S DURABLE-WORKSPACE
      ROOT, passing the resolved path INTO A1's factory as a parameter. The model is
      _triageWorkspaceRoot() (server.dart:1281-1285). Revision 1 assigned that read to A1 while
      A1's own path map made it impossible for A1 to perform it (M3). A1's grant was deliberately
      NOT narrowed instead -- C-1's single-writer guarantee is the stronger invariant.
  neither:
    - "apps/server/lib/src/credentials/** -- READ-ONLY for both units, all thirteen files, after M5's narrowing. This is the structural enforcement of D-8: neither unit CAN fix the retained-tree leak even by accident."
  concurrency_verdict: >
    GENUINELY CONCURRENT-SAFE, subject to C-1 (server.dart assigned exclusively to A2, which adds
    A1's wiring lines AND A1's environment-variable read after A1's factory exists) and C-2 (A1's
    runtime is constructible without server.dart). BOTH CONDITIONS STILL HOLD in revision 2, and
    the reviewer found no blocker and no high against either.
    Concurrent code authoring: YES. Concurrent independent review: YES. Concurrent DISPATCH without
    a durable workspace: NO and must not happen -- the readiness probe defers instead (section 7.7),
    which is runtime ordering, not a build constraint, and decision fb3c3485 binds it explicitly.
    The one shared file is serialized, at a cost of roughly two call lines, and CORRECTLY recorded
    in A2's runtime_depends_on rather than overstated (M2).
    As originally dispatched, before C-1, the answer was NO: the named composition file
    apps/server/lib/src/scheduler.dart does not exist, and both units must write
    apps/server/lib/server.dart.

human_decisions_requested:
  - id: "OD-3"
    question: >
      Which of the five routes into designNotRequired mean "re-do the work" rather than
      "re-classify"? Recommended: (engineeringReview, rework) and (qaRework, reject) stay in
      triage; (qaWaiver, reject), (humanQaApproval, reject) and (escalation, approve) go to
      implementationReady. Only (engineeringReview, rework) and (humanQaApproval, reject) need
      escalationTargetFor lockstep.
    resolved: false
    blocks: "A2's routing edits only. D-13/D-14 bind regardless, so the edge and its guard set are authorable even though which pairs route there is not."
  - id: "OD-4"
    question: >
      How does the implementation lane express "deferred, not blocked"? null from
      WorkloadResolver currently means exactly blockedArtifactMissing. Recommended: widen the
      typedef to a sealed WorkloadResolution {resolved, deferred, blocked}; a per-definition flag
      is acceptable; folding into the existing deferred channel is rejected because the
      construction-time workload is a required constructor argument (scheduler.dart:322) and would
      become the dispatch path.
    resolved: false
    blocks: "A2's composition"
  - id: "OD-5"
    question: >
      Must the implementation lane provision a QA contract before dispatching, or refuse to
      dispatch items without one? An item with qaContractId IS NULL is refused on
      agentExecuting -> agentCompleted for ever with nothing repairing it, and createFeatureWorkItem
      produces items with no contract at all. The dependency nobody should discover late: a
      qa_architect lane must exist to produce one.
    resolved: false
    blocks: "A2's dispatch behaviour, and IMPL-003 end to end"
  - id: "OD-7.1"
    question: "Named volume (W-A) or host bind mount (W-B)? And what bounds the location choice."
    resolved: true
    resolution: "B -- host bind ${SHIPIT_HOST_WORKSPACE_DIR}, with a fail-closed sentinel of the same shape as ${SHIPIT_HOST_SECRET_DIR} and explicit -p naming on every teardown."
    decision_id: "9bfe2d09-881e-4df4-9939-3883cf45b0d5"
    blocks: "nothing -- A1's compose change is UNBLOCKED"
  - id: "OD-7.2"
    question: "How long does a durable clone live? Unlike every other clone in this platform it has a PRODUCT lifetime, not an execution lifetime."
    resolved: false
    recommendation_stands: "Reclaim when the product leaves governed for archived, and never before -- the existing lifecycle rather than an invented timer."
    blocks: "A1's reclamation path. NOTE: nothing currently deletes a durable clone, so the gap is BOUNDED (one per product) rather than an unbounded leak like OD-9's."
  - id: "OD-7.3"
    question: "Who deletes a durable clone -- onboarding, offboarding, a sweep, or a human action?"
    resolved: false
    recommendation_stands: "A human action, not a sweep. Deleting a product's only checkout is not a machine decision, and AGENTS.md reserves destructive operations for human authorisation."
    blocks: "A1's reclamation path"
  - id: "OD-8"
    question: >
      WorkspaceDescriptor is per-EXECUTION; a durable clone is per-PRODUCT. workerExecutionId,
      workerId and worktreePath are all required -- in the type AND in both JSON Schemas -- and
      none of them has a meaning here. Escalated rather than decided by this lane because it changes
      a published schema and a published contract suite, and AGENTS.md section 12 is the section
      that makes a baseline's own claims independently checkable.
    resolved: true
    resolution: "A -- add DurableWorkspaceDescriptor as a separate type + schema. WorkspaceDescriptor is NOT modified. The per-execution consumers stay behaviourally byte-identical with no new null branches. No migration required."
    decision_id: "c04f6a8d-abcc-4a63-ab42-04b969a63b9a"
    note: >
      Revision 1 had recommended option (b), a kind discriminator on the existing type; the
      operator chose the second type, which is the better call, and the override is recorded as
      deliberate. RE-VERIFIED BEFORE ADOPTING: all four named per-execution consumers provably
      contain no reference to OnboardingRecord, so the byte-identical binding holds exactly as
      stated. The verified consequence the answer did not anticipate is at brief 8.6.
    blocks: "nothing -- this was what blocked A1's write path, and it is answered"
  - id: "OD-9"
    question: >
      Who reclaims a retained snapshot tree, and when? treeRetainedForArtifact says in bold that
      the caller owns reclaiming it; verified that nothing does. Recommended: do NOT fix it here --
      file it against the snapshot lifecycle as its own lane with its own bound.
    resolved: false
    blocks: "nothing; recorded because A1 must not inherit it silently -- now STRUCTURALLY enforced, since all thirteen credential files are READ-ONLY for both units"
  - id: "OD-10"
    question: >
      What puts a work item into implementationReady? A state nothing routes into is inert, and
      WorkEntryTrigger currently parks a feature at planned with no consumer runtime -- which an
      implementation lane would be. Recommended: route only from resolved human decisions and add
      no autonomous producer, keeping the first code-writing lane supervised by construction.
    resolved: false
    blocks: "whether A2 dispatches anything at all -- i.e. IMPL-001"

