    - "IMPL-002 -- the workspace is real, durable and credential-mediated: sections 2.2-2.4, 6.1-6.4, 6.7 (A1). Location DECIDED (OD-7.1); reclamation STILL GATED on OD-7.2/OD-7.3; the persistence path is blocked pending the section 8.6 grant."
    - "IMPL-003 -- engineering review dispatches instead of failing closed: section 3, verified end to end at section 9.1. Requires OD-5."
    - "IMPL-004 -- no concurrent double-dispatch onto one work item: sections 7.4, 8.1-8.3. Safe under any OD-3 answer."
    - "IMPL-005 -- no artifact is manufactured: sections 4.2 (hazard), 7.7 (guard), 9.2 row 1 (negative control), 9.4 (backlog refusal). Strengthened by R-9 (credential leak) and R-10 (descriptor discrimination)."
    - "LIMITATION (L2): IMPL-001..IMPL-005 have no source-of-truth requirements artifact in this repository -- verified: the only hits for these IDs anywhere are in this design folder, and there is no docs/requirements/ directory. The mapping above is dispatch-text-to-design, NOT requirements-to-design, and should not be read as evidence the platform's requirements are covered. Persisting a requirements artifact is recommended before IMPL-001 is claimed complete; authoring requirements text is a product decision outside this lane's authority."
  requirements_gaps:
    - "OD-7.2 and OD-7.3 unanswered: A1 can ship the mount but NOT a reclamation policy. IMPL-002's workspace will exist and be durable with no bound on its lifetime and no named reclaimer. Bounded-but-unowned, unlike OD-9's unbounded-per-execution leak. Sections 6.3.6, 12.3.1, prohibition 16."
    - "Section 8.6's five paths are not granted: A1 cannot compile until the grant is extended. DISPATCH-TIME INPUT, NOT A DESIGN GAP -- and this lane took nothing."
    - "OD-5 unanswered: IMPL-003 cannot complete end to end; an item A2 dispatches without a qaContractId is refused on agentExecuting -> agentCompleted for ever (work_item_transitions.dart:102; guard_conditions.dart:247; execution_coordinator.dart:830)."
    - "OD-10 unanswered: IMPL-001 may build a scheduler that never dispatches. Safe, but THE REQUIREMENT IS UNMET -- 'safe' is not 'done'."
    - "OD-4 unanswered: the deferral shape is undecided; A2's composition is gated on it."
    - "OD-3 unanswered: A2's routing edits cannot be written. D-13/D-14 bind regardless, so the edge and its guard set are authorable even though which pairs route there is not."
    - "OD-9 unanswered: retained-tree reclamation has no owner anywhere in the repository. PRE-EXISTING; not a gap this design introduces, and deliberately not one it closes. Now structurally unenforceable-by-accident for A1 and A2 (all thirteen credential files READ-ONLY, M5)."
    - "No qa_architect lane assumed (OD-5, from the other side)."
