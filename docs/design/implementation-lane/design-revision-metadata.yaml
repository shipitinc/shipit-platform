     production variant, and REJECTED container-ephemeral because it destroys the artifact.
     Section 6.3, D-4, D-5, OD-7."
  - "ANSWERED snapshot-vs-durable-clone coexistence: three distinct objects with three
     distinct reclaimer responsibilities; A1 neither inherits nor fixes the unbounded,
     unowned retained-tree leak. Section 6.5, D-8, OD-9."
  - "VERIFIED the A1/A2 collision argument still holds against cc9317c, and recorded WHY:
     RunnableWorkEvaluator rejects a non-entry state BEFORE the probe
     (runnable_work.dart:142-144) and EntryHopper is only reached inside the runnable arm
     and may only land on its own definition's entry states (entry_hop.dart:288-297), so
     a hop can never carry an item between lanes. Sections 1.2, 7.4."
  - "ADDED three paths neither candidate list covered: packages/platform_contracts/
     lib/src/enums/workflow_state.dart (where WorkItemState actually lives),
     apps/server/lib/src/implementation/** (A2's resolver must not live in an
