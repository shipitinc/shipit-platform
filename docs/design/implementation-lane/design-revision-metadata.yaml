implementation_units:
  A1:
    name: "durable workspace creation"
    changes_lifecycle: false
    owns:
      - "apps/server/lib/src/baseline/**"
      - "apps/server/lib/src/credentials/**"
      - "docker/**"
      - "conditionally per OD-8: packages/platform_contracts/lib/src/types/workspace_descriptor.dart, schemas/workspace_descriptor.schema.json, schemas/onboarding_record.schema.json"
    does_not_own:
      - "apps/server/lib/src/persistence/** — provisionally, because the store already round-trips all three columns (brief section 6.9); re-scoped through review if implementation finds a gap, not taken silently"
      - "apps/server/lib/server.dart — see condition C-1"
    condition_c2: >
      A1's runtime MUST be constructible without apps/server/lib/server.dart -- a
      resolve(...)-shaped factory taking its dependencies as parameters, modelled on
      BaselineProductionRuntime (baseline_runtime.dart:62-134) and integration-tested the way
      that one is (baseline_dispatch_integration_test.dart:57, :749).
  A2:
    name: "implementation scheduler"
    changes_lifecycle: true
    owns:
      - "packages/scheduler/**"
      - "packages/workflow_engine/**"
      - "packages/workflow_store/**"
      - "packages/platform_contracts/lib/src/enums/workflow_state.dart"
      - "apps/server/lib/src/implementation/**"
      - "apps/server/lib/server.dart  (EXCLUSIVELY -- condition C-1)"
    runtime_depends_on: "A1's OnboardingRecord write. Data dependency only: readOnboardingForProduct already exists, so A2 compiles and passes its own tests without A1's code existing."
  neither:
    - "apps/control_plane/** — READ-ONLY for both units; gap recorded in section 8.5 and in the approval request."
  concurrency_verdict: >
    GENUINELY CONCURRENT-SAFE, subject to C-1 (apps/server/lib/server.dart assigned exclusively
    to A2, which adds A1's wiring lines after A1's factory exists) and C-2 (A1's runtime is
    constructible without server.dart). Concurrent code authoring and concurrent independent
    review: YES. Concurrent DISPATCH without a durable workspace: NO and must not happen --
    the readiness probe defers instead (section 7.7), which is runtime ordering, not a build
    constraint. The one shared file is serialized, at a cost of roughly two call lines.
    As dispatched, before C-1, the answer was NO: the named composition file
    apps/server/lib/src/scheduler.dart does not exist, and both units must write
    apps/server/lib/server.dart.

human_decisions_requested:
  - id: "OD-3"
    question: >
      Which of the five routes into designNotRequired mean "re-do the work" rather than
      "re-classify"? Recommended: (engineeringReview, rework) and (qaRework, reject) stay in
      triage; (qaWaiver, reject), (humanQaApproval, reject) and (escalation, approve) go to
      implementationReady. Only the first of the retargeted pairs and (humanQaApproval,
      reject) need escalationTargetFor lockstep.
    resolved: false
    blocks: "A2's routing edits only"
  - id: "OD-4"
    question: >
      How does the implementation lane express "deferred, not blocked"? null from
      WorkloadResolver currently means exactly blockedArtifactMissing. Recommended: widen the
      typedef to a sealed WorkloadResolution {resolved, deferred, blocked}; a per-definition
      flag is acceptable; folding into the existing deferred channel is rejected.
    resolved: false
    blocks: "A2's composition only"
  - id: "OD-5"
    question: >
      Must the implementation lane provision a QA contract before dispatching, or refuse to
      dispatch items without one? An item with qaContractId IS NULL is refused on
      agentExecuting -> agentCompleted for ever with nothing repairing it, and
      createFeatureWorkItem produces items with no contract at all. The dependency nobody
      should discover late: a qa_architect lane must exist to produce one.
    resolved: false
    blocks: "A2's dispatch behaviour"
  - id: "OD-7"
    question: >
      Where does the durable clone live, how long does it live, and who deletes it? Most
      consequential open question in the revision. Recommended: a Docker named volume for
      compose-managed stacks, a host bind mount as the documented production variant, and a
      reclamation bound tied to the product leaving `governed` for `archived` -- pressed by a
      human, not a sweep.
    resolved: false
    blocks: "A1's compose change and its reclamation path"
  - id: "OD-8"
    question: >
      WorkspaceDescriptor is per-EXECUTION; a durable clone is per-PRODUCT. workerExecutionId,
      workerId and worktreePath are all required -- in the type AND in both JSON Schemas -- and
      none of them has a meaning here. Recommended: an explicit `kind` discriminator with a
      per-kind validation rule. Escalated rather than decided because it changes a published
      schema and a published contract suite, and AGENTS.md section 12 is the section that makes
      a baseline's own claims independently checkable.
    resolved: false
    blocks: "A1's persistence writes"
  - id: "OD-9"
    question: >
      Who reclaims a retained snapshot tree, and when? treeRetainedForArtifact says in bold that
      the caller owns reclaiming it; verified that nothing does. Recommended: do NOT fix it
      here -- file it against the snapshot lifecycle as its own lane with its own bound.
    resolved: false
    blocks: "nothing; recorded because A1 must not inherit it silently"
  - id: "OD-10"
    question: >
      What puts a work item into implementationReady? A state nothing routes into is inert, and
      WorkEntryTrigger currently parks a feature at planned with no consumer runtime -- which an
      implementation lane would be. Recommended: route only from resolved human decisions and
      add no autonomous producer, keeping the first code-writing lane supervised by
      construction.
    resolved: false
    blocks: "whether A2 dispatches anything at all"

