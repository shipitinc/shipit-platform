  - "OD-7 IS ONLY PARTLY ANSWERED. The decision scopes itself to location; OD-7.2 (lifetime bound)
     and OD-7.3 (who presses it) remain OPEN. The decision's own binds field says 'A1's compose
     change is unblocked', and revision 1 said OD-7 blocks 'the compose change AND ITS RECLAMATION
     PATH' -- so the reclamation path is still blocked. Recorded at 6.3.6 and prohibitions 16."
  - "OD-8 = option A (c04f6a8d): a NEW DurableWorkspaceDescriptor type + schema; WorkspaceDescriptor
     and its schema are READ-ONLY for both units; the per-execution consumers stay
     behaviourally byte-identical with no new null branches; no migration. Revision 1 had
