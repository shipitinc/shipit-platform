     lane has needed one; workspace CREATION is a prerequisite of implementation, not a
     derivation from the baseline. Section 2, with the evidence for each clause."
  - "SPLIT the design into exactly two implementation units, A1 (durable workspace
     creation) and A2 (implementation scheduler), and answered whether they are genuinely
     concurrent-safe. Sections 6, 7, 8."
