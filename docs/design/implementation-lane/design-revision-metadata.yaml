     second type, which is the better call and is recorded as a deliberate override. D-20. Two
     obligations the answer implies but does not state are added at 6.2.2: a MANDATORY literal
     discriminator, and a fail-closed (never fallback) read of the wrong kind. D-21, R-10."
  - "The UI mislabel gap is CLOSED. Decision fb3c3485 granted plain_language.dart and
     transition_copy.dart, so section 8.5 becomes an A2 obligation with a test behind it (R-6)
     instead of a gap neither unit could close. DESIGN_SYSTEM_COMPLIANCE moves PARTIAL -> PASS and
     UX_ACCESSIBILITY_SCORE moves PARTIAL -> PASS. D-23."
  - "GRANTED PATHS incorporated: apps/control_plane/lib/core/plain_language.dart,
     apps/control_plane/lib/shared/transition_copy.dart, apps/server/lib/src/implementation/**,
     packages/platform_contracts/lib/src/enums/workflow_state.dart. All four are reflected in the
     section 8.1 path map."
  - "OPEN DECISIONS NOT ANSWERED and not silently closed: OD-3, OD-4, OD-5, OD-9, OD-10, plus
     OD-7.2 and OD-7.3. Section 11 now carries an explicit status table and section 12.3.1 carries
     the per-unit dispatchable-vs-gated partition built from exactly that status."
  - "Prohibitions register renumbered and extended: 15 superseded, 16-23 added (reclamation gate,
     credential obligations, D-7-not-inherited, A2's env-var read, WorkspaceDescriptor read-only,
     descriptor discrimination, no-null-branch-in-the-hot-path, UI mislabel)."

