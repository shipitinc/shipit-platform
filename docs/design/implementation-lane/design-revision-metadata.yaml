risk_rationale: >
  Level 3 -- Major Workflow change. Four independent grounds, each stated so a
  reviewer can disagree with one without discarding the rest. (1) A state is added to
  WorkItemState, the enum every component obeys -- the scheduler's entry sets, the
  coordinator's edges, the workflow store, the control-plane API and the operator UI
  (platform_contracts/lib/src/enums/workflow_state.dart:1-30). (2) The transition table
  every other component must obey gains an edge (work_item_transitions.dart); the
  scheduler asks that table and never reimplements it (runnable_work.dart:152-163).
  (3) Human-decision routes are retargeted across five (type, choice) pairs spanning four
  decision types (human_decision_routing.dart:55-56,59-60,61-62,71-72,79-80) plus a
  transition-guard change (work_item_transitions.dart:256-284), which changes what
  "rework" and "reject" mean to a human resolving a gate. (4) The escalation audit trail
  changes shape, and getting it wrong is SILENT: escalationTargetFor "does not error --
  it silently stops the escalation index advancing" (human_decision_routing.dart:105-109).
  Level 2 was considered and rejected: the change is to the governance model every future
  feature inherits, not to one feature's flow. Level 2 is a defensible alternative
  reading and is invited rather than defended against. Per DESIGN_GOVERNANCE.md:99 this
  requires product/design/architecture approval; the approval request is brief section 12.3.

