# ## QA-stack correction recorded here, because it is the operational half of this decision
#
# The review surfaced a fact that is worth stating precisely, because "no commit ever set it" is easy to
# over-generalise from a single stack to all four:
#
# - `SHIPIT_OPERATOR_MAX_RETRIES: "${SHIPIT_OPERATOR_MAX_RETRIES:-3}"` **was committed** in
#   `docker/compose.yaml`, `docker/compose.e2e.yaml` and `docker/compose.test.yaml` by `d41f2b6`, then
#   lowered to `${SHIPIT_OPERATOR_MAX_RETRIES:-}` (empty) by `8492dcb`, which is an ancestor of `main`.
# - `docker/compose.qa.yaml` is different, and the difference is the finding: **no commit on any ref has
#   ever set that variable in the QA stack.** `git log --all -S 'SHIPIT_OPERATOR_MAX_RETRIES' --
#   docker/compose.qa.yaml` returns nothing. The `:-3` the QA stack was running existed only as an
#   **uncommitted working-tree edit**, which meant the cap the QA environment actually carried was invisible
#   to review and to anyone reading the repository.
#
# That edit has been removed, and `docker/compose.qa.yaml` now carries a comment recording why the variable
# is deliberately absent: QA matches the other three stacks, and operator retry is uncounted. Verified
# independently by commit `611f2cc`, whose message records the same finding from the other side —
# "compose.qa.yaml is untouched — it sets no operator-retry value at any commit".