# human-decision.yaml
decision_id: 1a8d9769-6c6b-49f4-a089-7024ad302e2d
type: ARCHITECTURE
status: RESOLVED
question: >-
  HD-1(a): must a defect require a governed product? createDefect checks only that the product is registered and enqueues for ANY state, including offboarded. ProductState's own text says governed/paused/offboarded restrict what may be dispatched, but nothing enforces it.
context:
  summary: >-
    Escalated by the design of the work-entry trigger
    (docs/engineering/dispatch/tasks/design-work-entry/design-revision.md). Designing the trigger
    surfaced that nothing enforces what ProductState's text already says, and that the designer's
    own preferred option was a worse visible outcome than shipping behaviour. Both were escalated
    rather than settled because they change what operators see and what may be dispatched.
  blocking_work_item:
    item_type: OTHER
    item_id: design-work-entry
    item_ref: Work-entry trigger making defect and feature triage live.
  evidence:
    documents:
      - type: OTHER
        id: design-revision
        url: docs/engineering/dispatch/tasks/design-work-entry/design-revision.md
  recommendation:
    recommended_option: >-
      Leave defects as shipped for (a); accept and park features visibly for (b).
    confidence: MEDIUM
options:
  - option_id: OPTION_A
    label: Leave defects as shipped / refuse features
    description: Defects dispatch for any registered product; features refused until governed.
    risk_level: LOW
  - option_id: OPTION_B
    label: Gate both on governed; park features
    description: >-
      Defects are accepted but not dispatched until governed; features are accepted and held at
      planned with a visible reason until governed.
    risk_level: MEDIUM
resolution:
  outcome: OPTION_B
  decided_by: human-operator
  rationale: >-
    Yes - gate defects on governed too. Accept and record the defect, but enqueue no triage job until the product reaches governed. This makes the governance gate real rather than documentary, and it closes the contradiction where an offboarded product could still dispatch work. It changes shipped working behaviour deliberately.
  follow_up_actions:
    - action: Enforce the ProductState dispatch contract the state text already claims.
      owner: orchestrator-main
    - action: Record the parked-feature reason where an operator can see it, not only in a job row.
      owner: orchestrator-main
created_by: orchestrator-main
created_at: 2026-10-10T00:00:00Z
updated_at: 2026-10-10T00:00:00Z
