    qualitative_tradeoffs:
      - dimension: "Fidelity to the human's stated points 2a/2b"
        option_a: "Option 1 (split identity from registration)"
        option_b: "Option 3 (mint at registration)"
        assessment: >-
          Option 1 satisfies both points as written. Option 3 rejects them as written and needs its
          own explicit human sign-off, so choosing it is a scope change rather than an implementation
          choice.
      - dimension: "Fidelity to human addendum 2 ('the key is still there later')"
        option_a: "Option 1"
        option_b: "Option 2 (decouple credential from product ownership)"
        assessment: >-
          Option 2 preserves addendum 2 most faithfully, because a credential can exist before any
          product does. Option 1 leaves the page early with a visible product that has no usable
          credential, which sits awkwardly with the human's "if when down the road we want to create
          that product".
      - dimension: "Cost to the domain's ownership invariant"
        option_a: "Option 1 — no contract or schema change"
        option_b: "Option 2 — breaks a documented invariant"
        assessment: >-
          Option 2 makes `productId` nullable, which is the field whose stated purpose is to stop a
          known credential id from bypassing the ownership graph. That is a security-relevant
          contract change with a real blast radius, for a workflow convenience.
  recommendation:
    recommended_option: OPTION_A
    rationale: >-
      Option 1 — split identity from registration. It is the only option that satisfies both human
      points as written *and* sits inside the existing `ProductState.registered` semantics without a
      schema or contract change, and it is the only one that makes "the key is still there later"
      literally true through a concrete read path. The trade — a visible half-registered product
      against a stricter reading of addendum 2 — is a product judgement, which is why it is escalated
      rather than decided.
    confidence: MEDIUM
  options:
    - option_id: OPTION_A
      label: "Split identity from registration (1)"
      description: >-
        The key flow creates the `Product` row (state `registered`) plus the `RepositoryReference`
        as an explicit first step; "Register product" then commits credential verification.
      implications: >-
        Satisfies points 2a/2b literally, matches `registered`'s existing meaning, and needs no
        contract or schema change. Cost: leaving the page early leaves a visible product with no
        usable credential, which sits awkwardly with the human's "if when down the road we want to
        create that product".
      estimated_effort: "moderate; domain + client state change"
      risk_level: MEDIUM
    - option_id: OPTION_B
      label: "Decouple credential from ownership (2)"
      description: >-
        Mint against the repository only; `productId` is nullable or pending until the product
        exists.
      implications: >-
        Preserves points 2a/2b and addendum 2 most faithfully — a credential can exist before any
        product. Cost: breaks `RepositoryCredential.productId`'s non-null invariant and its stated
        purpose (scope enforcement so a known credential id cannot bypass the ownership graph).
        A contract and schema change in two packages plus a migration, on a security-relevant field.
      estimated_effort: "largest; migration + generated contract"
      risk_level: HIGH
    - option_id: OPTION_C
      label: "Mint at registration (3)"
      description: >-
        Key generation happens inside the register action; the public key is copyable afterwards.
      implications: >-
        Smallest change to the domain; product creation stays one explicit act; "the key persists"
        still holds. Cost: **rejects human points 2a and 2b as written** — generation would no
        longer happen on SSH URL input, and registration would no longer be gated on the key — so it
        is a scope change requiring explicit human sign-off, not an implementation detail.
      estimated_effort: "smallest"
      risk_level: MEDIUM
resolution:
  selected_option: OPTION_A
  decided_by: "repository owner (interactive structured question UI, session orchestrator-main)"
  decided_at: 2026-10-06T13:05:00Z
  rationale: >-
    **Split identity from registration.** The key flow creates the Product row (state registered) plus the
    RepositoryReference as an explicit first step; "Register product" then commits credential verification.

    This is the only option that satisfies human points 2a and 2b as written, sits inside the existing
    ProductState.registered semantics, and needs no schema or contract change. It also makes the human's
    addendum - "if down the road we want to create that product we'll find the key ready to be verified
    again" - literally true through a concrete read path.

    Because this resolves the cycle in favour of the human's stated requirement, **ADR 0018 :100-102 is
    upheld rather than contradicted**: "a product cannot be registered until a connectivity check has
    succeeded" is now actually satisfiable, because the credential can be minted before the registration act
    completes.

    The known trade, accepted: leaving the page early leaves a visible product with no usable credential.
    That is the cost of honouring 2b literally, and it is a product judgement the human has now made.
  follow_up_actions:
    - action: >-
        Update the state machine so the Product and RepositoryReference rows are created as an explicit first step of the key flow and Register product commits verification. Carry the 'visible half-registered product' consequence into the UI design: the user must be able to tell a product exists but is not yet usable.
      owner: design-agent
    - action: >-
        Re-ground the mobile boards' Unknown-host state on the split - the product row now exists before trust, so the board's step order and copy must reflect that. This couples the two revisions.
      owner: design-agent
    - action: >-
        Verify the chosen option does not weaken the ownership control ADR 0018 A1 relies on: productId stays non-null, and copyWith still cannot change credentialId, publicKey, fingerprint, algorithm or referenceName.
      owner: implementer
