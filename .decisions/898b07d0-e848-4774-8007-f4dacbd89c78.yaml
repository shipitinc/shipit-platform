decision_id: 898b07d0-e848-4774-8007-f4dacbd89c78
type: ARCHITECTURE
status: RESOLVED
question: >-
  ADR 0018 :100-102 records as settled architecture that "a product cannot be registered until a
  connectivity check has succeeded" — human point 2b. That is unsatisfiable against the current engine,
  because minting a credential requires the Product and RepositoryReference rows that registration
  itself creates. Which resolves it: split identity from registration, decouple the credential from
  product ownership, or mint at registration (an explicit divergence from ADR 0018)?
# REFRAMED 2026-10-06 after DESIGN_REVIEW_APPROVED on Design Revision 2. Severity raised: the conflict
# is ADR-vs-domain, not preference-vs-requirement. Line numbers corrected (engine:52->:54,
# product_state.dart:29-32->:24-27). Revision 2 § R.19.2 adds that option 2 also weakens a control ADR
# 0018 A1 now relies on.
context:
  summary: >-
    **This decision was not asked for by the human and was not in the dispatch brief. The design
    lane found it while reading the engine and escalated it rather than choosing.** It is recorded
    here because it is provable, it blocks the feature, and every resolution changes either the
    human's stated requirement or the domain's ownership model.

    The cycle, verbatim from the domain:

    ```
    createProduct(...)                 engine:43-63   -> state: ProductState.registered
    addRepositoryReference(...)        engine:150-174 -> requires the product to exist
    recordGeneratedCredential(...)     engine:912-967 -> readRepositoryReference + _ensureOwned
                                                          => REQUIRES the repository AND product
    confirmHostKey(...)                engine:974-1013
    recordCredentialCheck(...)         engine:1020-1054
    ```

    `recordGeneratedCredential` cannot run before the product and repository exist
    (`engine:924-925`). So if "Register product" is the act that creates the product, and it is
    gated on a credential that requires the product, **the gate is unsatisfiable** — the same class
    of defect as the `canRegister == false` constant the human originally reported, arriving by a
    different route.

    There is no pre-registration `ProductState` to hide in: `createProduct` hardcodes
    `ProductState.registered` (`engine:54`), and `registered` is already defined as *"no baseline,
    no governance, no work … a product is visible here before anything about it has been approved"*
    (`product_state.dart:24-27`) — which is precisely the semantic option 1 relies on.

    **This is an ADR contradiction, not only a design-level circularity.** Independently verified at
    Gate D3: **ADR 0018 exists** — `docs/adr/0018-per-product-git-credentials.md`, status "Proposed
    (amended — A1)" — and `:100-102` already settles human point 2b as architecture: *"Access is
    proven, not assumed. A product cannot be registered until a connectivity check has succeeded
    against the real host with the real key."* So the ordering the human asked for is **already
    recorded architecture**, and it is **unsatisfiable against the current engine**. That raises the
    stakes on this decision well above "which of three options": the ADR must either be amended or
    Option 3 accepted as an explicit divergence from it.

    **What is NOT open regardless of the answer:** the endpoint shapes, the `hostUnrecognised` trust
    state machine, the "Check access" semantics and the structural kill of the silent-key-rotation
    defect. All three options implement them identically; only the trigger moves.
