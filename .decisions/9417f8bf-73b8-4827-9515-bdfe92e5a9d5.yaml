    qualitative_tradeoffs:
      - dimension: "Where the guarantee lives"
        option_a: "SHIP IT holds a reference and asks a manager for the bytes (A3)"
        option_b: "SHIP IT holds or writes the bytes itself (A1/A2/A4)"
        assessment: >-
          A3 is literally the existing contract — SHIP IT never touches key bytes — so
          `referenceName` needs no reinterpretation at all. The cost is a runtime dependency whose
          unavailability lands directly on the fail-open/fail-closed question in
          `7b1bc8b7-6cd1-4ddc-a94f-366de2bed38a`.
      - dimension: "Insider/backup exposure"
        option_a: "A3 (manager-held) or A2 (encrypted, KEK outside the DB)"
        option_b: "A1 (plaintext file)"
        assessment: >-
          A1 yields the key in cleartext from a stolen volume, a backup, or a `docker cp`. On a
          single local machine that may be an acceptable trade for having no new dependency; it is
          not acceptable if the store ever moves off that machine.
      - dimension: "Blast radius of a mistake"
        option_a: "A2/A3 — a mistake in one component"
        option_b: "A1 — a mistake in filesystem permissions exposes the whole key store"
        assessment: >-
          A2 also concentrates risk in the KEK, which becomes the single most valuable secret in the
          system and needs its own rotation story.
  recommendation:
    recommended_option: OPTION_C
    rationale: >-
      **Confidence LOW — nothing about any option was runtime-verified.** Design Revision 2 collapsed
      Q1 to Q1' because ADR 0018 already decides it: the ADR names the local secret store (macOS
      Keychain or ~/.config/shipit/platform/ chmod 600), which is A1+A4, and forbids persisting to the
      durable record, which rules out A2. So the real question is narrower than it looked — does
      b869ec24's server-side move SUPERSEDE that clause?

      If it does: **A3** (external secret manager) is the design's argument, because it is the only
      option under which SHIP IT never holds key bytes at all, so "referenced by name, never by value"
      survives verbatim and the reference is the thing custody points at. **This is the design's
      argument, not a neutral menu position** — Revision 2 § R.4 A3 calls it "the natural consequence of
      Q1'-negative rather than a competing choice", and § R.8 prefers it under *either* answer. A1/A4
      remain live if the target topology cannot reach a secret manager. A2 remains forbidden by the ADR.

      If it does not, ADR 0018 stands as written and this question closes with A1/A4 already decided.

      A2 is NOT recommended and is listed only so the human can see why it is excluded.
    confidence: LOW
  options:
    - option_id: OPTION_A
      label: "Filesystem 0600 (A1)"
      description: >-
        Private half written under a dedicated directory outside the work tree, owned by the
        service user, mode 0600, on a volume not shared with application code.
      implications: >-
        No new dependency; works in the current Compose topology; trivially inspectable when a
        registration is stuck. But protection is entirely the host filesystem's: a stolen volume,
        a backup or a `docker cp` yields the key in cleartext, and permissions do not defend
        against a same-uid process — which is the git transport.
      estimated_effort: "smallest; no migration"
      risk_level: HIGH
    - option_id: OPTION_B
      label: "Envelope-encrypted table (A2) — FORBIDDEN by ADR 0018"
      description: >-
        Private half sealed with a key-encryption key held outside the database; ciphertext stored
        in its own table, not on `product_credential`. `referenceName` becomes an opaque row reference.
      implications: >-
        **CONTRADICTS THE GOVERNING ADR.** ADR 0018 :87-88 states the private half is "never ...
        persisted to the durable record"; storing sealed ciphertext in a table IS the durable record, so
        choosing A2 means approving a violation of ADR 0018 and amending or superseding it. Beyond that:
        costs a migration and a second persistence path; makes the KEK the most valuable secret in the
        system; and turns any SQL injection elsewhere in the server into a key disclosure rather than a
        data leak. Its former comfort-claim — "a backup alone no longer discloses the key" — is FALSE in
        this repository, because the live database is reachable on 0.0.0.0:5432 with a committed default
        password, so an attacker reads the sealed rows directly and never needs a backup.
      estimated_effort: "largest; migration + KEK lifecycle + an ADR amendment"
      risk_level: HIGH
    - option_id: OPTION_C
      label: "External secret manager (A3)"
      description: >-
        SHIP IT never writes key bytes; it writes a reference and asks the manager for the material
        at transport time. `referenceName` is a secret path or ARN.
      implications: >-
        Strongest separation, and it is literally the existing contract, so `referenceName` needs no
        reinterpretation. Rotation and revocation become manager features. Costs a runtime
        dependency that can be unavailable — which feeds the fail-open/fail-closed decision — and on
        a single local machine may be more machinery than the problem warrants. Makes the reference
        itself the most sensitive variant (an ARN discloses vault topology).
      estimated_effort: "moderate; dependency + reachability"
      risk_level: MEDIUM
    - option_id: OPTION_D
      label: "Host keychain (A4)"
      description: >-
        Private half stored in the host's keychain or a TPM-backed store and read by handle at
        transport time.
      implications: >-
        Strongest at-rest property of the four, hardware-bound, with per-item ACLs. **Feasibility is
        unverified**: SHIP IT runs as a container while the keychain is the host's, and CI or
        another machine would have a different store. Choosing it makes the "local only" scope in
        decision `570bb640` load-bearing for correctness, not merely for security posture.
      estimated_effort: "moderate, but reachability unknown"
      risk_level: HIGH
resolution:
  selected_option: OPTION_C
  decided_by: "repository owner (interactive structured question UI, session orchestrator-main)"
  decided_at: 2026-10-06T13:05:00Z
  rationale: >-
    The human chose to SUPERSEDE ADR 0018 :85-88's local-secret-store clause and adopt **A3, an external
    secret manager** - SHIP IT never holds key bytes, only a reference, and asks the manager for the
    material at push time.

    This settles the decision the human explicitly reserved at the start of the session ("I have NOT
    approved the at-rest protection model ... do not default it"), and it was reached only after the
    design was re-framed against the ADR, which had already chosen A1+A4 and forbidden A2. Three
    consequences follow and are binding:

    (1) **ADR 0018 :85-88 is SUPERSEDED** and must be amended by a follow-up, not silently ignored.
    (2) **A2 is permanently excluded** - the ADR's "never persisted to the durable record" still binds it.
    (3) **A3 makes the reference the most sensitive artifact SHIP IT holds**, because an ARN or secret path
        discloses vault topology. That is gap G-7: RepositoryCredentialView currently exposes referenceName
        to clients. Removing it is now REQUIRED rather than optional, and is a generated-contract change
        in two packages.
  follow_up_actions:
    - action: >-
        Amend ADR 0018 to record the supersession: replace the local-secret-store clause at :85-88 with the external-secret-manager substrate, and keep A1/A4 as the documented fallback when no manager is reachable in the target topology.
      owner: human (ADR owner)
    - action: >-
        Remove referenceName from RepositoryCredentialView, or replace it with a non-identifying handle. Under A3 the reference IS the sensitive artifact; G-7 was optional while the substrate was undecided and is now required.
      owner: design-agent
    - action: >-
        Design the A3 unavailability path with concrete remediation copy, per the fail-closed answer in 7b1bc8b7. Under A3 the substrate is a runtime dependency that can be down, so this is a common case, not an edge case.
      owner: design-agent
    - action: >-
        Probe A3's reachability in the target topology before implementation is called complete. The design records confidence LOW and states that no option was runtime-verified.
      owner: implementer
