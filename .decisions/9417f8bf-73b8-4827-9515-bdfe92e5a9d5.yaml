decision_id: 9417f8bf-73b8-4827-9515-bdfe92e5a9d5
type: SECURITY
status: PENDING
question: >-
  Does b869ec24's server-side custody SUPERSEDE ADR 0018 :85-88's local-secret-store clause — and if
  so, what becomes of "never persisted to the durable record" and of the reference reaching the client?
# REISSUED 2026-10-06 after DESIGN_REVIEW_APPROVED on Design Revision 2. Reissue required by
# tasks/design-review-addproduct-keyservice/report-revision-2.md: the previous question asked the human
# to choose a substrate the governing ADR had ALREADY chosen (A1+A4) and offered A2, which the ADR
# forbids outright. The previous recommendation also endorsed that forbidden option and repeated a
# comfort-claim the design withdrew. Both are corrected below.
context:
  summary: >-
    This is the decision the human explicitly reserved. Verbatim, at the start of this session:
    *"I have NOT approved the at-rest protection model for the server-stored private half.
    Surface it as a decision at Gate D4; do not default it."*

    Decision `b869ec24` (ARCHITECTURE, RESOLVED, OPTION_A) settled that deploy-key pairs are
    generated and stored **server-side**, behind an API returning only the public half, because
    SHIP IT pushes from its own backend and never from the browser. That settled *where*; it did
    not settle *how the private half is protected at rest*. The design lane therefore produced the
    options and deliberately defaulted none of them.

    **What makes this consequential now.** This is the first time SHIP IT will hold a private key
    authorising **write** access to a customer repository. No such secret exists today. A leaked
    key cannot be recalled from SHIP IT's side — it must be uninstalled at the host. The existing
    domain contract is unusually well built for this: `RepositoryCredential` carries **no** key
    material, `referenceName` names the private half rather than holding it, and `CredentialStatus`
    documents "access is proven, never assumed". Whichever substrate is chosen determines whether
    that property survives.

    **SUPERSEDED-IN-PART 2026-10-06 — READ BEFORE PRESENTING.** The Independent Design Review
    (Gate D3, `docs/engineering/dispatch/tasks/design-review-addproduct-keyservice/report.md`,
    blocker B1) established that **ADR 0018 exists and already decides much of this question**:
    `docs/adr/0018-per-product-git-credentials.md`, status "Proposed (amended — A1)". The Manager had
    asserted the ADR was absent because it looked in `docs/engineering/adr/` (which holds only the
    three framework-distribution ADRs) instead of `docs/adr/` (21 ADRs, 0001–0021). That assertion was
    false and was repeated into this object; it is corrected here.

    ADR 0018 `:85-88` already specifies: "One `ed25519` keypair per repository, generated by ShipIt on
    the operator's device. The private half is written to the local secret store (macOS Keychain or
    `~/.config/shipit/platform/` chmod 600) and is **never displayed, logged, persisted to the durable
    record, or transmitted**."

    Three consequences for this decision:

    1. **The ADR already chose A1 + A4** (filesystem `0600`, or the OS keychain). Those are not open
       substrate choices; they are the recorded architecture.
    2. **The ADR forbids A2 outright** — envelope-encrypted ciphertext stored in a table *is*
       "persisted to the durable record". A2 as written below therefore contradicts the governing
       ADR and cannot be offered without saying so.
    3. The genuinely open delta is much smaller than the four options suggest: whether `b869ec24`'s
       server-side move *supersedes* the ADR's local-secret-store clause (a supersession question),
       and if so what becomes of "never persisted to the durable record".

    **This object must be reissued against ADR 0018 before it is presented.** Answering it on the
    current evidence would ask the human to choose between options the ADR has already ruled on.
