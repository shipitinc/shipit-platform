# human-decision.yaml
decision_id: f691aeb5-caa9-4019-942f-5fb9a5e6cdd1
type: SECURITY
status: RESOLVED
question: >-
  The production server image runs in development mode, and production applies migrations but no
  schema bootstrap — so production currently boots without the partial unique index that
  enforces one active credential per repository, and would fail to boot entirely if anyone
  applied the bootstrap. How is production handled?
context:
  summary: >-
    Raised as promotion blocker B-1 by the startup design agent, then verified independently by
    the Manager end to end from source. This is not a QA concern: it is a production data-integrity
    invariant, and it is currently unenforced rather than merely at risk.

    The chain, each link verified:

      1. `.github/workflows/release.yaml:18-26` builds the production server image with
         `cd docker` then `docker build -f Dockerfile.server ../apps/server`. The `-f` path
         resolves against the CWD, so the production Dockerfile is **`docker/Dockerfile.server`**.
      2. `docker/Dockerfile.server:53` — `CMD ["dart", "bin/main.dart", "--apply-migrations"]`.
         **No `--mode` argument.** (`apps/server/Dockerfile` sets `--mode=$runmode`, but it is on
         no build path and is not what release builds.)
      3. `infrastructure/modules/cloudrun/main.tf:60-90` — the server container sets **no `args`,
         no `command`**, and an env block containing only `SERVERPOD_DATABASE_HOST`, `_NAME`,
         `_USER` and `_PASSWORD`. **`SERVERPOD_RUN_MODE` appears nowhere in any config, workflow,
         Dockerfile or Terraform file** — the only two hits repo-wide are inside `.dart_tool`
         build caches.
      4. With no `--mode`, Serverpod's config is null (3-argument constructor), so
         `serverpod.dart:967` returns `development`.
      5. In `development`, the analyzer is fatal: `serverpod.dart:894`.

    The consequence is a fork, and BOTH branches are bad:

      - Production applies `--apply-migrations` but never the bootstrap, so the six hand-maintained
        objects are absent. The analyzer is one-directional (it iterates live objects and looks
        them up in the model), so objects missing from BOTH sides are never reported. **The analyzer
        passes. Production boots unenforced** — with no partial unique index enforcing one active
        credential per repository, which is the invariant that decision 898b07d0 and ADR 0018 A1
        exist to protect.
      - If anyone ever applied the bootstrap to production, the live database would then carry
        indexes the model does not declare. `liveTable.like(target)` reports `Missing Index`, the
        analyzer returns false, and **production fails to boot**. So the one action that would fix
        the gap is the one action that breaks the service.

    Nothing in this repository currently detects either state. CI's integration job uses a fresh
    database and the bootstrap, so it never reproduces production's combination.

    Note the interaction with the work in progress: the QA fix (a bootstrap compose service plus a
    non-fatal run mode) does NOT reach production. Production needs its own answer, and the design
    deliberately keeps the production artifact byte-identical by putting the run-mode override in
    compose rather than the Dockerfile — which means production's run mode remains whatever its CMD
    says, which is nothing.
