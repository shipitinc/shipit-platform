    qualitative_tradeoffs:
      - dimension: Which gap is worse
        option_a: Fix the enforcement gap
        option_b: Fix the boot gap first
        assessment: >-
          Today the enforced gap is the live one: production accepts a second active credential
          for a repository because the index that prevents it is absent. The boot failure is
          latent and only triggers once someone applies the bootstrap. Fixing enforcement without
          fixing boot would take production from unenforced to unable-to-start.
      - dimension: Run mode as the lever
        option_a: Set an explicit production run mode
        option_b: Leave production in development
        assessment: >-
          An explicit non-development run mode makes the analyzer non-fatal, which is what lets
          production apply the bootstrap and boot. It also stops development conveniences in
          production that were never intended there. Leaving it alone preserves the unenforced
          state and the latent boot failure together.
      - dimension: Sequencing against QA
        option_a: Fix production now
        option_b: Land QA first, production after
        assessment: >-
          Landing QA first is smaller and already designed, but it does not touch production, and
          the production gap is a live data-integrity defect rather than a planned-work item. The
          two can proceed in parallel because they touch different artifacts — the QA run-mode
          override lives in compose, production's would live in the Terraform or the image CMD.
  recommendation:
    recommended_option: OPTION_A
    rationale: >-
      Fix both production gaps together: give production an explicit non-development run mode AND
      apply the bootstrap there. Either alone leaves a defect — enforcement without a run-mode fix
      takes production from unenforced to unbootable, and a run-mode fix without the bootstrap
      leaves the invariant unenforced. The pair is the smallest configuration in which production
      is both correct and startable, and it is the configuration the QA work converges on anyway,
      so the two agree rather than diverge.

    This is a production change and therefore human authority, not an implementation detail. It is
    filed as SECURITY because the unenforced state permits a data-integrity violation that
    decisions 898b07d0 and ADR 0018 A1 exist to prevent.
    confidence: MEDIUM
options:
  - option_id: OPTION_A
    label: Fix both — run mode and bootstrap in production
    description: >-
      Give the production service an explicit non-development run mode and apply the schema
      bootstrap on its migration path, so the one-active-credential-per-repository index exists and
      the service still starts.
    implications: >-
      Closes a live data-integrity gap and removes the latent boot failure together. Touches the
      production artifact or Terraform, so it needs its own design, review and human promotion
      authorisation, and cannot ride along with the QA work.
    estimated_effort: "production design plus review plus promotion authorisation"
    risk_level: MEDIUM
  - option_id: OPTION_B
    label: Set the run mode only, defer the bootstrap
    description: >-
      Make the production analyzer non-fatal now and apply the bootstrap in a later step.
    implications: >-
      Removes the latent boot failure so the bootstrap becomes safe to apply later, but leaves
      production unenforced in the meantime — the invariant stays unprotected across the gap.
    estimated_effort: "Terraform or image CMD change plus review"
    risk_level: LOW
  - option_id: OPTION_C
    label: Apply the bootstrap only
    description: >-
      Add the bootstrap to the production migration path and leave the run mode alone.
    implications: >-
      Closes the data-integrity gap but, on the verified chain, production would then fail its
      analyzer check in development mode and be unable to start. Not recommended as a standalone.
    estimated_effort: "migration path change plus review"
    risk_level: HIGH
  - option_id: OPTION_D
    label: Record and defer past this work item
    description: >-
      File production's run mode and bootstrap as tracked follow-up and do not change production
      in this work item.
    implications: >-
      Keeps production untouched and out of the QA change's blast radius. Leaves the
      one-active-credential-per-repository invariant unenforced and the boot failure latent, with
      no detection in this repository for either.
    estimated_effort: "ledger entry only"
    risk_level: HIGH
resolution:
  selected_option: OPTION_D
  decided_by: "repository owner (interactive structured question UI, session orchestrator-main)"
  decided_at: 2026-10-08T06:22:00Z
  rationale: >-
    Record and defer past this work item. Production is not to be changed as part of the Add Product
    work. The human chose to keep production out of this item's blast radius, which is a
    deliberate scope judgement: the QA fix is already designed, independently reviewed once, and
    touching the production artifact or Terraform alongside it would widen the change precisely
    where the framework reserves human authority.

    **What is accepted by this deferral, stated plainly so it is not softened by the passage of
    time:**

      - Production continues to boot **unenforced**. The partial unique index enforcing one active
        credential per repository does not exist in production, so a second active credential for
        one repository is currently accepted. That is the invariant `898b07d0` and ADR 0018 A1
        exist to protect, and it is unenforced rather than merely at risk.
      - The latent boot failure remains. If anyone applies the bootstrap to production — a natural
        thing for an engineer to try, since it is the documented fix — production will fail its
        analyzer check in development mode and **will not start**.
      - **Nothing in this repository detects either state.** CI's integration job uses a fresh
        database with the bootstrap, which is the one combination production does not have. There
        is no check that would notice production drifting unenforced, or that would notice the day
        someone applies the bootstrap and takes the service down.

    Because no detection exists, this deferral is only safe if the record is durable and prominent.
    A gap nobody can detect is not mitigated by being written down in a decision file that no one
    reads; it is mitigated by being a first-class tracked item with a named owner and a trigger
    condition. That is what the follow-up actions below establish.
  follow_up_actions:
    - action: >-
        Record this as a first-class tracked item in docs/engineering/WORK_STATE.md and
        docs/engineering/dispatch/LANES.md with a named owner and the verified evidence chain, not as
        a passing mention in a decision file. Nothing detects this gap, so the record is the only
        mitigation the deferral has.
      owner: engineering-manager
    - action: >-
        Attach an explicit warning to docs/deployment/local-qa.md and the production deployment
        documentation: DO NOT apply the schema bootstrap to production while its run mode remains
        unset. Doing so takes the service down. This is the one action most likely to be attempted
        by someone who believes they are fixing the gap.
      owner: engineering-manager
    - action: >-
        Revisit at the next production promotion, as a precondition rather than a follow-up. The
        Add Product work item must not be promoted to production with the one-active-credential-
        per-repository invariant unenforced unless the human re-authorises that explicitly.
      owner: engineering-manager
    - action: >-
        Re-open this decision if production has already been deployed and is carrying a second
        active credential for any repository, since the unenforced index means the database may
        already violate the invariant and no query in this repository checks for it.
      owner: engineering-manager
