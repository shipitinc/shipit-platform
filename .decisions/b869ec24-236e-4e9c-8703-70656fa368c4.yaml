    quantitative_data:
      - metric: Server-side git execution
        value: "present - onboarding_worker.dart, product_registry_engine.dart, control_plane_service.dart all reference clone/push"
        source: source inspection
      - metric: Browser-side git credentials
        value: "none - the Flutter client is a control-plane client only"
        source: source inspection
      - metric: Existing deploy-key infrastructure
        value: "0 - grep for deployKey/deploy_key across apps/server/lib and packages/*/lib returns nothing"
        source: source inspection
      - metric: Current mock key
        value: "_generateMockKeyPair, add_product_page.dart:126-138 - 'ssh-ed25519 <base64 of 32 random bytes>'"
        source: source inspection
      - metric: Trust-flow escape hatch
        value: "not required - the Products page is always reachable, and the generated key persists on the machine so a product can be created later"
        source: human decision
    qualitative_tradeoffs:
      - dimension: Where the private half lives
        option_a: Server-side, never returned to the browser
        option_b: Browser-side storage
        assessment: >-
          Server-side removes the browser-storage exposure entirely and matches how the
          product actually pushes. It introduces server-side secret storage, which is its own
          decision - at-rest encryption, filesystem permissions, and whether the host keychain
          is available. That storage decision is real and must be designed, not defaulted.
      - dimension: Blast radius of the change
        option_a: Server-side key service
        option_b: Browser-side key generation
        assessment: >-
          Server-side widens the change to apps/server and adds an API surface. Browser-side
          keeps the change local to the UI but ships private key material to a web client,
          which the boards explicitly claim does not happen.
  recommendation:
    recommended_option: OPTION_A
    rationale: >-
      Generate and store the keypair server-side behind an API that returns only the public
      half. It matches how SHIP IT actually pushes, removes the browser-storage exposure the
      Manager flagged, and makes the boards' keychain claim closer to true rather than
      aspirational.
    confidence: HIGH
options:
  - option_id: OPTION_A
    label: Server-side key service
    description: >-
      New server capability generates the keypair, stores the private half server-side, and
      exposes only the public key to the control plane. The browser never receives private key
      material. The design must specify at-rest protection and host permissions for the
      stored private half.
    implications: >-
      Removes the browser-storage exposure and matches the real git topology. Widens the change
      to apps/server and adds an API surface. Introduces a server-side secret-storage decision
      that must be made explicitly.
    estimated_effort: "larger than a UI-only change"
    risk_level: MEDIUM
  - option_id: OPTION_B
    label: Browser-side key generation
    description: >-
      Keep key generation in the Flutter client and store the private half in browser storage.
    implications: >-
      Keeps the change inside apps/control_plane. Ships private key material to a web client,
      contradicting the boards' stated guarantee, and is the exposure the human just declined.
    estimated_effort: "smaller"
    risk_level: HIGH
resolution:
  selected_option: OPTION_A
  decided_by: "repository owner (interactive structured question UI, session orchestrator-main)"
  decided_at: 2026-10-06T08:57:01Z
  rationale: >-
    The human's words: "We should have an API for private-key creation and storage. B/c we
    won't be git pushing in SHIP IT from the web browser from it's backend correct. This
    should settle your issue there." Recorded as OPTION_A.

    Second point, also recorded here: removing "Cancel" from the trust flow does NOT leave the
    user stuck. The Products page remains reachable, and the generated key persists on the
    machine, so if the product is wanted later it can be created and the key re-verified. That
    closes the dead-end objection raised against point 2d of the human's original request — no
    escape hatch is needed on the trust screen itself.
  follow_up_actions:
    - action: >-
        Design the server-side deploy-key service: keypair generation, private-half storage and
        its at-rest protection, and an endpoint that returns only the public half. Specify
        permissions and what happens when the server cannot protect the key adequately.
      owner: orchestrator-main
    - action: >-
        Widen the work item's OWNED_PATHS to include apps/server/** and any new package, and
        state the widened scope explicitly in the Design Brief so the human sees that this is no
        longer a control-plane-only change.
      owner: orchestrator-main
    - action: >-
        Correct the boards' copy if needed: "the private half stays in the keychain" should
        describe what actually happens on the server, not imply browser storage.
      owner: orchestrator-main
    - action: >-
        Record that no escape hatch is required on the trust screen; the Products page is the
        way out and the key persists for later verification.
      owner: orchestrator-main
