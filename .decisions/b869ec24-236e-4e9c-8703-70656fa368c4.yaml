# human-decision.yaml
decision_id: b869ec24-236e-4e9c-8703-70656fa368c4
type: ARCHITECTURE
status: RESOLVED
question: >-
  Where does deploy-key generation and storage belong, given that SHIP IT pushes from
  its backend and not from the web browser?
context:
  summary: >-
    Decision 73097d48 chose REAL deploy-key generation over the existing mock, and its
    follow-up actions flagged one concern: the Penpot boards assert "ed25519 · created on
    this device · the private half stays in the keychain", which a Flutter **web** build
    cannot literally honour. The Manager raised that a private key reaching browser storage
    is a material weakening of the guarantee the design claims.

    The human resolved it architecturally rather than accepting the weakening: there should
    be an API for private-key creation and storage, because SHIP IT pushes from its own
    backend, not from the browser.

    **Verified true by the Manager.** The server already performs the git work —
    `packages/worker_runtime/lib/src/worker/onboarding_worker.dart`,
    `packages/product_registry/lib/src/engine/product_registry_engine.dart` and
    `apps/server/lib/src/services/control_plane_service.dart` reference clone/push. The
    browser is only ever a control-plane client; it never holds git credentials. And there
    is currently **no** deploy-key infrastructure anywhere on the server — `grep` for
    `deployKey`/`deploy_key` across `apps/server/lib` and `packages/*/lib` returns nothing,
    and the only `ssh` references are incidental type/enum names. So this is net-new
    server-side capability, not an existing thing to extend.

    This **changes the shape of the work**: it is no longer a control-plane-only UI change.
    It requires a new server capability (keypair creation + storage + retrieval of the public
    half), which widens OWNED_PATHS from `apps/control_plane/lib/**` to include
    `apps/server/**` and possibly a package.
  blocking_work_item:
    item_type: DESIGN_REVISION
    item_id: 73097d48-3e8b-48d7-b3d8-8834168c5113
    item_ref: "Add Product rebuild — real deploy-key lifecycle"
  evidence:
    documents:
      - type: OTHER
        id: 73097d48
