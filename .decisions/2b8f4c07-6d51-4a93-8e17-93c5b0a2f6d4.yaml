# human-decision.yaml
decision_id: 2b8f4c07-6d51-4a93-8e17-93c5b0a2f6d4
type: ARCHITECTURE
status: RESOLVED
question: >-
  (HD-2) Where does an operator's identity and reason durably live when they act on a failed work
  item? Transitions currently write `reason = transition.rejectionReason = NULL`, so a retry would
  leave no record of who spent credits or why. Is an `idempotencyKey` string prefix acceptable as
  dispatch authorization?
context:
  summary: >-
    Raised during live QA remediation while designing the operator action panel. The design agent
    verified against source that accepted transitions persist no reason and that `context` is not
    persisted, so no request-side transition outside decision resolution can durably record WHO
    acted or WHY. `resolveDecision` already sets a precedent: the engine acts as orchestrator and
    the human is recorded as data elsewhere.
  blocking_work_item:
    item_type: OTHER
    item_id: design-failed-work-retry
    item_ref: Durable audit of operator-initiated retries.
  evidence:
    documents:
      - type: DESIGN
        id: design-brief-failed-work-retry
        url: docs/engineering/dispatch/tasks/design-failed-work-retry/design-brief.md
    measurements:
      - "durable_workflow_engine.dart:156 — accepted transitions write reason = transition.rejectionReason (NULL on every accepted live row)"
      - "work_item_transition.reason is NOT NULL column but is never populated on accepted transitions"
  options_considered:
    - option: AUDIT_TABLE_SAME_TX
      description: A dedicated operator_action row written inside DurableWorkflowEngine's existing transaction.
    - option: IDEMPOTENCY_KEY_PREFIX
      description: Encode operator and reason in the idempotency key; atomic and greppable, no migration.
    - option: WORK_ITEM_COLUMNS
      description: Add actor/reason columns to work_item; overwrites rather than keeping retry history.
resolution:
  outcome: AUDIT_TABLE_SAME_TX
  decided_by: human-operator
  rationale: >-
    Authorization-by-string-convention is not authorization. Encoding dispatch authority in an
    `idempotencyKey` prefix means permission is a predicate matching a naming convention that any
    future caller could satisfy by formatting a string correctly; it is greppable but not
    enforced. Adding columns to work_item loses history — repeated retries overwrite the previous
    actor, which defeats the purpose of an audit trail for a spend-arming action.
    A dedicated audit row written inside the transaction DurableWorkflowEngine already opens is
    atomic with the state change (so the audit and the transition cannot diverge), keeps every
    retry in history, and makes authorization a real recorded fact rather than a convention.
    A migration is a fair price for an action that spends money.
  follow_up_actions:
    - action: >-
        The operator_action write MUST be inside the same transaction as the work-item
        transition, or the audit and the state change can diverge under a crash.
      owner: orchestrator-main
    - action: >-
        Ship an additive `reason` parameter on DurableWorkflowEngine.transition so the operator's
        reason reaches work_item_transition.reason as well as the audit row.
      owner: orchestrator-main
