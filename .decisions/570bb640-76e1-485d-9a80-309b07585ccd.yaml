# human-decision.yaml
decision_id: 570bb640-76e1-485d-9a80-309b07585ccd
type: DEPLOYMENT_AUTHORITY
status: RESOLVED
question: >-
  Given that SHIP IT will run locally only for the foreseeable future, is
  authentication of the control-plane API required now, and what is its disposition?
context:
  summary: >-
    Supersedes the authentication half of decision 048f3367, which resolved as OPTION_C
    ("fix and add authentication"). The human has since determined that SHIP IT will run
    locally only for the foreseeable future, and therefore no API authentication is
    required at this time. The decision is to record the unauthenticated API as an
    ACCEPTED RISK scoped to local/QA use, and to make authentication a BLOCKING
    PRECONDITION for any production deployment. The credential-literal half of 048f3367
    (removal of the three committed passwords) is unaffected and still stands.

    Recorded as a NEW decision rather than an amendment to 048f3367 because
    `docs/engineering/HUMAN_DECISIONS.md` requires the audit trail to be immutable and
    amendments to create a new decision object.

    MATERIAL FINDING the human should be aware of, discovered while verifying the scope of
    "local only": that property is currently NOT enforced by anything in the repository.
    No Docker Compose file pins a host interface. Every binding is an unqualified
    "PORT:PORT" mapping, which Docker publishes on 0.0.0.0 — every interface, including
    the LAN:

      docker/compose.qa.yaml     5432:5432 (postgres)  8080:8080 (server)  8081:8081 (client)
      docker/compose.yaml        5432:5432            8080:8080            8081:8081
      docker/compose.test.yaml   5433:5432            8082:8080            8083:8081
      apps/server/docker-compose.yaml  8090:5432 (dev)  9090:5432 (test)

    So on any shared network — coffee shop, office, hotel — the unauthenticated API that
    can create and execute jobs and resolve human decisions is reachable by anyone, and
    PostgreSQL on 5432 is reachable with the documented default credentials
    (POSTGRES_USER=shipit, POSTGRES_PASSWORD=shipit, `.env.example:15-18`). The accepted
    risk is therefore real and currently unenforced, not merely theoretical.
  blocking_work_item:
    item_type: DEPLOYMENT
    item_id: c46b6807-a15c-4c3c-911b-cd34f6b21195
    item_ref: >-
      Control-plane API authentication posture; gate on any production deployment
