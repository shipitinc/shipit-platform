        value: "FAIL - 40 files across 8 of 17 packages"
        source: review-baseline-0d5d132
      - metric: "NEW — baseline's own committed verdict"
        value: "RELEASE_CORRECTION_REQUIRED with 3 open non-human blockers + 3 OPEN human gates"
        source: S2_NON_VISUAL_RELEASE_BLOCKER_CLOSURE.md:236-245, :172-181
      - metric: Unpushed commits on main
        value: "3 - 693cfbc, 9d98efe, bfbbd68 (pushing main would publish all three)"
