    qualitative_tradeoffs:
      - dimension: Provenance integrity
        option_a: Land the unreviewed baseline on main now
        option_b: Review the baseline before landing it
        assessment: >-
          Landing first means main permanently carries ~204k lines no human or reviewer
          has read, and weakens the "integrate only reviewed results" invariant.
          Reviewing first costs a large review effort but preserves the invariant
          honestly and may surface latent defects in code that has never been
          independently examined.
      - dimension: Throughput
        option_a: Land the unreviewed baseline on main now
        option_b: Review the baseline before landing it
        assessment: >-
          Landing first immediately unblocks every feature lane, because lane isolation
          requires a citable BASE_SHA. Reviewing first blocks all feature work for the
          duration of a 585-file review.
      - dimension: Reversibility
        option_a: Land the unreviewed baseline on main now
        option_b: Review the baseline before landing it
        assessment: >-
          Landing is a single fast-forward commit, so it is trivially revertable in
          principle. But pushing main also publishes 693cfbc, 9d98efe and bfbbd68, which
          have never been pushed, so the reversal is no longer purely local.
      - dimension: Known latent risk carried either way
        option_a: Land the unreviewed baseline on main now
        option_b: Review the baseline before landing it
        assessment: >-
          Independent of the choice, 0d5d132 activates a migration
          (20260925181113034/migration.sql creating defect and defect_clarification plus
          8 indexes) that has never executed in any environment, and propagates a
          hardcoded Postgres superuser password into a new unreviewed file
          (apps/server/bin/test_pod.dart). Neither is a reason to withhold the baseline,
          but both need tracked follow-up before staging.
  recommendation:
    recommended_option: OPTION_C
    rationale: >-
      SUPERSEDED. The earlier recommendation (OPTION_B — land now, review blocking) rested
      on the integrator's evidence that every deterministic gate was green. The independent
      review of 0d5d132 refuted that premise: the tree does not analyze (10 compile errors,
      CI red on arrival) and its own committed record declares it RELEASE_CORRECTION_REQUIRED.
      Recommendation is now to NOT integrate 0d5d132 in any form until a mechanical correction
      lane clears B1/B2/M2/M3 — which the reviewer states requires no human judgement — after
      which the genuinely human decisions (security credential, ADR 0021, migration validation
      against a real Postgres) must be resolved before any merge.
    confidence: MEDIUM
options:
  - option_id: OPTION_A
    label: Land now, review later
    description: >-
      Fast-forward 0d5d132 onto main immediately and dispatch the baseline review as
      ordinary non-blocking follow-up work alongside feature delivery.
    implications: >-
      Unblocks all feature lanes at once. main carries ~204k unreviewed lines, and the
      review can be deprioritised indefinitely. Pushing main also publishes 693cfbc,
      9d98efe and bfbbd68 for the first time.
    estimated_effort: "minutes to merge; review effort deferred and unbounded"
    risk_level: MEDIUM
  - option_id: OPTION_B
    label: Land now, review blocking
    description: >-
      Fast-forward 0d5d132 onto main and record the independent review of the baseline as
      a BLOCKING follow-up that must complete before any staging or deployment.
    implications: >-
      Unblocks feature lanes immediately while keeping the review non-optional and
      sequenced ahead of staging. The active migration and the committed credential
      become explicit staging blockers.
    estimated_effort: "minutes to merge; baseline review before staging"
    risk_level: LOW
  - option_id: OPTION_C
    label: Review before landing
    description: >-
      Dispatch engineering-reviewer on 0d5d132 and hold the merge until it approves.
    implications: >-
      Preserves the "integrate only independently reviewed results" invariant without
      exception. Blocks every feature lane for the duration of a 585-file review, and the
      review may surface latent defects in never-reviewed code.
    estimated_effort: "large; 585 files / ~204k lines before any feature work"
    risk_level: LOW
  - option_id: OPTION_D
    label: Do not integrate baseline
    description: >-
      Leave main at bfbbd68 and cut future lane worktrees directly from
      baseline/product-2026-10-05, treating that branch rather than main as the anchor.
    implications: >-
      Avoids putting unreviewed code on main, but main stays 3 commits ahead of origin and
      diverges from the branch that actually contains the product, so every future lane,
      review and integrator provenance reference points at a non-default branch.
    estimated_effort: "low now; permanent provenance confusion later"
    risk_level: MEDIUM
