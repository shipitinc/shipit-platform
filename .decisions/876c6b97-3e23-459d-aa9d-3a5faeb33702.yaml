# human-decision.yaml
decision_id: 876c6b97-3e23-459d-aa9d-3a5faeb33702
type: ARCHITECTURE
status: RESOLVED
question: >-
  Is ADR 0018 amendment A2 accepted, with its four knowingly-open gaps accepted alongside it — or does
  A2 wait until those gaps close?
# Created by the Manager, not by the lane that authored the amendment. The amendment lane recorded the
# owner's answer inside its own artifact and flagged (ADR-0018-A2-D6) that no Human Decision object backed
# it, so a sibling design artifact was able to assert an "Accepted by the human" amendment that nothing on
# disk supported. This object is the citable id that closes that gap. See ae1c1f79:8-11 for the precedent
# that a consequential decision should have one.
context:
  summary: >-
    ADR 0018 ("Per-Product Git Credentials") is the recorded architecture for how SHIP IT reaches a
    customer's repository. It was written when the private half lived on **the operator's own machine**,
    in the macOS Keychain or `~/.config/shipit/platform/` at mode 0600.

    Decision `b869ec24` moved generation and storage **server-side**, and decision `9417f8bf` chose an
    **external secret manager** — so SHIP IT never holds key bytes at all, only a reference it asks the
    manager to resolve at push time. Decision `79e860e2` made revocation **two-sided**, because a
    custodian must be able to destroy its own half. Decision `898b07d0` upheld ADR `:100-102` (a product
    cannot register until a connectivity check succeeds) and made it satisfiable by splitting identity
    from registration.

    Those four answers make ADR 0018's `:85-88` and `:113-114` describe the opposite of the system, so the
    ADR had to be amended rather than left contradictory — it is cited by 19 occurrences across 15 files,
    and three ADRs depend on it.

    **The amendment lane escalated exactly two things and declined both**: the STATUS AUTHORITY to declare
    the ADR accepted, and whether the four knowingly-open gaps should be accepted alongside A2 or gate it.
  blocking_work_item:
    item_type: DESIGN_REVISION
    item_id: ADR0018-A2-REV2
    item_ref: "ADR 0018 amendment A2 — custody = external secret manager, revocation = two-sided"
  evidence:
    documents:
      - type: DESIGN_REVISION
        id: ADR0018-A2-REV2
        url: docs/engineering/dispatch/tasks/design-adr-0018-amendment/design-revision-2.md
      - type: ADR
        id: "0018"
        url: docs/adr/0018-per-product-git-credentials.md
      - type: OTHER
        id: 9417f8bf-73b8-4827-9515-bdfe92e5a9d5
        url: .decisions/9417f8bf-73b8-4827-9515-bdfe92e5a9d5.yaml
      - type: OTHER
        id: ADR-0018-A2-D6
        url: docs/engineering/dispatch/tasks/design-adr-0018-amendment/design-revision-2.md
    quantitative_data:
      - metric: "ADR 0018 A2 size"
        value: "158 lines -> 580. Supersedes :85-88 (custody) and :113-114 (revocation) in place, keeping :87-88's prohibition and upholding :100-102."
        source: amendment lane, re-based onto 43d328b
      - metric: "Four gaps the amendment recorded as open"
        value: "A1 a revoked credential can be resurrected (the read path excludes revoked rows, so the one-active guard cannot fire, and under 79e860e2 the handle is already destroyed) · A2 host-key verification has a domain enforcer but NO transport enforcer, while :96-99 requires one · A3 the 'local only' scope is unenforced, with 5432 published unqualified · A4 the external secret manager's reachability has never been runtime-probed"
        source: ADR 0018 §Accepted risks A1-A4, each verified at 43d328b
      - metric: "Enforcement that now exists because of e391c02"
        value: "the partial unique index is present in BOTH tool/schema_bootstrap.sql and migrations/20261006150645000/migration.sql, and the predicating upsert is at postgres_product_registry_store.dart:322-331. Both were absent when the amendment was first drafted at 6220951."
        source: amendment lane re-verification at 43d328b
      - metric: "The amendment lane's own correction"
        value: "revision 1 claimed the partial unique index 'refuses the legitimate fresh mint'. It does not - rotateCredential revokes first, so the superseded row is already excluded. Over-claimed in the direction that would have made A1 look closed."
        source: ADR-0018-A2-D5
      - metric: "HostKeyStatus enforcers"
        value: "3, not 2 - product_registry_engine.dart:1047-1052, :1162-1167, and :1012-1015 (the third throws on a CHANGED host fingerprint, recording the change before failing closed)"
        source: amendment lane, uniform +14 offset confirmed
    qualitative_tradeoffs:
      - dimension: "What acceptance commits the repository to"
        option_a: "Accept A2, record the gaps"
        option_b: "Gate A2 until the gaps close"
        assessment: >-
          A2 changes recorded architecture on a security boundary and the four gaps are real, so accepting
          is a judgement. But leaving the ADR contradicted is worse: it is cited by 15 files, and this
          session already produced two false "artifact absent" conclusions partly from architecture nobody
          could read.
      - dimension: "Whether A1 alone should have gated it"
        option_a: "Accept with all four gaps recorded"
        option_b: "Gate on A1 specifically"
        assessment: >-
          A1 is the one gap that makes an ADR clause false rather than merely unenforced: `:113-114` says
          revocation "requires no Shipit-side action", and a resurrected credential breaks exactly that.
          It is also the one with a fix already implemented and independently reviewed but **uncommitted**.
  recommendation:
    recommended_option: OPTION_A
    rationale: >-
      Accept A2 and record the four gaps as accepted risks, each with its consequence stated — which is
      what the owner chose. The ADR is then unambiguous, and the gaps are tracked rather than hidden.
    confidence: HIGH
  options:
    - option_id: OPTION_A
      label: "Accept A2, gaps recorded as accepted"
      description: >-
        The ADR Status line becomes Accepted (amended — A1 scope per repository; A2 custody = external
        secret manager, revocation = two-sided). The four gaps are recorded as **accepted risks** with their
        consequences, not as blockers.
      implications: >-
        The architecture is unambiguous for every future lane, which is what this session's repeated
        "ADR does not exist" and "ADR contradicts the code" findings actually needed. Cost: four known
        weaknesses sit on a security boundary and are carried rather than closed — so each needs an owner
        and a follow-up, and none may be forgotten.
      estimated_effort: "done; four follow-ups remain"
      risk_level: MEDIUM
    - option_id: OPTION_B
      label: "Gate A2 until the gaps close"
      description: >-
        Keep the status Proposed until A1-A4 are closed, so nothing downstream treats A2 as settled.
      implications: >-
        Nothing can lean on a clause whose enforcement does not exist. Cost: ADR 0018 stays **contradictory
        against the system** — which is the state that produced this session's errors — and the 15 files
        citing it keep citing text that describes the opposite of what SHIP IT does.
      estimated_effort: "blocks the credential path until all four close"
      risk_level: HIGH
resolution:
  selected_option: OPTION_A
  decided_by: "repository owner (ADR owner, interactive structured question UI, session orchestrator-main)"
  decided_at: 2026-10-06T14:20:00Z
  rationale: >-
    **"Accept A2, record the gaps as accepted."**

    Recorded on `docs/adr/0018-per-product-git-credentials.md` at its Status line and in a new
    **§ Accepted risks** section carrying A1-A4, each with a "Consequence accepted." paragraph stating
    what is being carried. The artifact also records, explicitly, that **acceptance is not review**:
    `reviewed_by` and `reviewed_at` remain `null` because independent design review of the amendment has
    still never happened.

    **This object exists because that acceptance was previously recorded nowhere citable.** The amendment
    lane wrote it into its own artifact and flagged that no `.decisions/` object backed it — so a sibling
    design artifact asserted an "Accepted by the human" amendment that nothing on disk supported, and built
    one of its six risk reasons on it. That is the same class of error as a claim about a deleted file
    surviving in a retained artifact.

    **A note the reviewer will need:** the amendment lane found that its **own revision 1 contained a
    factual error** — it claimed the partial unique index refuses a legitimate fresh mint, and it does
    not, because `rotateCredential` revokes first. It over-claimed the index's protection **in the
    direction that would have made gap A1 look closed.** Corrected in revision 2. Judged on the corrected
    text, not on revision 1.
  follow_up_actions:
    - action: >-
        Independent design review of ADR 0018 amendment A2. It has been human-accepted and has never been
        independently reviewed — acceptance is not review, and the artifact records that distinction.
      owner: independent design reviewer
    - action: >-
        Close gap A1 (a revoked credential can be resurrected) before the amendment lands if at all
        possible. The fix is implemented on `fix/credential-identity-invariants` and independently reviewed
        as APPROVE_WITH_NON_BLOCKING_FOLLOWUP, but is **uncommitted**, so A1 is live on `main` today.
        Merging it is the cheapest single improvement to this ADR's honesty.
      owner: orchestrator-main
    - action: >-
        Close gap A2 (host-key verification has a domain enforcer and no transport enforcer, while ADR
        :96-99 requires one). This is an unimplemented ADR requirement and needs its own reviewable work
        item, not a side effect of the Add Product feature.
      owner: design-agent
    - action: >-
        Close gap A3 (the "local only" scope is unenforced) and gap A4 (the external secret manager has
        never been runtime-probed; no adapter exists yet, so there is nothing to probe). Both are
        deployment/infrastructure preconditions owned outside any lane's current scope.
      owner: implementation / deployment authority
    - action: >-
        Note that `AGENTS.md` §13, §13a and §13b now exist (restored at `0bf2fa0`), so the three dangling
        §13 references this amendment originally recorded as a gap are closed. Verified by the amendment
        lane at :65/:72/:78/:91/:96-101.
      owner: none — closed
