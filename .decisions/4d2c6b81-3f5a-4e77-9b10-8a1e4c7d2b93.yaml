# human-decision.yaml
decision_id: 4d2c6b81-3f5a-4e77-9b10-8a1e4c7d2b93
type: ARCHITECTURE
status: PENDING
question: >-
  The one-active-credential-per-repository index exists only in
  apps/server/tool/schema_bootstrap.sql, which no deployed environment runs. How is ADR 0018 A1's
  invariant made to reach production — by also adding it to a migration, or by accepting that it holds
  on fresh and CI databases only?
context:
  summary: >-
    **Filed by the `fix-credential-store-integrity` implementer, which escalated rather than absorbed
    this.** It landed the index in the only place its granted scope allowed, got every gate green, and
    then stopped — because closing this needs `apps/server/migrations/**`, which the dispatch prohibited.

    **The fact.** `apps/server/tool/schema_bootstrap.dart` is wired into exactly two places:
    `Makefile:228` and `.github/workflows/integration.yaml:131`. **No QA, staging or production path runs
    it.** `grep -rl` across `apps/server/migrations/` finds no trace of the new index. So:

    - a **fresh** database gets the index (bootstrap runs);
    - a **chain-migrated** database does **not**;
    - and **no deployed database gets it at all**.

    The consequence is that the invariant ADR 0018 A1 depends on — "one keypair per repository" — holds in
    development and CI and evaporates in production, where two concurrent mints can produce two active
    credentials for one repository.

    **The repository already documents this as the defect its own mechanism exists to remove.**
    `apps/server/tool/schema_bootstrap.sql:37-44` states the parity contract: the bootstrap and the
    migration chain must create the same objects. The guard's check 3 enforces it — for the three objects
    that predate it. And the identical shape has been solved here before:
    `design_revision_approved_unique_per_work_item` is a **partial unique index**, put in **both**
    `tool/schema_bootstrap.sql` **and** `migrations/20260920232118956/migration.sql`, in commit `14608dc`
    ("fix-design-triggers"), which was independently reviewed and merged.

    **So the repository has already answered this once, by precedent and by its own written contract.**
    It is escalated rather than decided because the alternative path means editing `apps/server/migrations/**`
    in a repository with a documented migration-lineage history: nine migrations were activated for the
    first time at the baseline and never executed; `migration_manager.dart:169-172` throws when a
    database's recorded version has no directory; and a fresh database replays only the latest
    `definition.sql` while an existing one replays every `migration.sql` positionally.

    **A second, smaller gap rides along.** `apps/server/tool/verify_schema_bootstrap.sh:69-73` hardcodes
    three required objects. The new index is not among them, so the guard **exits 0 while blind to it** —
    deleting the `CREATE` would leave CI green, which is the exact failure the guard's own header says it
    exists to prevent. That is a mechanical fix needing only ownership of that file, and it is **not**
    part of this question; it is recorded here so it is not lost.
  blocking_work_item:
    item_type: OTHER
    item_id: fix-credential-store-integrity
    item_ref: "Credential store integrity — D-2 partial unique index, deployed-database reach"
  evidence:
    documents:
      - type: OTHER
        id: fix-credential-store-integrity
        url: docs/engineering/dispatch/tasks/fix-credential-store-integrity/report.md
      - type: OTHER
        id: d374ff2
        url: apps/server/tool/schema_bootstrap.sql
      - type: ADR
