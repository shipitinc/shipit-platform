    quantitative_data:
      - metric: "Environments running the bootstrap"
        value: "2 — Makefile:228 and .github/workflows/integration.yaml:131. Zero QA, staging or production paths."
        source: implementation lane, verified by grep
      - metric: "Traces of the index in apps/server/migrations/"
        value: "0 files"
        source: implementation lane, verified by grep -rl
      - metric: "Index predicate vs the read path"
        value: "identical — index is ON (repositoryId) WHERE status <> 'revoked'; readActiveCredentialForRepository selects WHERE repositoryId = @repositoryId AND status <> 'revoked' (store:257-268). They cannot contradict."
        source: implementation lane + design Revision 2 § R.15b
      - metric: "Gate result with the index in place"
        value: "make test-integration +161 -1, T-A and T-B both green against real Postgres; the sole failure is the pre-existing dogfood .git file-vs-directory assertion, proven identical on pristine 064703d (+157 -1)"
        source: implementation lane report
      - metric: "Existing instance of this exact shape"
        value: "design_revision_approved_unique_per_work_item — a partial unique index in both tool/schema_bootstrap.sql and migrations/20260920232118956/migration.sql, and listed in verify_schema_bootstrap.sh required_objects. It reached the migration in 305cdc8 (baseline) and the bootstrap in d374ff2."
        source: git log -S, verified by the engineering review
      - metric: "Is there a template for adding an index to the migration chain?"
        value: "NO. The precedent runs the other way - the index existed in the migration first (305cdc8) and the bootstrap was added afterwards (d374ff2) to fix parity for fresh databases. OPTION_A must author a NEW migration."
        source: engineering review finding M-1, independently re-verified by the Manager
      - metric: "Operational hazard in OPTION_A"
        value: "CREATE UNIQUE INDEX fails if a deployed database already holds duplicate non-revoked credentials per repository. A duplicate audit must run BEFORE the migration."
        source: engineering review finding H-2
    qualitative_tradeoffs:
      - dimension: "What the invariant is actually for"
        option_a: "Make it reach production"
        option_b: "Accept divergence"
        assessment: >-
          The blast radius of two active credentials for one repository is a deploy key whose rotation
          history is ambiguous — and rotation is the mechanism that keeps a leaked key revocable. An
          invariant that holds only where tests run is a weaker guarantee than it reads.
      - dimension: "Cost and risk of the conforming path"
        option_a: "Add the index to the migration chain"
        option_b: "Accept bootstrap-only"
        assessment: >-
          The conforming path matches both the written parity contract and an already-merged precedent,
          but it writes into the one directory whose hazards are documented in WORK_STATE, and it means
          confirming the index is correct in a chain-replay context as well as the fresh one.
      - dimension: "Whether this is a decision at all"
        option_a: "Take the precedent and apply it"
        option_b: "Escalate and let the human see the trade"
        assessment: >-
          An honest reading is that the repository's own contract and its own precedent already answer
          this, so OPTION_A may simply be "do what 14608dc did". It is escalated because the alternative
          is a recorded, accepted divergence in a security invariant — which is exactly the kind of thing
          that should never be settled silently by an agent.
  recommendation:
    recommended_option: OPTION_A
    rationale: >-
      Add the index to the migration chain as well. That is what the parity contract at
      `schema_bootstrap.sql:37-44` requires, and the shape already exists in this repository
      (`design_revision_approved_unique_per_work_item`). Confidence is MEDIUM and **not** HIGH because
      there is no template to copy: the previous instance went the other way, so this needs a new migration,
      a pre-flight duplicate audit, and real-Postgres chain-replay verification. The alternative records, in
      writing, that a credential invariant holds only in development and CI — a weaker guarantee than every
      artifact in this repository claims.
    confidence: MEDIUM
  options:
    - option_id: OPTION_A
      label: "Add to the migration chain too"
      description: >-
        Put the same `CREATE UNIQUE INDEX IF NOT EXISTS product_credential_active_repo_unique ON
        "product_credential" ("repositoryId") WHERE "status" <> 'revoked'` into the appropriate migration
        SQL as well as the bootstrap, exactly as `14608dc` did for
        `design_revision_approved_unique_per_workitem`, and verify it holds in a chain-replayed database
        and not only a fresh one.
      implications: >-
        Satisfies the parity contract; the invariant reaches production; matches an already-reviewed,
        already-merged precedent in this repository. Cost: writes into `apps/server/migrations/**`, the one
        directory with a documented lineage hazard, so the correction lane must verify the chain-replay
        case and not only the fresh one — and must not edit a shipped `definition.sql`.
      estimated_effort: "larger than first stated: a NEW migration must be authored (no template exists), a duplicate-credential audit run first, and the chain-replay path verified against real Postgres"
      risk_level: MEDIUM
    - option_id: OPTION_B
      label: "Accept bootstrap-only divergence"
      description: >-
        Leave the index in `tool/schema_bootstrap.sql` only, and record that ADR 0018 A1's
        one-active-credential-per-repository invariant is enforced on fresh and CI databases but not on
        deployed ones.
      implications: >-
        No migration is touched and no lineage risk is taken. Cost: the credential invariant silently
        weakens in exactly the environments that matter, the parity contract is knowingly violated, and
        two concurrent mints can still produce two active credentials in production — with a rotation
        history that is then ambiguous, which is the property that keeps a leaked key revocable. This must
        be recorded as an accepted risk, not left implicit.
      estimated_effort: "zero"
      risk_level: HIGH
