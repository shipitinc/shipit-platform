# human-decision.yaml
decision_id: d41a6e85-7c02-4b39-9f18-3e6b5a20d7f4
type: ARCHITECTURE
status: RESOLVED
title: Design defects get a real governance runtime, not a permanent park
resolution:
  selected: BUILD_DESIGN_GOVERNANCE_AUTOMATION_001
  label: implement the design governance runtime so design-defect remediation can complete
  decided_by: operator
  decided_at: 2026-10-18T14:05:00Z
  rationale_given: >-
    Design defects cannot complete today and that is by ACCEPTED ARCHITECTURE, not by accident. ADR 0021
    (docs/adr/0021-design-defect-routing.md:112) states that until DESIGN_GOVERNANCE_AUTOMATION_001 is
    implemented in shipit-platform, the boundary stops at WorkItem creation and the linked WorkItem
    "cannot progress until the design governance runtime exists", reported as
    EXTERNAL_DESIGN_GOVERNANCE_DEPENDENCY. That constant appears in the tree only inside
    lane_e_design_remediation_work_item.dart as the NAMED dependency; it is implemented nowhere. Verified.
    The consequence is that every design defect ever triaged parks permanently in designNotRequired, and a
    retry converges on that same terminal state, so each one absorbs a failure, a retry and a repair pass
    before landing exactly where it started.
  rejected_alternatives:
    - >-
      Accept the park and remove the misleading retry path. Rejected: correct and cheap, and it removes a
      real waste, but it makes "design defects are permanently unautomatable" the platform's standing
      answer rather than a stated interim state.
    - >-
      Leave it as-is. Rejected for the same reason, with the added cost that the misleading retry path
      keeps absorbing repair cycles.
  scope_and_honesty_constraints:
    - >-
      The parked item CANNOT be completed retroactively. Building the runtime does not finish
      design-remediation-DEF-1791686085546076; that item would have to be re-triaged once the runtime
      exists. Do not represent the build as a repair of existing work.
    - >-
      Until the runtime exists, design defects remain honestly parked with
      EXTERNAL_DESIGN_GOVERNANCE_DEPENDENCY. That reporting is correct today and must not be relaxed
      while the runtime is being built.
    - >-
      ADR 0021 already fixes the shape: the Routing Flow, Hard Rules, Authority Separation, Human Gates
      Preserved and Data Contracts sections are the governing design. The runtime implements that boundary
      and does not reopen it.
  dispatchable_as: >-
    An architecture/design lane producing a design artifact, followed by independent design review. Not an
    implementation-first task: DESIGN_GOVERNANCE_AUTOMATION_001 changes what dispatch is allowed to do on
    a governed path, so it is designed and reviewed before anything is built.
