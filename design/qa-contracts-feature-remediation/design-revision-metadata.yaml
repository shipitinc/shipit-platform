    verdict: "IT CLOSES, and the hole is WIDER than evaluator-spec.md §1 and FOLLOW_UPS F-49 record."
    finding: >
      The filter at guard_conditions.dart:272 selects FROM gateResults, not FROM
      qaContract.gates. So the guard asks "of the results I was handed, are the required ones
      satisfied?" and NEVER asks "was every required gate given a result at all?". A contract
