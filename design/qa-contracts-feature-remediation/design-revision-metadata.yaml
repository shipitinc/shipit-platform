    fix:
      - "C1 step 2 — qaContract absent from context => FAIL. Closes the F-49 / spec §1 hole."
      - "C1 step 3 — for every qaContract.gates entry where gc.required, a result with that gateId MUST exist; absent => FAIL naming the gate. Closes the SUBSET hole. This is the whole fix and it is four lines."
      - "C2 — invert isOverallPass to iterate requiredGates and look each up in results, failing on a miss."
      - "C3 — QAGateEvaluationService must return both context keys; C1 step 2 makes this load-bearing."
      - "C4 — a guard test for each of the seven rows of the artifact's §7.2 table, including the three currently green-and-wrong."
    not_proposed: >
      No change to _isGateSatisfied (guard_conditions.dart:291-317). It is already correct. The
      bug is in WHAT IS ITERATED, not in how each element is judged.

