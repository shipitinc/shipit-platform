  # THE SHAPE. RESOLVED, NEW_HUMAN_DECISION_TYPE, decided_by: operator, 2026-10-17T14:40:00Z.
  # THE PARK'S HUMAN-DECISION PARK GETS ITS OWN HumanDecisionType, AND MAY NOT REUSE escalation OR
  # designApproval. This is the fourth operator decision in force in this artifact set and the third
  # that pass 3 or pass 4 had to apply rather than ask about. PASS 5 SUPERSEDES THE LAST PARAGRAPH OF
  # THIS BLOCK ONLY — see governing_decision_menu below. Everything else in this block stands, except
  # that the arm count and registration-site count it states are restated there at their pass-5 values.
  #
  # TWO VERIFIED FACTS FORCED IT, and both are load-bearing for the specification:
  #  (1) HumanDecisionOption carries only optionId/label/description/recommended
  #      (packages/platform_contracts/lib/src/types/human_decision.dart:148-168, fields :156-159).
  #      THERE IS NO PER-OPTION decisionType. A decision's type is a property of THE DECISION,
  #      resolved once as targetFor(decision.decisionType, effectiveChoice)
  #      (durable_workflow_engine.dart:758-761). THE ASSERTION PASS 3 WROTE TO GUARD THIS INVARIANT
  #      ASKED FOR A FIELD THAT DOES NOT EXIST, so it could never go green.
  #  (2) (escalation, approve) targets designNotRequired DELIBERATELY, on the routing table's own
  #      stated reasoning (human_decision_routing.dart:128-131): "an escalation is a statement about
  #      EXECUTION failing, not a judgement on the work". So an answer labelled "do the design
  #      review" re-triages the item straight back into the guard that just refused it. NO
  #      escalation arm reaches designApproved for ANY of the nine HumanDecisionChoice values
  #      (enums/human_decision.dart:33-41) — independently re-verified in pass 4.
  #
  # CONSEQUENCE THIS PASS HAD TO DISCOVER, NOT DECIDE: the decision's `consequence` names TWO
  # registration sites ("its routing arms MUST be registered in the same change") and the lockstep
  # hazard at human_decision_routing.dart:66-83. THERE IS A THIRD, and the design could not be
  # specified without it: blockingHumanDecisionResolved is a STRICT WHITELIST
  # (guard_conditions.dart:420-428), so a new type is admitted by NO edge until it is added to that
  # edge's allowed set. Two existing edges need it — (waitingForHumanDecision, designApproved)
  # at work_item_transitions.dart:75-80 and (waitingForHumanDecision, planning) at :643-648.
  # THE THIRD ANSWER NEEDS NO REGISTRATION AT ALL: (_, cancel) is a catch-all
  # (human_decision_routing.dart:121) and waitingForHumanDecision -> cancelled is admitted by the
  # generic escape (work_item_transitions.dart:786-791, :806-811).
  # *** PASS 5: EVERY COUNT IN THIS PARAGRAPH IS ONE SHORT OF THE PASS-5 VALUE. The park now has FOUR
  # ANSWERS, so it touches THREE edges and needs THREE whitelist admissions — :75-80, :643-648, and
  # :530-549 (waitingForHumanDecision, designNotRequired, which the restored re-triage arm needs and
  # which is the ONLY ONE OF THE THREE CARRYING an escalationIndexWithinLimitForDecisionTypes bound at
  # :559-563). And a new HumanDecisionChoice needs a FOURTH registration site that a new TYPE never
  # did: apps/control_plane/lib/shared/decision_choice.dart:12-19, whose knownDecisionChoices is a
  # hardcoded SIX-value set against a TEN-value enum. Superseded by governing_decision_menu below. ***
  #
  # IN THE OPERATOR'S FAVOUR, AND RECORDED BECAUSE IT IS: pass 3's own PASS3-5b finding applies here.
  # escalationTargetFor SHORT-CIRCUITS to null for any choice that is not reject or rework
