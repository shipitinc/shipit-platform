points_for_independent_review:
  # The mechanism this lane uses INSTEAD of human_decisions_required, per the operator's
  # routing instruction above. One entry, and it is deliberately singular.
  - id: HD1-UNDELEGATED-CLAUSE-READING
    question: >
      Did HD-1's operator intend a human's resolved routing decision to substitute for a
      design review on the feature-intake and design-remediation paths — or not?
    specified_by_this_lane: >
      NOT SUBSTITUTED. The guard is placed on waitingForHumanDecision ->
      implementationReady (:599-602) as well as on the one automatic route (:340-342). See
      design-review-gate.md §5.2 for the full argument and the cost.
    why_this_lane_specified_that: >
      HD-1's delegated clause withholds exactly one thing from delegation and states it
      without a qualifier: "What is NOT delegated is that an IMPLEMENTER dispatch must be
      preceded by a satisfied design review for items originating on these two paths." The
      word "unattended" appears in rationale_given, which describes the harm the chosen
      middle avoids; reading it as a narrowing of the clause imports a qualifier from a
      different field of the same document. A routing answer is also not a review — the
      operator separately named designApproval as the design-review decision type
      (ADR 0021:126-127).
    cost_if_this_reading_is_right: >
      Nothing writes an approved design_revision until slice 3 (M5-M7), so both intake
      paths become unable to reach an implementer, and a human's options at the park are
      re-triage, re-plan or stop. This is the price of the gate on this repository today.
    if_the_reading_is_wrong: >
      Remove the guard from route 3 and park entry P3; then state EXPLICITLY that the four
      HumanDecisionRouting pairs routing to implementationReady
      (human_decision_routing.dart:103-104, 107-108, 109-110, 119-120) are a deliberate
      bypass of HD-1's undelegated clause — and note that the bypass becomes LIVE the moment
      slice 2c or slice 4 lands.
    not_decided_here: true
    interacts_with: >
      BLOCKING B1. Independent review observed, correctly, that fixing the refusal sink makes
      the route-3 reachability question materially live, so the two cannot be sequenced
      independently: sub-slice 1a must add both guards in ONE commit. design-review-gate.md
      §5.3; risk R12.

