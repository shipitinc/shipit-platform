    - "A design-review actor other than a human — no scheduler dispatches the design lane (server.dart has exactly three), so an agent design review cannot be specified honestly today. The design deliberately chooses the human and states that it is a consequence, not a preference (design-review-gate.md §4.5)."
    - "An executable gate on the QA path — follows from FINDING 2 and FINDING 3. evaluator-spec.md §5, slices 2a-2c."
    - "Whether the human override on waitingForHumanDecision -> implementationReady is the intended reading of HD-1's 'unattended' — argued from the decision's own rationale_given at design-review-gate.md §5.2, and flagged as the one element a human may still wish to own."

