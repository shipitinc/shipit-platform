design_system_compliance: "NOT APPLICABLE — this artifact introduces no user-facing UI, declares no gate
  set, changes no component, no token and no pattern. Recorded rather than left blank so a reviewer does
  not read the omission as an unassessed dimension. ONE operator-facing consequence is in scope and is
  recorded rather than scored.
  REVISION 2 CORRECTED A PRIOR ENTRY which recorded this surface as reached via blockedArtifactMissing
  on the review lane. That was WRONG and was revision 2's BLOCKING finding: the review drain stands
  down for a no-commit producer (engineering_review_gate.dart:2860-2871), so no such decision is ever
  raised. THIS PASS CORRECTS REVISION 2 IN THE SAME SHAPE.
  ~~PASS 4 CORRECTS THE OPERATOR MENU THIS FIELD DESCRIBES, AND THE MENU SHRANK. The decision type is
  now DECIDED (.decisions/3e5a7c26-…: a NEW HumanDecisionType, not escalation and not designApproval),
  and because one decision carries one type (durable_workflow_engine.dart:758-761) the new type must
  carry the WHOLE menu — while the nine HumanDecisionChoice values (enums/human_decision.dart:33-41)
  cannot express four coherent park answers. The operator is therefore offered THREE, not four:
  do the design review (approve -> designApproved), put it back in the lane (rework -> planning), and
  stop (cancel -> cancelled). THE MERGED-AWAY ANSWER IS RE-TRIAGE (-> designNotRequired), which
  design-review-gate.md §5.2.1 itself classifies as 'a cycle — visible, durable, and dispatching
  nothing'. This is a REDUCTION in what an operator is offered and it is recorded here rather than
  folded away; design-revision.md §13.14 states the reasoning and the disagreement invite.~~
  *** PASS 5: THE OPERATOR REVERSED THE REDUCTION (.decisions/5a90c1d3-…, FOURTH_CHOICE_VALUE) —
  'HD-1 delegates the park's handling to the design lane, but a product-facing menu reduction is not
  that delegation.' THE MENU IS FOUR: do the design review (approve -> designApproved), put it back in
  the lane (rework -> planning), RE-TRIAGE (reTriage -> designNotRequired), and stop (cancel ->
  cancelled). The merged-away answer is RESTORED as a distinct HumanDecisionChoice('re_triage'), so
  the reduction is withdrawn rather than merely softened. *** THIS IS MATERIAL TO A
  DESIGN-SYSTEM COMPLIANCE FIELD, not only to the menu: this field records that a park option's
  presentation is an operator-facing surface with an unasserted property, and pass 5 ADDED a fourth
  such surface — the re-triage row's `description`, which §6 2b now requires to exist (G18 asserts
  that it does) because the answer routes to a cycle and the operator must be told so at the point of
  choosing. **The accessibility and design-system findings of this artifact set are about the
  human-decision surface, and every one of them now covers four answers instead of three.** The stale
  three-answer text is retained above because this register's convention is to preserve what it
  withdraws, and because the register has been the blind spot twice.
  ONE OPERATOR-FACING PROPERTY PASS 4 ADDED TO THE SURFACE, because nothing in the tree checks it:
  _resolvedOptionId matches a recorded option by o.optionId == choice.wire and FALLS BACK to
  choice.wire when no option matches (durable_workflow_engine.dart:1110-1113). An operator shown a
  menu can therefore have a decision recorded against an optionId they were never offered, with no
  error. G16 and G17(c) now assert the optionId/choice correspondence; requestHumanDecision's
  `recommendation` has the same hole (a bare String with no membership check).
  Revision 2 replaced that with: 'a work item of either intake origin now parks at designReviewRequired
  with a durable blockingReason and is surfaced as a blocking human decision.' THE FIRST HALF OF THAT
  WAS ALSO WRONG. durable_workflow_engine.dart:222-225 writes blockingReason ONLY when the target is
  waitingForHumanDecision, and null otherwise — so a park hop through transition erased the item's own
  reason and wrote none. Revision 2 asserted the opposite as fact, in this field, in
  ux_accessibility_score, in design-review-gate.md §4.3/§5.1.1 and in design-revision.md §4.3.
  THE ACCURATE STATEMENT IS: a refused intake item parks at designReviewRequired — a state in no
  JobDefinition.entryStates, so RunnableWorkEvaluator returns noAction for it — and its exit is
  DurableWorkflowEngine.requestHumanDecision, which writes blockingHumanDecisionId and blockingReason
  ITSELF (:651-653) and lands the item at waitingForHumanDecision. That is a reuse of the existing
  human-decision surface, not a new one: the decision appears on the Needs You page an operator already
  uses (apps/control_plane/lib/router.dart:70-75, /needs-you and /needs-you/:decisionId). The
  operator sees a real pending decision with a real reason, and the operator's option list is exactly
  three answers (escalation approve/rework/cancel) — re-triage, re-plan, stop — none of which is 'do the
  design review' — UNLESS the human surface of slice 1 has landed, which the operator has now ORDERED
  (b81f40c7-…, HUMAN_SURFACE_FIRST). From slice 1 the option set includes the design-review answer, and
  G16 is pinned to that SET rather than to escalation's three, so this field no longer describes a
  three-answer surface.
  CORRECTION PASS 3, and the supersession is recorded rather than applied quietly: the previous pass
  recorded that gap as 'the operator's own named next task … which is slice 1.5 and the Manager's', and
  cited FOLLOW_UPS F-55 — WHICH DID NOT EXIST. BOTH are superseded. F-55 EXISTS (0bfb6fb,
  FOLLOW_UPS.md §16) and independently confirms the gap, with the same three answers and the same
  human_decision_routing.dart:121, 132-135 citations, re-verified here; and the work is SLICE 1 IN THIS
  ARTIFACT, specified at design-review-gate.md §6 (1a-1c) with G17 asserting the invariant that no
  item may be parked before the answer exists. docs/** is PROHIBITED_PATHS: F-55 and F-56 were READ,
  never written.
  WHAT SLICE 1 DOES NOT CHANGE: the operator still cannot PRODUCE the design review the item needs.
  The answer routes the item to designApproved and nothing writes an approved revision there until
  slice 4. That residual is R4.
  Assertions G14 (non-null, non-default blockingReason), G15 (non-null, resolvable
  blockingHumanDecisionId) and G16 (the exact option set) exist because this field is where revision
  2's false claim sat, and a claim in a metadata field is exactly the kind no test would catch."

ux_accessibility_score: "NOT APPLICABLE — no interface, no visual or interaction surface, no navigation and
  no content is designed. The underlying walk does have an operator-facing consequence, and it is
  recorded here rather than scored, because scoring a consequence of a decision this revision APPLIES
  but does not own would be a category error.
  ACCURATE STATEMENT: an intake item that cannot be implemented parks at designReviewRequired and then
  raises a real blocking `designReviewRequest` decision via requestHumanDecision, reaching
  waitingForHumanDecision with a non-null blockingReason and a non-null blockingHumanDecisionId. It
  therefore appears on the Needs You surface with a readable reason and ~~three explicit answers~~.
  That is strictly better than
  both the current silent route (an item re-attempted every tick and stood down) and the dead end
  revision 1 would have shipped (an item that simply vanished at agentCompleted), and it is better than
  revision 2's version, which looked the same to an operator but carried no reason to read.
  WHAT IT IS NOT: ~~it is not a design that lets the operator resolve the blocker. Three answers, none
  of them the one the item needs.~~
  CORRECTION PASS 3 SUPERSEDED THE SENTENCE ABOVE IN ONE PLACE, and recorded that it did: from slice 1
  the FOURTH answer EXISTED (design-review-gate.md §6, 1a-b) and G16 was pinned to the resulting SET
  rather than to escalation's three, so 'no fourth' was no longer the property being asserted.
  PASS 4 SUPERSEDES THAT SUPERSESSION'S PREMISE, AND SAYS SO. The fourth answer still exists — it is
  the 'do the design review' answer — ~~but the menu is now THREE, not four, because the decision type
  changed and one of the previous four answers was merged~~ (see design_system_compliance above and
  design-revision.md §13.14). THE LIMITATION THAT SURVIVES IS UNCHANGED AND IS STATED IN THE FIELD
  ABOVE: the design-review answer routes the item to designApproved and nothing produces an approved
  revision there until slice 4 — so for the whole of slices 1 through 4 the operator is offered an
  answer that changes the item's state and still cannot unblock it. Recorded as a known limitation with
  a named owner (R4), not scored as an accessibility property.

  *** PASS 6 SUPERSEDED BOTH PASS-3 AND PASS-4 CLAIMS IN THE FIELD ABOVE, AND THIS IS THE REGISTER'S
  THIRD BLIND SPOT — so it is recorded here rather than merged away. TWO LIVE CLAIMS HAD SURVIVED
  UN-SUPERSEDED, AND PASS 7 CORRECTS WHAT PASS 6 WROTE ABOUT HOW IT CORRECTED THEM: ***

  *** (1) ~~three explicit answers~~ and ~~Three answers, none of them the one the item needs~~ — FALSE
  TWICE OVER, the second time by the operator's own ruling. `.decisions/5a90c1d3-…` restored
  re-triage as a distinct `HumanDecisionChoice('re_triage')`, so the park's menu is FOUR:
  `approve` / `rework` / `re_triage` / `cancel`. The clause's original point — that the operator could
  not *resolve* the blocker — was true of pass 4's merged menu and is now FALSE, because from slice 1
  one of the four IS the answer the item needs. What survives of it is only the residual, which is
  stated in the field above and is R4: the answer moves the item to `designApproved` and nothing
  produces an approved revision there until slice 4. ***

  *** (2) ~~raises a real blocking escalation decision~~ — A PASS-3-ERA CLAIM RULED OUT BY
  `3e5a7c26…`, WHICH PASS 6 DID CORRECT, at the ACCURATE STATEMENT sentence in the field above —
  which is why it is stated here in the PAST tense rather than the present. *** PASS 7 CORRECTS PASS
  6'S OWN ACCOUNT OF THIS ITEM, because a correction that misreports itself as incomplete is the
  same failure inverted. Pass 6 wrote: *'a pass-3-era claim ruled out by `3e5a7c26…`, **which I
  never corrected here**. The park does not raise `escalation` at all … This sentence still reads as
  though `escalation` were the park's type.'* **All three of those present-tense claims were false
  when pass 6 wrote them.** Pass 6 DID correct it, **in the same edit, in the same field, at the
  `ACCURATE STATEMENT:` sentence**, which now reads *'raises a real blocking `designReviewRequest`
  decision via `requestHumanDecision`'* — the correct type, corrected in place. **The struck text is
  preserved verbatim above and the disposition is stated: corrected in place, at the sentence itself,
  in the same pass.** So the honest account of why the claim survived until pass 6 is not 'it was
  never corrected'; it is **'it survived until pass 6 because pass 5 changed the answer count in this
  field and left the decision TYPE beside it alone — and a reader checking a UX score is not checking
  a decision type.'** That is the finding, and pass 6's own sentence understated it by claiming a lapse
  that had not happened. **The park does not raise `escalation` at all: it raises
  `HumanDecisionType.designReviewRequest`, a NEW type, and `escalation` is ruled out for it. §12.5,
  PASS7-2.** ***

  *** (3) WHY THE SIBLING FIELD DID NOT HAVE THE SAME DEFECT — recorded because the inconsistency is
  the finding. `design_system_compliance` above WAS updated for pass 5 (its `*** PASS 5:` block states
  the four-answer menu and the restored choice), so this is **an inconsistent omission, not a missing
  convention** — the register has been the blind spot three times now (H-3 twice in pass 4, and this),
  and all three were in this file rather than in a `.md` artifact whose orphan sweep was clean. A
  `design_system_compliance` field that describes four answers and a `ux_accessibility_score` field on
  the same surface that says three is an inconsistency a reader cannot resolve without opening both.
  §12.4, PASS6-5. ***"

implementation_feasibility: >
  MEDIUM for slice 1 (the park's human surface — NEW in pass 3), MEDIUM for slice 2 (the
  design-review gate; DOWNGRADED from HIGH by revision 2, see below), MEDIUM for slice 3 (the
  evaluator), LOW-to-MEDIUM for slice 4 (the design lane, M5-M7), and NOT RATED for slice 5 (the
  path-specific contracts), which cannot be estimated because their subject does not exist.
  SLICE 1 IS MEDIUM, AND PASS 4 REASSESSES IT AGAINST THE DECIDED SHAPE. It is now a new
  HumanDecisionType (enums/human_decision.dart:1-20) plus TWO targetFor arms (:88-138), plus TWO
  blockingHumanDecisionResolved whitelist admissions (work_item_transitions.dart:75-80, :643-648), plus
  G17(a)/(b)/(c) and G17b — THREE FILES, where pass 3 listed the third conditionally and wrongly said
  it was not needed. *** PASS 5 RAISES BOTH NUMBERS AGAIN, FOR A NEW REASON: a new HumanDecisionChoice
  (enums/human_decision.dart:32-52, wire 're_triage') plus THREE targetFor arms (:88-138), plus THREE
  whitelist admissions (:75-80, :643-648, :530-549), plus a presentation registration in
  apps/control_plane/lib/shared/decision_choice.dart:12-19 and :32-57, plus G17(a)/(b)/(c), G17b and
  the NEW G18 — FOUR FILES. The added work is small and mechanical, so slice 1 stays MEDIUM rather than
  moving to LOW; what changed is the COUNT, and the new count is not a rounding of the old one. The
  one genuinely new FEASIBILITY question this pass introduces is whether the scope derivation holds,
  because the entire no-escalation decision rests on it — hence §16(2)(d) asks a reviewer to check the
  four facts rather than accept them. *** Sub-slice 1b (the option list) has FOLDED INTO 2b, so it is not slice 1's
  feasibility at all; it is 2b's, and 2b already owned that call site.
  IT IS MEDIUM AND NOT LOW FOR TWO REASONS, AND THE SECOND IS NEW. (1) The lockstep hazard: if the
  implementer adds an escalationTargetFor arm they were not asked for, escalation accounting starts
  silently — and pass 4 shows this is now MORE dangerous than pass 3 thought, because the new type has
  a rework arm, and rework is the one choice :196-199's short-circuit does not protect. Its inertness
  rests on `_ => null` at :214, so "completing the lockstep" on the rework arm would make
  routesToEscalation true and start escalation accounting on a RE-PLAN answer. G17b is extended for
  exactly this. (2) THE THIRD REGISTRATION SITE FAILS WITH NO ERROR MESSAGE, which is the same class of
  hazard and is the reason feasibility is not LOW: if the type and its targetFor arm are added and the
  two edge whitelists are not, the decision still RESOLVES and is still SAVED RESOLVED, the item does
  not move, and nothing logs a defect — because the guard simply refused. That is §5.1.1b's
  unrecoverable position, reached by a new route, and G17(a)'s second clause exists to catch it.
  IT IS NOT HIGH because it changes no dispatch: it adds answers, and no answer routes to
  implementationReady (re-verified for the new type's three arms in design-review-gate.md §6 1a.
  *** PASS 5 RE-VERIFIES IT FOR FOUR: the restored reTriage arm targets designNotRequired, which is the
  state triage dispatches from and therefore the arm most likely to be misread as a step toward the
  implementer. It is not — designNotRequired leads back to agentCompleted, where the guard refuses and
  the item parks again. It passes, and it is the second arm (after approve) that has had to be checked
  against this property from a new direction. ***)
  Slice 2 was HIGH in revision 1 because it "adds one guard class to one existing file, adds it
  to two edges that already exist … No new state, no new edge". REVISION 2 DOWNGRADED IT TO
  MEDIUM, because that feasibility rested on the claim revision 1's own review found false. With
  the park specified (design-review-gate.md §5.1.1), slice 2 now adds one guard class, one new
  WorkItemState variant, its registrations in two files, and THREE edges (P2 in, P3 in, P4 out).
  THIS PASS KEEPS IT AT MEDIUM, and for a reason that is stronger than revision 2's: the park's
  shape did not change, but the WORK did. Revision 2 thought the park's exit was a bare transition
  hop. It is a requestHumanDecision call with an explicit options list, plus a raised decision, a
  durable question string, and the operator surface that reads them — and packages/scheduler/lib/src/scheduler.dart:1746
  must become a computed map before either key can exist at all. That is more to build than revision
  2 counted, but it is all wiring against APIs that already exist: requestHumanDecision is already
  production-called (raiseStallDecision, apps/server/lib/src/triage/stalled_work_item_gate.dart:195-227),
  and NOTHING in packages/workflow_store/** is modified. That is why MEDIUM and not LOW — and why
  the cost is in the number of things a reviewer must check, not in novelty or risk.
  Slice 3 is MEDIUM because it must first DE-REGISTER the four fabricated evaluators rather than
  only add to the registry (evaluator-spec.md §5.2, whose option 1 this revision showed cannot
  achieve non-vacuity), and because the drain must be added at a state nothing reaches — plus, as of
  HIGH H2, the caller for reviewApproved -> qaInProgress as well. Both are ordinary Dart following
  patterns the repository has already shipped
  (GateEvaluator's own interface; the engineering-review missing-artifact drain).
  Slice 4 is LOW-to-MEDIUM because it is a runtime, not a wiring change: a producer, a scheduler and
  an edge, where the scheduler and edge are individually small and the producer is a real agent lane.
  Slice 5 is NOT RATED rather than rated LOW: M8-M10 must exist before there is anything to estimate,
  and a LOW rating would imply the work is merely difficult rather than not yet specifiable.

