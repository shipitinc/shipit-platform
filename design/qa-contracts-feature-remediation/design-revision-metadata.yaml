risk_assessment:
  level: 3
  rationale: >
    Level 3 (Major Workflow / navigation / IA change) is the correct level for the change
    being designed, and it is unchanged from the blocked brief's assessment — for the same
    reason: the level is not about a screen, it is about whether production code may begin
    being written from a request that has never been designed. Slice 1 changes what the
    platform is permitted to do unattended on two intake paths, and that affects the
    operator's mental model of what intake means. It is not a Level 2: Level 2 is a
    feature-level UX change affecting user behaviour, whereas this governs whether an
    IMPLEMENTER may be dispatched at all.
    The residual scope this revision actually delivers is documentation of a design, so
    the artifact itself carries no product-facing behaviour change — which is why the
    disposition is COMPLETE for the specification while the shipped behaviour change is
    gate on slice 1 and is strictly a REDUCTION in what the platform may do.
    HD-1 resolved the Level 3 question itself (ALLOW_COMPLETION_GATE_IMPLEMENTATION_ON_DESIGN_REVIEW).
    What remains delegated is the gate's shape. REVISION 2 CHANGED THE LEVEL ASSESSMENT'S
    reasoning, not its level. Revision 1 recorded the one open element as "whether the human
    override is the intended reading of 'unattended'", argued that it was, and called it
    settled. The independent review found that reading unsupported by the clause it claimed to
    follow, and revision 2 specified the OPPOSITE reading — the guard goes on the human edge too —
    marking it open for judgement.
    THIS PASS CHANGES THE REASONING AGAIN, because the element is no longer open: Reading B is
    DECIDED (.decisions/7f3e2a95-6c81-4d70-b215-8e94a0c7d382.yaml, READING_B_CLAUSE_COVERS_EVERY_ROUTE,
    decided_by operator, 2026-10-17T13:40:00Z). The operator's stated reasoning is "a clause that is
    not qualified is not narrowed by a rationale that explains why it was written" — which is
    NEITHER revision 1's reading NOR revision 2's argument, and is recorded verbatim rather than
    paraphrased. Revision 2's "imports one from a different field" argument is REMOVED: the
    operator's rejected_alternative names that exact clause as a reason the reading was rejected.
    The level stays 3, and the reason is now simpler than it was. Revision 2 held it at 3 while the
    reading was open, on the grounds that under either reading the shipped change is a restriction —
    reasoning that is now moot, because there is one reading. A Level 3 reviewer should see plainly
    that this is a gate on whether production code may begin being written from a never-designed
    request, on two intake paths, attended or not, and that the operator has ruled its scope. What
    the change adds in scope is unchanged — a new state, three edges, and now a raised decision with
    an explicit option set (§11 records the non-goal withdrawal and what it costs) — which is a
    governance surface increase of the kind a Level 3 reviewer should see plainly.
  risks:
    - "R1 the guard is treated as satisfied because its context key is supplied by a caller that did not read the store — HIGH, AND STILL UNMITIGATED. DurableWorkflowEngine.transition passes context to the policy (durable_workflow_engine.dart:173) and persists NO GUARD-SUPPLIED KEY (it reads back only humanDecision :216 and blockingReason :223, both its own). This is the platform's EXISTING model (qaContractExists, guard_conditions.dart:247). REVISION 2 CORRECTION (MEDIUM M4): revision 1's mitigation — 'require it to be the only writer' — is not a test and therefore not a mitigation; G1-G6 test the guard, never the supplier, so every one of them passes with a lying writer. The required artifact is a drift test naming the single writer of workItemOrigin and approvedDesignRevisionId, named in sub-slice 1b. Until it exists the rating stands unmitigated, and design-revision.md §10 says so in the row rather than in a footnote."
    - "R11 a future caller appears for agentFailed -> implementationReady and the guard is absent there — MEDIUM/HIGH. The edge is callerless today, so a guard there would be inert while looking like coverage (H1). Pinned by G11, which fails only when a production caller exists — the rule fires when the risk becomes real, and not before."
    - "R12 slice 1's route-1 and route-3 guards land in separate commits — MEDIUM/HIGH. Between them the park exists and the human route is unguarded, and slice 2c and slice 4 both make that window worth exploiting (design-review-gate.md §5.3). Stated as an in-slice ordering constraint: 1a adds both in one commit."
    - "R2 the evaluator is wired before _validateEvidence is replaced — MEDIUM/CRITICAL. All four registered evaluators would return QAGateStatus.passed with fabricated empty findings (gate_evaluator.dart:53-58 + the four collectors). evaluator-spec.md §5 makes this a hard ordering constraint with a named non-vacuity test. The one ordering in this revision that must not be violated."
    - "R3 the design-review gate strands an intake item SILENTLY — WAS LOW, WAS WRONG, NOW CRITICAL, AND IT HAS NOW HAPPENED TWICE IN THIS DESIGN. First as the BLOCKING finding of revision 2's review: revision 1 asserted a refused item 'stays at agentCompleted, which fails closed into a blocking human decision', but engineeringReviewMissingArtifact STANDS DOWN for a no-commit producer (engineering_review_gate.dart:2860-2871, decided unconditionally at :2210-2228; documented in prose at server.dart:1416-1421), so the item sat there forever re-attempting the same refused route every tick under a suite whose G1/G2 were satisfied by that dead end. Second as the BLOCKING finding of THIS review: revision 2 replaced that with a park and then asserted, citing durable_workflow_engine.dart:222-225, that the park 'carries a durable reason'. THAT RANGE WRITES blockingReason: NULL for every target other than waitingForHumanDecision (:215-225), so revision 2's park erased its own reason — B1 surviving under a new state name. The lesson is not 'check the citations' (revision 2 checked them); it is that G7 asked whether the item MOVED and nothing asked what it CARRIED. Mitigated now by the specified park plus G7, G9, G10 and — the ones this pass adds — G14 (non-null non-default blockingReason), G15 (non-null resolvable blockingHumanDecisionId) and G16 (the exact option set). The rating stays CRITICAL: a silent, indefinitely-repeating dead end with a green suite over it is the worst combination in this table."
    - "R3b the park is implemented with a bare transition instead of requestHumanDecision, and ships the reason-less park — MEDIUM/CRITICAL, recorded separately from R3 because it is a distinct implementation error with a distinct fix and folding it in would hide it. It passes G1/G2/G7/G9 silently. Mitigated by sub-slice 1b naming the park helper as performing BOTH steps and stating that a step-1-only helper 'is the B-1 defect and must not be written', plus G14/G15/G16 failing if it is."
    - "R4 a human cannot move an intake item to an implementer, and at the park has no answer that is 'do the design review' — HIGH/HIGH, now a DECIDED consequence with a named owner rather than a risk awaiting judgement. Revision 1 recorded this as 'RESOLVED' on the strength of the narrower reading (wrong); revision 2 specified the guard ON the human edge and marked the reading open; .decisions/7f3e2a95-… has now DECIDED Reading B, so the price is fixed and accepted — nothing writes an approved design_revision until slice 3, so a human's options are re-triage, re-plan or stop and NONE of the three is the design review the item is waiting for. Mitigated as far as this lane can go: the park's option list is made EXPLICIT (requestHumanDecision's options argument) so the absence of a fourth answer is a recorded property rather than an emergent one, and G16 asserts it cannot widen silently; the gap is named as slice 1.5 with the Manager as owner, tied to FOLLOW_UPS F-55 which the operator's own decision names. Honest residual: between slice 1 and slice 3+1.5, 'stop' is the only answer that terminates. This design's position is that slice 1 lands anyway — a strict reduction in what the platform may dispatch, leaving items visible with a real reason — and that position is THIS REVISION'S JUDGEMENT against the decision's word 'FIRST', flagged as such rather than presented as the decision's instruction."
    - "R4 a human cannot move an intake item to an IMPLEMENTER at all — HIGH, AND RE-OPENED. Revision 1 recorded this as 'RESOLVED' on the strength of the narrower reading of HD-1, and that was wrong: it re-opened on H4. Revision 2 specifies the guard ON the human edge (:599-602), because HD-1's delegated clause is unconditional, and nothing writes an approved design_revision until slice 3 (M5-M7). So today a human's options at the park are re-triage, re-plan or stop (the table at design-review-gate.md §5.2). This is SPECIFIED BEHAVIOUR, not an unresolved risk — but it is the reason §5.2 is marked for independent judgement, and it is escalated to the Manager as a consequence to record BEFORE slice 1 ships (slice 0)."
    - "R5 the qaInProgress dead end goes unrecorded — MEDIUM/HIGH. Every item that commits, is engineering-reviewed and approved is stranded there, because allRequiredGatesPassed always fails and nothing dispatches from qaInProgress. Affects the MAIN implementation lane, not these two paths. Reported in full (design-revision.md §2.1) and routed to the Manager as slice 0; not designed here and FOLLOW_UPS.md not written."
    - "R6 the two contracts are authored anyway to close the ticket — MEDIUM/HIGH. This revision is the obstacle, and §6 gives the next lane a specification (which artifact justifies which gate) rather than a prohibition."
    - "R7 a future implementer adds designApproved -> implementationReady without M7 and creates a loop — MEDIUM/HIGH. design-revision.md §4.1 Fact 2 names the trap: designApproved is in triageDefectDefinition.entryStates, so an approved design routes to TRIAGE."
    - "R8 sourceColumn is interpolated into SQL — LOW/CRITICAL. It names a table and a column and arrives from operator-authored manifest JSON (product_registry_endpoints.dart:470-510). evaluator-spec.md §3.4 forbids it and requires the typed store reader."
    - "R9 M6/M5 land without M7 — MEDIUM/MEDIUM. Both are in slice 3 together, and §6 states the constraint."
    - "R10 a reviewer reads gateRegistry and believes four gates work — HIGH/MEDIUM. §7's third row and evaluator-spec.md §5.1/§5.2 state it; the recommendation is to de-register rather than fix."

changelog:
  - "CORRECTION PASS 2 (this pass). DISPOSITION: DESIGN_REVISION_COMPLETE. Revision 2 was returned as DESIGN_REVIEW_CHANGES_REQUIRED — 1 BLOCKING, 2 HIGH, 4 MEDIUM, 3 LOW. Every item addressed and itemised under correction_items_disposition. One spec recommendation is declined WITH EVIDENCE and the disagreement invite is stated (B-1-alt)."
  - "PASS 2 / BLOCKING B-1 — THE PARK ERASED ITS OWN DURABLE REASON, and three artifacts asserted the opposite as fact. design-review-gate.md §4.3/§5.1.1, design-revision.md §4.3 and this file's design_system_compliance and ux_accessibility_score all stated that the park 'carries a durable blockingReason', citing durable_workflow_engine.dart:222-225. THAT RANGE WRITES blockingReason: NULL for every target other than waitingForHumanDecision (:215-225), so the park hop erased the item's reason and wrote none. B1's signature — no decision, no park, no durable reason — survived under a new state name. FIXED: the writer is NAMED and it is not transition. DurableWorkflowEngine.requestHumanDecision takes the park's out-edge as its own policy evaluation (:614-622) and writes blockingHumanDecisionId and blockingReason ITSELF (:651-653); it is already production-called (apps/server/lib/src/triage/stalled_work_item_gate.dart:195-227), idempotent (:564-572), and lands the decision on the Needs You page (apps/control_plane/lib/router.dart:70-75). NOTHING in packages/workflow_store/** changes. The misattributed precedent is corrected too: work_item_transitions.dart:34-40 explains the WAY OUT of the feature park, not a reason, and the feature park has no durable reason either — so the property could never be inherited from it. NEW ASSERTIONS G14 (non-null, non-default blockingReason), G15 (non-null, resolvable blockingHumanDecisionId), G16 (the option set is exactly escalation's three). design-review-gate.md §3.5, §5.1.1a, §6."
  - "PASS 2 / B-1-alt — THE RECOMMENDED OPTION IS DECLINED WITH EVIDENCE, not silently. The spec recommended parking at waitingForHumanDecision rather than in a new state, on the grounds that it also closes H-2, and permitted the new state if the writer and the originating component are named — both now are. But the recommended option is not implementable as written, and it relocates the dead end rather than closing it. (1) agentCompleted has NO edge to waitingForHumanDecision: the in-edges are :51 :63 :351 :703 :709 :738, and apps/server/lib/src/triage/stalled_work_item_gate.dart:97-99 says so in its own words, with :40-42 giving the reason it declined to add one. (2) DECISIVELY — under Reading B the gate refuses route 3 for decisions raised by the item's OWN lanes, and on refusal resolveHumanDecision saves the decision as RESOLVED (:817) and throws (:821) before the copyWith that would move the item (:854), leaving it at waitingForHumanDecision holding a resolved decision id that requestHumanDecision REFUSES to re-raise (:563-580) and that no edge leads away from. So the operator would see 'Nothing needs you here' — the exact phrase at apps/server/lib/src/endpoints/work_item_action_endpoints.dart:880. P3 IS THE SINK, not a convenience. design-review-gate.md §5.1.1b; design-revision.md §12, §13.10."
  - "PASS 2 / HIGH H-2 — BOTH WRITERS NAMED. The park's out-edge is taken by requestHumanDecision, a shipped component with a production caller, not by 'somebody must'. The route-3 refusal that re-enters the park is originated by resolveHumanDecision (:758-761 computes targetFor, :820-841 refuses when the new guard fails) and caught by the human-decision endpoint, which is named as a required third file because it is outside the two transition-table files. design-review-gate.md §5.1.1a, §5.1.2."
  - "PASS 2 / HIGH H-3 — READING B IS DECIDED, NOT ASKED. .decisions/7f3e2a95-6c81-4d70-b215-8e94a0c7d382.yaml: RESOLVED, READING_B_CLAUSE_COVERS_EVERY_ROUTE, decided_by operator, 2026-10-17T13:40:00Z. This revision APPLIES it. THE 'DIFFERENT FIELD' DISPOSAL IS REMOVED — revision 2 argued Reading B partly on the ground that 'Reading A imports one from a different field of the same document', and the operator's rejected_alternative names that exact clause as a reason the reading was rejected. The operator's own reasoning is used instead: a clause that is not qualified is not narrowed by a rationale explaining why it was written. Revision 2's grounds 2-4 are retained as SUPPORTING argument only. The cost table is reconciled rather than left arguing against the design's own pick, as rejected_alternative also complains. The park's dead end — re-triage/re-plan/stop, none of them the design review — is recorded as SLICE 1.5, OWNER THE MANAGER, tied to FOLLOW_UPS F-55 which the decision names and this lane does not write (docs/** prohibited). And 1a's pinned content changed with the answer: the route-3 guard is REQUIRED and Reading A's alternative is closed, which the decision's own precondition states. design-review-gate.md §5.2, §5.2.2; design-revision.md §4.4, §8, R4, §11."
  - "PASS 2 / MEDIUM M-2 — the park moves to scheduler.dart:1823-1833, the transition's own catch. Revision 2 cited :1582-1599, which is the try around the four per-item READS and whose reason string is 'this item could not be read well enough to decide whether it should be reviewed or implemented' — literal compliance would file a refusal under a statement about readability. The transition's try is :1740-1843; the concurrent-writer catch is :1834-1843. :1582-1599 is still cited, correctly, for read isolation. design-review-gate.md §5.1.2."
  - "PASS 2 / MEDIUM M-3 — packages/scheduler/lib/src/scheduler.dart is ADDED to sub-slice 1b's file list. It is the actual route-1 context writer (:1741-1813) and its context at :1746 is a const LITERAL — context: const {'agentAvailable': true, 'capabilitiesMatch': true} — so workItemOrigin and approvedDesignRevisionId CANNOT EXIST until it becomes a computed map. Revision 2 specified a context supplier for a call site that cannot carry one, and the file appeared in no sub-slice's list. metadataMerge at :1809-1812 is cited as the existing precedent for passing per-item facts. design-review-gate.md §6, 1b."
