    finding: "THE OFFERED SET OF A HUMAN DECISION IS A PROPERTY OF THE DECISION INSTANCE, NOT OF ITS TYPE OR OF THE ENUM — and that is why a per-type option set IS expressible, which is what .decisions/5a90c1d3-8e47-4b26-9f0c-3d7a5b2e6c19.yaml's scope_warning asked this lane to establish from the data model rather than work around. HumanDecision.options is a List<HumanDecisionOption>? on the decision (platform_contracts/lib/src/types/human_decision.dart:55) and DecisionContext.availableOptions is a free-form List<String> on its context (:204); the engine documents availableOptions as 'the caller's own option ids, in the caller's order' and says a caller passing none records an empty list rather than a guess (durable_workflow_engine.dart:531-535). THE OPERATOR UI BUILDS ITS MENU FROM THOSE AND FROM NOTHING ELSE (apps/control_plane/lib/features/decision_detail/decision_detail_bloc.dart:31-38 — detail.options if non-empty, else detail.context?.availableOptions mapped) WITH NO ENUM FILTER ANYWHERE IN THAT PATH. HumanDecisionChoice.values IS ENUMERATED NOWHERE IN lib/ — all nine sites are in test/ (workflow_engine/test/engineering_rework_entry_state_test.dart:636, transition_consistency_test.dart:100 and :123, implementation_ready_edge_test.dart:299, transition_test.dart:1113; scheduler/test/triage_entry_state_drift_guard_test.dart:167, :360, :413, implement_feature_deferral_test.dart:119). CONSEQUENCE: a value absent from a decision's own option list CANNOT BE RENDERED FOR IT, so adding an enum value is scoped BY CONSTRUCTION to whichever raising call sites name it — strictly more expressive than a per-type set, which is therefore derivable rather than absent. THIS IS THE OPPOSITE OF THE FORBIDDEN WORKAROUND: nothing filters, because nothing needs to."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "A PER-TYPE PRESENTATION LAYER FOR HUMAN DECISION CHOICES ALREADY EXISTS IN PRODUCTION. decisionChoiceLabel(String wireValue, {String? fallback, String? decisionType}) at apps/control_plane/lib/shared/decision_choice.dart:32-57 keys on decisionType, and its `escalation` arm at :37-46 already relabels the same wire value per gate — its own doc comment at :28-31 records that the board labels `approve` 'Approve' on a design gate and 'Resume' on an escalation, and that only the words change, never the wire value submitted. USE: a new HumanDecisionChoice needs a per-type label arm here, and nothing about it is new architecture."
  - category: PROJECT_FACT
    authority: REPORTED TO MANAGER — apps/** is PROHIBITED_PATHS for this lane, so this is recorded, not corrected
    finding: "apps/control_plane/lib/shared/decision_choice.dart:12-19 HARDCODES knownDecisionChoices = {approve, reject, waive, rework, cancel, defer} — SIX values — against a HumanDecisionChoice enum that has NINE today and TEN after .decisions/5a90c1d3-… : fixed, still_broken and partially_fixed are ALREADY absent from it, and the file's own doc comment at :3-5 enumerates the six as though they were the enum's values. THIS IS A LIVE SUPERSEDED CLAIM IN PRODUCTION CODE — the L3 pattern this artifact set has produced seven times, the seventh being outside the artifact set entirely. IMPACT, WHICH IS PRESENTATION-ONLY AND THEREFORE NOT A ROUTING HAZARD: isKnownDecisionChoice gates the label lookup in TWO blocs (decision_detail_bloc.dart:40-42 and needs_you_bloc.dart, both using the same `isKnownDecisionChoice(o.optionId) ? o.optionId : (isKnownDecisionChoice(o.label) ? o.label : o.optionId)` fallback), so an unrecognised value still SUBMITS CORRECTLY — the fallback lands on o.optionId, which IS the wire — but decisionChoiceLabel then returns `fallback ?? wireValue` (:55) and the operator is shown caller prose instead of a mapped label. Concretely, a new choice added to the enum without a corresponding knownDecisionChoices entry is offered correctly and answered correctly, and merely LABELLED wrongly, on both operator surfaces. RECOMMENDED FOR THE OWNING LANE: derive the set from the enum, or add a drift assertion, rather than extending a hardcoded literal a fourth time."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "(waitingForHumanDecision, designNotRequired) IS THE ONLY EDGE AMONG THE THREE THE DESIGN-REVIEW PARK TOUCHES THAT CARRIES AN ESCALATION-INDEX BOUND, AND ITS OWN COMMENT NAMES THE BOUND AS WHAT MAKES ITS CYCLE SAFE. work_item_transitions.dart:528-565 — the edge ends with escalationIndexWithinLimitForDecisionTypes({engineeringReview, humanQaApproval}) at :559-563, and its comment at :517-522 states that 'designNotRequired -> agentExecuting -> agentCompleted -> reviewInProgress -> waitingForHumanDecision -> designNotRequired' is a cycle and 'every traversal of it requires a RESOLVED decision signed by a human decider, bounded by escalationIndexWithinLimitForDecisionTypes below. Nothing in it is automatic, so no unattended rework loop is created.' Its whitelist holds SIX pairs (:531-548; the guard call spans :530-549). The bound DELIBERATELY covers only two types: qaRework, qaWaiver and escalation are not added, because at :553-558 'the generic edge does not bound them either, and inventing a bound here would be new policy rather than a lockstep move'. CONSEQUENCE FOR A NEW OPERATOR-INVOKED LOOP: a re-triage arm routed here would be a FOURTH type reaching the edge unbounded. Defensible — every traversal is human-gated and visible — so whether it should be bounded is a PRODUCT DECISION, recorded as R14 rather than taken. *** PASS 6 CORRECTS THE CLAUSE THAT FOLLOWED THE DASH, because it was FALSE AND THIS ENTRY IS THE ONE THAT WOULD BE READ AS EVIDENCE: 'an operator-invoked loop differs in kind from escalation (a one-off provider failure)' is wrong. (escalation, approve) -> designNotRequired (human_decision_routing.dart:132-133) is the IDENTICAL operator-invoked loop to the identical target on this same edge, and escalation is EQUALLY absent from the bound's set. So the precedent is not weaker than it looks — it is a precedent for exactly this unboundedness, and a ceiling would be a change to a type already in that position rather than a new policy applied to a novel loop. The generalisable form, which is what a future lane needs: an operator-invoked loop on this edge is NOT distinguishable from an escalation's, and any bound added here would bound both. ***"
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A COUNT STATED IN PROSE IS INVALIDATED BY THE ACT OF APPENDING A ROW TO THE REGISTER IT COUNTS, AND CORRECTING ONE NUMBER IN SUCH A SENTENCE IS NOT THE SAME AS CHECKING THE OTHERS. Demonstrated four times in one four-artifact design set, and the fourth instance was inside the row that corrected the third. design-revision.md's §12 grew from eleven rows to thirteen while §12.1's summary sentence, §9.1's ledger cell and §16(11) continued to say 'eleven'; §12.1 grew from six rows to eight while the same three sites said 'six'; and the metadata register's verification_commands repeated both. The numbers were CORRECT WHEN WRITTEN and were invalidated by later passes appending rows — which is the part that makes this a structural finding rather than carelessness: no reviewer and no correcting pass can keep a hand-maintained count synchronised with a register that the correcting pass itself grows. PASS 4 CORRECTED TWO NUMBERS IN §16(11) AND MISSED THE OTHER TWO IN THE SAME SENTENCE, because it corrected the numbers it was already looking at rather than re-deriving the count from the table. THE GENERALISABLE RULE FOR A SELF-CORRECTING ARTIFACT SET: DO NOT STATE A COUNT OF A CORRECTIONS REGISTER IN PROSE ANYWHERE OUTSIDE THE REGISTER — or if a count is required for the reader, derive it at read time and say so. A corrections register that miscounts itself is not a corrections register, and a register whose own prose counts it will miscount itself once per pass, forever."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A TRUE CONCLUSION RESTING ON A CITATION THAT DOES NOT STATE THE PROPERTY IS THE SAME DEFECT AS A FALSE CONCLUSION, AND IT IS HARDER TO CATCH. In the same artifact set, pass 4 wrote that (escalation, rework) -> planning 'already has' its behaviour and cited human_decision_routing.dart:188-191 for it; :188-191 is '## THE TWO LOCKSTEP ARMS MOVED WITH OD-3' and does not mention (escalation, rework) or planning at all. The conclusion was CORRECT — escalationTargetFor(escalation, rework) does fall to `_ => null` at :214 — and the citation was hollow. A reviewer checking 'is this true?' passes it; only a reviewer checking 'does this range state this?' catches it. That is the dominant class M-1 already names (a range that exists, is in-file, and contains a real line but does not state the property; 8 of 13 rows), and this pass adds a second instance of it IN THE CLAUSE WRITTEN TO PREVENT IT — which is now the third time in this set that the most careful text contains the defect. RECOMMENDED ADDITION TO THE CITATION DISCIPLINE, alongside the existing pre-filters: for every load-bearing inference, record WHAT THE CITED RANGE SAYS IN THE SAME SENTENCE, so the claim and its support can be compared by a reader who does not open the file. That makes an unsupported citation visible on the page instead of only in the file."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — extended by this lane, not persisted
    finding: "A reviewer's orphan-string checklist has a demonstrated blind spot, and the evidence is in one artifact set. A grep for an orphaned slice number was clean in BOTH .md artifacts of a four-artifact design set and missed a present-tense superseded claim TWICE in the metadata register AND a third in a .md paragraph. Five instances of the same pattern — a superseded claim surviving as a live one — were caught in that set across four rounds, two of them inside the correction machinery itself and one in the very clause written to prevent it. THE GENERALISABLE RULE: A CHECKLIST FINDS WHAT IT WAS WRITTEN TO LOOK FOR, AND AN ORPHANED STRING IS NOT THE SAME OBJECT AS A STALE CLAIM. A sweep that read every artifact end to end found all five; the grep found none. Applies to the review checklist that will read this pass, and reported rather than persisted because it is a framework-workflow finding, not a product fact. *** PASS 5: THE COUNT IS NOW SEVEN, AND THE SEVENTH IS IN PRODUCTION CODE (apps/control_plane/lib/shared/decision_choice.dart:12-19, recorded above) RATHER THAN IN THE ARTIFACT SET — which is the sharpest form of the finding so far, because it means the pattern is not a documentation habit confined to design artifacts but a general one that design artifacts merely made visible. PASS 5 ALSO CONFIRMS PASS 4'S METHOD ON A NEW TARGET: reading all four artifacts found seven where a grep for the phrases this pass cared about ('three answers', 're-triage', 'reduction') would have found the surviving ones and missed the count rot and the malformed citation entirely. ***"
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "Two mechanical citation discriminators (the end line is inside the file; the cited range contains the quoted string) were proposed as a closure mechanism and are NECESSARY BUT NOT SUFFICIENT. Demonstrated on a sample: they catch a range 1103 lines past the end of a 440-line file, and a range ending one line short of the string it quotes — but NEITHER catches the case where the range exists, is in-file, and contains a real line that simply does not state the property it was cited for. That is the LARGEST class in the observed correction set (8 of 13 rows). A third mechanical check (the cited construct's name appears in the range) is also necessary and also insufficient. A MECHANICAL CHECK CATCHING TWO OF THREE INSTANCES OF THE DOMINANT CLASS IS WORSE THAN NONE, because it produces the confidence of automation with a third of the coverage. Proposes: if a mechanical citation check is adopted, it must be labelled a PRE-FILTER in the same sentence that proposes it, and the assertion rule must be stated as the mechanism alongside it."


  # ---------------------------------------------------------------------------
  # PASS 6 additions. Classified per docs/engineering/LEARNING_POLICY.md. NONE is persisted by this
  # lane: docs/** is PROHIBITED_PATHS. Reported to the Manager for routing.
  # ---------------------------------------------------------------------------
  - category: PROJECT_FACT
    authority: AUTO
    finding: "TWO OF THE THREE PRODUCTION OPTION IDS AT control_plane_service.dart:1831/:1837/:1842 ARE NOT HumanDecisionChoice WIRES, SO _resolvedOptionId'S FALLBACK IS LIVE IN PRODUCTION TODAY. The option ids are 'fixed', 'stillBroken' and 'partiallyFixed'; the wires are fixed (:39), still_broken (:40) and partially_fixed (:41) — packages/platform_contracts/lib/src/enums/human_decision.dart:33-41, wires at :43-45. _resolvedOptionId matches o.optionId == choice.wire and FALLS BACK to choice.wire (packages/workflow_store/lib/src/durable_workflow_engine.dart:1113), so for those two ids no offered option matches, the fallback fires, and the decision is persisted with a resolvedOptionId THE OPERATOR WAS NEVER SHOWN — with no error and no log line. The other cited raisers DO follow optionId == choice.wire (apps/server/lib/src/triage/stalled_work_item_gate.dart:201, 207; apps/server/lib/src/review/engineering_review_gate.dart:1647-1649; control_plane_service.dart:1831).GENERALISES FOR EVERY DESIGN THAT SPECIFIES AN OFFERED OPTION LIST: the convention 'optionId is the choice's wire' is intended and mostly kept, and is ALREADY BROKEN in this repository — so it needs an assertion (a drift test over production raisers), not a reviewer's diligence. A design that treats the convention as established by inspection will inherit the defect. NOT recorded in FOLLOW_UPS.md; control_plane_service.dart is under apps/**, PROHIBITED_PATHS for the design lane."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "(escalation, approve) -> designNotRequired IS AN OPERATOR-INVOKED LOOP, AND IT IS THE SAME ONE A re-triage ARM WOULD CREATE — which is why 'unlike escalation' is not an available distinction. packages/workflow_engine/lib/src/transitions/human_decision_routing.dart:132-133 routes it to designNotRequired; work_item_transitions.dart:528 is the identical edge the re-triage arm would use, guarded by decisionActorIsHuman() at :550, so both loops fire only when a human approves; and escalationIndexWithinLimitForDecisionTypes at :559-563 contains ONLY {engineeringReview, humanQaApproval}, so escalation is equally unbounded there. CONSEQUENCE FOR ANY FUTURE OPERATOR-CHOSEN LOOP ON THAT EDGE: a ceiling added there would bound escalation's loop too, not only the new one — so 'we bound this one because it is operator-invoked' is not a separable policy. The edge's own rule at :553-558 ('inventing a bound here would be new policy rather than a lockstep move', with qaRework, qaWaiver and escalation already unbounded) is the ground to argue from. This is the fourth occurrence of a correct conclusion reached by a false reason in one artifact set, and it was the Manager who found it first, independently, in FOLLOW_UPS.md F-65."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — extended by this lane, not persisted
    finding: "A GENERATED COUNT IS NOT AN EXECUTABLE MITIGATION IF THE GENERATOR'S OWN BOUNDARIES ARE HAND-TYPED, AND THIS WAS FOUND BY RUNNING IT RATHER THAN BY READING IT. In the same four-artifact design set, the fix for a nine-times-repeated count-rot defect was a runnable command that counted rows per register using awk range patterns ('### 12.3 :## 13.'). Adding a NEW register to that set, without editing the command, makes the unchanged command return the OLD register's count with the new register's rows silently absorbed — verified by execution: four-register form returned 13/8/9/13 where five-register returned 13/8/9/7/6. THE FAILURE IS WORSE THAN THE ONE IT REPLACED, because a generator that silently mis-counts looks machine-checked and so stops being questioned, whereas a prose number is visibly a prose number. THE DURABLE RULE IS THEREFORE STRONGER THAN 'GENERATE IT': A PROCESS THAT ADDS AN ARTEFACT TO A COUNTED SET MUST RE-DERIVE THE COUNTING TOOL'S OWN SELECTION CRITERIA, AND ANY COUNT THAT APPEARS IN PROSE SHOULD BE PASTED FROM A RUN AND NAMED AS A RUN RATHER THAN STATED. Generalises past design artifacts: any 'we generate this' claim should be checked by asking what happens when the set grows, and by running the tool in its un-updated form."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — extended by this lane, not persisted
    finding: "THE METADATA REGISTER IS THE BLIND SPOT, AND IT IS A PROPERTY OF SCORES AND LEDGERS RATHER THAN OF FORMATTING. Three times in this artifact set, a present-tense superseded claim survived in a field whose TYPE made it unlikely to be re-read: a ux_accessibility_score that still said 'three answers' while its sibling design_system_compliance field had been corrected for the same fact; a traceability.requirements_gaps entry that listed a decided question as an open gap; and a risk table row describing a loop as 'operator-invoked, unlike escalation' when the comparison was false. In every case the surrounding convention existed and was demonstrated elsewhere in the SAME FILE, so this is an inconsistent omission rather than a missing convention. THE OBSERVABLE DIFFERENCE FROM A BODY OF PROSE: a score field is read for its verdict, not re-derived from the source, so a reader has no reason to open the code that would falsify it. RECOMMENDATION FOR ANY SELF-CORRECTING ARTIFACT SET: treat SCORE FIELDS, GAP LISTS AND RISK ROWS as first-class sweep targets and require each to be re-derived from its source, because a field that summarises is a field that decays. Applies to this artifact set's own review checklist, and is reported rather than persisted because it is a framework-workflow finding."

