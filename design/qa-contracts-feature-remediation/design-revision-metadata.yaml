problem_statement: >
  HD-1 is resolved: allow completion, insert a design-review gate before implementationReady
  dispatches an IMPLEMENTER, and delegate the gate's shape to the design lane. The blocker
  brief (at 5afc230) declined to author the two QA contracts on three grounds, of which the
  Manager independently confirmed the third — no gate in this repository is evaluated by any
  production code, because nothing writes context['gateResults'] and
  allRequiredGatesPassed() therefore always fails. This revision proceeds under the decision
  and delivers three of the four delegated items in full: the evaluator, specified to the
  point of naming its insertion points and its ordering constraints; the design-review gate,
  specified as one guard on two existing edges, satisfied by a durable artifact query that
  already exists; and the missing-artifact backlog, each item carrying the gate it would
  justify. It declines the fourth — the two contracts — on evidence, and states the evidence.
  Three findings materially change the shape of the work. First, the design governance
  PERSISTENCE layer already exists (types, stores, migrations, a PostgreSQL implementation
  and a one-line readApprovedDesignRevisionForWorkItem query), so the HD-1 gate needs a
  producer, not a model — the blocked brief's framing understated this. Second, the four
  registered gate evaluators are not merely unenforced but would return a fabricated
  PASSING with an audit trail, so wiring the evaluator before replacing their validation
  would convert an honest notExecuted into a false green. Third, every work item that
  produces a reviewable commit and passes engineering review is stranded at qaInProgress,
  which is a live dead end on the main implementation lane that no FOLLOW_UPS entry records.

user_flows: >
  ALL FLOWS BELOW ARE OBSERVED AND CITED. No flow is designed or changed by this revision
  except the guard in FLOW E, which is specified and not built.

  FLOW A — feature intake (observed, CHANGED since the blocked brief). A human files a
  feature request; `WI-feature-<micros>` is minted
  (apps/server/lib/src/services/control_plane_service.dart:916) and a QA contract is
  provisioned from the product's declaration inside the creation transaction (:918-950).
  `WorkEntryTrigger.ensureWorkEntry(kind: featureIntake)` takes the first unconditional
  branch (work_entry.dart:390-392) and `_parkFeature` (:529-583) walks the item
  `draft -> planning -> planned -> featureIntakeParked` (:608-641). EXIT: the item sits at
  `featureIntakeParked`, which is in no JobDefinition's entryStates, so NO scheduler
  dispatches it. No agent execution, no AgentResult, no structured result. CHANGED: the
  blocked brief recorded this path parking at `planned` and being triaged as a defect; F-48
  (ddfbfff) gave the park its own state and the red test
  "the parked feature is invisible to the category-blind scheduler" is GREEN at e3634a0
  (executed). This is the single most consequential correction to the brief.

  FLOW B — design remediation (observed, unchanged). Triage classifies a defect
  `design_defect`; DesignRemediationWorkItemProvisioner.ensurePersisted creates
  `design-remediation-<defectId>` and `_advanceToPlanned` walks it `draft -> planning ->
  planned` and stops (lane_e_design_remediation_work_item.dart:449-492), recording
  EXTERNAL_DESIGN_GOVERNANCE_DEPENDENCY. EXIT: the item sits at `planned`.

  FLOW C — what actually happens to each (observed, executable, and the asymmetry). The two
  paths are no longer symmetric. `planned` IS in triageDefectDefinition.entryStates
  (triage_defect.dart:130), so FLOW B's item IS dispatched by sched-triage, hops to
  designNotRequired, runs AgentRole.triageDefect under triageDefectInstruction — whose
  DEFECT DETAILS block degrades to the item's own title with an EMPTY `EVIDENCE: []`
  (triage_defect.dart:223-231) while :274 tells the agent to cite evidence ids from it —
  and then has its result abandoned: _extractDefectId (:279-285) yields the work-item id,
  readDefect raises DefectNotFoundException (:122), and the catch returns the result
  unused (:124-132) with the job sitting `succeeded`. FLOW A's item is NOT dispatched at
  all. EXIT: FLOW B produces a healthy-looking job and no work; FLOW A produces no job.
  There is therefore no run to describe for FLOW A and an abandoned one for FLOW B.

  FLOW D — the walk the decision governs (observed, and specified in
  design-review-gate.md). implementationReady is the only state that dispatches an
  IMPLEMENTER (implement_feature.dart:112-114), reached by three edges: agentCompleted
  (:340-342) and agentFailed (:265), both automatic via completionRouteFor's NoCommitProduced
  branch (implementation_inflow.dart:437-440), and waitingForHumanDecision (:599-602),
  human. EXIT: the spec places one origin-conditional guard on the two automatic edges and
  deliberately not on the human one.

  FLOW E — what the design-review gate actually reads (observed). The gate reads
  context['approvedDesignRevisionId'], supplied after
  DesignGovernanceStore.readApprovedDesignRevisionForWorkItem(workItemId)
  (design_revision_store.dart:16-19; postgres_design_governance_store.dart:46-60, a
  SELECT ... WHERE status = 'approved' against a real migrated table). EXIT: null for
  every work item in existence, because nothing writes those rows. The gate is DECLARED,
  not PASSING, and it will refuse every intake item until the design lane is built — which
  is correct under HD-1 and is flagged in design-revision.md §13.2 rather than discovered in
  staging.

success_criteria: >
  A reviewer can re-derive every factual claim from the cited file:line at e3634a0, and
  from the three commands in design-revision.md §14, without running the platform and
  without touching the QA stack. The evaluator is specified well enough that an
  implementer needs no further design question except the two named in evaluator-spec.md
  §4.2. The gate is specified well enough that the only judgement left is placement, and
  two negative placement assertions (G5, G6) pin the two dead ends it could have shipped.
  The refusal on deliverable 3 is evidenced rather than asserted, and a reader who believes
  a contract should have been authored can find the specific missing artifact in
  design-revision.md §6 and see which gate it would justify. No reader can come away
  believing a gate in this repository is enforced: design-revision.md §7 states the state
  vocabulary three ways and evaluator-spec.md §6 defines it in four.

constraints: >
  DESIGN ONLY. No docker, no compose, no psql; the QA stack was not touched. No bare
  `git stash`, no `git checkout .`, no `git add -A`; explicit paths only. apps/**,
  packages/**, docs/**, docker/**, .github/**, Makefile and tooling/** were read and never
  written. docs/engineering/FOLLOW_UPS.md is the Manager's and was NOT modified — F-47
  already records B3. This revision is a NEW commit atop e3634a0; nothing was amended,
  rebased or reset. No gate may be proposed whose justification is a role name or a lane
  name rather than a cited consumer that reads the result. No claim of enforcement may rest
  on the existence of a qa_contract row.

acceptance_criteria: >
  AC-1 (deliverable 1) The evaluator is specified: who populates context['gateResults'],
  from what, at which point in the transition, and how a gate's config is read; naming the
  code that does it or stating it must be built and what it must do. SATISFIED:
  evaluator-spec.md §1 (both context keys the guard reads, including the vacuous-pass hole
  in qaContract), §2 (the transition and the fact that nothing takes it), §3 (the service,
  step by step, and the sourceColumn-must-never-be-a-query rule), §4 (the call site, the
  actor, and six fail-when-bypassed assertions), §5 (the ordering constraint and the one
  evaluator honestly specifiable today). Names the insertion points:
  guard_conditions.dart:267/274, work_item_transitions.dart:690-696,
  execution_coordinator.dart:1065-1073, qa_orchestration.dart:11-39, gate_registry.dart:19-23.
  AC-2 (deliverable 2) The design-review gate answers all four delegated questions —
  where in the graph, which actor, what for an item that never gets one, and whether
  defect-origin takes the same path. SATISFIED: design-review-gate.md §7 answers each in a
  row, and §3 proves why the design states cannot host the gate (three wired Schedulers only;
  no design-to-implementation edge; designApproved routes to triage;
  designInReview->designApproved does not exist). The invariant is enforced on both
  automatic routes, and the human route is deliberately left intact with the reason stated
  (§5.2).
  AC-3 (deliverable 3) The two contracts, authored from what the agents actually emit, or a
  stated refusal. REFUSED ON EVIDENCE, as the mandate permitted: design-revision.md §3.1
  (feature intake produces no execution at all — featureIntakeParked is in no
  entryStates), §3.2 (design remediation's run has its result abandoned at
  triage_processor.dart:124-132), §3.3 (no consumer on either path, so any
  config.requiredFields would be justified by nothing). Not a bare refusal: §6 names M5-M11,
  each with a location and the gate it would justify.
  AC-4 (deliverable 4) The result type, parser, instruction and AgentRole variants named,
  each with where it belongs. SATISFIED: design-revision.md §6 — M5 (design-lane producer),
  M6 (sched-design Scheduler), M7 (design->implementationReady edge), M8 (feature-intake
  JobDefinition), M9 (AgentRole per path), M10 (result type + parser + instruction),
  M11 (a real structural evaluator), plus the ordering constraint that M6/M5 without M7
  builds a loop.
  AC-5 Traceability, risks, explicit non-goals, implementation sequence in reviewable
  slices. SATISFIED: §9, §10 (ten risks, each with the consequence stated rather than
  mitigated away), §11, §8 (slice 0 is a Manager decision, then four mergeable slices).
  AC-6 The word DECLARED, not PASSING. SATISFIED: design-revision.md §7 states it three
  ways and adds a fourth level — the four registered gate types are not DECLARED but would
  be fabricated PASSING if wired; evaluator-spec.md §6 defines four levels in a table.
  AC-7 Every file:line verified against the tree at e3634a0. SATISFIED individually.
  design-revision.md §12 records five corrections to inherited inputs, including two wrong
  citations in the resume spec and three drifted line ranges in the blocked brief.
  AC-8 Never approve your own work. SATISFIED: design-revision.md §15 hands the artifact to
  an independent design-reviewer; approved_by is null.
  AC-9 Prefer a blocked result to an invented one. APPLIED SELECTIVELY, and the selection
  is argued rather than assumed: deliverables 1, 2 and 4 were specified in full rather than
  blocked, because the evidence to specify them honestly is present; deliverable 3 was
  refused rather than invented, because it is not. §13 lists all six items this revision
  did not fully address.

risk_assessment:
  level: 3
  rationale: >
    Level 3 (Major Workflow / navigation / IA change) is the correct level for the change
    being designed, and it is unchanged from the blocked brief's assessment — for the same
    reason: the level is not about a screen, it is about whether production code may begin
    being written from a request that has never been designed. Slice 1 changes what the
    platform is permitted to do unattended on two intake paths, and that affects the
    operator's mental model of what intake means. It is not a Level 2: Level 2 is a
    feature-level UX change affecting user behaviour, whereas this governs whether an
    IMPLEMENTER may be dispatched at all.
    The residual scope this revision actually delivers is documentation of a design, so
    the artifact itself carries no product-facing behaviour change — which is why the
    disposition is COMPLETE for the specification while the shipped behaviour change is
    gate on slice 1 and is strictly a REDUCTION in what the platform may do.
    HD-1 resolved the Level 3 question itself (ALLOW_COMPLETION_GATE_IMPLEMENTATION_ON_DESIGN_REVIEW).
    What remains delegated is the gate's shape, and the one element of that shape a human
    may still wish to own is flagged rather than decided: whether the human override on
    waitingForHumanDecision -> implementationReady (§5.2 of design-review-gate.md) is the
    intended reading of "unattended". This revision argues it is, from the decision's own
    rationale_given, and names the dead end that the alternative reading would create. It
    does not treat that argument as settled.
  risks:
    - "R1 the guard is treated as satisfied because its context key is supplied by a caller that did not read the store — HIGH. DurableWorkflowEngine.transition passes context to the policy (:173) and persists none of it (:211-233), so a context guard is exactly as strong as its writer. This is the platform's EXISTING model (qaContractExists, guard_conditions.dart:247). design-review-gate.md §4.4 states it as a property of the design and sub-slice 1b requires the supplier to be the only writer."
    - "R2 the evaluator is wired before _validateEvidence is replaced — MEDIUM/CRITICAL. All four registered evaluators would return QAGateStatus.passed with fabricated empty findings (gate_evaluator.dart:53-58 + the four collectors). evaluator-spec.md §5 makes this a hard ordering constraint with a named non-vacuity test. The one ordering in this revision that must not be violated."
    - "R3 the design-review gate strands an intake item — LOW/HIGH. A refusal leaves the item at agentCompleted, which sched-review picks up and which fails closed into a blocking human decision with no execution burned (design-review-gate.md §5.1). Proved structurally, not asserted."
    - "R4 a human cannot move an intake item forward at all — WAS HIGH, RESOLVED in this revision. The guard is deliberately NOT on waitingForHumanDecision -> implementationReady. Had it been placed on all three edges, that route's own decisionActorIsHuman() would have been permanently overridden by a gate nothing satisfies today, manufacturing a dead end."
    - "R5 the qaInProgress dead end goes unrecorded — MEDIUM/HIGH. Every item that commits, is engineering-reviewed and approved is stranded there, because allRequiredGatesPassed always fails and nothing dispatches from qaInProgress. Affects the MAIN implementation lane, not these two paths. Reported in full (design-revision.md §2.1) and routed to the Manager as slice 0; not designed here and FOLLOW_UPS.md not written."
    - "R6 the two contracts are authored anyway to close the ticket — MEDIUM/HIGH. This revision is the obstacle, and §6 gives the next lane a specification (which artifact justifies which gate) rather than a prohibition."
    - "R7 a future implementer adds designApproved -> implementationReady without M7 and creates a loop — MEDIUM/HIGH. design-revision.md §4.1 Fact 2 names the trap: designApproved is in triageDefectDefinition.entryStates, so an approved design routes to TRIAGE."
    - "R8 sourceColumn is interpolated into SQL — LOW/CRITICAL. It names a table and a column and arrives from operator-authored manifest JSON (product_registry_endpoints.dart:470-510). evaluator-spec.md §3.4 forbids it and requires the typed store reader."
    - "R9 M6/M5 land without M7 — MEDIUM/MEDIUM. Both are in slice 3 together, and §6 states the constraint."
    - "R10 a reviewer reads gateRegistry and believes four gates work — HIGH/MEDIUM. §7's third row and evaluator-spec.md §5.1/§5.2 state it; the recommendation is to de-register rather than fix."

changelog:
  - "revision 1 (initial revision of the brief). DISPOSITION: DESIGN_REVISION_COMPLETE with deliverable 3 declined on evidence."
  - "DELIVERABLE 1 — the QA gate evaluator, specified. Names the two context keys the guard reads (gateResults at guard_conditions.dart:267 AND qaContract at :274 — the second is unrecorded anywhere and is a vacuous-pass hole), the transition (qaInProgress -> qaPassed, :690-696), the fact that nothing takes it, the service contract, and the insertion point. Requires QAOrchestration.evaluate to be reused verbatim rather than re-derived."
  - "DELIVERABLE 2 — the design-review gate under HD-1. One new GuardCondition on TWO existing edges (agentCompleted -> implementationReady at :340-342 and agentFailed -> implementationReady at :265-267), origin-conditional on the work-item id prefix, satisfied by DesignGovernanceStore.readApprovedDesignRevisionForWorkItem. All four delegated sub-questions answered in design-review-gate.md §7."
  - "DELIVERABLE 3 — the two contracts: REFUSED ON EVIDENCE. Feature intake produces no agent execution at all (featureIntakeParked is in no entryStates); design remediation's run has its result abandoned at triage_processor.dart:124-132. No consumer exists on either path, so config.requiredFields would be justified by nothing."
  - "DELIVERABLE 4 — M5 through M11, each with a location and the gate it would justify, plus the ordering constraint that M6/M5 without M7 builds a loop."
  - "FINDING 1 — the design governance PERSISTENCE layer already exists: types (DesignRevision, DesignReviewResult, DesignFinding, DesignRevisionEvent, DesignRiskTier), stores with CAS and lineage, a 693-line PostgresDesignGovernanceStore, migrations, and readApprovedDesignRevisionForWorkItem. What is missing is a PRODUCER. The blocked brief's §6 and lane E's own comment at :125-127 ('no design_contract table, no DesignContractStore') are literally true and point at the wrong absence; a design built on that framing would have been substantially larger than necessary."
  - "FINDING 2 — the four registered gate evaluators would return a fabricated PASSING with an audit trail if wired today, because GateEvaluatorImpl._validateEvidence returns evidence.isNotEmpty and every collector returns a hardcoded empty finding. This inverts the naive plan ('wire the evaluator in and the gates start working') and is the reason the ordering constraint in evaluator-spec.md §5 exists."
  - "FINDING 3 — a live dead end nobody has recorded: qaInProgress is entered only from reviewApproved, has two out-edges, one of which requires a guard that can only fail and the other of which requires a qaExecutor that nothing dispatches. Every work item that commits and passes engineering review is stranded there. This is the main implementation lane, not these two paths; reported for the Manager, not designed here."
  - "FINDING 4 — the blocked brief's proof-by-execution is retired. 'the parked feature is invisible to the category-blind scheduler' is GREEN at e3634a0 (F-48/ddfbfff gave the park its own state). The brief's CONTRADICTION against F-45 is no longer live, and its Flow A no longer describes HEAD. The two intake paths are no longer symmetric, which changes what can be honestly designed for each."
  - "FINDING 5 — the guard reads TWO context keys, not one. Supplying gateResults without qaContract yields a vacuous pass, because requiredGates is then an empty iterable and .every() over it is true. A partially-wired evaluator looks enforced and judges nothing. Six fail-when-bypassed assertions are specified, of which V3 and V4 cover this and exist in no form today."
  - "CORRECTIONS to inherited inputs (design-revision.md §12): design-resume.md cites work_item_transitions.dart:657-662 for qaInProgress -> qaPassed, which is :690-696; it cites triage_processor.dart:272-276 for _extractDefectId, which is :279-285; FOLLOW_UPS.md §13 line 1073 carries the same off-by-29 citation and is Manager-owned so it is not corrected here. The blocked brief's §4.2 line table drifted by 3-7 lines throughout; its substance is correct."

