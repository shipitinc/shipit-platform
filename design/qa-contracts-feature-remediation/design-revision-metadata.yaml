    decision: "RETAIN intake-structured-result-admitted, unchanged, required: true, alongside the substantive gates."
    rationale: >
      The governing decision says it "stays registered and truthful" and forbids only describing
      it as a quality gate. Retaining it costs nothing and asserts something true; replacing it
