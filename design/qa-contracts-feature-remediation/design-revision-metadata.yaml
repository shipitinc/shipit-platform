hich pass 6 corrected; design-review-gate.md §5.2.2's 'Stated residual risk under the new order' row, corrected by this pass) *** — is stated in design-review-gate.md §0.2 and §5.2.2 rather than argued away, and remains this lane's live disagreement with the implemented order."
