  - "REVISION 2 / HIGH H3 — deliverable 3's refusal is RESTATED PER PATH. Revision 1's stated criterion was 'a gate's config.requiredFields is justified by a consumer that reads them', then silently applied '…and its outcome is later used'. Feature intake: declined because NO EXECUTION EXISTS (correct as written; NOT rebuilt — the review confirmed it). Design remediation: declined on M10 only, against an ESTABLISHABLE SHAPE — triageDefectInstruction is a fixed template naming the JSON schema (triage_defect.dart:222-276), _parseTriageResult reads the four required keys (triage_processor.dart:199-222), saveTriageResult persists durably (:102-105). Also now stated: BOTH paths provision a product-declared qaContractId today (control_plane_service.dart:918-950 stamped :940; lane_e_design_remediation_work_item.dart:283 stamped :294), so 'DOES NOT EXIST' is true only of PATH-SPECIFIC contracts. design-revision.md §3.3, §7."
  - "REVISION 2 / HIGH H4 — the undelegated clause is SPECIFIED AND MARKED FOR REVIEW, not decided. HD-1's delegated clause is unconditional ('What is NOT delegated is that an IMPLEMENTER dispatch must be preceded by a satisfied design review for items originating on these two paths'); revision 1 read 'unattended' out of the RATIONALE and left the human edge unguarded. This revision specifies the guard ON waitingForHumanDecision -> implementationReady (:599-602), argues it on four grounds, states its cost (four HumanDecisionRouting pairs route to implementationReady and none can reach an implementer until slice 3), and marks it in a BOXED CALLOUT as the single point an independent design-reviewer must judge — with both branches spelled out. design-review-gate.md §5.2; design-revision.md §4.4, R4. **SUPERSEDED BY PASS 2 / H-3**: the operator has since DECIDED the reading (.decisions/7f3e2a95-6c81-4d70-b215-8e94a0c7d382.yaml, READING_B_CLAUSE_COVERS_EVERY_ROUTE, 2026-10-17), so it is no longer a question this lane holds open — and revision 2's 'different field' argument, quoted above, is the clause the operator's rejected_alternative names as a reason for rejecting the reading. It is removed, not restated."
  - "REVISION 2 / B1+H4 INTERACTION — after B1 the human route becomes materially reachable, so the two cannot be sequenced independently: sub-slice 1a MUST add both route-1 and route-3 guards in ONE commit (R12). design-review-gate.md §5.3."
  - "REVISION 2 / MEDIUM M1 — the brief's M2 (a design-remediation JobDefinition, design-brief.md:317) had NO successor. Revision 1 asserted M1-M4 were 'carried forward as M8-M10'; that silently dropped M2. RESTORED as M12, with an explicit statement that M10 does not subsume it. design-revision.md §6."
