review_disposition: >
  NOT SELF-APPROVED. Handed to an independent design-reviewer. approved_by is null and this lane sets
  no status beyond DRAFT — advancing lifecycle state is not a specialist's to do (AGENTS.md:
  "Specialists do not independently advance lifecycle state"). READY_FOR_INDEPENDENT_DESIGN_REVIEW is
  set because the artifact is complete and reviewable, NOT because its conclusions are correct.
  THIS ARTIFACT HAS NOW BEEN THROUGH THREE REVIEWS. Two found the same CLASS of error in the same
  place: a load-bearing property asserted with a citation that did not support it, and no assertion
  that would fail if the property were absent. The third — of pass 2 — found NO blockers and NO highs,
  confirmed the pass-2 corrections, and returned metadata, argument and a sequencing reversal.
  PASS 3 ADDED THE FOURTH INSTANCE OF THE CLASS, IN PASS 3'S OWN ARTIFACTS, AND THE REVIEW DID NOT
  RAISE IT: implementation_inflow.dart:1543-1578, a range 1103 lines past the end of a 440-line file,
  cited twice for a load-bearing property (design-revision.md §12.1 PASS3-1). THE LESSON IS THE ONE
  THIS ARTIFACT KEEPS LEARNING: A REVIEW THAT CONFIRMS ~60 CITATIONS IS NOT A GUARANTEE ABOUT THE
  ONES IT DOES NOT NAME, AND A WELL-FORMED file:line IS NOT EVIDENCE — IT IS WHAT INVITES ACCEPTANCE
  WITHOUT OPENING.
  PASS 4 — FOUR REVIEWS HAVE NOW RUN. The first three found the SAME CLASS of error in the same place
  (a load-bearing property asserted with a citation that did not support it, and no assertion that
  would fail if the property were absent), plus the L3 pattern (a superseded claim surviving as a live
  one) FIVE TIMES IN THIS ARTIFACT SET — twice in the correction machinery itself, and once in the very
  clause written to prevent it. The fourth review found G17 written over a field that does not exist and
  a sub-slice that could not land. THE OPERATOR HAS NOW DECIDED THE FORK (3e5a7c26-…), so this pass
  applies rather than argues.
  THE PASS-4 SPECIFIC AND THE ONE THAT SHOULD DRIVE THE REVIEW: the dispatch's orphan-1.5 sweep was
  clean in BOTH .md artifacts and missed BOTH instances of the stale claim it was looking for in THIS
  register, AND missed a third in design-revision.md §4.2. A GREP FINDS AN ORPHANED STRING, NOT A
  STALE CLAIM. Pass 4's sweep read all four artifacts end to end. THAT IS A FINDING ABOUT THE CHECKING
  AND IT APPLIES TO THE CHECKLIST THAT WILL READ THIS PASS.
  PASS 5 — FIVE REVIEWS HAVE NOW RUN AND THE FIFTH CONFIRMED EVERYTHING LOAD-BEARING: no blockers, and
  the normative slice-1 specification at design-review-gate.md §6 1a verified citation-by-citation; the
  four HIGH, three MEDIUM and two LOW it did raise were ALL summary artifacts disagreeing with their own
  source, and every one is addressed in correction_items_disposition (H1-H4, M1-M3, L1, L2).
  PASS 6 ADDED THE ONE THING THAT CHANGES WHAT AN ASSERTION REQUIRES: G18 NOW PINS EACH ARM'S TARGET.
  §8 of the .md artifact said "two targetFor arms" in the present tense while three exist, and no
  assertion failed when the third was absent — an implementer omitting reTriage -> designNotRequired
  gets a null target and an item saved resolved and never moved. THIS IS THE FOURTH TIME IN THIS SET
  THAT A LOAD-BEARING PROPERTY HAD NO FAILING ASSERTION, AND THE FIRST TIME THE PROPERTY WAS THE
  OPERATOR'S OWN RULING RATHER THAN THIS DESIGN'S.
  TWO THINGS PASS 6 ESTABLISHED THAT THE PREVIOUS ROUNDS ASSERTED AND NOBODY CHECKED. FIRST, the false
  premise: two of the three production option ids at control_plane_service.dart:1831/:1837/:1842 are
  NOT HumanDecisionChoice wires, so _resolvedOptionId's fallback at :1113 is LIVE IN PRODUCTION TODAY
  rather than hypothetical — which makes G16/G17(c) stronger, not weaker, and replaces pass 5's
  weakest form of the argument with the repository's own counter-example. SECOND, the mitigation for
  the count-rot defect: the generator was run, and pass 5's four-register form, unchanged, returns
  13/8/9/13 against the same file the five-register form counts 13/8/9/7/6 — so a generated count is
  not by itself an executable mitigation when the generator's own boundaries are hand-typed.
  THE REVIEWER'S STANDING OBSERVATION APPLIES TO PASS 6 AS MUCH AS TO PASS 5: A CORRECT CONCLUSION
  REACHED BY A FALSE REASON IS STILL A DEFECT, BECAUSE THE NEXT READER INHERITS THE REASON. HIGH-2 was
  exactly that, and the Manager found it first and independently in FOLLOW_UPS.md F-65 (corrected at
  4a7c1a3). In pass 6 the same sentence appeared in THREE places in the .md artifacts and FOUR MORE in
  this register — every instance the by-reading sweep found that the review did not name was here,
  which is now the fourth recorded time this register has been the blind spot.
  In priority order (design-revision.md §16 carries the long form; design-review-gate.md §5.2.2
  carries the artefact-level list). **PASS 6 ADDS ONE ITEM AT THE HEAD OF THIS LIST, BECAUSE IT IS
  THE ONLY ONE THAT CHANGES WHAT AN ASSERTION MUST REQUIRE:**
  (0) **G18's new TARGET clause — is it the right assertion for "the operator's own ruling is not
      quietly unimplemented"?** §8 of the .md artifact said "two targetFor arms" in the present tense
      while three exist; G18 pinned the count and the membership and therefore an implementer who
      omitted reTriage -> designNotRequired satisfied it, and `targetFor` returned null, and the item
      was saved resolved and never moved. G18 now pins all four targets. **A reviewer should decide
      whether pinning targets belongs in G18 (the arm-set assertion, which this pass chose) or in G17(a)
      (which already pins one arm's reachability and would then own all four) — the two are not
      equivalent, because G17(a) is keyed on `designApproved` by the reversal's invariant while G18 is
      keyed on the four-answer menu.** That is a genuine seam choice and it is this lane's.
  (a) G17(a)/(b)/(c) — does it state .decisions/b81f40c7-…'s invariant, or a weaker restatement of it?
      PASS 4 REWROTE IT because the previous form asked a parsed HumanDecisionOption list for a
      decisionType field that does not exist (human_decision.dart:156-159) and asserted nothing about
      blockingHumanDecisionResolved (guard_conditions.dart:425-428) — an assertion that could never go
      green. FIRST because it is the only load-bearing property in this pass whose assertion this pass
      rewrote, and the reviewer's specific question is whether G17(b) is a SUFFICIENT ORDERING GATE or
      the ordering needs one that fails before 2d rather than at it.
  (b) design-review-gate.md §6 sub-slice 1a — the arm set and the three registration sites. The SHAPE
      question is DECIDED (3e5a7c26-…). What remains this lane's: three park answers rather than four
      (a product-facing reduction, design-revision.md §13.14), the two edge-whitelist registrations,
      and the per-arm escalationTargetFor disposition — especially that (designReviewRequest, rework)
      must get NO arm.
  (c) design-review-gate.md §5.1.1a — is the new "the order is load-bearing" argument right? It rests
      on durable_workflow_engine.dart:219-221 (transition nulls the id) and :564-584
      (requestHumanDecision throws for a resolved one). It is the strongest POSITIVE argument for the
      distinct state this artifact has, and it is new.
  (d) design-review-gate.md §5.1.1b — the REJECTION of the correction spec's recommended option, now
      at :816-841 and :564-584. The load-bearing NEGATIVE claim, and everything else rests on it. The
      independent review CONFIRMED it, so it is fourth rather than first — but a confirmation is not
      the same as this lane having shown it.
  (e) design-review-gate.md §5.1.2 — is the route-3 chain right, and is identifying the
      type-discrimination as WORK right? (workflow_endpoints.dart:168-174 is a generic catch.)
  (f) G14/G15/G16 — and G16's WIDENING, which this pass changed from 'exactly three' to 'exactly the
      set §6 1b specifies'. A reviewer should check the widened form still pins something.
  (g) design-review-gate.md §5.2 — is Reading B (DECIDED, 7f3e2a95-…) applied completely, and is
      G5-prime's SIX the right pair count?
  (h) THE SEQUENCING IS NOT ON THIS LIST, and that is deliberate. b81f40c7-… decided it, and
      design-review-gate.md §0.2 preserves the merits argument this lane lost because the decision's
      own authority_note says it "is recorded and is not dismissed". Re-arguing merits against a
      decision made on authority changes nothing without a new human decision. THE ONE DISAGREEMENT
      THAT SURVIVES INTO THE IMPLEMENTED ORDER — an unconsumed human-facing answer for the slice-1 →
      slice-2 window — is R13, and a reviewer who thinks that is itself a dead end should make it.
  (i) design-revision.md §2.1 and §2.1a against the tree, §3.3's per-path split, §6's M12 — unchanged
      from earlier passes and not re-litigated here.
  (j) THE DISCIPLINE, not the content: §12 carries eleven pass-2 corrections (TEN this lane's own
      errors), §12.1 carries six more and §12.2 carries nine. Decide whether this design holds to it
      everywhere, INCLUDING in the parts pass 4 rewrote — a rewrite of a document whose history is
      superseded claims is exactly where a new one is introduced, and pass 4 proved it twice. AND NOTE
      §12's M-1 correction: the two mechanical citation discriminators catch two of three instances of
      the DOMINANT class, so they are pre-filters, not the mechanism. The mechanism is the assertion
      rule, and a property without one is the defect.
  (k) THE STALE CLAIMS PASS 4 SUPERSEDED, AS A SET: design-review-gate.md §5.2.2's "the matching
      escalationTargetFor arm" (B-2), its "no NEW enum value is needed" (:1020), §6 2d's "the park
      itself raises HumanDecisionType.escalation", design-revision.md §4.2's "No new HumanDecisionType",
      §8's dangling fragment, §16(11)'s stale count, and this file's two present-tense SLICE-1.5
      claims. A reviewer should confirm each supersession MARKER is present and each stale text is
      preserved VERBATIM — the convention this register has used since M-B, and the one whose absence
      is the defect.

