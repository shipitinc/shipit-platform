  #
  # It is WITHDRAWN, not reworded, because Reading A is not merely out of fashion — it was
  # REJECTED. .decisions/7f3e2a95-6c81-4d70-b215-8e94a0c7d382.yaml records
  # resolution.selected: READING_B_CLAUSE_COVERS_EVERY_ROUTE, decided_by: operator,
