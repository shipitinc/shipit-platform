review_disposition: >
  NOT SELF-APPROVED. Handed to an independent design-reviewer. approved_by is null and
  this lane sets no status beyond DRAFT — advancing lifecycle state is not a specialist's
  to do (AGENTS.md: "Specialists do not independently advance lifecycle state").
  READY_FOR_INDEPENDENT_DESIGN_REVIEW is set because the artifact is complete and
  reviewable, NOT because its conclusions are correct.
  THIS ARTIFACT HAS NOW BEEN THROUGH TWO FAILED REVIEWS, and the reviewer should treat
  it as a FRESH review rather than a re-check of points already argued. Both previous
  reviews found the same CLASS of error in the same place: a load-bearing property
  asserted with a citation that did not support it, and no assertion that would fail if
  the property were absent. Design Revision 2 was produced to stop that class and
  committed the class inside the fix. The reviewer should assume it is present a third
  time and look for it specifically.
  In priority order (design-revision.md §16 carries the long form):
  (a) design-review-gate.md §5.1.1b — the REJECTION of the correction spec's recommended
      option, parking at waitingForHumanDecision instead of a new state. It is a negative
      claim and everything else depends on it. It rests on durable_workflow_engine.dart:816-841
      and :563-580. If that reasoning is wrong, the park shape is wrong.
  (b) §5.1.1a and §5.1.2 — whether the named writers exist and are reachable. Revision 2's
      failure was a property asserted with no writer; the correction names one, and the
      check is whether it is real, not whether it sounds right.
  (c) G14/G15/G16 — whether those are the right assertions, and whether some property of
      the park still has none.
  (d) §5.2.2 — whether the dead-end hand-off is honest or a deferral dressed as one. The
      operator called it a precondition ("must be solved FIRST"); this design sequences it
      behind slice 1 and FLAGS THAT AS ITS OWN JUDGEMENT.
  (e) §5.2 — whether Reading B (now DECIDED, 7f3e2a95-…) is applied completely, and
      whether G5-prime's SIX is the right pair count.
  (f) design-revision.md §2.1 and §2.1a against the tree, §3.3's per-path split, §6's M12
      — unchanged from the previous pass and not re-litigated here.
  (g) THE DISCIPLINE, not the content: design-revision.md §12 now lists eleven corrections,
      nine of them this lane's own errors, six of them of one kind — citing a range as
      evidence for a property that range does not state. The correction proposed is not
      "check the lines", because revision 2 checked them. It is that every load-bearing
      property gets an assertion that fails on its absence. Decide whether this design
      holds to that everywhere.

