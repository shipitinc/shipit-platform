    - "[WITHDRAWN IN PLACE — NOT A LIVE FINDING. TEXT BELOW IS PRESERVED VERBATIM FROM PASS 2 AND IS RETAINED FOR AUDIT ONLY. See the comment block above and design-revision.md §12 / §12.1 M-B.] R4 a human cannot move an intake item to an IMPLEMENTER at all — HIGH, AND RE-OPENED. Revision 1 recorded this as 'RESOLVED' on the strength of the narrower reading of HD-1, and that was wrong: it re-opened on H4. Revision 2 specifies the guard ON the human edge (:599-602), because HD-1's delegated clause is unconditional, and nothing writes an approved design_revision until slice 3 (M5-M7). So today a human's options at the park are re-triage, re-plan or stop (the table at design-review-gate.md §5.2). This is SPECIFIED BEHAVIOUR, not an unresolved risk — but it is the reason §5.2 is marked for independent judgement, and it is escalated to the Manager as a consequence to record BEFORE slice 1 ships (slice 0)."
