  #
  # The withdrawal is asserted only against that decision file, which was read in full. Nothing here
  # depends on this lane's judgement that Reading A was weak.

  - category: ARCHITECTURE_DISCOVERY
    authority: HUMAN — RESOLVED, not flagged. Decision 7f3e2a95-6c81-4d70-b215-8e94a0c7d382.yaml.
    finding: >
      RESOLVED. HD-1's delegated clause governs EVERY route to implementationReady. The decision
      records resolution.selected: READING_B_CLAUSE_COVERS_EVERY_ROUTE, decided_by: operator,
      decided_at: 2026-10-17T13:40:00Z, with the rationale "The clause is unqualified … and a
      clause that is not qualified is not narrowed by a rationale that explains why it was written.
      Reading A was rejected", and a rejected_alternative that names the design's cost table as
      "the strongest evidence against its own pick".
      APPLIED IN THIS REVISION: the guard sits on waitingForHumanDecision -> implementationReady
      (:599-602) as well as the one automatic route (:340-342). P3 is retained because route 3's
      refusal needs a sink (design-review-gate.md §5.1.1b). Sub-slice 1a MUST land both guards in one
      commit — the decision's own precondition states this and says slice 1 may not begin until it is
      recorded, which it now is.
      THE COST, accepted and NOT accepted as a resting state: nothing writes an approved
      design_revision until slice 3, so an intake item's park offers re-triage / re-plan / stop and
      none is "do the design review". The decision's consequence calls that dead end something that
      "must be solved FIRST … it makes it the next thing to build", and names FOLLOW_UPS F-55 as
      where it is recorded. It is slice 1.5, owner the Manager; docs/** is PROHIBITED_PATHS for this
      lane and F-55 was not written here.
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A guard condition reads only `context`, and DurableWorkflowEngine.transition passes context to the policy (packages/workflow_store/lib/src/durable_workflow_engine.dart:173) and persists NO GUARD-SUPPLIED KEY — it reads back only humanDecision (:216) and blockingReason (:223), both of its own. Every guard in work_item_transitions.dart is therefore exactly as strong as the component that fills its context. qaContractExists is the same shape. This is the platform's enforcement model and it is usually described as though the guard were self-verifying; design-review-gate.md §4.4 states it plainly instead. Worth an executable declaration of which component writes each guard context key. CORRECTION (MEDIUM M5): this entry previously read 'persists NONE of it' AND attributed DurableWorkflowEngine.transition to packages/workflow_engine/lib/src/states/workflow_state.dart. Both were wrong — the file is packages/workflow_store/lib/src/durable_workflow_engine.dart, and design-review-gate.md §4.4 already stated the corrected form while this entry did not follow."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "engineeringReviewMissingArtifact STANDS DOWN for a no-commit producer at agentCompleted: engineering_review_gate.dart:2860-2871 logs 'engineering-review-missing-artifact-stands-down' and RETURNS — no decision, no park, no durable reason. standDown.owns is true unconditionally for such a producer (_implementationInflowOwns, :2210-2228), and server.dart:1416-1421 documents it in prose. Consequence for any design that assumes 'a refused agentCompleted item is surfaced as a blocking human decision': it is not. The refused route repeats every tick. Directly contradicted by the composition-root comment at server.dart:539-543, which still describes the drain as turning blockedArtifactMissing into a blocking human decision — that comment and the handler now disagree. NOT recorded in FOLLOW_UPS.md."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "work_item_transitions.dart declares edges that no caller takes, and the table is not a map of what happens. Two verified at c8fd361: (1) agentFailed -> implementationReady (:265) has no caller — the only completionInflowFrom in the repository is {agentCompleted} (implement_feature.dart:117) and the inflow filters on it (scheduler.dart:1522); (2) reviewApproved -> qaInProgress (:651) has no caller — reviewApproved is in no entryStates, its only in-edge is human (:425), and no production code transitions to it, so the main implementation lane is stranded at reviewApproved, not at qaInProgress. Every production call to transition(to: implementationReady | reviewApproved | qaInProgress) is in a *_test.dart. server.dart:1327-1330 records the repository shipping this shape once already."
  - category: ARCHITECTURE_DISCOVERY
    authority: HUMAN — RESOLVED. Decision 7f3e2a95-6c81-4d70-b215-8e94a0c7d382.yaml. SUPERSEDES the
      Reading A entry this list previously carried (MEDIUM M5).
    finding: "HD-1's delegated clause is UNCONDITIONAL — 'What is NOT delegated is that an IMPLEMENTER dispatch must be preceded by a satisfied design review for items originating on these two paths' — while its rationale_given speaks of no 'unattended' dispatch. Revision 1 read the qualifier out of the rationale and left waitingForHumanDecision -> implementationReady unguarded; the review found that unsupported. RESOLVED by the operator 2026-10-17 as READING_B_CLAUSE_COVERS_EVERY_ROUTE (7f3e2a95-…). This revision APPLIES it rather than asking for it. The cost is named and accepted: HumanDecisionRouting.targetFor routes four pairs to implementationReady (:103-104, :107-108, :109-110, :119-120), and with the guard on, none can reach an implementer for these two origins until the design lane exists."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "DurableWorkflowEngine.transition writes blockingReason and blockingHumanDecisionId ONLY when the target is waitingForHumanDecision, and writes NULL otherwise (packages/workflow_store/lib/src/durable_workflow_engine.dart:215-225). So ANY state a guard parks an item into via transition carries NO durable reason and NO blocking decision id — it erases whatever the item had. The component that does write both is requestHumanDecision, which takes the (from, waitingForHumanDecision) edge as its own policy evaluation (:614-622) and sets blockingHumanDecisionId: id and blockingReason: question ?? 'Awaiting human decision' itself (:651-653); it is idempotent for an item already pending (:564-572) and is already production-called (apps/server/lib/src/triage/stalled_work_item_gate.dart:195-227). GENERALISES: any design in this repository that promises 'the item parks with a reason' must name which API writes it, and the answer is never transition. NOT recorded in FOLLOW_UPS.md."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "There is NO (agentCompleted, waitingForHumanDecision) edge. The in-edges to waitingForHumanDecision are work_item_transitions.dart :51 (featureIntakeParked), :63 (designInReview), :351 (reviewInProgress), :703 (qaPassed), :709 (qaFailed), :738 (deploying). apps/server/lib/src/triage/stalled_work_item_gate.dart:97-99 documents this in its own words and :40-42 records why it did not add one ('Picking a different type here would have meant adding an edge, which is a state-machine change and not this lane's to make')."
  - category: ARCHITECTURE_DISCOVERY
    authority: INDEPENDENT REVIEW — routed to the Manager as slice 1.5, NOT decided here
    finding: "A refused item parked at waitingForHumanDecision is UNRECOVERABLE, which is why the design-review park needs a distinct state. durable_workflow_engine.resolveHumanDecision saves the decision as RESOLVED (:817) and then throws when the transition is refused (:820-841) — the copyWith that would move the item is at :854, after the throw. The item is left at waitingForHumanDecision holding a resolved decision id, which requestHumanDecision then REFUSES to re-raise (:563-580, 'Work item is already waiting for a blocking human decision'), and there is no (waitingForHumanDecision, reviewInProgress) edge to leave by. RunnableWorkEvaluator returns blocked for that state (runnable_work.dart:169-171) and apps/server/lib/src/endpoints/work_item_action_endpoints.dart:880 records the operator-visible consequence by name — an item in that position must read 'Nothing needs you here'. CONSEQUENCE FOR EVERY FUTURE PARK IN THIS PLATFORM: a park must be a state the item can LEAVE, not merely one that is not dispatched."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A non-vacuity suite can pass a reason-less park. G7 asserted that a refused item LEAVES agentCompleted within one tick; nothing asserted what it CARRIES, so a park with a null blockingReason passed every assertion and three artifacts stated the reason as fact with a citation (durable_workflow_engine.dart:222-225) that said the opposite. The missing assertions are about PAYLOAD, not movement: non-null non-default blockingReason, a non-null resolvable decision id, and an explicit option set. This has now happened twice in one design (revision 1 asserted a drain that stood down; revision 2 asserted a reason that was nulled), so the rule generalises: every load-bearing property needs an assertion that FAILS ON ITS ABSENCE, and citing a precedent for a property requires reading that the cited range states it — not merely that the range exists."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A registered-but-unreachable evaluator is worse than an absent one when its predicate is a constant. Four gate types sat in GateRegistry with content-blind validation and unreachable call sites; nothing flagged that the registry's contents were not a list of working gates. The executable-capability-declaration mechanism proposed in design/capability-parity/ would have caught it, and remains unbuilt. Generalises the F-45/F-15 lesson recorded in the blocked brief."

