governing_decision_menu: 5a90c1d3-8e47-4b26-9f0c-3d7a5b2e6c19
  # THE PARK'S MENU. RESOLVED, FOURTH_CHOICE_VALUE, decided_by: operator, 2026-10-17T15:10:00Z.
  # This is the FIFTH operator decision in force in this artifact set, and the most recent. It REVERSES
  # pass 4's merge: the park's menu is FOUR coherent answers, and re-triage is a DISTINCT choice again.
  #
  # WHAT IT REVERSES, QUOTED: "Nine EXISTING HumanDecisionChoice values cannot express four coherent
  # answers, and the design lane merged 're-triage' into 'put it back in the lane', leaving three.
  # That silently removed a genuine operator choice: re-triaging a parked item would become
  # cancel-and-refile, losing the item's history and the durable reason it was parked. HD-1 delegates
  # the park's handling to the design lane, but a product-facing menu reduction is not that delegation."
  # INVARIANT: "The operator's menu for a parked design-review item must remain four coherent answers.
  # A design that cannot express them must escalate, as this one did, rather than merge two into one
  # and report the reduction as resolved."
  #
  # THE NEW VALUE: HumanDecisionChoice.reTriage('re_triage'), declared in the SECOND enum of
  # packages/platform_contracts/lib/src/enums/human_decision.dart (the HumanDecisionChoice enum,
  # :32-52; nine values at :33-41 today, wire constructor :43-45, fromWire :47-51). The wire is
  # snake_case like every other wire in that enum, and it is the optionId the park's raising call site
  # must use, because _resolvedOptionId matches optionId against choice.wire
  # (durable_workflow_engine.dart:1108-1113) and FALLS BACK TO choice.wire when no option matches
  # (:1113). Pass 4's G16 already pinned optionId == choice.wire for exactly this reason; with a
  # fourth choice it matters more, because re_triage is the first optionId in this design with NO
  # existing shipped precedent to copy.
  #
  # *** THE SCOPE_WARNING IS THE CLAIM THAT DECIDED WHETHER THIS PASS ESCALATES, AND IT WAS ESTABLISHED
  # FROM THE DATA MODEL INSTEAD OF ASSUMED. THE ANSWER: A PER-TYPE OPTION SET IS EXPRESSIBLE, so this
  # is NOT the escalation the decision contemplates. FOUR VERIFIED FACTS: ***
  #  (1) THE OFFERED SET IS A PROPERTY OF THE DECISION, NOT OF THE ENUM OR THE TYPE.
  #      HumanDecision.options is a List<HumanDecisionOption>? on the decision
  #      (human_decision.dart:55) and DecisionContext.availableOptions is a free-form List<String> on
  #      its context (:204). The engine's own doc says availableOptions is "the caller's own option
  #      ids, in the caller's order" and that a caller passing none records an empty list rather than
  #      a guess (durable_workflow_engine.dart:531-535). EVERY PRODUCTION RAISER SUPPLIES ITS OWN LIST
  #      — ['acknowledge','investigate'] (provider_health_monitor.dart:449),
  #      ['fixed','stillBroken','partiallyFixed'] (control_plane_service.dart:1827). A PER-INSTANCE SET
  #      IS STRICTLY MORE EXPRESSIVE THAN A PER-TYPE ONE, so a per-type set is derivable from it. That
  #      is the answer to the decision's question.
  #  (2) THE OPERATOR UI BUILDS ITS MENU FROM THAT LIST AND FROM NOTHING ELSE.
  #      apps/control_plane/lib/features/decision_detail/decision_detail_bloc.dart:31-38 —
  #      sourceOptions = detail.options != null && detail.options!.isNotEmpty ? detail.options! :
  #      (detail.context?.availableOptions ?? const []).map(...). NO ENUM FILTER ANYWHERE IN THAT PATH,
  #      so a value absent from a decision's list cannot be rendered for it.
  #  (3) HumanDecisionChoice.values IS ENUMERATED NOWHERE IN lib/ — all nine sites are in test/
  #      (workflow_engine/test/{engineering_rework_entry_state,transition_consistency,
  #      implementation_ready_edge,transition}_test.dart, scheduler/test/
  #      {triage_entry_state_drift_guard,implement_feature_deferral}_test.dart). NOTHING IN lib/ ITERATES
  #      THE ENUM TO BUILD A MENU. So the park's fourth answer is scoped to the park BY CONSTRUCTION,
  #      NOT BY FILTERING — the opposite of the workaround the decision forbade.
  #  (4) A PER-TYPE PRESENTATION LAYER ALREADY EXISTS IN PRODUCTION.
  #      decisionChoiceLabel(String wireValue, {String? fallback, String? decisionType})
  #      (decision_choice.dart:32-57) keys on decisionType, and its `escalation` arm (:37-46) already
  #      relabels the same wire value per gate — its doc comment records the board showing `approve`
  #      as "Approve" on a design gate and "Resume" on an escalation.
