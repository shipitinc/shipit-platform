  AC-10 (this pass) Every citation this pass TOUCHED is re-verified against the tree at 90b6f5f,
  and the commands are listed in verification_commands. SATISFIED: design-revision.md §14.3. The
  review confirmed ~60 citations as sound and they were NOT rebuilt; only ranges this pass altered
  were re-read, which is the discipline asked for rather than a full re-verification.
  AC-11 (this pass) No spec item is complied with silently. SATISFIED: exactly one is answered
  against its recommendation (B-1-alt, parking at waitingForHumanDecision instead of a new
