    - "deliverable 3 — the two contracts → design-revision.md §3, declined on evidence with the evidence cited; §3.1 (no execution exists for feature intake), §3.2 (the design-remediation run's result is abandoned), §3.3 (no consumer, so requiredFields is unjustifiable)"
    - "deliverable 4 — result type, parser, instruction, AgentRole variants, each named and located → design-revision.md §6 M5-M11"
