review_disposition: >
  NOT SELF-APPROVED. Handed to an independent design-reviewer. approved_by is null and
  this lane sets no status beyond DRAFT — advancing lifecycle state is not a specialist's
  to do (AGENTS.md: "Specialists do not independently advance lifecycle state").
  READY_FOR_INDEPENDENT_DESIGN_REVIEW is set because the artifact is complete and
  reviewable, NOT because its conclusions are correct. This revision was itself produced
  from a failed review, so the reviewer should treat it as a fresh review and not as a
  re-check of the points already argued.
  In priority order, the reviewer should judge:
  (a) points_for_independent_review.HD1-UNDELEGATED-CLAUSE-READING — THE reading of HD-1.
      Not whether the argument is well-made but whether the operator's text supports it.
      This is the one point deliberately left open, and if it is wrong, §4.1, §5.1, §5.2 and
      sub-slices 1a/1d are all wrong and the gate is a different gate.
  (b) design-review-gate.md §5.1 — whether designReviewRequired is the right answer to the
      BLOCKING finding, or whether the honest answer is to change the review drain's
      stand-down instead. The latter is an architecture change behind a resolved decision
      (92d567e3-…) and this lane cannot make it.
  (c) G7 — whether "the item LEAVES agentCompleted within one tick" is sufficient, or whether
      the park must additionally be proven unre-enterable. The reviewer identified the
      absence of this class of assertion; it should confirm the replacement closes it.
  (d) design-revision.md §2.1 and §2.1a against the tree. These corrected dead-end locations
      were asserted by the prior review and adopted here; if either is wrong, slice 2c's
      widened shape is wrong.
  (e) §3.3's per-path split — whether declining design remediation on M10, against an
      ESTABLISHABLE SHAPE, is still the right call now that the reasoning is stated rather
      than inferred. The prior review's H3 held that the shape was establishable and that
      revision 1 had silently tightened its own criterion. If a contract is authorable after
      all, this revision is incomplete on its central mandate.
  (f) §6's M12 — whether restoring the brief's M2 is a complete repair or a partial one, and
      whether other brief items were also dropped under the same "carried forward" sentence.
  (g) THE DISCIPLINE, not the content: this revision's H3 fix is the thing most worth
      checking. Revision 1's error was not a wrong fact — the instruction and parser it
      cited are real and do run — it was a decision RELABELLED as a non-decision, which is
      what let five live contradictions survive. Wherever this revision says "corrected" or
      "restated", check that the evidence is in the same place as the claim.

durable_discoveries:
  - category: PROJECT_FACT
    authority: AUTO
    finding: "No QA gate in this repository is evaluated by any production code. `rg gateResults packages apps` returns 3 hits inside guard_conditions.dart itself (the guard that reads it) and 7 in *_test.dart — zero producers in production. allRequiredGatesPassed() can therefore only fail. Confirms and extends F-47."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "qaInProgress is a live dead end on the MAIN implementation lane. It is entered only from reviewApproved (:651-654); its two out-edges are qaInProgress->qaPassed (:690-696, requires the guard that always fails) and qaInProgress->qaFailed (:697-702, requires ActorType.qaExecutor); and no JobDefinition lists qaInProgress in entryStates, so nothing dispatches from it. Every work item that produces a reviewable commit and passes engineering review is stranded there. NOT recorded in FOLLOW_UPS.md."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "The four registered gate evaluators (gate_registry.dart:19-23) would return QAGateStatus.passed unconditionally if invoked: GateEvaluatorImpl._validateEvidence returns evidence.isNotEmpty (gate_evaluator.dart:53-58), evidence gains one entry per evidenceTypes element (:31-39), evidenceTypes is required and non-null (qa_contract.dart:72,80), and all four collectors return hardcoded empty findings (static_analysis issues:[]; test_coverage has no coverage value at all; security_scan vulnerabilities:[]; performance benchmarks:[]). Wiring the evaluator without replacing this converts an honest notExecuted into a false green with an audit trail."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "The design governance persistence layer EXISTS and is usable: packages/design_governance with CAS, lineage and idempotency; PostgresDesignGovernanceStore (693 lines) against tables created by migrations 20260928233022000 and 20261012145629000; and readApprovedDesignRevisionForWorkItem (design_revision_store.dart:16-19; postgres_design_governance_store.dart:46-60). What is missing is a PRODUCER: PostgresDesignGovernanceStore is instantiated nowhere in apps/server/lib/server.dart, and server.dart constructs exactly three Scheduler instances (sched-triage, sched-review, sched-impl) — designRevisionDefinition and designReviewDefinition are declared and exported but never instantiated."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "The design lane and the implementation lane are disconnected in the transition graph: no edge runs from any design state to implementationReady, whose three in-edges are agentCompleted (:340), agentFailed (:265) and waitingForHumanDecision (:599). designApproved's only out-edge is -> agentExecuting (:111-114), and designApproved is in triageDefectDefinition.entryStates (triage_defect.dart:128) — so an approved design routes the item into TRIAGE, not implementation. defaultImplementFeatureDefinition (scheduler.dart:3196-3203), the one definition listing designApproved, is not wired."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "featureIntakeParked (F-48, ddfbfff) made the two intake paths asymmetric. A feature now parks at featureIntakeParked (work_entry.dart:543, :608-641), a state in no JobDefinition's entryStates, so no agent executes for it and there is no result to describe. design-remediation-* still parks at planned (lane_e_design_remediation_work_item.dart:449-492), which IS in triageDefectDefinition.entryStates, so its run still happens and its result is still abandoned (triage_processor.dart:279-285 then :124-132). The blocked brief applied one finding to both paths; that was correct at 5afc230 and is no longer."
  - category: ARCHITECTURE_DISCOVERY
    authority: HUMAN — flagged, not decided by this lane
    finding: "allRequiredGatesPassed reads TWO context keys, not one: gateResults (:267) and qaContract (:274). Supplying gateResults without qaContract leaves requiredGates an empty iterable, and .every() over an empty iterable is true — a VACUOUS PASS. A partially-wired evaluator therefore looks enforced and judges nothing. Two of the six assertions in evaluator-spec.md §4.3 (V3, V4) exist to close this and exist in no form today."
  - category: DESIGN_DISCOVERY
    authority: HUMAN — HD-1 resolved; shape delegated and designed here
    finding: "The HD-1 gate is specified as one origin-conditional guard on the two AUTOMATIC in-edges of implementationReady, satisfied by an approved design_revision row, and deliberately NOT on the human-driven edge. Placing it on all three would let the guard's own decisionActorIsHuman() on :604-624 be permanently overridden by a gate nothing satisfies today, manufacturing a dead end — the failure the gate was meant to prevent. Faithful to HD-1's rationale_given, which asks for no UNATTENDED dispatch."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A guard condition reads only `context`, and DurableWorkflowEngine.transition passes context to the policy (durable_workflow_engine.dart:173) and persists NONE of it (:211-233). Every guard in work_item_transitions.dart is therefore exactly as strong as the component that fills its context. qaContractExists is the same shape. This is the platform's enforcement model and it is usually described as though the guard were self-verifying; design-review-gate.md §4.4 states it plainly instead. Worth an executable declaration of which component writes each guard context key."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "engineeringReviewMissingArtifact STANDS DOWN for a no-commit producer at agentCompleted: engineering_review_gate.dart:2860-2871 logs 'engineering-review-missing-artifact-stands-down' and RETURNS — no decision, no park, no durable reason. standDown.owns is true unconditionally for such a producer (_implementationInflowOwns, :2210-2228), and server.dart:1416-1421 documents it in prose. Consequence for any design that assumes 'a refused agentCompleted item is surfaced as a blocking human decision': it is not. The refused route repeats every tick. Directly contradicted by the composition-root comment at server.dart:539-543, which still describes the drain as turning blockedArtifactMissing into a blocking human decision — that comment and the handler now disagree. NOT recorded in FOLLOW_UPS.md."
  - category: PROJECT_FACT
    authority: AUTO
    finding: "work_item_transitions.dart declares edges that no caller takes, and the table is not a map of what happens. Two verified at c8fd361: (1) agentFailed -> implementationReady (:265) has no caller — the only completionInflowFrom in the repository is {agentCompleted} (implement_feature.dart:117) and the inflow filters on it (scheduler.dart:1522); (2) reviewApproved -> qaInProgress (:651) has no caller — reviewApproved is in no entryStates, its only in-edge is human (:425), and no production code transitions to it, so the main implementation lane is stranded at reviewApproved, not at qaInProgress. Every production call to transition(to: implementationReady | reviewApproved | qaInProgress) is in a *_test.dart. server.dart:1327-1330 records the repository shipping this shape once already."
  - category: ARCHITECTURE_DISCOVERY
    authority: HUMAN — flagged, routed to an independent design-reviewer
    finding: "HD-1's delegated clause is UNCONDITIONAL — 'What is NOT delegated is that an IMPLEMENTER dispatch must be preceded by a satisfied design review for items originating on these two paths' — while its rationale_given speaks of no 'unattended' dispatch. Revision 1 read the qualifier out of the rationale and left waitingForHumanDecision -> implementationReady unguarded; the review found that unsupported. This revision specifies the unconditional reading (the guard goes on the human edge) and marks it, at design-review-gate.md §5.2, as the single point an independent design-reviewer must judge. The cost is named: HumanDecisionRouting.targetFor routes four pairs to implementationReady (:103-104, :107-108, :109-110, :119-120), and with the guard on, none can reach an implementer for these two origins until the design lane exists."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A non-vacuity suite that asserts only that a guarded route is NOT taken cannot distinguish 'refused and parked' from 'refused and vanished'. G1/G2 in revision 1 were satisfied by a stand-down dead end. The missing assertion is the one about ABSENCE OF PROGRESS: after a refusal, the item must have LEFT the guarded-from state within one tick, and a second attempt must be idempotent. Generalises to every guard in this repository, all of which assert that a transition does not happen and none of which assert that the item then goes somewhere."
  - category: WORKFLOW_IMPROVEMENT
    authority: INDEPENDENT REVIEW — reported, not persisted
    finding: "A registered-but-unreachable evaluator is worse than an absent one when its predicate is a constant. Four gate types sat in GateRegistry with content-blind validation and unreachable call sites; nothing flagged that the registry's contents were not a list of working gates. The executable-capability-declaration mechanism proposed in design/capability-parity/ would have caught it, and remains unbuilt. Generalises the F-45/F-15 lesson recorded in the blocked brief."

