points_for_independent_review:
  # The mechanism this lane uses INSTEAD of human_decisions_required. Revision 2 had exactly one
  # entry, an OPEN QUESTION. This pass replaces it with the two things a reviewer must actually
  # check, neither of which is the settled reading.
  - id: HD1-READING-APPLIED-FAITHFULLY
    question: >
      Reading B is decided (.decisions/7f3e2a95-…). Did this design APPLY it correctly and
      completely, and is the mechanism it chose the right one for a decision that chose only a
      scope?
    decided_by_operator: >
      READING_B_CLAUSE_COVERS_EVERY_ROUTE, decided_at 2026-10-17T13:40:00Z. The clause covers every
      route to implementationReady. Reading A rejected on the ground that "a clause that is not
      qualified is not narrowed by a rationale that explains why it was written."
    what_this_lane_applied: >
      The guard is on waitingForHumanDecision -> implementationReady (:599-602) as well as the one
      automatic route (:340-342). Sub-slice 2a pins both in one commit, which the decision's own
      precondition requires. P3 is retained. Reading A's alternative — drop the route-3 guard, restore
      P3, declare four decision pairs a deliberate bypass — is CLOSED.
    what_is_still_this_lane_to_be_judged_on: >
      The mechanism. Specifically design-review-gate.md §5.1.1b, which REJECTS the correction spec's
      recommended option of parking at waitingForHumanDecision instead of a new state, on two verified
      grounds: agentCompleted has no edge to waitingForHumanDecision (stalled_work_item_gate.dart:97-99
      says so explicitly), and decisively, a route-3 refusal leaves the item at waitingForHumanDecision
      holding a RESOLVED decision id (durable_workflow_engine.dart:816-841 saves the decision then
      throws before the copyWith at :854) which nothing can re-raise (:564-584) and no edge leads away
      from. The spec permits the distinct state on condition that the writer and the originating
      component be named; both are — requestHumanDecision (:651-653) and resolveHumanDecision's
      caller. If a reviewer reads those ranges differently, the park shape is wrong and P3 exists for
      no reason.
  - id: G17-THE-REVERSALS-INVARIANT
    question: >
      FIRST ON THE LIST. Does G17(a)/(b)/(c) state the invariant .decisions/b81f40c7-… requires, or a
      weaker restatement of it? The decision's `invariant`, verbatim: "NO item may be parked at
      designReviewRequired before the decision raised there offers a 'do the design review' answer.
      … This invariant is the whole point of the reversal and must be asserted, not assumed."
      PASS 4 REWROTE IT, BECAUSE THE PASS-3 FORM COULD NOT GO GREEN AND SAID NOTHING ABOUT REACHABILITY.
      The previous G17 asked a parsed HumanDecisionOption list for a `decisionType` field that does not
      exist (human_decision.dart:156-159), and asserted nothing about blockingHumanDecisionResolved —
      which is the strict whitelist that decides whether the arm moves the item at all
      (guard_conditions.dart:425-428). It is now three obligations: G17(a) the arm exists AND the
      target edge admits the pair; G17(b) the park may not acquire an in-edge while G17(a) is red;
      G17(c) the raising call site offers it, with optionId == choice.wire.
      THE REVIEWER SHOULD PRESS TWO THINGS SPECIFICALLY. First: the seams this artifact was offered as
      alternatives — the option list, the edge set, the routing table — are now all three obligations of
      one assertion, so is the split right? Second, and sharper: is G17(b) really the ORDERING assertion,
      or does the ordering need a gate of its own that fails BEFORE 2d rather than at it? The artifact's
      position is that G17(b) suffices because a violation requires P2/P3, which only 2d adds.
    why_it_is_first: >
      It is the only new load-bearing property in this pass. Without an assertion at all, the reversal
      would be exactly the defect this design has produced twice: a property asserted in a decision and
      in three artifacts, with nothing that fails when it is absent. This is the FIRST time the L3
      pattern has been caught in the very clause that corrects it, so it is the one most likely to be
      live again.
    not_decided_here: true
  - id: SLICE-1-MECHANISM
    question: >
      Second, and the question has CHANGED SHAPE since pass 3. .decisions/3e5a7c26-… has DECIDED that
      the park's decision type is a NEW HumanDecisionType and may not reuse escalation or designApproval,
      so "new enum value or designApproval?" is no longer open — and the reviewer who thought a new type
      was required, or that re-using designApproval conflates a design APPROVAL with a request to PRODUCE
      a design, is now on the record as RIGHT and is answered by the decision.
      ~~WHAT REMAINS THIS LANE'S, AND WHAT THE REVIEWER SHOULD PRESS: (a) THE ARM SET. Three answers —
      approve -> designApproved, rework -> planning, cancel -> cancelled — where pass 3 specified four.
      That reduction is a PRODUCT-FACING change this lane decided inside HD-1's delegation, on the
      evidence that the nine HumanDecisionChoice values cannot carry four coherent park answers and that
      the merged-away target is the one §5.2.1 itself calls a non-terminating cycle. If a reviewer thinks
      four answers are right, the correction is a NEW HumanDecisionChoice — which 3e5a7c26 did NOT
      authorise, so it would need a second human decision rather than an implementation choice.~~
      *** PASS 5: THE OPERATOR TOOK EXACTLY THAT SECOND HUMAN DECISION AND RULED THE OTHER WAY.
      (.decisions/5a90c1d3-…, FOURTH_CHOICE_VALUE, operator, 2026-10-17T15:10:00Z.) The arm set is
      FOUR and is no longer this lane's to press. WHAT REMAINS THIS LANE'S, REWRITTEN: (a) is no
      longer the arm set but the FOURTH ARM'S TARGET — reTriage -> designNotRequired is the one arm
      whose target §5.2.1 itself calls a non-terminating cycle, and the reviewer should press whether
      that is the right thing to route an operator who wants the item reconsidered. (a') and NEW: the
      RE-TRIAGE CEILING — designReviewRequest is deliberately not added to that edge's
      escalationIndexWithinLimitForDecisionTypes bound (work_item_transitions.dart:553-558's own rule,
      four other types already unbounded there), which leaves an operator-invoked loop unbounded. That
      is product policy, recorded as R14 rather than taken. ***
      (b) THE REGISTRATION SITES, of which the decisions' own consequences name two of four: THREE
      blockingHumanDecisionResolved whitelists — work_item_transitions.dart:75-80, :643-648 and
      :530-549 (the third added by pass 5 for reTriage -> designNotRequired) — PLUS the presentation
      registration in apps/control_plane/lib/shared/decision_choice.dart:12-19 and :32-57 that a new
      HumanDecisionChoice needs and a new HumanDecisionType does not.
      (c) THE escalationTargetFor DISPOSITION PER ARM, especially that (designReviewRequest, rework)
      must get NO arm — rework is the one choice :196-199 does not protect, so its inertness rests on
      `_ => null` at :214, and an implementer who "completes the lockstep" would start escalation
      accounting silently on a re-plan answer. *** PASS 5 STATES THE SHORT-CIRCUIT TABLE EXPLICITLY:
      THREE of the four arms are protected by :196-199 (approve, cancel, reTriage) and ONE is not
      (rework). reTriage IS on the protected side, so the fourth answer does not create a fourth
      unprotected arm. Its hazard is the EDGE instead: designNotRequired carries a bound that makes an
      implementer think the answer is already escalation-counted when it is not and must not be. ***
      (d) PASS 5 ADDS THE SCOPE DERIVATION AS A REVIEWABLE CLAIM, because the entire no-escalation
      decision rests on it: the offered set is a property of the DECISION INSTANCE, the operator UI
      builds its menu only from it, HumanDecisionChoice.values is enumerated nowhere in lib/, and a
      per-type label layer already exists in production. Four facts, all in governing_decision_menu.
    not_decided_here: true
  - id: THE-ORDER-WAS-OVERRIDDEN-ON-AUTHORITY
    question: >
      Not whether the order is right — it is decided in b81f40c7 and this pass applies it. Whether this
      pass makes it VISIBLE that the override was on authority rather than on reasoning, and whether the
      merits argument it preserved is a faithful record of what was overridden.
    what_the_merits_argument_was: >
      That the GATE (now slice 2) should land first: it is a strict reduction in what the platform may
      dispatch, and it leaves the item visible on the Needs You page with a real reason and a real
      pending decision — strictly better than the current silent route (a refused intake item at
      agentCompleted whose only consumer stands down, engineering_review_gate.dart:2860-2871) and than
      revision 2's reason-less park. The independent review AGREED with this on the merits.
    why_it_is_not_on_the_priority_list: >
      Re-arguing merits against a decision made on authority changes nothing without a new human
      decision. Spending a review on it would be the reviewer's time in the wrong place. The argument is
      preserved verbatim at design-review-gate.md §0.2, and the decision's own authority_note says it
      "is recorded and is not dismissed".
    the_disagreement_that_SURVIVES: >
      The implemented order leaves, for the slice-1 → slice-2 window, a HumanDecisionType and a routing
      arm that NO GUARD CONSUMES — an answer an operator is offered that changes nothing about whether
      an item may reach an implementer. This lane calls that additive and harmless. A reviewer who
      thinks an unconsumed human-facing answer is ITSELF a dead end should make that finding. It is R13.
    owner_if_disagreed_with: >
      The Manager, as the holder of both decisions and of docs/engineering/FOLLOW_UPS.md — which is
      PROHIBITED_PATHS here. F-55 and F-56 now EXIST (0bfb6fb) and were READ, not written, by this lane.
  - id: PARK-REASON-ASSERTIONS
    question: >
      Revision 2's BLOCKING failure was a property asserted with no assertion behind it. Are G14, G15
      and G16 the right replacement, or does another property of the park still have no assertion?
    why_this_exists: >
      revision 2 asserted "the park carries a durable reason", citing durable_workflow_engine.dart:222-225
      — which writes blockingReason: null for every target other than waitingForHumanDecision. Three
      artifacts asserted the opposite as fact. G7 asked whether the item MOVED; nothing asked what it
      CARRIED, so the reason-less park passed every assertion. G14 (non-null, non-default
      blockingReason), G15 (non-null, resolvable blockingHumanDecisionId) and G16 (the option set is
      exactly escalation's three) exist to close that class, not that instance.
    not_decided_here: true

