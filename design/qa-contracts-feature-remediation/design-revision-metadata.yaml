  governing_human_decision: "92d567e3-da03-4c43-99f4-e3726472f0ab"
    # PRODUCT · RESOLVED · DESIGN_SUBSTANTIVE_GATES_FIRST · operator · 2026-10-18.
    # Its `scope_note` verbatim: "Dispatchable as an ordinary design lane with independent
    # review, under the Gate-D4 approved design/qa-contracts-feature-remediation/. No further
    # human gate is required to run that design." This revision IS that design, which is why it
    # raises no HUMAN_DECISION_REQUIRED of its own.

  risk_level: 3
  risk_name: "Major Workflow Change"
  risk_rationale: >
    Per DESIGN_GOVERNANCE.md:92-99. This revision redefines what `qaPassed` MEANS on two lanes,
    adds a guard clause that fails closed where it previously passed vacuously, and specifies
    six new gate types registered on a governed path. Gate D4 is HUMAN_DECISION_REQUIRED at
    Level 3. This lane does NOT grant that approval and does not treat its own completion as
    it: the artifact goes to INDEPENDENT DESIGN REVIEW first, and human approval follows the
    review, not this lane.

  what_a_pass_asserts:
    feature_lane: >
      A commit exists at a recorded revision; every path it touched matches the lane's declared
      owned paths and none matches a declared prohibited path; platform-VERIFIED evidence
      (EvidenceKind.platformVerifiedEvidence, never agentClaimedEvidence) exists bound to that
      execution; every declared check ran under the EXACT declared command and reported passed;
      and the revision engineering review approved IS the revision the commit produced. No
      agent-authored field participates in any of the five.
    remediation_lane: >
      The defect the item names resolves in durable storage; every evidence id the classification
      cites exists AND belongs to that defect; and the classification is durably recorded rather
      than discarded.
    risk_asymmetry: >
      Opposite failure modes, non-interchangeable evidence. The feature lane's risk is a false
      green on CODE THAT SHIPS, and its substance is only obtainable by RUNNING something
      (commit, validator, revision identity). The remediation lane's risk is a false RECORD ABOUT
      A DEFECT that scopes every later fix, and its substance is only obtainable by
      CROSS-REFERENCING durable rows. A commit proves nothing about whether a cited evidence id
      exists; a resolvable defect id proves nothing about whether the code that fixes it builds.
      Neither gate set is a subset of the other, which is why a single merged list would be a
      list whose members are individually vacuous on one of the two lanes.

  new_gate_types:
    # Six require an evaluator to be WRITTEN:
    - "implementation-artifact-provenance   (F1 — falsifies on HEAD unmoved / delta unreadable)"
    - "change-scope-confinement             (F2 — falsifies on a changed path outside the declared owned set, or inside the forbidden set)"
    - "platform-verified-evidence           (F3 — falsifies when every row is agentClaimedEvidence, or there are no rows, or rows are bound to another execution)"
    - "declared-validation-outcome          (F4 — falsifies when checkName matches but the COMMAND does not; or a declared check is absent; or one failed)"
    - "revision-identity-match              (F5 — falsifies when the reviewed revision differs from, or is null/empty relative to, the produced revision)"
    - "triage-defect-existence              (R1 — falsifies when the cited defect does not resolve)"
