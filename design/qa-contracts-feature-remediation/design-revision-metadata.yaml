  - "PASS 2 / LOW L-1 — (escalation, approve) is :619-622; :618 closes humanQaApproval/reject. blockingHumanDecisionResolved is :604-623; :624 is decisionActorIsHuman(). Conclusion unchanged. design-review-gate.md §4.1, §6."
  - "PASS 2 / LOW L-2 — triage-clarification-routing is required: false (lane_g_triage_qa_contract.dart:222), deliberately so per its own comment at :216-218; only :175 and :202 are required. evaluator-spec.md §5.3 said 'both are required: true' and §6 called it one of 'the other two required gates'. Conclusion unaffected — triage-evidence-grounding IS required and has no evaluator — but the honest reading is 'one required gate is unsatisfiable', not 'two'. evaluator-spec.md §5.3, §6."
  - "PASS 2 / LOW L-3 — the log an operator will actually see is now NAMED, not just the one avoided. A parked item is neither at agentCompleted nor in engineeringReviewDefinition.entryStates, so the review handler takes its else arm and logs engineering-review-missing-artifact-unexpected-state (:2898-2905) EVERY TICK. Harmless, but recorded as expected-not-a-fault, with stalled_work_item_gate.dart:129-133 (stall.already-parked) cited as the shipped pattern that answers such a log rather than rides it. design-review-gate.md §7; design-revision.md §4.3."
  - "PASS 2 / ADDITIONAL — §4.4 and §4.5 of design-revision.md were BOTH numbered 4.4 (the human route, and defect-origin items). The second is renumbered §4.5 and cross-references updated. Not raised by any review; it is a defect in this lane's own artifact that a reader following §4.4 would have hit."
  - "PASS 2 / ADDITIONAL — recorded that escalation is RAISED NOWHERE IN PRODUCTION today (only routing arms and the escalation-index computation at durable_workflow_engine.dart:996). The park would be its first raiser. A new USE of an existing type, not a new type, which is what keeps it inside slice 1 — but 'the park uses an existing decision type' and 'the park introduces the first production use of that type' are different statements and only the second is a surprise. design-review-gate.md §6, 1d; design-revision.md §11."
  - "PASS 2 / NOT REBUILT — B1's original stand-down fix (the park existing at all, so the repeating silent loop is broken) is confirmed sound and untouched; the BLOCKING finding above is a different defect. Also preserved: G7-G13 and the explicit withdrawal of G1/G2 as evidence; H1, H2-of-revision-1, H3-of-revision-1, M1-M4 of revision 1; and the ~60 citations the review confirmed. Only ranges TOUCHED by this pass were re-verified."
  - "REVISION 2 (initial revision of the brief). DISPOSITION: DESIGN_REVISION_COMPLETE with deliverable 3 declined on evidence."
  - "REVISION 2 / BLOCKING B1 — the design-review gate's refusal sink DID NOT EXIST. Revision 1 claimed a refused item 'stays at agentCompleted … which fails closed into a blocking human decision'. engineeringReviewMissingArtifact STANDS DOWN for a no-commit producer (engineering_review_gate.dart:2860-2871, :2210-2228; server.dart:1416-1421), so the refused route repeated every tick and nothing ever happened — and revision 1's G1/G2 were satisfied by that dead end. FIXED by specifying a park: a new WorkItemState designReviewRequired with one named way out (-> waitingForHumanDecision), modelled row-for-row on featureIntakeParked (work_item_transitions.dart:31-53). The non-goal 'Not a new WorkItemState' is WITHDRAWN. NEW ASSERTION G7: a refused intake item must be at designReviewRequired, NOT agentCompleted, within one tick. **PARTLY SUPERSEDED BY PASS 2**: the park was right; the durable reason it was said to carry was not."
  - "REVISION 2 / HIGH H1 — agentFailed -> implementationReady is NOT an automatic route and has NO caller. The only completionInflowFrom is {agentCompleted} (implement_feature.dart:117), the inflow filters on it (scheduler.dart:1522), and no production code transitions to implementationReady. The guard is DROPPED from that edge (it would read an empty context and always pass) and AC-2's 'enforced on both automatic routes' is withdrawn. Pinned by NEW ASSERTION G11, a drift test that fires only when a production caller appears. design-review-gate.md §2.1; design-revision.md §2.1a, R11."
