    authority: "HUMAN — touches governance documentation; escalated, not reconciled"
    finding: "docs/engineering/FOLLOW_UPS.md §11 F-45 records the red test at work_entry_test.dart:854 as restored by this session's work. It is RED at 5afc230 with `Expected: noAction / Actual: runnable`, executed. 8b38a95 touched no file that test reads."
  - category: PROJECT_FACT
    authority: "AUTO"
    finding: "triageDefectDefinition.entryStates contains `planned` (triage_defect.dart:130) with entryProbeTargets[planned]=designNotRequired (:134), added by 863831a. Every work item at `planned` is therefore dispatched on the triage lane regardless of producer, because RunnableWorkEvaluator reads neither category nor productId. This defeats the protection at work_entry.dart:389-391 without changing it."
  - category: PROJECT_FACT
    authority: "AUTO"
    finding: "For a WI-feature-* or design-remediation-* item, the triage run's output is persisted to triage_result keyed on the WORK-ITEM id and then abandoned (triage_processor.dart:272-276 then :120-132), while the job sits succeeded. The prediction at work_entry.dart:385-388 is realised."
  - category: PROJECT_FACT
    authority: "AUTO"
    finding: "No QA gate in this repository is evaluated by any production code. GateRegistry holds four implementation evaluators (gate_registry.dart:19-23); QAOrchestration is called only from its own test file; GuardConditions.allRequiredGatesPassed reads context['gateResults'] (guard_conditions.dart:267) which no production code writes. A QAContract is a durable declaration, not an enforced one."
  - category: PROJECT_FACT
    authority: "AUTO"
    finding: "agent_result.structuredResultJson has no committed fixture for any lane other than a store round-trip (packages/store_contract_tests/lib/src/fixtures.dart:409, {'route': '/landing'}, AgentRole.implementer). No .sql file carries a value. Any claim about a lane's structured-result shape must cite the instruction that requests it and the parser that consumes it; there is nothing else in the repository to cite."
  - category: DESIGN_DISCOVERY
    authority: "HUMAN — escalated as HD-1"
    finding: "Authoring a QA contract for feature intake does not merely unblock a recorded result; it completes a walk to implementationReady and dispatches AgentRole.implementer on an undesigned human request. Level 3; gates all gate-authoring work."
