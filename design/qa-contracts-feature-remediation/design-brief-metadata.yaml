problem_statement: >
  `GuardConditions.qaContractExists()` refuses `agentExecuting -> agentCompleted` unless the work item
  carries a `qaContractId`, and it refuses on a NULL CHECK, so a work item with no contract can
  dispatch, can run a real agent, and can never be recorded. `8b38a95` made the per-product spec
  reachable and provisions from it with work-item-scoped ids, three named fail-closed refusals, and
  the guard untouched — so what is missing is the contract CONTENT itself: there is nothing for a
  feature-intake or design-remediation product to declare. This brief was asked to author that content
  from what those agents actually emit. It cannot, and the reason is not ambiguity: at `5afc230` the
  ONLY run either path can perform is a `triage_defect` execution whose structured result is parsed,
  persisted and then explicitly abandoned by its sole consumer, because `planned` is an entry state of
  the category-blind triage lane and `_extractDefectId` yields the work-item id, so `readDefect`
  raises. Independently, no gate in this repository is evaluated by any production code at all.
  Authoring a gate set today would therefore be an unenforceable declaration about an abandoned
  record — and would complete a walk to `implementationReady`, dispatching `AgentRole.implementer`
  on a human's raw, undesigned feature request. That last consequence is a Level 3 governance decision
  and is escalated as HD-1 rather than decided here.

user_flows: >
  FLOW A — feature intake (observed, executable). A human files a feature request; a governed product
  means `_requireRegisteredProduct` passes; `WI-feature-<micros>` is minted (control_plane_service.dart:916)
  and a QA contract is provisioned from the product's declaration inside the creation transaction
  (:918-950). `WorkEntryTrigger.ensureWorkEntry(kind: featureIntake)` takes the first unconditional
  branch (work_entry.dart:389-391) and parks the item at `planned`, recording
  `EXTERNAL_WORK_ENTRY_CONSUMER_DEPENDENCY` (:64). EXIT: the item sits at `planned`. There is no
  consumer runtime and none is expected (M1, M4).

  FLOW B — design remediation (observed, executable). Triage classifies a defect `design_defect`;
  `DesignRemediationWorkItemProvisioner.ensurePersisted` creates `design-remediation-<defectId>`,
  provisions its QA contract, and `_advanceToPlanned` walks it to `planned` and stops, recording
  `EXTERNAL_DESIGN_GOVERNANCE_DEPENDENCY` (lane_e_design_remediation_work_item.dart:557). EXIT: the
  item sits at `planned` (M2, M4).

  FLOW C — what actually happens to both (observed, executable, and the finding). `planned` is in
  `triageDefectDefinition.entryStates` with `entryProbeTargets[planned] = designNotRequired`
  (triage_defect.dart:130, :134), added by `863831a`. `RunnableWorkEvaluator` reads neither
  `category` nor `productId`. So the category-blind scheduler dispatches BOTH, hops them to
  `designNotRequired`, then `designNotRequired -> agentExecuting` (work_item_transitions.dart:116-119),
  and a real `AgentRole.triageDefect` worker runs under `triageDefectInstruction` — whose DEFECT
  DETAILS block degrades to the feature's own title/description, `Severity: medium`, and an EMPTY
  `EVIDENCE: []` list (triage_defect.dart:223-241), while :274 instructs the agent to cite evidence ids
  from that empty list. EXIT: `agentExecuting -> agentCompleted` is refused by `qaContractExists()` for
  an item with no contract; and even when it succeeds, `TriageProcessor._parseTriageResult` parses the
  output, `_extractDefectId` (:272-276) returns the WORK-ITEM id, `readDefect` raises
  `DefectNotFoundException`, and :125-132 returns with the outcome discarded. The job sits `succeeded`.
  The prediction at work_entry.dart:385-388 — "a healthy looking job and no work done" — is realised.

  FLOW D — the walk that completes if a contract exists (observed, executable, and escalated). With
  any non-empty product declaration, `planned -> designNotRequired -> agentExecuting ->
  agentCompleted -> implementationReady`, and `implementationReady` is
  `implementFeatureDefinition.entryStates` (implement_feature.dart:114,
  `requiredRole: AgentRole.implementer`). No design review and no engineering review lie on that path.
  EXIT: an implementer is dispatched on a human's raw feature request. This is HD-1 (§12).

success_criteria: >
  A design reviewer can re-derive every factual claim in this brief from the cited `file:line` and from
  the two commands recorded in §3.3 and §18, without running the platform and without touching the QA
  stack. A reader can reach HD-1 without reading any Dart. No gate in this brief is asserted to be
  enforced; the brief says plainly which are not enforced by anything.

constraints: >
  DESIGN ONLY. No docker, no compose, no psql; the QA stack is untouched. No bare `git stash`, no
  `git checkout .`, no `git add -A`; explicit paths only. `apps/**`, `packages/**`, `docs/**`,
  `docker/**`, `.github/**`, `Makefile`, `tooling/**` are read-only and were not written.
  `docs/engineering/FOLLOW_UPS.md` is the Manager's and was not modified. Two commits must not be
  amended, rebased or reset; this brief is a NEW commit atop `5afc230`. No gate may be proposed whose
  justification is a role name or a lane name rather than a cited consumer that reads the result.

acceptance_criteria: >
  AC-1 Every factual claim about a result shape carries a `file:line` or a named fixture, or the
  brief says the claim cannot be established from the repository. SATISFIED: §4.1-§4.3 request and
  acceptance shapes cited line-by-line; §4.4 records the negative evidence for every shape that
  could NOT be established, including the absence of any non-triage `agent_result` fixture.
  AC-2 The brief states which triage gate, if any, is genuinely reusable, and why.
  SATISFIED: §9 — none of the three, with per-gate reasoning and the repository's own two
  already-green reuse-refusal suites cited.
  AC-3 Pass criteria per contract, and whether any gate is optional. SATISFIED AS FAR AS POSSIBLE:
  §11 records that pass criteria are DERIVED from the gate set (product_qa_contract.dart:128-141),
  that the triage numeral `1` is correct only because the triage contract has exactly one optional
  gate, and — applying the triage contract's own criterion at :91-94 — that a contract governing this
  run would need no optional gates at all and therefore should not exist. Concrete numbers are
  deferred to the gate count, which does not exist.
  AC-4 Name the code that evaluates a gate, or state that the evaluator does not exist and would need
  building. Do not assume an evaluator exists. Check whether the triage gates are enforced anywhere.
  SATISFIED: §7 — no evaluator exists for ANY gate; `QAOrchestration` is called only from its own
  test; `context['gateResults']` is written by no production code. Both existing builders already
  record `evaluatorRuntime: absent`.
  AC-5 State whether work-item-scoped ids and the `qa-product-` prefix are sufficient for these two
  paths. SATISFIED: §10 — sufficient and proven for IDENTITY (disjoint prefix, no parent-repointing,
  idempotent, one row per item), and explicitly not sufficient for CONTENT.
  AC-6 Risks, explicit non-goals, implementation sequence. SATISFIED: §13, §14, §15.
  AC-7 Never approve your own work. SATISFIED: §18 hands the brief to an independent design-reviewer.
  AC-8 Prefer a blocked result to an invented one. SATISFIED: the brief proposes no gate at all,
  names the four missing artifacts (M1-M4) that would be required first, and records the one
  transcription that was available and why it is false (§6.1).

risk_assessment:
  level: 3
  rationale: >
    Level 3 (Major Workflow / IA change) is assigned to the change this brief was asked to design:
    authoring a QA contract for feature-intake and design-remediation work items. The level is not
    about a screen or a navigation structure — it is because the change completes a WORKFLOW WALK that
    does not currently complete. At `5afc230`, `planned` is dispatched on the category-blind triage
    lane (triage_defect.dart:130) and completion is refused by `qaContractExists()`; a QA contract is
    exactly what makes that refusal stop (product_qa_contract.dart:117-127, guard_conditions.dart:247).
    Once it stops, the item walks `planned -> designNotRequired -> agentExecuting -> agentCompleted ->
    implementationReady` (work_item_transitions.dart:112-124, :306-308) and `AgentRole.implementer`
    is dispatched on a human's raw, undesigned feature request, with no design review and no
    engineering review on the path. That is a change to what the platform is permitted to do with a
    human's request, and it affects the operator's mental model of what intake means. It is not a
    Level 2: Level 2 is a feature-level UX change affecting user behaviour, whereas this governs
    whether production code may begin being written from an unapproved request.
    Level 3 is therefore HUMAN_DECISION_REQUIRED and is raised as HD-1 in §12 with three named
    options and no recommendation applied as a decision. Per aef-design-workflow §6 this lane stops
    and escalates rather than choosing.
    Risk is assessed for the change AS SCOPED BY THIS BRIEF, which is: author nothing, escalate HD-1,
    and leave `8b38a95` intact. That residual scope carries no product-facing behaviour change at
    all — it is documentation and a human gate — which is why the brief is DRAFT rather than a
    blocked implementation attempt.
  risks:
    - "R1 the red test at work_entry_test.dart:877 is unnoticed because nothing runs that suite in CI (F-15) — CERTAIN likelihood, HIGH severity; it is the brief's own proof of §3.3 and stays red until HD-1 is answered"
    - "R2 a gate set is authored anyway to close the ticket, against the triage shape — MEDIUM/HIGH; the brief is the obstacle, §6.1 explains why the faithful transcription is false, and product_qa_contract_test.dart:588-616 will fail on the reuse itself"
    - "R3 authoring the contracts completes the walk and dispatches an implementer on a raw feature request — HIGH likelihood if authored, CRITICAL severity; HD-1 is the mitigation and the reason authoring must not precede deciding"
    - "R4 a triage_result row naming a non-defect work-item id is read as a triage outcome — MEDIUM/MEDIUM; pre-existing, made visible by §5, and no test asserts such a row cannot exist"
    - "R5 gates treated as enforced because a qa_contract row exists — HIGH/MEDIUM; §7, and any new contract must carry evaluatorRuntime: absent"
    - "R6 the qa-product- prefix over-read as meaning the content is right — MEDIUM/LOW; §10 separates the id namespace from the content claim"
    - "R7 a malformed config['evidenceTypes'] aborts the whole provision — LOW/MEDIUM; already fail-closed by design (product_qa_contract.dart:172-191), recorded because any future gate must respect it"

changelog:
  - "revision 1 (initial brief). BLOCKED. Proposes no QA contract and no gate set for either path, on three independently established grounds: (1) the only run either path performs is a triage_defect execution whose structured result is discarded by its sole consumer (TriageProcessor :272-276 then :120-132); (2) no gate in this repository is evaluated by any production code (GateRegistry holds four implementation evaluators; QAOrchestration is called only from its own test; allRequiredGatesPassed reads a context key nothing writes); (3) the transition a contract unblocks reaches AgentRole.implementer on an undesigned human request, which is a Level 3 human decision (HD-1)."
  - "Establishes the observed result shape to the full standard the mandate demanded, and then records that the shape is real but ungovernable: §4 cites the instruction that requests it (triage_defect.ts:249-264) and the parser that accepts it (triage_processor.ts:200-260), line by line; §5 cites the code that abandons it; §4.4 records the negative evidence — no non-triage agent_result fixture exists anywhere in the repository."
  - "Proves the dispatch executably rather than by assertion: `dart test lib/src/triage/work_entry_test.dart -n 'category-blind scheduler'` at 5afc230 returns Expected noAction / Actual runnable. This both confirms the mandate's premise and contradicts FOLLOW_UPS.md §11 F-45, which records the behaviour as restored. Raised as CONTRADICTION, not reconciled here (docs/** is prohibited to this lane and the Manager owns FOLLOW_UPS.md)."
  - "§9 answers the mandate's direct question plainly: NONE of the three triage gates is reusable, and the reason is stronger than the mandate's own — structuredClassificationAdmitted is justified by a parser that, on these paths, runs and then gives up."
  - "§11 records that pass criteria are DERIVED (product_qa_contract.dart:128-141), so neither contract declares its own; that the triage numeral `1` is correct only because that contract has exactly one optional gate; and — applying the triage contract's own criterion at :91-94 — that a contract governing THIS run would need no optional gates and therefore should not exist."
  - "§10 answers the id question: work-item-scoped ids and the qa-product- prefix are sufficient and already proven for identity, and explicitly not sufficient for content."
  - "Records M1-M4 — a JobDefinition per path, an AgentRole per path, and a result type + parser + instruction + consumer per path — as the specific artifacts whose absence blocks authoring, rather than reporting a bare block."

