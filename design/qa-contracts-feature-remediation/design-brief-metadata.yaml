human_decisions_required:
  - id: HD-1
    level: 3
    title: "Should a feature-intake or design-remediation work item be permitted to complete an agent execution at all?"
    summary: >
      At HEAD, `planned` is in `triageDefectDefinition.entryStates`, so both producers' items are
      dispatched, hopped to `designNotRequired`, executed by `AgentRole.triageDefect` under
      `triageDefectInstruction` with an empty EVIDENCE list, and their output is discarded at
      `triage_processor.dart:120-132`. Once a QA contract exists (8b38a95) the completion transition
      SUCCEEDS and the item walks to `implementationReady`, where `AgentRole.implementer` is
      dispatched on a human's raw feature request with no design review and no engineering review.
    options:
      - "(a) Narrow triageDefectDefinition.entryStates so `planned` dispatches only items carrying a defect. Restores the invariant at work_entry.dart:380-382 and deliberately re-strands the three items 863831a rescued."
      - "(b) Build the missing runtimes (M1-M4) so each path has its own JobDefinition, AgentRole, instruction, result type and consumer, making the dispatch deliberate rather than accidental."
      - "(c) Accept the walk and govern it — which is what the original mandate assumed was happening, and which needs both the gates this brief declines to invent and a named owner for the implementer dispatch."
    recommendation: >
      NONE APPLIED. This lane records no preference, because the choice turns on whether an
      undesigned human feature request may reach an implementer, which is a product decision reserved
      to the human. If forced to state the engineering constraint rather than the product answer: all
      three options are implementable with what is in the repository today, and (b) is the only one
      after which a QA contract for these paths has anything real to govern.
    owner: orchestrator-main → HUMAN_DECISION object

