durable_discoveries:
  - category: QA_DISCOVERY
    finding: >
      POSIX sh cannot disambiguate a JSON token that appears as both a key and a value without a
      real parser, and the mis-binding direction is a false SATISFIED. Flatness is a correctness
      property for a fail-closed tool, not a convenience.
  - category: PROJECT_FACT
    finding: >
      The root pubspec.yaml workspace includes apps/control_plane, so resolving the workspace
      requires the Flutter SDK. Any tool detecting missing Flutter must live outside the Dart
      workspace.
  - category: PROJECT_FACT
    finding: >
      AGENTS.md:47-52 confirms the platform-adapter generator and its --check drift test are NOT
      instantiated in this product repo. Editing only .agents/skills/ changes nothing and fails
      nothing; the .opencode/skill/ mirrors are what opencode loads.
  - category: PROJECT_FACT
    finding: >
      SERVERPOD_TEST_DATABASE_PASSWORD is a GitHub SECRET name, never an environment variable. The
      variable Serverpod reads is SERVERPOD_DATABASE_PASSWORD (Makefile:241,
      apps/server/config/test.yaml:47). A probe for the former can never match anywhere.
  - category: DESIGN_DISCOVERY
    finding: >
      A design finding, a review finding and a ledger entry all repeated the same false claim about
      the FVM/golden divergence before anyone read golden_render_environment.json._authority. The
      artifact would have been overturned. Each hop looked reasonable; only reading the artifact
      caught it. Recorded so the failure is reproducible in review rather than repeated.
