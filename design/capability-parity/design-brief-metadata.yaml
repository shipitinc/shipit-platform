user_flows: >
  N/A — deliberately absent, not forgotten. This artifact introduces no user interface and no user
  workflow. The nearest analogue is the operator-facing refusal message the checker prints, which
  inherits the established pattern: names every mismatched axis with expected and observed values,
  states the remedy, and names the authority. Recorded as absent per the convention above.

success_criteria: >
  1. A lane reviewing a component whose capability cannot be measured CANNOT write "clean": the word
     is unavailable without CAPABILITY_PRECHECK: <component> <surface> 0 <HEAD_SHA> (section 3.4).
  2. A checker that probed nothing never exits 0 — including a zero-requirement selection, which
     exits 2 UNUSABLE (section 3.3).
  3. "Could not measure" and "measured and absent" never produce the same exit code as each other,
     nor collide with the imported contract's exitRefusedToGrade = 3 (section 3.3).
  4. A version that does not match its surface's exact pin exits 1, never a warning (HD-2).
  5. The checker runs with no Dart and no Flutter installed, and touches no Docker daemon.
  6. No argument exists that turns a mismatch into a match.

constraints: >
  - POSIX sh only. The root pubspec.yaml workspace includes apps/control_plane, so RESOLVING the
    workspace requires the Flutter SDK; a tool whose job is detecting missing Flutter must not
    require Flutter. Therefore no Dart, and no assumption that python/jq exist.
  - The declaration must stay FLAT (section 3.1). Nested JSON puts the same token in a value and a
    key, which a POSIX reader cannot disambiguate, and the expensive error direction is a false
    SATISFIED.
  - Flutter must NEVER be installed into the QA containers. Dockerfile.client:12 is nginx:alpine
    serving prebuilt artifacts, and docker/build-client.sh builds on the host because Cloudflare
    WARP / corporate VPNs block storage.googleapis.com. Enforced as an `assert` capability.
  - No network access at check time.
  - The checker must not start the stack and then judge it: no Docker, no Compose, no daemon call.
  - Scope of the version ruling (HD-2) is EXACT per surface. This mechanism does not change what a
    pin means repository-wide; the golden pin's exactness is governed by HD 3e9dfb75, not by this.
  - No flag may make a mismatch look like a match (precedent: check_render_environment.dart:24-26,
    which rejects ANY argument).

acceptance_criteria: >
  Section 12 of design-brief.md is the SLICE-1 acceptance set and is labelled as such. Slice 3
  modifies .github/workflows/ci.yaml (adds a job, changes a Flutter install), so an earlier
  acceptance criterion claiming this design modifies no workflow file was FALSE AS WRITTEN and is
  corrected rather than quietly dropped.

