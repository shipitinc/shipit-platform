problem_statement: >
  Nothing in this repository compares what a product component needs in order to be built,
  validated and run against what an environment actually provides. A capability requirement that
  was never measured is therefore indistinguishable from one that was measured and satisfied, so a
  validation claim can be recorded as "clean" when the tool that would have produced the evidence
  was absent. The failure is at two locations — the review host and .github/workflows/ci.yaml —
  and the mechanism must be at neither of them: one committed declaration that both consume.

risk_assessment:
  level: 2
  rationale: >
    Level 2 (Feature UX Change) is chosen for the affected party, who is an agent or an operator
    rather than an end user: this design adds a hard gate, introduces a new failure mode and a new
    claim vocabulary ("clean" becomes conditional on a recorded exit code), and can block a lane
    with no remedy path inside the lane itself. That is a change to when work may be declared done.

    Level 3 rejected: no navigation, information architecture or core user workflow is touched, and
    nothing in the product's UI changes.

    Level 1/0 rejected in the other direction: it adds a new required gate with no natural owner
    and a fail-closed path that can block `make qa-up`. Optimising it away — softening an UNKNOWN
    into a warning — is how the current defect started, so it must not be routed AUTO.

    Gate D4 is therefore HUMAN_DECISION_REQUIRED. Three decisions are escalated rather than made:
    HD-1 whether a lane may proceed and report UNVERIFIED, or must stop; HD-2 whether .fvmrc stays
    a preferredVersion (recommended, with a falsifiable test) or becomes exact; HD-3 whether exit
    code 4 (UNDECLARED) is fatal in CI or advisory. All three are recorded in the brief §9.
  risks:
    - "R1 the gate becomes a checkbox a lane learns to satisfy superficially — HIGH likelihood, mitigated by code 4 in slice 2 and CI consumption in slice 3"
    - "R2 grep/awk parsing of pubspec.yaml is brittle and a wrong derivation is a false SATISFIED — MEDIUM, mitigated by UNKNOWN-on-unreadable-key and --verify"
    - "R3 scope explosion into every tool in the environment — HIGH, mitigated by a three-capability slice-1 cap and a named consumer per entry"
    - "R4 exit code 4 blocks all work until the manifest is complete — MEDIUM, deliberately deferred to slice 2"
    - "R5 range-satisfies is misread as 'pins are decorative' — MEDIUM, mitigated by importing the golden pin exactly and stating the absence-fatal/version-warned asymmetry"
    - "R6 a lane reviews an undeclared component — MEDIUM, the exact loophole code 4 exists to close; recorded as slice 1's honest limitation"
    - "R7 the tool cannot run in some lane sandbox — LOW, degrades to UNKNOWN which is the safe direction"
    - "R8 build/ is gitignored so host.build_web cannot be derived — CERTAIN, designed around as a runtime probe"
    - "R9 'unverified' becomes the cheap answer and review throughput recovers without coverage — MEDIUM, mitigated by making UNKNOWN countable in the structured result"

changelog:
  - "revision 1 (initial brief). Four ledger requirements designed as one committed declaration
     (tool/capabilities.json) plus one dependency-free checker (tool/capability-check), with three
     consumers: make qa-up, CI, and the lane gate."
  - "ANSWERED Q1 hybrid declaration (derive what is derivable, declare what is not) at
     tool/capabilities.json, with --verify re-derivation as the teeth. Derive-only rejected
     (cannot express service.postgres_test or the render environment); declare-only rejected
     (duplicates pubspec.yaml and adds a third place to forget)."
  - "ANSWERED Q2 component = a repository path owning a validation surface; identity IS the path, so
     the lane gate is a three-field string comparison (component, surface, HEAD). apps/control_plane
     carries TWO surfaces, validation (loose, satisfiable by pubspec range) and golden (imported,
     enforced exactly), so 'analyze clean, goldens unverified' is expressible and 'gates clean' is
     not available when neither was measured."
  - "ANSWERED Q3 derive-vs-declare with an explicit table. host.build_web is PROBED not derived
     because build/ is gitignored (.gitignore:3); host.render_environment is IMPORTED not re-derived;
     service.postgres_test is declared; egress.googleapis is declared because it exists today only
     as a comment in build-client.sh:19-23 and a comment is not a requirement."
  - "ANSWERED Q4 the crux: UNKNOWN fails closed with its own verdict and exit code 3, distinct from
     VIOLATED (1) and from UNUSABLE (2). Exit code 0 is never returned when nothing was probed —
     F-27's lesson applied to capability checking. Code 4 (UNDECLARED) closes the loophole where a
     new component is simply omitted from the manifest."
  - "ANSWERED Q5 the pin-drift question: range-satisfies for build and validation, exact only where
     a contract already demands it. .fvmrc's 3.44.0 becomes a non-fatal preferredVersion; the golden
     contract's 3.44.7 stays exact because it is a different fact about a different thing under a
     different Human Decision. Absence is fatal; version drift is reported on every run. Recorded
     as HD-2 with the recommendation attached, not applied unilaterally."
  - "ANSWERED Q6 migration in four slices. Slice 1 is the smallest CORRECT version: one component,
     one surface, three capabilities, codes 0-3 only, plus the lane obligation — and its acceptance
     proof is that the check exits 3 on a host with Flutter off PATH."
  - "CONSTRAINT DISCOVERED AND BINDING: the checker must not be a Dart script. The root
     pubspec.yaml workspace: list includes apps/control_plane, so resolving the workspace requires
     Flutter (F-15(1)). The tool that detects a missing Flutter cannot itself require Flutter."
  - "REFUSED a --force/--allow-missing/--skip flag, on the precedent already set by
     check_render_environment.dart: no argument may make a mismatch look like a match."
  - "STATED that make qa-up is the natural but WEAKEST gate, because the incident happened at review
     time. qa-up gets the check as a left-to-right prerequisite before any docker line; the lane
     gate and CI carry the weight."
  - "RECORDED slice 1's honest limitation (R6): a lane reviewing a component the manifest does not
     cover is not caught until exit code 4 lands in slice 2."

