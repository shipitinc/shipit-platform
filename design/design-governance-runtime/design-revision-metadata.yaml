  Major Workflow Change. This artifact designs the runtime for a core workflow stage that
  does not exist, changes the meaning of four WorkItemStates (designRequired,
  designInReview, designApproved, designRejected), and specifies changes to the
  transition table that is the sole authority for all work-item movement (AGENTS.md §1).
  UNCHANGED by the correction, and the reviewer agreed level 3. Revision 2 does not
  reduce it: it adds a second change to that same table — a new WorkItemState
  (designParked) with five edges — in §4.4/R2, which is if anything a larger footprint
  than the single edge revision 1 proposed, because revision 1's edge was not actually
  reachable on its own. Per DESIGN_GOVERNANCE.md:88-96 and checkpoint 003 §11, Level 3
  requires HUMAN_DECISION_REQUIRED at Gate D4. Gate D4 is now RESOLVED for the interim
  default (§5.6); U-2 and U-7 remain open but are not blocking this artifact.

