human_decision_required:
  gate: D4
  status: RESOLVED
  decision_id: a1c7d904-3b8e-4f21-9d6e-5c2f81b7a390
  decided_at: "2026-10-18"
  question: >-
    Fail-closed default while no DesignRiskPolicy exists (design-revision.md §5.6):
    F-A — treat every revision as HIGH until a policy exists; or F-B — classify by
    checkpoint 003 §9.2-§9.4 prose, which that document itself declares UNFINALIZED and
    which the data-not-hard-coded rule forbids hard-coding.
  decision: >-
    F-A. Until a DesignRiskPolicy exists, EVERY design revision is HIGH tier and requires
    human design approval. Accepted cost, recorded not minimised: a trivial copy-tweak waits
    on a person. Blocks step 5 of §9 only; the other nine build steps are unaffected.
  f_b_rejected_because: >-
    Classifying from checkpoint 003 §9.2-§9.4 prose was rejected because that document
    declares the question unsettled (§9.5: thresholds NOT finalized) and because the rule
    is mandatory — checkpoint 003 §9.6 ("Risk policy MUST be DATA, not hard-coded control
    flow") and, independently, ADR 0021 §6 and its Consequences.
  note: >-
    This gate was raised by revision 1 and is now closed by a human decision. The correction
    lane did not decide it and did not reopen it. HIGH-by-default is a STANDING rule, not a
    temporary default with an expiry: it stops being right when a policy lands, not when
    someone remembers. U-2 and U-7 remain open.

u3_fidelity_anchor:
  status: CONTENT DECIDED
  decision_id: a1c7d904-3b8e-4f21-9d6e-5c2f81b7a390
  position: >-
    BOTH anchors, each with a named role. A committed, versioned JSON schema validated on
    write is what the MACHINE diffs an implementation against. Penpot is what a HUMAN
    reviewer reads and approves. Both refer to the same approved revision, and WHERE THEY
    DISAGREE, THE DISAGREEMENT IS ITSELF A FINDING — it is reported, not resolved by picking
    a winner.
  penpot_alone_rejected_because: >-
    penpotFileId and penpotPageId are nullable (definition.sql:194-195) and nothing can diff
    against a board. The schema closes that by requiring providerFileId inside boardIdsJson,
    which makes Q5 enforceable by validation rather than by a separate check.
  decided_content: "design-revision.md §3.5.1-§3.5.4 — one document, six named subschemas, canonical form, fail-closed on write, plus the comparison basis."
  residue_open: >-
    Schema owner (proposed workflow_engine, where guards live — an architecture call); build
    order against §9 step 1; and how WorkspaceDeltaProbe / GitWorkspaceInspector — which the
    approved QA artifact already records as undecided and which live in DIFFERENT packages —
    obtain the implementation side of the §3.5.4 diff. Carried in §7 as U-3 residue.

qa_passed_interaction:
  position: "NOT REOPENED, NOT WEAKENED, NOT INTERPRETED"
  governing_decision: 92d567e3-da03-4c43-99f4-e3726472f0ab
  statement: >-
    This design adds no QA gate, no evaluator and no contract. qaInProgress -> qaPassed keeps
    allRequiredGatesPassed() and keeps every condition 92d567e3 placed on it. Design
    remediation is UPSTREAM of QA, not a substitute: the runtime lengthens the path to
    implementation and leaves the path to qaPassed untouched. That decision's accepted cost —
    items accumulating at reviewApproved — is unchanged and is if anything pushed further
    out, because a design-remediation item now passes two more states first. The fidelity
    anchor REUSES that artifact's proposed evidenceTypes vocabulary and adds to it; where
    they ever disagree, THAT ARTIFACT WINS, because it is the approved one.

