qa_passed_interaction:
  position: "NOT REOPENED, NOT WEAKENED, NOT INTERPRETED"
  governing_decision: 92d567e3-da03-4c43-99f4-e3726472f0ab
  statement: >-
    This design adds no QA gate, no evaluator and no contract. qaInProgress -> qaPassed keeps
    allRequiredGatesPassed() and keeps every condition 92d567e3 placed on it. Design
    remediation is UPSTREAM of QA, not a substitute: the runtime lengthens the path to
    implementation and leaves the path to qaPassed untouched. That decision's accepted cost —
    items accumulating at reviewApproved — is unchanged and is if anything pushed further
    out, because a design-remediation item now passes two more states first. The fidelity
    anchor REUSES that artifact's proposed evidenceTypes vocabulary and adds to it; where
    they ever disagree, THAT ARTIFACT WINS, because it is the approved one.

