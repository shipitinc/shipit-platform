changelog_findings_routed:
  note: "FOLLOW_UPS.md is PROHIBITED_PATHS for this lane. Findings are REPORTED here for the Manager to route."
  findings:
    - id: D-1
      title: "designRevisionDedupeKey burns its key permanently, making the correction loop unreachable"
      detail: >-
        JobQueue.enqueueIfAbsent resolves a key held by ANY job, terminal or not
        (scheduler.dart:3385-3391 documents this for engineeringReview, which fixed it with
        an :a<n> suffix from triageAttempt). The design lane's key is
        '<workItemId>:design_revision' with NO suffix, so the SECOND revision for an item is
        silently a no-op — precisely the correction loop ADR 0021 §6 gives parentRevisionId for.
    - id: D-2
      title: "HumanDecisionType.designRejection is declared and admitted by nothing"
      detail: >-
        human_decision.dart:3. Referenced by no transition edge, no routing arm, no production
        caller. An implementer reaching for it builds a decision that resolves to NO target
        (_ => null in targetFor) and the item sits at its gate with the decision answered.
    - id: D-3
      title: "escalationIndexWithinLimitForDecisionTypes is unbounded in practice"
      detail: >-
        guard_conditions.dart:542 reads context['maxEscalation'] ?? -1 and PASSES when the
        bound is negative (:544). Its sole supplier, DurableWorkflowEngine.
        _getMaxEscalationForDecisionType, returns a hard-coded -1 with a comment conceding it
        is a stub (durable_workflow_engine.dart:1047-1052). A human can send a design back for
        rework an unlimited number of times; the guard that reads as a bound bounds nothing.
        Affects designApproval rework today, not just the design lane.
    - id: D-4
      title: "No maxAttempts-exhaustion to human route for the design lane"
      detail: >-
        Checkpoint 003 §10.4 requires exhaustion to route to a human decision, never an
        unbounded agent re-run. No such path exists for the design lane; maxAttempts is 3
        (tree) against 2 (checkpoint 003 §10.2) and neither number is meaningful without it.
    - id: D-5
      title: "designContractExists() reads caller-supplied context, not the durable column"
      detail: >-
        Satisfiable by any caller passing a string, whether or not a row exists — which is
        why lane E described it as 'purely to satisfy'. Shared by planned -> designRequired
        for ALL categories, so the change is wider than design remediation. §4.3.
    - id: D-6
      title: "planned is not a safe holding state for any lane"
      detail: >-
        planned is in triageDefectDefinition.entryStates with entryProbeTargets
        {planned: designNotRequired} (triage_defect.dart:126-135) and the scheduler is
        category-blind. Any future lane that parks there inherits the convergence defect.
    - id: D-7
      title: "ADR 0021 §3 names a ControlPlaneService method that does not exist"
      detail: >-
        CONTRADICTION. createDesignRemediationWorkItem() appears only in a doc comment at
        design_remediation_request.dart:11. The implementation is
        DesignRemediationWorkItemProvisioner.ensurePersisted(). An accepted ADR and the code
        it governs disagree by name. ADR amendment is a human/architecture action.

