problem_statement: >-
  A human-reported defect triaged as designDefect cannot reach the Design Governance
  lifecycle. Lane E durably creates the remediation WorkItem and records
  EXTERNAL_DESIGN_GOVERNANCE_DEPENDENCY, then REFUSES to enter designRequired because the
  planned -> designRequired guard reads context['designContractId'], transition discards it,
  and there is no design_contract table and no DesignContractStore. Nothing is on the other
  side of that refusal. CORRECTION TO THE DISPATCH FRAMING: the runtime is not implemented
  nowhere — designRevisionDefinition and designReviewDefinition exist and are exported and
  tested; the design_revision / design_review_result / design_finding / design_revision_event
  tables, the design_governance store interfaces, and PostgresDesignGovernanceStore exist.
  What is absent is a producer, a production composition root, and a raiser of the design
  approval decision.

user_flows:
  - id: F1
    name: design revision
    entry: "work item at designRequired; durable design contract exists; no live design execution"
    exit: "one DesignRevision row at status=draft, read back, designerExecutionId stamped, identity written to work item metadata"
    blocking_gaps: [G-A, G-B, G-D, G-E]
  - id: F2
    name: independent design review
    entry: "work item at designInReview; revision exists; reviewer execution excluded the designer"
    exit: "one DesignReviewResult plus zero or more DesignFinding rows, persisted"
    blocking_gaps: [G-A, G-E]
  - id: F3
    name: risk classification
    entry: "review verdict durable; DesignRiskPolicy resolves a tier"
    exit: "LOW -> approved; MEDIUM/HIGH -> blocking HumanDecision(designApproval) raised"
    blocking_gaps: [G-F]
  - id: F4
    name: human approval
    entry: "blocking designApproval decision pending"
    exit: "approve -> designApproved; reject -> designRejected; rework -> designInReview (bounded)"
    blocking_gaps: [G-C]

success_criteria:
  - "A design defect triaged AFTER the runtime ships reaches designApproved through the full ADR 0021 lifecycle, every step durably recorded."
  - "No code path enqueues a designRevision job that does not satisfy every precondition; no path proposes a revision for review that does not satisfy every postcondition."
  - "designApproval is raised by the platform, resolved by a human, and admits exactly the three already-wired choices — no new HumanDecisionType, no new WorkItemState."
  - "A rejected design has a route back to the design agent (today it does not)."
  - "ADR 0021 §2's 'divergence from approved design is itself a defect' has a machine-checkable detector. Today it has a rule and no detector."
  - "EXTERNAL_DESIGN_GOVERNANCE_DEPENDENCY reporting is not weakened at any point during the build."

constraints:
  - "Reuse existing machinery — no new scheduler, no new workflow, no parallel mechanism (ADR 0021 §7; checkpoint 003 §10)."
  - "Triage is advisory and must never produce design artifacts (ADR 0021 §2, §4)."
  - "Reviewer != designer, platform-enforced at dispatch (ADR 0021 Consequences; checkpoint 003 §7.1)."
  - "Risk policy is DATA, never hard-coded control flow (ADR 0021 §6 and Consequences; checkpoint 003 §9.6)."
  - "qaPassed stays CLOSED under decision 92d567e3; this runtime must not reopen or weaken it."
  - "Credentials referenced by name, never value; no Penpot token in any artifact or log (AGENTS.md §13, §13a)."
  - "Design-defect verification is a separate gate from design approval (ADR 0021 §5)."
  - "Read-only on apps/**, packages/**, docker/**. No docker, no compose, no psql."

acceptance_criteria:
  - id: A1
    text: "Every precondition and postcondition states the INPUT THAT MAKES IT FAIL. A condition whose failure mode cannot be described is not a gate."
  - id: A2
    text: "The designRevision JobDefinition is specified field by field, with divergences from checkpoint 003 §10.2 named rather than silently reconciled."
  - id: A3
    text: "designApproval is confirmed against what exists; any required enum addition is given as an exact addition."
  - id: A4
    text: "The planned-convergence defect is specified with its resolution, and the resolution does not weaken EXTERNAL_DESIGN_GOVERNANCE_DEPENDENCY."
  - id: A5
    text: "The interaction with the approved qaPassed decision is stated, and qaPassed is not reopened."
  - id: A6
    text: "Undecidable items are stated plainly, not guessed."
  - id: A7
    text: "RUNTIME acceptance (an implementer's bar, NOT this lane's to grant): every condition has a named test, reachable in production, with a failing input."
  - id: A8
    text: "RUNTIME acceptance: the independence rule is enforced by a test that fails when the designer execution is not excluded."
  - id: A9
    text: "RUNTIME acceptance: no revision reaches approved without either a recorded LOW/MEDIUM-ungated policy decision or a human designApproval resolution."

excluded_from_acceptance:
  - "Repairing the already-parked remediation item. Out of reach by the human decision's own terms; it would have to be re-triaged. Stated in the artifact preamble and §4.7, NOT claimed."
  - "Any change to the meaning of qaPassed, qaInProgress, or any approved QA gate."

risk_assessment:
  level: 3
  name: Major Workflow / Navigation / IA Change
  rationale: >-
    This designs the runtime for a core workflow stage that does not exist. It changes the
    meaning of four states (designRequired, designInReview, designApproved, designRejected)
    and adds an edge (designRejected -> designRequired) to the one authority table governing
    all work-item movement (AGENTS.md §1). Comparable to the approved
    design/qa-contracts-feature-remediation artifact, which was likewise Level 3.
  approval_path: HUMAN_DECISION_REQUIRED (Gate D4)
  human_decision_required:
    gate: D4
    status: RESOLVED
    decision_id: a1c7d904-3b8e-4f21-9d6e-5c2f81b7a390
    question: >-
      Fail-closed default while no DesignRiskPolicy exists (design-revision.md §5.6):
      F-A treat every revision as HIGH until a policy exists, or F-B classify by
      checkpoint 003 §9.2-§9.4 prose, which that document itself declares UNFINALIZED and
      which the data-not-hard-coded rule forbids hard-coding.
    decision: >-
      F-A. Until a DesignRiskPolicy exists, every design revision is HIGH tier and requires
      human design approval. Accepted cost: a trivial copy-tweak waits on a person. Blocks
      step 5 of §9 only; the other nine build steps are unaffected.
    citation_correction: >-
      Revision 1 and this file attributed "§9.6" to ADR 0021. ADR 0021 has sections 1-8
      only. §9.6 — "Risk policy MUST be DATA, not hard-coded control flow" — is
      CHECKPOINT 003's. ADR 0021 states the same principle independently at §6
      ("DesignRiskTier + DesignRiskPolicy (data, not code) drive human gate") and in its
      Consequences. Re-cited at every site.
    note: "Raised by revision 1 as a blocker. Closed by a human decision. The correction lane did not decide it."

