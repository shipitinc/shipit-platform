name: Release
on:
  push:
    tags: ['v*']
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server
        run: |
          cd docker
          docker build -f Dockerfile.server \
            -t ghcr.io/${{ github.repository }}/server:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository }}/server:latest \
            ../apps/server
          docker push ghcr.io/${{ github.repository }}/server:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/server:latest
      - name: Build and push client
        run: |
          cd docker
          docker build -f Dockerfile.client \
            -t ghcr.io/${{ github.repository }}/client:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository }}/client:latest \
            ../apps/control_plane
          docker push ghcr.io/${{ github.repository }}/client:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/client:latest

  worker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push worker-linux
        run: |
          cd docker
          docker build -f Dockerfile.worker-linux \
            -t ghcr.io/${{ github.repository }}/worker-linux:${{ github.ref_name }} \
            ../tooling/workers
          docker push ghcr.io/${{ github.repository }}/worker-linux:${{ github.ref_name }}

  infrastructure:
    needs: [build-and-push, worker-images]
    uses: ./.github/workflows/infrastructure.yaml
    secrets: inherit
    with:
      env: production