name: CI
on: [pull_request, push]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.0'
      - name: Install melos
        run: dart pub global activate melos ^8.0.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Analyze
        run: melos run analyze
      - name: Format check
        run: melos run format

  # Fails the build when a regeneration has erased hand-maintained content from
  # the latest cumulative definition.sql. Two indexes (`job_active_dedupe_unique`
  # and `design_review_result_execution_unique`) are now declared in their
  # Serverpod models and regenerate on their own; the block this job really
  # protects is the `qa_contract` table, whose `managedMigration: false` DDL the
  # generator knows about but never renders. Without it a fresh database would
  # be built without the table. A non-zero exit fails the job, so this blocks a
  # merge.
  #
  # The three greps below cannot see the class of drift that actually bit this
  # repository: Serverpod applies only the LATEST `definition.sql` to a fresh
  # database, so everything the generator cannot express — the design-revision
  # immutability trigger, the design-review independence trigger and the
  # one-approved-revision-per-work-item index — is absent from every fresh
  # database while this check reported green. Those objects live in
  # apps/server/tool/schema_bootstrap.sql instead, and the second step below
  # guards them: it fails if the asset and the chain-migrated migration stop
  # agreeing, if a generated definition.sql is edited to claim them, or if
  # either wiring site (CI, Makefile) stops applying them. The runtime half —
  # a real fresh database rejecting a tampered approved revision — is asserted
  # in integration.yaml by the "Apply schema bootstrap" step.
  schema-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.0'
      - name: Install melos
        run: dart pub global activate melos ^8.0.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Verify schema deviations
        run: melos run verify:schema-deviations
      - name: Verify the hand-maintained schema bootstrap
        run: apps/server/tool/verify_schema_bootstrap.sh

  # Pure-Dart package tests. `--no-select` skips melos's interactive
  # package-choice prompt, which would otherwise block a non-interactive run.
  # apps/server is covered by integration.yaml (it needs Postgres)
  # and apps/control_plane needs the Flutter SDK, so neither belongs here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.0'
      - name: Install melos
        run: dart pub global activate melos ^8.0.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Test packages
        run: melos run test --no-select

  # The golden suite had no CI job at all until now. `test` above excludes
  # control_plane because `dart test` cannot run a Flutter widget suite, and
  # nothing else in .github/workflows rendered a single golden — so a stale
  # baseline could not fail the build because nothing in the build looked at
  # one. That is how the Product Detail baseline kept painting a retired
  # security guarantee while the suite went green.
  #
  # The tolerant comparator is not the problem and is unchanged: it has to
  # exist, because text rasterisation is not bit-stable across platforms. The
  # problem is that "under tolerance" is reported as plain PASS, with no
  # number, so nothing downstream can tell a re-wrapped line of text from a
  # baseline that has drifted by 0.49% of its pixels.
  #
  # This job therefore does two things. It runs the suite through the real
  # comparator (the pixel comparison is unchanged and still authoritative),
  # and it then grades every committed baseline against a fresh render with
  # test/tools/check_golden_domination.dart, which reports the delta as a
  # number and fails when a baseline passes ONLY because the tolerance
  # swallowed its drift.
  #
  # Two renders are taken because the discriminator between "changed a little,
  # legitimately" and "stale and silent" is this machine's own noise floor: the
  # largest delta between two independent renders of the same source. A single
  # render cannot be trusted to define its own expected output.
  #
  # runs-on is pinned to macOS deliberately. The baselines are platform-specific
  # pixel data, and on a platform whose text rasterisation differs the check
  # would report 54 confident verdicts describing the runner. The check refuses
  # to grade when the two renders disagree by more than the tolerance, and says
  # so, rather than inventing a result.
  golden-integrity:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # .fvmrc is this repository's declared SDK pin, and
          # subosito/flutter-action reads it through yq. Overriding the version
          # here instead would fork the pin: the goldens are pixel data and the
          # Flutter version that rasterises them is part of what they mean.
          flutter-version-file: .fvmrc
          channel: stable
      - name: Disable Flutter analytics
        run: flutter config --no-analytics
      # Workspace resolution: the app is a member of the root melos workspace,
      # so the root resolves every package including the Flutter SDK ones.
      - name: Bootstrap
        run: flutter pub get
      - name: Snapshot the committed baselines
        run: cp -R apps/control_plane/test/goldens "$RUNNER_TEMP/baseline"
      # The real comparator, unchanged: this is where a genuine visual
      # regression still fails on pixels alone.
      - name: Run the control plane suite
        working-directory: apps/control_plane
        run: flutter test
      - name: Render pass 1
        working-directory: apps/control_plane
        run: flutter test --update-goldens
      - name: Keep render pass 1
        run: cp -R apps/control_plane/test/goldens "$RUNNER_TEMP/pass1"
      - name: Render pass 2
        working-directory: apps/control_plane
        run: flutter test --update-goldens
      - name: Keep render pass 2
        run: cp -R apps/control_plane/test/goldens "$RUNNER_TEMP/pass2"
      # Grades the snapshot, not the working tree, so this step can never
      # commit or bless a render. It fails with the file name and the measured
      # delta for every baseline that is not current.
      - name: Fail on a tolerance-dominated golden
        working-directory: apps/control_plane
        run: |
          dart run test/tools/check_golden_domination.dart \
            --baseline="$RUNNER_TEMP/baseline" \
            --current="$RUNNER_TEMP/pass1" \
            --repeat="$RUNNER_TEMP/pass2"

  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: |
          cd docker
          docker build -f Dockerfile.server -t shipit/server:pr-${{ github.event.number }} ../apps/server

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build client image
        run: |
          cd docker
          docker build -f Dockerfile.client -t shipit/client:pr-${{ github.event.number }} ../apps/control_plane

  worker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker-linux image
        run: |
          cd docker
          docker build -f Dockerfile.worker-linux -t shipit/worker-linux:pr-${{ github.event.number }} ../tooling/workers

  opentofu-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Check formatting
        run: tofu fmt -check -recursive ./infrastructure
