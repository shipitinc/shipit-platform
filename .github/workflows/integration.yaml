name: Integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule: [cron: '0 2 * * *']

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # TEST DATABASE CONTRACT. These values must match
    # `apps/server/config/test.yaml` and `apps/server/docker-compose.yaml`,
    # which the Serverpod test harness reads at startup: localhost:9099,
    # database control_plane_test, user postgres.
    #
    # PORT. 9099, not the 9090 this file used to publish. 9090 is claimed on
    # developer machines by `partnerhub-test-db`, a different project, and
    # Serverpod connects to whatever answers on the port named in test.yaml —
    # so a 9090 contract would apply this project's nine migrations to that
    # database. Provenance: the throwaway `shipit-test-port-override.yaml`
    # that first put the local container on 9099 is superseded by the
    # committed compose file; do not re-derive 9099 from it.
    #
    # PASSWORD. Not in this repository. It is the single Actions secret
    # SERVERPOD_TEST_DATABASE_PASSWORD, referenced exactly twice below and
    # therefore structurally unable to drift: once as the service's
    # POSTGRES_PASSWORD, once as the job's SERVERPOD_DATABASE_PASSWORD, which
    # Serverpod reads in preference to `test.database` in
    # `config/passwords.yaml` (serverpod_shared password_manager.dart:34-54).
    # Create it once with:
    #   gh secret set SERVERPOD_TEST_DATABASE_PASSWORD
    env:
      SERVERPOD_DATABASE_PASSWORD: ${{ secrets.SERVERPOD_TEST_DATABASE_PASSWORD }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: control_plane_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.SERVERPOD_TEST_DATABASE_PASSWORD }}
        ports: [9099:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.0'
      - name: Install melos
        run: dart pub global activate melos ^8.0.0
      - name: Bootstrap
        run: melos bootstrap
      # `apps/server/config/passwords.yaml` is gitignored, so a clean checkout
      # has no credentials at all. Serverpod throws PasswordMissingException
      # before the first test runs unless the shared serviceSecret is present.
      # The file is carried as a single base64 Actions secret and materialised
      # here — nothing secret is ever committed or echoed.
      #
      # It supplies `shared.serviceSecret` (Insights auth) and
      # `development.database`. It does NOT supply the test database password:
      # that comes from the SERVERPOD_DATABASE_PASSWORD job env above, which
      # Serverpod prefers over `test.database`
      # (serverpod_shared password_manager.dart:34-54). Keeping the two apart
      # is what stops a rotated test password from silently disagreeing with
      # the secret blob the Postgres service was started with.
      - name: Materialise Serverpod passwords
        env:
          PASSWORDS_YAML_B64: ${{ secrets.SERVERPOD_PASSWORDS_YAML }}
        run: |
          if [ -z "$PASSWORDS_YAML_B64" ]; then
            echo "::error::SERVERPOD_PASSWORDS_YAML secret is not set. Create it with: gh secret set SERVERPOD_PASSWORDS_YAML --body \"$(base64 -i apps/server/config/passwords.yaml)\""
            exit 1
          fi
          printf '%s' "$PASSWORDS_YAML_B64" | base64 --decode > apps/server/config/passwords.yaml
          # Fail closed if the decode produced nothing rather than letting
          # Serverpod fail later with a less useful message.
          test -s apps/server/config/passwords.yaml
      # The credential is only half the contract: Serverpod and the database
      # must also be pointed at the same endpoint. The defaults in
      # config/test.yaml already are the committed values (localhost:9099,
      # control_plane_test, postgres) and the postgres service above matches
      # them, so nothing needs setting — this step only fails closed on a
      # missing password, which the service container would otherwise report
      # as an opaque "database is uninitialized" error.
      - name: Verify the test database credential contract
        run: |
          if [ -z "$SERVERPOD_DATABASE_PASSWORD" ]; then
            echo "::error::SERVERPOD_TEST_DATABASE_PASSWORD secret is not set. It is the single value both the postgres service and Serverpod must use, so neither can be changed alone. Create it with: gh secret set SERVERPOD_TEST_DATABASE_PASSWORD"
            exit 1
          fi
          echo "test database credential contract satisfied (password value not echoed)"
      # No `docker compose up` here: `withServerpod` starts Serverpod in-process
      # and every suite talks to the postgres service above. Building the dev
      # stack (server + client + worker images) would not be exercised by a
      # single assertion and would burn most of the 60 minute budget.
      #
      # Migrations need no separate step — the Serverpod test harness applies
      # them at startup (default `applyMigrations: true`, which passes
      # `--apply-migrations`).
      #
      # Migrations are NOT enough, though. Serverpod applies only the LATEST
      # `definition.sql` to a database with no recorded migration version
      # (serverpod-3.4.13 migration_manager.dart `_loadMigrationSQL`: the
      # `fromVersion == null` branch returns the single definitionSql entry;
      # only the `else` branch walks `migration.sql`). Everything the
      # model-driven generator cannot express therefore exists on the chain
      # path only. Until this step existed, every fresh database this workflow
      # created — including this one — permitted mutating an APPROVED
      # `design_revision`, silently.
      #
      # The step passes `--apply-migrations` to Serverpod itself, so it is the
      # migration step for this run: on a fresh database it creates the schema
      # from the latest `definition.sql`, then applies
      # `apps/server/tool/schema_bootstrap.sql`, then asserts in the live
      # database that all three hand-maintained objects exist AND that the
      # database rejects tampering with an approved revision, a second approved
      # revision for one work item, and a self-review. A bootstrap that did not
      # take effect exits non-zero, which fails the build.
      #
      # It must run BEFORE the suites: they share `control_plane_test` and
      # `dart test` would find the schema already at the latest version, making
      # the harness's own migration call a no-op.
      - name: Apply schema bootstrap
        run: |
          cd apps/server
          dart run tool/schema_bootstrap.dart
      #
      # Every suite namespaces its fixture ids and cleans up with targeted
      # DELETEs scoped to its own rows, so the files share one database
      # without a serial gate — run them concurrently (`dart test` default).
      - name: Run server integration tests
        run: |
          cd apps/server
          dart test test/integration/
# NO TEARDOWN STEP, DELIBERATELY. This job creates no compose project, so there
# is nothing here for a teardown to remove: its database is the `postgres`
# service container declared above, and the Actions runner removes that itself
# when the job ends. `withServerpod` runs in-process and adds no container, and
# there is no `docker compose up` in this workflow at all.
#
# A previous version had a `Teardown test resources` step running
# `docker compose -p shipit_test -f docker/compose.test.yaml down -v --remove-orphans || true`.
# It was wrong twice over. `|| true` discarded the exit code while leaving the
# output visible, so a teardown that genuinely failed read as a green step — the
# exact "silent pass" AGENTS.md § Product-specific policy forbids, in a file
# that rule had been written into. And `-p shipit_test` is a FIXED project name a
# developer also uses, so on a self-hosted runner `down -v` could destroy a real
# running stack that this job never created.
#
# The rule that survives: teardown belongs to whoever creates the resource, and
# it must not be silenced. `make test-integration`, `make test-env-test` and
# `make e2e-test` are the sites that actually create something, and each traps a
# real `down -v` that fails loudly.
