services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shipit
      POSTGRES_USER: shipit
      POSTGRES_PASSWORD: shipit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipit"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Triage forks real git worktrees from a real repository, and the server
  # refuses to boot unless SHIPIT_TRIAGE_REPOSITORY_PATH resolves to one (it
  # asks that repository for HEAD, so an empty directory is rejected too).
  #
  # This seeds a throwaway repository into a volume rather than bind-mounting a
  # developer's actual checkout: triage creates worktrees and branches in
  # whatever repository it is pointed at, and that should not happen to the repo
  # you are editing. A scratch repo satisfies the validation with no blast
  # radius.
  triage-seed:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -d /repo/.git ]; then
          echo "triage repo already initialised; leaving it alone"
        else
          git init -q -b main /repo
          cd /repo
          git config user.email "triage@shipit.local"
          git config user.name "ShipIt Triage"
          printf '# Triage scratch repository\n\nSeeded by docker/compose.yaml so the\ncontrol plane has a repository it may fork worktrees from.\n' > README.md
          git add -A
          git commit -qm "seed: initial commit"
          echo "triage repo initialised at $(git rev-parse HEAD)"
        fi
    volumes:
      - triage_repo:/repo
    restart: "no"

  server:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      # Serverpod reads all of these from the environment, so the container
      # does not inherit `localhost:8090` from config/development.yaml -- which
      # inside a container is the container itself, with no Postgres on it.
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: shipit
      SERVERPOD_DATABASE_USER: shipit
      SERVERPOD_DATABASE_PASSWORD: shipit
      # config/development.yaml says 8095, but this publishes 8080 and the
      # dashboard talks to 8080. Setting it here keeps the published port and
      # the listening port in agreement without forking the config file.
      SERVERPOD_API_SERVER_PORT: "8080"
      SHIPIT_TRIAGE_REPOSITORY_PATH: /triage-repo
      SHIPIT_TRIAGE_WORKSPACE_ROOT: /triage-workspaces
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      triage-seed:
        condition: service_completed_successfully
    volumes:
      - triage_repo:/triage-repo
      - triage_workspaces:/triage-workspaces

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    ports:
      - "8081:8081"
    # The dashboard is a prebuilt static site served by nginx, so there is no
    # runtime configuration to pass: CONTROL_PLANE_API is compiled in as a
    # dart-define (see Dockerfile.client) and the browser reaches the API
    # through this same container's /api/ proxy. Keeping the call same-origin
    # means no CORS allowance is needed on the server.

  # Builds an image with Flutter, gcloud, Node, Python and opencode, then runs
  # `sleep infinity`. That is minutes of build time for a container that does
  # nothing until a worker session is attached to it, so it is off by default.
  # Start it with: docker compose --profile workers up -d
  worker-linux:
    profiles: [workers]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker-linux
    environment:
      WORKER_POOL: linux
      SERVERPOD_API_URL: http://server:8080
    depends_on:
      - server

volumes:
  postgres_data:
  triage_repo:
  triage_workspaces:
