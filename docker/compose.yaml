services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shipit
      POSTGRES_USER: shipit
      POSTGRES_PASSWORD: shipit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipit"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Triage forks real git worktrees from a real repository, and the server
  # refuses to boot unless SHIPIT_TRIAGE_REPOSITORY_PATH resolves to one (it
  # asks that repository for HEAD, so an empty directory is rejected too).
  #
  # This seeds a throwaway repository into a volume rather than bind-mounting a
  # developer's actual checkout: triage creates worktrees and branches in
  # whatever repository it is pointed at, and that should not happen to the repo
  # you are editing. A scratch repo satisfies the validation with no blast
  # radius.
  triage-seed:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -d /repo/.git ]; then
          echo "triage repo already initialised; leaving it alone"
        else
          git init -q -b main /repo
          cd /repo
          git config user.email "triage@shipit.local"
          git config user.name "ShipIt Triage"
          printf '# Triage scratch repository\n\nSeeded by docker/compose.yaml so the\ncontrol plane has a repository it may fork worktrees from.\n' > README.md
          git add -A
          git commit -qm "seed: initial commit"
          echo "triage repo initialised at $(git rev-parse HEAD)"
        fi
    volumes:
      - triage_repo:/repo
    restart: "no"

  server:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      # Serverpod reads all of these from the environment, so the container
      # does not inherit `localhost:8090` from config/development.yaml -- which
      # inside a container is the container itself, with no Postgres on it.
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: shipit
      SERVERPOD_DATABASE_USER: shipit
      SERVERPOD_DATABASE_PASSWORD: shipit
      # config/development.yaml says 8095, but this publishes 8080 and the
      # dashboard talks to 8080. Setting it here keeps the published port and
      # the listening port in agreement without forking the config file.
      SERVERPOD_API_SERVER_PORT: "8080"
      SHIPIT_TRIAGE_REPOSITORY_PATH: /triage-repo
      # Global cap on CONCURRENT agent executions, enforced durably at claim time
      # (pg_advisory_xact_lock + in-flight count inside the claim transaction), not
      # by an in-process semaphore -- so a restart does not reset it while executions
      # are still running, and two replicas contend for the same budget.
      #
      # This FAILS CLOSED: unset, blank or unparseable means the server REFUSES TO
      # BOOT rather than running unbounded. That is deliberate -- a host crash on
      # 2026-10-10 came from unbounded agent work -- but it means removing this line
      # takes every stack down, not just this one. Override per environment; do not
      # delete it.
      #
      # Default 2 for QA: two opencode sessions measure ~1.5 GB against the 7.65 GB
      # Docker VM ceiling. Tune only after observing real peak (decision f8c8b67f).
      SHIPIT_DISPATCH_MAX_CONCURRENT_AGENTS: "${SHIPIT_DISPATCH_MAX_CONCURRENT_AGENTS:-2}"
      # Operator retry bound for the failed-work action panel. Per WORK ITEM.
      #
      # REVERSED 2026-10-12. This used to FAIL CLOSED: unset meant the retry
      # action was never offered, because "an operator action that spends real
      # credits must never be armed by a missing configuration" (decision
      # 5d9a1f62, HD-3). A human asked for the opposite -- operator retries are
      # uncounted unless a cap is chosen here. Do not reinstate the old
      # rationale; it was reversed deliberately, not overlooked.
      #
      # WHY IT IS SAFE, which is the whole basis of the reversal:
      #   * The action is HUMAN-TRIGGERED through an authenticated operator
      #     session, and its only caller is the operator UI
      #     (run_detail_bloc -> control_plane_repository -> the endpoint).
      #     There is no automation, cron, webhook or agent-driven caller.
      #   * Each press is a separate, deliberate, confirm-required spend with a
      #     written reason, recorded in an append-only audit ledger.
      #   * AUTOMATIC retries are a DIFFERENT mechanism and are STILL bounded:
      #     the job's own maxAttempts, enforced by RetryPolicy.canRetry in the
      #     scheduler's own tick. Uncounting a human's button does not uncount
      #     an agent's retry loop -- `triage_defect` still has maxAttempts: 2.
      #
      # So `${VAR:-}` interpolating to empty now means NO COUNT BOUND, not
      # "unconfigured". A positive N caps one work item at N retries; `0`
      # switches operator retry off entirely and is the ONLY value that removes
      # the action. An unreadable or negative value is ignored and leaves the
      # uncounted default in place.
      #
      # The contrast with the `${...:-2}` directly above is still deliberate and
      # still real. That cap defaults because the server REFUSES TO BOOT without
      # one, and a host crash on 2026-10-10 came from unbounded AGENT work.
      #
      # Under the OLD policy this line's variable was the second one that "must
      # not default", because a missing configuration must never arm an action
      # that spends real model credits. The reversal REMOVED that duty rather
      # than satisfying it: the action is available by default now, and this
      # variable no longer arms anything, so there is nothing here for a default
      # to arm. It is kept on the line all the same, because an operator who
      # DOES want a cap needs one place to put it.
      #
      # The bound that must not default is still the agent-side one directly
      # above -- that is the unbounded AGENT work that crashed the host.
      SHIPIT_OPERATOR_MAX_RETRIES: "${SHIPIT_OPERATOR_MAX_RETRIES:-}"
      SHIPIT_TRIAGE_WORKSPACE_ROOT: /triage-workspaces
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      triage-seed:
        condition: service_completed_successfully
    volumes:
      - triage_repo:/triage-repo
      - triage_workspaces:/triage-workspaces

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    ports:
      - "8081:8081"
    # The dashboard is a prebuilt static site served by nginx, so there is no
    # runtime configuration to pass: CONTROL_PLANE_API is compiled in as a
    # dart-define (see Dockerfile.client) and the browser reaches the API
    # through this same container's /api/ proxy. Keeping the call same-origin
    # means no CORS allowance is needed on the server.

  # Builds an image with Flutter, gcloud, Node, Python and opencode, then runs
  # `sleep infinity`. That is minutes of build time for a container that does
  # nothing until a worker session is attached to it, so it is off by default.
  # Start it with: docker compose --profile workers up -d
  worker-linux:
    profiles: [workers]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker-linux
    environment:
      WORKER_POOL: linux
      SERVERPOD_API_URL: http://server:8080
    depends_on:
      - server

volumes:
  postgres_data:
  triage_repo:
  triage_workspaces:
