services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shipit_test
      POSTGRES_USER: shipit
      POSTGRES_PASSWORD: shipit
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipit"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  # Disposable database for the apps/server integration suite.
  #
  # Behind the `integration` profile so it is never started by `test-env-up`,
  # which runs the full E2E stack above. `make test-integration` brings this up
  # under its own compose project with a `down -v` trap, so nothing survives the
  # run.
  #
  # PORT is overridable because the committed default must not be a collision
  # waiting to happen: this suite needs a published port, and a developer who
  # already has something on 9199 sets SHIPIT_TEST_DB_PORT rather than getting a
  # confusing "address already in use" from the suite.
  #
  # tmpfs, not a volume: the data has no life beyond the run, so there is
  # nothing for `down -v` to leak and nothing for a crashed run to leave behind.
  postgres_integration:
    profiles: [integration]
    image: postgres:16
    environment:
      POSTGRES_DB: control_plane_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${SERVERPOD_DATABASE_PASSWORD:?export SERVERPOD_DATABASE_PASSWORD; it must equal test.database in apps/server/config/passwords.yaml, which is the value Serverpod connects with}"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_plane_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${SHIPIT_TEST_DB_PORT:-9199}:5432"

  triage-seed:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -d /repo/.git ]; then
          echo "triage repo already initialised; leaving it alone"
        else
          git init -q -b main /repo
          cd /repo
          git config user.email "triage@shipit.local"
          git config user.name "ShipIt Triage"
          printf '# Test Triage Repository\n\nSeeded by docker/compose.test.yaml for testing.\n' > README.md
          git add -A
          git commit -qm "seed: initial commit"
          echo "triage repo initialised at $(git rev-parse HEAD)"
        fi
    volumes:
      - test_triage_repo:/repo
    restart: "no"

  server:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: shipit_test
      SERVERPOD_DATABASE_USER: shipit
      SERVERPOD_DATABASE_PASSWORD: shipit
      SERVERPOD_API_SERVER_PORT: "8080"
      SHIPIT_TRIAGE_REPOSITORY_PATH: /triage-repo
      SHIPIT_TRIAGE_WORKSPACE_ROOT: /triage-workspaces
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      triage-seed:
        condition: service_completed_successfully
    volumes:
      - test_triage_repo:/triage-repo
      - test_triage_workspaces:/triage-workspaces

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    environment:
      CONTROL_PLANE_API: "http://localhost:8083/api/"
      API_UPSTREAM: "server:8080"
    ports:
      - "8083:8081"
    depends_on:
      - server

  worker-linux:
    profiles: [workers]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker-linux
    environment:
      WORKER_POOL: linux
      SERVERPOD_API_URL: http://server:8080
    depends_on:
      - server

volumes:
  test_triage_repo:
  test_triage_workspaces: