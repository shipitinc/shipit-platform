services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shipit
      POSTGRES_USER: shipit
      POSTGRES_PASSWORD: shipit
    volumes:
      - postgres_data_qa:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipit"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  triage-seed:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -d /repo/.git ]; then
          echo "triage repo already initialised; leaving it alone"
        else
          git init -q -b main /repo
          cd /repo
          git config user.email "triage@shipit.local"
          git config user.name "ShipIt Triage"
          printf '# Triage scratch repository\n\nSeeded by docker/compose.qa.yaml so the\ncontrol plane has a repository it may fork worktrees from.\n' > README.md
          git add -A
          git commit -qm "seed: initial commit"
          echo "triage repo initialised at $(git rev-parse HEAD)"
        fi
    volumes:
      - triage_repo_qa:/repo
    restart: "no"

  server:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: shipit
      SERVERPOD_DATABASE_USER: shipit
      SERVERPOD_DATABASE_PASSWORD: shipit
      # QA Postgres has no TLS. Serverpod requires SSL by default, so without this the
      # server retries "Failed to connect to the database" forever and never serves.
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      SERVERPOD_API_SERVER_PORT: "8080"
      SHIPIT_TRIAGE_REPOSITORY_PATH: /triage-repo
      # QA runs in `staging`, as this stack always has. In `development` Serverpod's
      # schema analyzer is FATAL and reports two indexes as missing on every boot. That
      # report is a FALSE POSITIVE: both exist in `shipit` with definitions
      # byte-identical to schema_bootstrap.sql and the migrations. `staging` makes it a
      # warning.
      SERVERPOD_RUN_MODE: staging
      # Global cap on CONCURRENT agent executions, enforced durably at claim time
      # (pg_advisory_xact_lock + in-flight count inside the claim transaction), not
      # by an in-process semaphore -- so a restart does not reset it while executions
      # are still running, and two replicas contend for the same budget.
      #
      # This FAILS CLOSED: unset, blank or unparseable means the server REFUSES TO
      # BOOT rather than running unbounded. That is deliberate -- a host crash on
      # 2026-10-10 came from unbounded agent work -- but it means removing this line
      # takes every stack down, not just this one. Override per environment; do not
      # delete it.
      #
      # Default 2 for QA: two opencode sessions measure ~1.5 GB against the 7.65 GB
      # Docker VM ceiling. Tune only after observing real peak (decision f8c8b67f).
      SHIPIT_DISPATCH_MAX_CONCURRENT_AGENTS: "${SHIPIT_DISPATCH_MAX_CONCURRENT_AGENTS:-2}"
      # SHIPIT_OPERATOR_MAX_RETRIES is deliberately ABSENT here, so QA matches
      # the other three stacks and operator retry is UNCUNTED. This previously
      # read "${SHIPIT_OPERATOR_MAX_RETRIES:-3}", in an uncommitted working-tree
      # edit only; no commit ever set it, so the cap the running stack carried
      # was invisible to review. Operator retry is a HUMAN-triggered action on an
      # authenticated operator session, and its only caller is the operator UI, so
      # it is no longer count-bounded. An explicit 0 still switches the action
      # off, and a positive integer still caps it. AUTOMATIC (agent-driven) retries
      # remain bounded by the job's own maxAttempts, which this variable does not
      # affect. Reversed from decision 5d9a1f62 (HD-3); see the HUMAN_DECISION_RECORD
      # superseding it.
      #
      # Custody substrate. Interpolated from docker/.env (the compose PROJECT
      # directory), NOT the repository-root .env that `env_file:` reads -- Compose
      # interpolation and env_file are different mechanisms, and putting these in
      # docker/.env without interpolating them here means they never reach the
      # container. That is why the baseline worker reported
      # custodyRuntimeState=unavailable after the restart.
      #
      # ADR 0018's DOCUMENTED FALLBACK (local secret store, A1/A4): a recorded
      # precondition, never a silent default. Unset resolves to empty and
      # secret_provider_resolver.dart fails CLOSED at runtime.
      SHIPIT_SECRET_PROVIDER: "${SHIPIT_SECRET_PROVIDER:-}"
      # Container path; the host side is the bind mount below.
      SHIPIT_LOCAL_SECRET_DIR: /var/lib/shipit/secrets
      SHIPIT_TRIAGE_WORKSPACE_ROOT: /triage-workspaces
      # The durable PRODUCT clone root, and the root the server's composition
      # passes into DurableWorkspaceRuntime.resolve. A1 does NOT read this: its
      # code sits under the product-agnosticism gate, which refuses every
      # product name in that directory, so the read belongs here and the
      # resolved string is passed in as an argument (see `_triageWorkspaceRoot`,
      # which is the existing pattern for the same thing).
      SHIPIT_DURABLE_WORKSPACE_ROOT: /workspace-repo
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
      triage-seed:
        condition: service_completed_successfully
    volumes:
      - triage_repo_qa:/triage-repo
      - triage_workspaces_qa:/triage-workspaces
      # Durable, host-backed custody for QA deploy-key private halves. The host path
      # comes from docker/.env; the container path is the fixed /var/lib/shipit/secrets
      # that SHIPIT_LOCAL_SECRET_DIR points at. ADR 0018's DOCUMENTED FALLBACK (local
      # secret store, A1/A4), a recorded deviation. This bind mount is what makes it
      # survive container destruction. Sentinel default is deliberately a bad path so a
      # lost variable lands somewhere obviously wrong rather than in the writable layer.
      - ${SHIPIT_HOST_SECRET_DIR:-/tmp/shipit-secrets-NOT-CONFIGURED}:/var/lib/shipit/secrets
      # Durable, host-backed PRODUCT CLONE (decision 9bfe2d09, OD-7 question 1).
      # Same shape and same rationale as the custody bind directly above it: a
      # host path is not Docker's to delete, so the clone survives `down`,
      # `down -v` and volume pruning -- and, the reason this was chosen over a
      # named volume, an independent reviewer can re-read
      # producer.repositoryPath from the HOST without entering the container to
      # check it. That is a review property, not an operational nicety: the
      # engineering review gate resolves an artifact out of that path, and a
      # reviewer who cannot reach the evidence either trusts this file's account
      # of it or enters the container to check. Sentinel default is deliberately
      # a bad path, for exactly the reason the secret dir above uses one: a lost
      # variable must land somewhere obviously wrong rather than in the writable
      # layer, where it would silently lose every governed product's checkout on
      # the next rebuild.
      #
      # NO reclamation policy ships with this mount, and none is implied by it.
      # How long a product's clone lives (OD-7.2) and who deletes it (OD-7.3)
      # are both OPEN, so nothing in the platform removes one: not `qa-down`,
      # not a sweep, not this comment. One clone per product, unbounded, is the
      # honest state of it and is recorded as such in the startup banner's
      # `reclamationPolicy`.
      - ${SHIPIT_HOST_WORKSPACE_DIR:-/tmp/shipit-workspaces-NOT-CONFIGURED}:/workspace-repo

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    environment:
      CONTROL_PLANE_API: "http://localhost:8081/api/"
      API_UPSTREAM: "server:8080"
      # Operator-asserted, not server-verified (finding M-5). Passed through with
      # "${VAR:-}" so an unset variable reaches the container as an empty string,
      # which the client reads back as "unconfigured" -- never as a literal
      # "${SHIPIT_...}" placeholder and never as a default value. A required form
      # "${VAR:?...}" is deliberately NOT used: Compose interpolates the whole file
      # before it filters services, so one mandatory variable would break every
      # command that reads this file, including read-only ones. Nothing is
      # hardcoded; supply the values from the environment (or a docker/.env).
      SHIPIT_HOST_KEY_FINGERPRINT: "${SHIPIT_HOST_KEY_FINGERPRINT:-}"
      SHIPIT_OPERATOR_NAME: "${SHIPIT_OPERATOR_NAME:-}"
    ports:
      - "8081:8081"
    depends_on:
      - server

  worker-linux:
    profiles: [workers]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker-linux
    environment:
      WORKER_POOL: linux
      SERVERPOD_API_URL: http://server:8080
    depends_on:
      - server

volumes:
  postgres_data_qa:
  triage_repo_qa:
  triage_workspaces_qa: