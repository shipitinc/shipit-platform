server {
    listen 8081;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serverpod sends the endpoint method name in the JSON request body
    # ({"method":"..."}), so the body MUST survive the proxy.
    #
    # Do not add websocket headers here. The dashboard is a static SPA that
    # talks to the API over ordinary POSTs, and forcing
    # `Connection: "upgrade"` on those made the Dart upstream skip reading the
    # body entirely -- every call failed with 400 "No method name specified".
    # nginx defaults to the correct `Connection` header for each request, so
    # there is nothing to set.
    location /api/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;
}