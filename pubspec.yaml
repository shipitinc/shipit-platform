name: shipit_platform
version: 0.1.0
description: ShipIt Platform - Executable runtime for the Agentic Engineering Framework
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

workspace:
  - packages/platform_contracts
  - packages/workflow_engine
  - packages/workflow_store
  - packages/agent_runtime
  - packages/worker_protocol
  - packages/qa_orchestration
  - packages/deployment_protocol
  - packages/execution_coordinator
  - packages/worker_runtime
  - packages/scheduler
  - packages/store_contract_tests
  - control_plane/client
  - control_plane/server

dev_dependencies:
  melos: ^8.0.0

melos:
  scripts:
    analyze:
      exec:
        command: dart analyze
        concurrency: 4

    format:
      exec:
        command: dart format --output=none --set-exit-if-changed lib test
        concurrency: 4

    "format:apply":
      exec:
        command: dart format lib test
        concurrency: 4

    test:
      exec:
        command: dart test
        concurrency: 4
        packageFilters:
          include: 'packages/*'

    "test:coverage":
      exec:
        command: dart test --coverage=coverage
        concurrency: 2
        packageFilters:
          include: 'packages/*'

    # Runs the control plane integration suite against a live PostgreSQL
    # database. Requires `control_plane/server` Postgres to be running:
    #   cd control_plane/server && docker compose up -d
    # The integration test groups all target the same database, so they must
    # run serially (`-j 1`) — a parallel runner lets one group's TRUNCATE
    # cleanup invalidate another group's in-flight write.
    "test:control-plane":
      run: cd control_plane/server && dart test -j 1

    build:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 2