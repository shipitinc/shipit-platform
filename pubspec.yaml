name: shipit_platform
version: 0.1.0
description: ShipIt Platform - Executable runtime for the Agentic Engineering Framework
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

workspace:
  - packages/platform_contracts
  - packages/workflow_engine
  - packages/workflow_store
  - packages/agent_runtime
  - packages/worker_protocol
  - packages/qa_orchestration
  - packages/deployment_protocol
  - packages/execution_coordinator
  - packages/worker_runtime
  - packages/scheduler
  - packages/product_registry
  - packages/store_contract_tests
  - packages/control_plane_client
  - packages/design_governance
  - apps/server
  - apps/control_plane

dev_dependencies:
  melos: ^8.0.0

melos:
  scripts:
    analyze:
      exec:
        command: dart analyze
        concurrency: 4

    format:
      exec:
        command: dart format --output=none --set-exit-if-changed lib test
        concurrency: 4

    "format:apply":
      exec:
        command: dart format lib test
        concurrency: 4

    # Package unit/contract tests only — the pure-Dart suites that can run in
    # parallel under `dart test`.
    #
    # `packageFilters` must be a SIBLING of `exec`, not nested inside it;
    # melos only reads it at script level, so nesting it silently no-ops. The
    # original `include:` key does not exist in melos 8 at all (the keys are
    # `scope`/`ignore`/`dirExists`, and `scope`/`ignore` match PACKAGE NAMES,
    # not paths), so the filter never applied and every workspace package ran
    # — including:
    #
    #   * apps/server (`control_plane_server`): its suites are integration
    #     tests that need a live PostgreSQL, so they are gated separately by
    #     .github/workflows/integration.yaml.
    #   * apps/control_plane (`control_plane`): a Flutter suite that needs
    #     `flutter test`; `dart test` cannot run it.
    #   * packages/control_plane_client: has no `test/` directory, and
    #     `dart test` exits 65 there. `dirExists: test` covers this and any
    #     future test-less package.
    #
    # Run with `--no-select` in CI to skip melos's package-choice prompt.
    test:
      packageFilters:
        dirExists: test
        ignore:
          - control_plane
          - control_plane_server
      exec:
        command: dart test
        concurrency: 4

    "test:coverage":
      packageFilters:
        dirExists: test
        ignore:
          - control_plane
          - control_plane_server
      exec:
        command: dart test --coverage=coverage
        concurrency: 2

    # The control plane's widget/golden suite. It is excluded from `test`
    # because `dart test` cannot run it (see the note there), which left it
    # unreachable from melos entirely — a 150+ test suite that only ran if
    # someone remembered to `cd apps/control_plane && flutter test`.
    #
    # Uses the FVM-pinned SDK (`.fvmrc`), not whatever `flutter` resolves to on
    # PATH, so a contributor's global default cannot change the golden pixels.
    # Requires the Flutter SDK: `fvm install && fvm flutter pub get`.
    #
    # Must `cd` first: the golden fonts and `goldens/` paths are resolved
    # relative to the app root, so invoking it from the repo root fails every
    # suite in `(setUpAll)` rather than in the tests themselves.
    "test:flutter":
      run: cd apps/control_plane && fvm flutter test

    # Runs the control plane integration suite against a live PostgreSQL
    # database. Requires `apps/server` Postgres to be running:
    #   cd apps/server && docker compose up -d
    # Every suite namespaces its fixture ids and purges only its own rows with
    # FK-ordered targeted DELETEs, so the files share one database safely and
    # run concurrently (the `dart test` default) — no serial gate needed.
    "test:control-plane":
      run: cd apps/server && dart test

    build:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 2

    # Regenerates Serverpod model/protocol code from the `.spy.yaml` models in
    # apps/server/lib/src/database/. Run after adding or changing any model.
    "serverpod:generate":
      run: cd apps/server && serverpod generate

    # Creates a migration from the diff between the generated models and the
    # last migration. Review the emitted SQL before applying — Serverpod will
    # happily emit a destructive diff if a field was removed.
    #
    # The generator rebuilds definition.sql entirely from the models, so any
    # hand-appended content in it is erased on every run. Known cases:
    #
    #   * `CREATE TABLE "qa_contract"` and its index. The table is
    #     `managedMigration: false` (its applied DDL has no `id` column, so a
    #     Serverpod table model cannot reproduce it): the generator knows the
    #     table — it IS in definition.json — but never renders its DDL.
    #   * Historically the two indexes checked below; both are now expressed in
    #     their models (`job.activeDedupeKey` derived column + unique index,
    #     and `design_review_result_execution_unique`) and regenerate cleanly.
    #     They stay in the guard as a tripwire, not as a repair instruction.
    #
    # migration.sql also carries DROP IF EXISTS + backfill lines the generator
    # cannot emit: its diff source never knew about the older hand-written
    # copies, so it emits a bare CREATE that would collide with an index that
    # already exists in any live database. `melos run verify:schema-deviations`
    # fails closed if regeneration erases any of the above from definition.sql.
    "serverpod:migration":
      run: cd apps/server && serverpod create-migration

    # Fails closed when a regeneration erased hand-maintained schema content
    # from the latest cumulative definition.sql. Lists every failure before
    # exiting non-zero; exits 1 outright if that file cannot be read.
    "verify:schema-deviations":
      run: |
        latest=$(ls -1 apps/server/migrations 2>/dev/null | grep -E '^[0-9]+$' | sort | tail -1)
        definition="apps/server/migrations/$latest/definition.sql"
        if [ -z "$latest" ] || [ ! -r "$definition" ]; then
          echo "FAIL: $definition is missing or unreadable; failing closed."
          exit 1
        fi
        status=0
        for pattern in \
          'CREATE UNIQUE INDEX "job_active_dedupe_unique"' \
          'CREATE UNIQUE INDEX "design_review_result_execution_unique"' \
          'CREATE TABLE "qa_contract"'
        do
          if grep -qF -- "$pattern" "$definition"; then
            echo "OK: $pattern"
          else
            echo "FAIL: $pattern missing from migrations/$latest/definition.sql"
            status=1
          fi
        done
        if [ $status -ne 0 ]; then
          echo "      Restore it from an earlier migration's definition.sql."
        fi
        exit $status
