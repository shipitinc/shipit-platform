name: control_plane
description: ShipIt Control Plane - Flutter web dashboard
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  control_plane_client:
    path: ../../packages/control_plane_client
  serverpod_client: 3.4.13
  go_router: ^14.0.0
  flutter_bloc: ^8.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Brand logomark, exported from the Penpot source at its 26x26 design size.
    # Declared file-by-file so stray files in the directory are never bundled.
    - assets/brand/logomark.png
  fonts:
    # Brand wordmark. Variable font; weight is instanced via FontVariation.
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-VariableFont_wght.ttf
          weight: 700
    # UI typeface.
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    # Refs, micro labels, numerals.
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
