### One row of the append-only `operator_action` audit ledger, for the panel.
###
### `requestedBy` is the HUMAN — the one place in this repository where a
### workflow action records the person rather than the path the engine acted by
### (`work_item_transition.actorId` deliberately holds `operator-retry`, not a
### name; see design-brief.md P-4 and OQ-1).
class: OperatorActionSummaryView
fields:
  ### 'retry' | 'stop' | 'deploy' | 'reclaim' | 'reland' | 'reroute' — the
  ### same plain-string tokens `operator_action.action` carries; only 'retry'
  ### and 'stop' are OperatorActionKind members, the rest are the endpoint's
  ### own wire tokens.
  action: String
  requestedBy: String
  reason: String
  at: DateTime
  ### 1-based position among this item's retries. Null for every other
  ### action — `retry` is the only one that consumes an attempt.
  attemptNumber: int?