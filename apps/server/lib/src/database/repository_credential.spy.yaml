class: RepositoryCredentialRow
table: product_credential
serverOnly: true
### ADR 0018 A1 — one credential per repository. Holds NO key material: only
### the public half and the reference name under which the private half sits in
### the operator's local secret store.
indexes:
  product_credential_id_unique:
    fields: credentialId
    unique: true
  product_credential_repo_idx:
    fields: repositoryId
  product_credential_product_idx:
    fields: productId
fields:
  credentialId: String
  productId: String
  repositoryId: String
  referenceName: String
  publicKey: String
  fingerprint: String
  algorithm: String
  status: String
  createdAt: DateTime
  lastVerifiedAt: DateTime?
  lastVerifiedBy: String?
  lastFailureReason: String?
  hostKeyStatus: String
  host: String?
  hostKeyFingerprint: String?
  hostConfirmedAt: DateTime?
  hostConfirmedBy: String?
  revokedAt: DateTime?
  revokedReason: String?
  supersedesCredentialId: String?
  version: int
