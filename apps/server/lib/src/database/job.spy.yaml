class: JobRow
table: job
serverOnly: true
indexes:
  job_id_unique:
    fields: jobId
    unique: true
  job_work_item_idx:
    fields: workItemId
  job_dedupe_key_idx:
    fields: dedupeKey
fields:
  jobId: String
  workItemId: String
  jobType: String
  requiredRole: String
  requiredCapabilitiesJson: String
  priority: String
  state: String
  dedupeKey: String
  createdAt: DateTime
  availableAt: DateTime?
  instruction: String
  attempt: int
  maxAttempts: int
  startedAt: DateTime?
  completedAt: DateTime?
  executionReferenceJson: String?
  workerId: String?
  failureJson: String?
  cancelReason: String?
  version: int