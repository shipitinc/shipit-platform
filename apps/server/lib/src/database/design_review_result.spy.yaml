class: DesignReviewResultRow
table: design_review_result
serverOnly: true
indexes:
  design_review_result_id_unique:
    fields: reviewResultId
    unique: true
  design_review_result_revision_idx:
    fields: revisionId
  # One review execution may only ever produce one stored verdict. Declared
  # here so `serverpod create-migration` regenerates it instead of erasing a
  # hand-written copy of the same constraint.
  design_review_result_execution_unique:
    fields: reviewExecutionId
    unique: true
fields:
  reviewResultId: String
  revisionId: String
  reviewExecutionId: String
  verdict: String
  findingsJson: String
  assessedDimensionsJson: String
  reviewScopeJson: String?
  createdAt: DateTime
  version: int