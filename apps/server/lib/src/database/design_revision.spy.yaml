class: DesignRevisionRow
table: design_revision
serverOnly: true
indexes:
  design_revision_id_unique:
    fields: revisionId
    unique: true
  design_revision_work_item_idx:
    fields: workItemId
  design_revision_status_idx:
    fields: status
  design_revision_designer_execution_idx:
    fields: designerExecutionId
fields:
  revisionId: String
  workItemId: String
  productId: String
  parentRevisionId: String?
  designSystemRevision: String
  providerType: String
  penpotFileId: String?
  penpotPageId: String?
  boardIdsJson: String
  responsiveTargetsJson: String
  statesRepresentedJson: String
  artifactRefsJson: String
  designerExecutionId: String
  reviewExecutionIdsJson: String
  # design-revision.md §3.5.2 rule 4. NOT NULL with NO default, deliberately:
  # a default would propagate into definition.sql on the fresh-database path and
  # the database would then manufacture a version for rows that never named the
  # column — laundering "never validated" into "validated" (decision 1b7e4c93).
  fidelityAnchorSchemaVersion: String
  status: String
  riskTier: String
  reviewScopeJson: String?
  carriedForwardFromRevisionId: String?
  supersededByRevisionId: String?
  createdAt: DateTime
  updatedAt: DateTime
  approvedAt: DateTime?
  version: int