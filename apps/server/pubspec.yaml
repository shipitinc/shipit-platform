name: control_plane_server
description: ShipIt control plane - Serverpod host for the PostgreSQL control-plane persistence slice.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

resolution: workspace

dependencies:
  agent_runtime:
    path: ../../packages/agent_runtime
  # SHA-256 over the SSH wire-format public blob, for the `SHA256:…` fingerprint
  # GitHub/GitLab render next to a deploy key. Already resolved into this app's
  # graph as a transitive dependency, so promoting it to direct adds no package.
  crypto: ^3.0.7
  design_governance:
    path: ../../packages/design_governance
  # ed25519 key generation for repository deploy keys (ADR 0018 A3). A port of
  # Go's crypto/ed25519, RFC 8032 compatible, pure Dart — no FFI, no C ABI on a
  # path that mints production credentials.
  ed25519_edwards: ^0.3.2
  execution_coordinator:
    path: ../../packages/execution_coordinator
  platform_contracts:
    path: ../../packages/platform_contracts
  product_registry:
    path: ../../packages/product_registry
  qa_orchestration:
    path: ../../packages/qa_orchestration
  scheduler:
    path: ../../packages/scheduler
  serverpod: 3.4.13
  workflow_engine:
    path: ../../packages/workflow_engine
  workflow_store:
    path: ../../packages/workflow_store
  worker_protocol:
    path: ../../packages/worker_protocol
  worker_runtime:
    path: ../../packages/worker_runtime

dev_dependencies:
  control_plane_client:
    path: ../../packages/control_plane_client
  lints: '>=3.0.0 <7.0.0'
  serverpod_cli: 3.4.13
  serverpod_test: 3.4.13
  store_contract_tests:
    path: ../../packages/store_contract_tests
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations
    # Runs the ShipIt platform onboarding (S-1)
    onboard: dart onboard_shipit_serverpod.dart