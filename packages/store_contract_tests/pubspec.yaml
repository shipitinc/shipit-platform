name: store_contract_tests
description: Reusable store contract test suites, parameterized by store factory. Run against file/in-memory stores and PostgreSQL.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

resolution: workspace

dependencies:
  execution_coordinator:
    path: ../execution_coordinator
  platform_contracts:
    path: ../platform_contracts
  scheduler:
    path: ../scheduler
  worker_protocol:
    path: ../worker_protocol
  worker_runtime:
    path: ../worker_runtime
  workflow_store:
    path: ../workflow_store

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.5